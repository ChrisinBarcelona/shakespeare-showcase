<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posters · Shakespeare Showcase</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Inter+Tight:wght@600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#000;color:#f5f5f4;font-family:Inter,system-ui,sans-serif}main{max-width:1200px;margin:0 auto;padding:40px 20px}h1{font-family:"Inter Tight",Inter;font-weight:600;letter-spacing:-.04em;font-size:clamp(40px,7vw,80px);margin:0 0 6px}p{color:#a1a1aa}h2{font-family:"Inter Tight";letter-spacing:-.02em;margin:36px 0 12px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}figure{margin:0}img{width:100%;display:block;border-radius:10px;border:1px solid #1f1f23}figcaption{display:flex;justify-content:space-between;font-size:13px;color:#a1a1aa;margin-top:6px}a{color:#f5f5f4}</style></head><body><main>
<p>a CHRIS KELLY production</p><h1>Posters</h1><p>Teatre Gaudí · Thursdays–Saturdays in March 2027 · Curtain 20:00. Click any poster to open the full-size file.</p>
<h2>Instagram · 1080×1350</h2><div class="g" id="ig"></div><h2>TikTok / Stories · 1080×1920</h2><div class="g" id="st"></div><h2>Ticket</h2><div class="g"><figure><a href="jpg/ticket.jpg"><img src="jpg/ticket.jpg" alt="Ticket"></a><figcaption>Ticket<a href="jpg/ticket.jpg" download>Download</a></figcaption></figure></div>
<p style="margin-top:40px"><a href="../">← Back to the showcase site</a></p></main>
<script>const P=[["company","Shakespeare"],["macbeth","Macbeth"],["hamlet","Hamlet"],["midsummer","A Midsummer Night's Dream"],["shrew","The Taming of the Shrew"],["richard","Richard III"],["coriolanus","Coriolanus"],["ayli","As You Like It"]];
for(const [s,id] of [["ig","ig"],["story","st"]])document.getElementById(id).innerHTML=P.map(([k,l])=>`<figure><a href="jpg/${k}-${s}.jpg"><img src="jpg/${k}-${s}.jpg" alt="${l} poster" loading="lazy"></a><figcaption>${l}<a href="jpg/${k}-${s}.jpg" download>Download</a></figcaption></figure>`).join("")</script></body></html>
