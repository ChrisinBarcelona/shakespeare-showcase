function scriptText(k){const x=SCRIPTS[k];let t=`${x.play}\nAct ${x.act}, Scene ${x.scene}. ${x.title.replace(/^SCENE [IVX]+\.\s*/,"")}\nA CHRIS KELLY PRODUCTION · Selected Works of Shakespeare · Text: Moby Shakespeare (public domain)\n\n`;
  x.items.forEach(it=>{if(it.d)t+=`    [${it.d}]\n\n`;else{const a=it.s.split(" / ").map(n=>SPEAKER_ACTOR[n]).filter(Boolean);t+=`${it.cut?"[CUT] ":""}${it.s}${a.length?" ("+a.join(", ")+")":""}\n${it.l.map(l=>"    "+l).join("\n")}\n\n`}});return t}
let _jspdf=null;
function loadJsPDF(){if(_jspdf)return _jspdf;_jspdf=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";sc.onload=()=>res(window.jspdf.jsPDF);sc.onerror=rej;document.head.appendChild(sc)});return _jspdf}
async function scriptPDF(k){
  const JsPDF=await loadJsPDF();const x=SCRIPTS[k];const doc=new JsPDF({unit:"pt",format:"a4"});const W=595,H=842,M=56;let y=M;
  const clean=t=>t.replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[–—]/g,"-");
  const need=h=>{if(y+h>H-M){doc.addPage();y=M}};
  doc.setFont("times","italic");doc.setFontSize(10);doc.text("A CHRIS KELLY PRODUCTION · Selected Works of Shakespeare",M,y);y+=22;
  doc.setFont("times","bold");doc.setFontSize(20);doc.text(clean(x.play),M,y,{maxWidth:W-2*M});y+=26;
  doc.setFont("times","normal");doc.setFontSize(13);doc.text(clean(`Act ${x.act}, Scene ${x.scene}. ${x.title.replace(/^SCENE [IVX]+\.\s*/,"")}`),M,y);y+=24;
  x.items.forEach(it=>{
    if(it.d){doc.setFont("times","italic");doc.setFontSize(10.5);const ls=doc.splitTextToSize(clean(it.d),W-2*M-40);need(ls.length*13+6);doc.text(ls,M+40,y);y+=ls.length*13+6;return}
    const a=it.s.split(" / ").map(n=>SPEAKER_ACTOR[n]).filter(Boolean);
    need(30);doc.setFont("times","bold");doc.setFontSize(10.5);if(it.cut)doc.setTextColor(165);doc.text(clean((it.cut?"[CUT]  ":"")+it.s+(a.length?"  ("+a.join(", ")+")":"")),M,y);y+=14;
    it.l.forEach(l=>{const sd=/^\[.*\]$/.test(l);doc.setFont("times",sd?"italic":"normal");doc.setFontSize(11);const ls=doc.splitTextToSize(clean(l),W-2*M-20);need(ls.length*14);doc.text(ls,M+20,y);y+=ls.length*14});doc.setTextColor(0);y+=8;
  });
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("times","normal");doc.setFontSize(9);doc.text(`${clean(scriptLabel(k))} · ${i}/${n}`,W-M,H-28,{align:"right"})}
  return doc.output("blob");
}
let downloadsNS=null;
async function saveFile(name,data){
  try{downloadsNS=downloadsNS||await window.claude.use("downloads")}catch(_){}
  if(!downloadsNS){try{const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:"text/plain"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(_){toast("Couldn't download")}return}
  try{await downloadsNS.save({filename:name,data});}catch(e){if(e&&e.code!=="declined")toast("Couldn't download ("+(e&&e.code||"error")+")")}
}
function wireDownloads(root){
  root.querySelectorAll("[data-dl-pdf]").forEach(b=>b.onclick=async()=>{const k=b.dataset.dlPdf;b.disabled=true;const t=b.textContent;b.textContent="Preparing…";try{const blob=await scriptPDF(k);await saveFile(`${scriptLabel(k).replace(/[^A-Za-z0-9]+/g,"-")}.pdf`,blob)}catch(e){toast("Couldn't build the PDF")}b.disabled=false;b.textContent=t});
  root.querySelectorAll("[data-dl-txt]").forEach(b=>b.onclick=()=>{const k=b.dataset.dlTxt;saveFile(`${scriptLabel(k).replace(/[^A-Za-z0-9]+/g,"-")}.txt`,scriptText(k))});
  root.querySelectorAll("[data-dl-img]").forEach(b=>b.onclick=async()=>{let blob=null;try{const r=await fetch(b.dataset.dlImg);if(r.ok&&(r.headers.get("content-type")||"").startsWith("image"))blob=await r.blob()}catch(_){}if(!blob){try{blob=await (await fetch(IMG[b.dataset.dlFallback])).blob()}catch(_){}}if(blob)await saveFile(b.dataset.dlName||"poster.jpg",blob);else toast("Couldn't prepare the image")});
}

const AMBIENT=[["owl","Owls","Night in the wood: Midsummer, the witches"],["crow","Crows & ravens","Macbeth's heath and castle"],["bird","Birdsong","Morning: Arden, the lovers wake"],["forest","Forest","The Forest of Arden, the Athenian wood"],["water","Water","Ophelia's water"],["river","River","Ophelia's drowning, running under the scene"]];

  <section class="cost" id="st-sfx"><div class="costhead"><span class="rnum sm">2</span><h2>SFX</h2></div>
    <p class="clede">Sound and light effects, in three parts: lighting, ambient sounds and the musical transitions.</p>
    <h3 class="sth">Lighting</h3>
    <div class="strobe"><div class="ssign" role="img" aria-label="Warning sign: strobe lighting in use"><svg viewBox="0 0 100 88" aria-hidden="true"><path d="M50 6 95 82H5Z" fill="#ffe500" stroke="#0a0a0a" stroke-width="8" stroke-linejoin="round"/><path d="M50 30v26" stroke="#0a0a0a" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="69" r="5.5" fill="#0a0a0a"/></svg><div class="splate">Strobe lighting in use</div></div>

        <p class="clede" style="margin:8px 0 0">Flashing light can affect people with photosensitive epilepsy. We'll warn the audience at the venue, on tickets and in the programme, and run it in tech so the cast knows exactly when it comes.</p>

  <section class="cost" id="st-atmos"><div class="costhead"><span class="rnum sm">3</span><h2>Atmos</h2></div>
    <p class="clede">The air on stage. A smoke machine gives us haze for the witches, the wood at night and Ophelia's water, and makes the light beams visible. To check with Teatre Gaudí before tech: smoke detectors and how long the haze hangs.</p>
    <div class="costgrid">${ph("smoke-machine","Smoke machine with coloured light")}</div></section>

  <section class="cost" id="st-props"><div class="costhead"><span class="rnum sm">4</span><h2>Props</h2></div>
    <p class="clede">The things actors handle and the pieces that dress the stage: the physical side of the look.</p>

      <div><h3 class="sth" style="margin-top:0">Foam rocks</h3><p class="meta">Light, safe rocks to sit and stand on: the heath, the wood, the Forest of Arden.</p><div class="costgrid one">${ph("foam-rocks","Foam rocks")}</div></div></div></section>

  <section class="cost" id="st-vfx"><div class="costhead"><span class="rnum sm">5</span><h2>Visual effects</h2></div>
    <div class="vfx">${icon("projector",54)}<div><p class="clede" style="margin:0">A projector for the moments that need more than light: the moon over the wood, Ophelia's father behind the scrim, water for her drowning, and the emblems between the plays.</p><p class="meta" style="margin-top:8px">Projection list and screen position to be set in tech.</p></div></div></section>

  <section class="cost" id="st-cost"><div class="costhead"><span class="rnum sm">6</span><h2>Costume</h2></div>

function pBooking(){
  return `<h1>Book a <em>dramaturgy session</em></h1><p class="sub">Two hours with Chris, Mon–Fri 15:30–17:30 or 17:30–19:30, at <b style="color:var(--paper)">${VENUES.bcs.name}</b>. Optional: come when it helps you and your scene.</p>
  <div class="partner" style="margin-top:14px"><b>Please book with your scene partners.</b> Agree a time together first; booked slots show everyone called.</div>
  <div class="rgrid" style="margin-top:16px"><div class="rclass"><h3 style="margin:0 0 4px">What we can work on</h3><ul class="topics">${CLASSES.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>${mapEmbed(VENUES.bcs)}</div>
  <div class="card"><span class="small">I am</span><select id="mesel" aria-label="Your name"><option value="">Choose your name…</option>${CAST.map(c=>`<option ${c===me?"selected":""}>${esc(c)}</option>`).join("")}</select><div id="myscenes" class="chips"></div></div>
  ${!db?`<div class="note warn">Live booking isn't available in this view. Open the page signed in to book.</div>`:canWrite===false&&!isOwner?`<div class="note warn">You can see the calendar but can't book yet. Ask Chris to invite you by email as an Editor.</div>`:""}
  <div class="legend" style="margin-top:16px"><span><i style="border:1px dashed #6b5a49"></i>Free</span><span><i style="background:#2b231d;border:1px solid var(--acc)"></i>Booked</span><span><i style="background:#1b2230;border:1px solid #2f4560"></i>Company call</span><span><i style="background:#241818;border:1px solid #4a2626"></i>Chris unavailable</span></div>

function wireBooking(){
  $("mesel").onchange=e=>{setMe(e.target.value);selScene=null;renderBooking()};
  $("prev").onclick=()=>{if(week>0){week--;renderBooking()}};$("next").onclick=()=>{if(week<WEEKS.length-1){week++;renderBooking()}};
  renderBooking();
}
function renderBooking(){
  if(!$("days"))return;
  const ms=me?bookable().filter(i=>i.actors.includes(me)):[];
  $("myscenes").innerHTML=ms.map(s=>`<button class="chip ${selScene===s.id?"on":""}" data-id="${s.id}"><b>${esc(s.play)}</b>${esc(s.title)}<br><small>with ${s.actors.filter(a=>a!==me).join(", ")||"solo"} · ${countFor(s.id)} booked</small></button>`).join("");
  $("myscenes").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{selScene=selScene===c.dataset.id?null:c.dataset.id;renderBooking()});
  const days=WEEKS[week];
  $("weektitle").textContent="Week of "+days[0].toLocaleDateString("en-GB",{day:"numeric",month:"long"});
  $("prev").disabled=week===0;$("next").disabled=week===WEEKS.length-1;
  $("days").innerHTML=days.map(d=>{const past=d<today;return `<div class="day ${past?"past":""}"><div class="dayname">${fmtDay(d)}</div><div class="slots">${timesFor(d).map(t=>{
    const id=slotId(d,t),b=bookings[id];
    if(!b)return `<button class="slot free" data-id="${id}" ${past?"disabled":""}><div class="t">${t}–${endTime(t)}</div><div class="s">${loaded?"Free":"Loading…"}</div></button>`;
    if(b.type==="block")return `<button class="slot block ${b.company?"company":""}" data-id="${id}"><div class="t">${t}–${endTime(t)}</div><div class="s">${esc(b.label||(b.company?"Company call":"Unavailable"))}</div></button>`;
    const s=IT[b.scene];const mine=me&&s&&s.actors.includes(me);
    return `<button class="slot booked ${mine?"mine":""}" data-id="${id}"><div class="t">${t} · ${s?esc(s.play):"Scene"}</div><div class="s">${s?esc(s.title)+(b.focus?" · "+esc(b.focus):"")+"<br>"+s.actors.join(", "):""}</div></button>`;
  }).join("")}</div></div>`}).join("");
  $("days").querySelectorAll(".slot").forEach(b=>b.onclick=()=>openSlot(b.dataset.id));
}
function openSlot(id){
  const p=parseSlot(id),b=bookings[id],when=`${fmtDay(p.date)}, ${p.time}–${endTime(p.time)}`,sh=$("sheet");
  if(b){
    const s=b.type==="scene"?IT[b.scene]:null,canCancel=isOwner||(myId&&b.by===myId)||(!!me&&b.actor===me&&b.type==="scene");
    sh.innerHTML=`<h3>${s?esc(s.play+" — "+s.title):esc(b.label||(b.company?"Company call":"Unavailable"))}</h3><p>${when}${s?"<br>Called: "+s.actors.join(", ")+(b.focus?"<br>Focus: "+esc(b.focus):"")+(b.actor?"<br>Booked by "+esc(b.actor):""):""}</p><div class="btns">${canCancel?`<button class="btn danger" id="cancel">${b.type==="block"?"Remove":"Cancel booking"}</button>`:""}<button class="btn" id="cx">Close</button></div>`;
    $("cx").onclick=closeSheet;
    if(canCancel)$("cancel").onclick=async()=>{try{await db.collection("bookings").doc(id).delete();toast("Removed");closeSheet()}catch(e){toast("Couldn't remove")}};
  }else{
    const opts=me?bookable().filter(i=>i.actors.includes(me)):bookable();
    sh.innerHTML=`<h3>Book this session</h3><p>${when} with Chris</p>
      <div class="field"><span class="small">Piece</span><select id="scn">${opts.map(s=>`<option value="${s.id}" ${s.id===selScene?"selected":""}>${s.n} · ${esc(s.play)} — ${esc(s.title)} (${s.actors.join(", ")})</option>`).join("")}</select></div>
      <div class="field"><span class="small">Focus</span><select id="foc">${CLASSES.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
      ${!me?`<div class="field"><span class="small">Your name</span><select id="who"><option value="">Choose…</option>${CAST.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>`:""}
      <div class="btns"><button class="btn" id="cx">Cancel</button><button class="btn primary" id="go" ${!db||(canWrite===false&&!isOwner)?"disabled":""}>Book</button></div>
      ${isOwner?`<div class="rule"></div><span class="small">Chris only</span><input type="text" id="lbl" placeholder="Label, e.g. Full company run"><div class="btns"><button class="btn" id="blk">Mark unavailable</button><button class="btn" id="cmp">Company call</button></div>`:""}`;
    $("cx").onclick=closeSheet;
    $("go").onclick=()=>{const actor=me||($("who")&&$("who").value);if(!actor){toast("Choose your name");return}claim(id,{type:"scene",scene:$("scn").value,focus:$("foc").value,actor,by:myId||"",at:new Date().toISOString()})};
    if(isOwner){$("blk").onclick=()=>claim(id,{type:"block",company:false,label:$("lbl").value.trim()||"Unavailable",by:myId||"",at:new Date().toISOString()});
      $("cmp").onclick=()=>claim(id,{type:"block",company:true,label:$("lbl").value.trim()||"Company call",by:myId||"",at:new Date().toISOString()})}
  }
  $("sheetbg").classList.add("on");
}
async function claim(id,body){
  if(!db){toast("Sign in to book");return}
  const ref=db.collection("bookings").doc(id);
  try{const l=await ref.acquire({holder:myId||("anon-"+Math.random().toString(36).slice(2)),ttlMs:5000});
    if(!l.acquired){toast("Someone is booking this slot right now");return}
    const s=await ref.get();if(s.exists&&s.data()&&s.data().type){toast("That slot was just taken");closeSheet();return}
    if(ref.create)await ref.create(body);else await ref.set(body);toast("Booked ✓");closeSheet();
  }catch(e){if(e&&e.code==="exists"){toast("That slot was just taken");closeSheet()}else if(e&&(e.code==="invalid_argument"||e.code==="not_allowed")){toast("Only Chris can do that")}else toast("Couldn't book: "+(e&&e.code||"error"))}
}



function matchActor(fname){
  const f=fname.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\.[a-z0-9]+$/,"").replace(/[^a-z0-9]+/g," ").trim();
  const full=CAST.find(n=>f.includes(ck(n).replace(/-/g," ")));if(full)return full;
  const hits=CAST.filter(n=>{const parts=ck(n).split("-").filter(p=>p.length>2);return parts.some(p=>new RegExp("\\b"+p+"\\b").test(f))});
  return hits.length===1?hits[0]:null;
}
async function saveHeadshot(name,file){
  if(!assets)throw {code:"no_assets"};
  const a=await assets.upload(file);const ref=db.collection("cast").doc(ck(name));const snap=await ref.get();
  if(snap.exists)await ref.update({headshot:a.id});else await ref.set({headshot:a.id,status:"offered"});
}

let rerenderQ=null;
function rerender(){if(document.querySelector(".sheetbg.on"))return;if([...document.querySelectorAll("audio")].some(a=>!a.paused&&!a.ended)){clearTimeout(rerenderQ);rerenderQ=setTimeout(rerender,2000);return} clearTimeout(rerenderQ);rerenderQ=setTimeout(()=>{const y=window.scrollY;const h=(location.hash||"#home").slice(1);if(h==="booking")renderBooking();else{route();window.scrollTo(0,y)}},60)}
(async()=>{
  const timer=setTimeout(()=>{if(!loaded)toast("Live data can't be reached yet")},10000);
  if(SUPA.url&&SUPA.key){db=supaDB();myId=deviceId;canWrite=true;
    try{const p=localStorage.getItem("ss_dir_pin");if(p&&me==="Chris Kelly")isOwner=await db.isDirector(p)}catch(_){}
    try{assets=await window.claude.use("assets")}catch(_){assets=null}
  }else{
  try{user=await window.claude.use("user");if(user){isOwner=!!(await user.isOwner());try{myId=await user.id()}catch(_){}
    try{const c=await user.can("data.write");canWrite=(c===null||c===undefined)?null:!!c}catch(_){}}}catch(_){}
  try{assets=await window.claude.use("assets")}catch(_){assets=null}
  try{db=await window.claude.use("db")}catch(_){db=null}
  }
  if(!db){clearTimeout(timer);loaded=true;route();return}
  route();
  const sub=(col,setter)=>db.collection(col).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});setter(m);if(!snap.metadata.fromCache){loaded=true;clearTimeout(timer)}rerender()},err=>{clearTimeout(timer);loaded=true;toast("Some data couldn't load ("+err.code+")")});
  sub("bookings",m=>bookings=m);sub("cast",m=>{castDocs=m;autoMe()});sub("content",m=>content=m);sub("attendance",m=>attendance=m);
})();

/* ---- poster viewer ---- */
(function(){
  const box=document.createElement("div");box.id="lbox";box.hidden=true;box.setAttribute("role","dialog");box.setAttribute("aria-modal","true");box.setAttribute("aria-label","Poster viewer");
  box.innerHTML=`<div class="lb-top"><span class="lb-cap" id="lbcap"></span><a class="lb-btn" id="lbdl" download>Download</a><button type="button" class="lb-btn" id="lbx" aria-label="Close">Close ✕</button></div>
    <button type="button" class="lb-nav prev" id="lbp" aria-label="Previous poster">‹</button><img id="lbimg" alt=""><button type="button" class="lb-nav next" id="lbn" aria-label="Next poster">›</button>`;
  document.body.appendChild(box);
  let list=[],i=0,back=null;
  const show=()=>{const im=list[i];$("lbimg").src=im.dataset.full;$("lbimg").alt=im.alt;$("lbcap").textContent=im.alt.replace(/ poster$/,"")+(list.length>1?`  ·  ${i+1} of ${list.length}`:"");
    $("lbdl").href=im.dataset.full;$("lbdl").setAttribute("download",im.dataset.dl||"poster.jpg");$("lbp").hidden=$("lbn").hidden=list.length<2};
  const open=im=>{const grid=im.closest(".postergrid,.costgrid:not(.one)")||im.closest(".props");list=grid?[...grid.querySelectorAll("img[data-full]")]:[im];i=Math.max(0,list.indexOf(im));back=im;show();box.hidden=false;document.documentElement.style.overflow="hidden";$("lbx").focus()};
  const close=()=>{box.hidden=true;$("lbimg").removeAttribute("src");document.documentElement.style.overflow="";if(back)back.focus()};
  const step=d=>{i=(i+d+list.length)%list.length;show()};
  document.addEventListener("click",e=>{const im=e.target.closest&&e.target.closest("img[data-full]");if(im&&!box.contains(im)){e.preventDefault();open(im)}});
  document.addEventListener("keydown",e=>{if(box.hidden){const im=e.target.closest&&e.target.closest("img[data-full]");if(im&&(e.key==="Enter"||e.key===" ")){e.preventDefault();open(im)}return}
    if(e.key==="Escape")close();else if(e.key==="ArrowRight")step(1);else if(e.key==="ArrowLeft")step(-1);
    else if(e.key==="Tab"){const f=[...box.querySelectorAll("a,button:not([hidden])")];const a=f.indexOf(document.activeElement);if(e.shiftKey&&a<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&a===f.length-1){e.preventDefault();f[0].focus()}}});
  $("lbx").onclick=close;$("lbp").onclick=()=>step(-1);$("lbn").onclick=()=>step(1);
  box.addEventListener("click",e=>{if(e.target===box)close()});
  let sx=null;box.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});box.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)step(dx<0?1:-1);sx=null});
})();
