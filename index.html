ueen come not within his sight,", "For Oberon is passing fell and wrath", "Because that she, as her attendant, hath", "A lovely boy stolen from an Indian king;"], "n": "2.1.18"}, {"s": "ROBIN", "l": ["She never had so sweet a changeling.", "And jealous Oberon would have the child", "Knight of his train, to trace the forests wild.", "But she perforce withholds the lovèd boy,", "Crowns him with flowers and makes him all her joy."], "n": null, "cut": true}, {"s": "ROBIN", "l": ["And now they never meet in grove or green,", "By fountain clear or spangled starlight sheen,"], "n": null}, {"s": "ROBIN", "l": ["But they do square, that all their elves for fear", "Creep into acorn cups and hide them there."], "n": null, "cut": true}, {"s": "FAIRY", "l": ["Either I mistake your shape and making quite,", "Or else you are that shrewd and knavish sprite", "Called Robin Goodfellow."], "n": "2.1.33"}, {"s": "FAIRY", "l": ["Are not you he", "That frights the maidens of the villagery,", "Skim milk, and sometimes labor in the quern", "And bootless make the breathless huswife churn,", "And sometime make the drink to bear no barm,", "Mislead night wanderers, laughing at their harm?", "Those that “ Hobgoblin” call you and “ sweet Puck,”", "You do their work, and they shall have good luck."], "n": null, "cut": true}, {"s": "FAIRY", "l": ["Are not you he?"], "n": null}, {"s": "ROBIN", "l": ["Thou speakest aright.", "I am that merry wanderer of the night."], "n": "2.1.44"}, {"s": "ROBIN", "l": ["I jest to Oberon and make him smile", "When I a fat and bean-fed horse beguile,", "Neighing in likeness of a filly foal.", "And sometime lurk I in a gossip’s bowl", "In very likeness of a roasted crab,", "And, when she drinks, against her lips I bob", "And on her withered dewlap pour the ale.", "The wisest aunt, telling the saddest tale,", "Sometime for three-foot stool mistaketh me;", "Then slip I from her bum, down topples she", "And “ Tailor!” cries and falls into a cough,", "And then the whole choir hold their hips and loffe", "And waxen in their mirth and neeze and swear", "A merrier hour was never wasted there."], "n": null, "cut": true}, {"s": "ROBIN", "l": ["But room, fairy. Here comes Oberon."], "n": null}, {"s": "FAIRY", "l": ["And here my mistress. Would that he were gone!"], "n": "2.1.61"}, {"d": "Enter Oberon the King of Fairies at one door, with his train, and Titania the Queen at another, with hers."}, {"s": "OBERON", "l": ["Ill met by moonlight, proud Titania."], "n": "2.1.62"}, {"s": "TITANIA", "l": ["What, jealous Oberon? Fairies, skip hence.", "I have forsworn his bed and company."], "n": "2.1.63"}, {"s": "OBERON", "l": ["Tarry, rash wanton. Am not I thy lord?"], "n": "2.1.65"}, {"s": "TITANIA", "l": ["Then I must be thy lady. But I know", "When thou hast stolen away from Fairyland", "And in the shape of Corin sat all day", "Playing on pipes of corn and versing love", "To amorous Phillida."], "n": "2.1.66"}, {"s": "TITANIA", "l": ["Why art thou here,", "Come from the farthest steep of India,", "But that, forsooth, the bouncing Amazon,", "Your buskined mistress and your warrior love,", "To Theseus must be wedded, and you come", "To give their bed joy and prosperity?"], "n": null, "cut": true}, {"s": "OBERON", "l": ["How canst thou thus for shame, Titania,", "Glance at my credit with Hippolyta,", "Knowing I know thy love to Theseus?"], "n": "2.1.76"}, {"s": "OBERON", "l": ["Didst not thou lead him through the glimmering night", "From Perigouna, whom he ravishèd,", "And make him with fair Aegles break his faith,", "With Ariadne and Antiopa?"], "n": null, "cut": true}, {"s": "TITANIA", "l": ["These are the forgeries of jealousy;", "And never, since the middle summer’s spring,", "Met we on hill, in dale, forest, or mead,"], "n": "2.1.84"}, {"s": "TITANIA", "l": ["By pavèd fountain or by rushy brook,", "Or in the beachèd margent of the sea,", "To dance our ringlets to the whistling wind,"], "n": null, "cut": true}, {"s": "TITANIA", "l": ["But with thy brawls thou hast disturbed our sport."], "n": null}, {"s": "TITANIA", "l": ["Therefore the winds, piping to us in vain,", "As in revenge have sucked up from the sea", "Contagious fogs, which, falling in the land,", "Hath every pelting river made so proud", "That they have overborne their continents.", "The ox hath therefore stretched his yoke in vain,", "The plowman lost his sweat, and the green corn", "Hath rotted ere his youth attained a beard.", "The fold stands empty in the drownèd field,", "And crows are fatted with the murrain flock.", "The nine-men’s-morris is filled up with mud,", "And the quaint mazes in the wanton green,", "For lack of tread, are undistinguishable."], "n": null, "cut": true}, {"s": "TITANIA", "l": ["The human mortals want their winter here.", "No night is now with hymn or carol blessed.", "Therefore the moon, the governess of floods,", "Pale in her anger, washes all the air,", "That rheumatic diseases do abound.", "And thorough this distemperature we see"], "n": null, "cut": true}, {"s": "TITANIA", "l": ["The seasons alter: hoary-headed frosts", "Fall in the fresh lap of the crimson rose,", "And on old Hiems’ thin and icy crown", "An odorous chaplet of sweet summer buds", "Is, as in mockery, set. The spring, the summer,", "The childing autumn, angry winter, change", "Their wonted liveries, and the mazèd world", "By their increase now knows not which is which.", "And this same progeny of evils comes", "From our debate, from our dissension;", "We are their parents and original."], "n": null}, {"s": "OBERON", "l": ["Do you amend it, then. It lies in you."], "n": "2.1.121"}, {"s": "OBERON", "l": ["Why should Titania cross her Oberon?"], "n": null, "cut": true}, {"s": "OBERON", "l": ["I do but beg a little changeling boy", "To be my henchman."], "n": null}, {"s": "TITANIA", "l": ["Set your heart at rest:", "The Fairyland buys not the child of me.", "His mother was a vot’ress of my order,"], "n": "2.1.125"}, {"s": "TITANIA", "l": ["And in the spicèd Indian air by night", "Full often hath she gossiped by my side", "And sat with me on Neptune’s yellow sands,", "Marking th’ embarkèd traders on the flood,", "When we have laughed to see the sails conceive", "And grow big-bellied with the wanton wind;", "Which she, with pretty and with swimming gait,", "Following ( her womb then rich with my young squire),", "Would imitate and sail upon the land", "To fetch me trifles and return again,", "As from a voyage, rich with merchandise."], "n": null, "cut": true}, {"s": "TITANIA", "l": ["But she, being mortal, of that boy did die,", "And for her sake do I rear up her boy,", "And for her sake I will not part with him."], "n": null}, {"s": "OBERON", "l": ["How long within this wood intend you stay?"], "n": "2.1.143"}, {"s": "TITANIA", "l": ["Perchance till after Theseus’ wedding day.", "If you will patiently dance in our round", "And see our moonlight revels, go with us."], "n": "2.1.144"}, {"s": "TITANIA", "l": ["If not, shun me, and I will spare your haunts."], "n": null, "cut": true}, {"s": "OBERON", "l": ["Give me that boy and I will go with thee."], "n": "2.1.148"}, {"s": "TITANIA", "l": ["Not for thy fairy kingdom. Fairies, away.", "We shall chide downright if I longer stay."], "n": "2.1.149"}, {"d": "Titania and her fairies exit."}, {"s": "OBERON", "l": ["Well, go thy way. Thou shalt not from this grove", "Till I torment thee for this injury.—", "My gentle Puck, come hither. Thou rememb’rest", "Since once I sat upon a promontory", "And heard a mermaid on a dolphin’s back", "Uttering such dulcet and harmonious breath", "That the rude sea grew civil at her song", "And certain stars shot madly from their spheres", "To hear the sea-maid’s music."], "n": "2.1.151"}, {"s": "ROBIN", "l": ["I remember."], "n": "2.1.160"}, {"s": "OBERON", "l": ["That very time I saw ( but thou couldst not),", "Flying between the cold moon and the Earth,", "Cupid all armed. A certain aim he took", "At a fair vestal thronèd by the west,", "And loosed his love-shaft smartly from his bow"], "n": "2.1.161"}, {"s": "OBERON", "l": ["As it should pierce a hundred thousand hearts.", "But I might see young Cupid’s fiery shaft", "Quenched in the chaste beams of the wat’ry moon,", "And the imperial vot’ress passèd on", "In maiden meditation, fancy-free."], "n": null, "cut": true}, {"s": "OBERON", "l": ["Yet marked I where the bolt of Cupid fell.", "It fell upon a little western flower,", "Before, milk-white, now purple with love’s wound,", "And maidens call it “ love-in-idleness.”", "Fetch me that flower; the herb I showed thee once.", "The juice of it on sleeping eyelids laid", "Will make or man or woman madly dote", "Upon the next live creature that it sees.", "Fetch me this herb, and be thou here again", "Ere the leviathan can swim a league."], "n": null}, {"s": "ROBIN", "l": ["I’ll put a girdle round about the Earth", "In forty minutes."], "n": "2.1.181"}, {"d": "He exits."}, {"s": "OBERON", "l": ["Having once this juice,", "I’ll watch Titania when she is asleep", "And drop the liquor of it in her eyes."], "n": "2.1.183"}, {"s": "OBERON", "l": ["The next thing then she, waking, looks upon", "( Be it on lion, bear, or wolf, or bull,", "On meddling monkey, or on busy ape)", "She shall pursue it with the soul of love.", "And ere I take this charm from off her sight", "( As I can take it with another herb),"], "n": null, "cut": true}, {"s": "OBERON", "l": ["I’ll make her render up her page to me.", "But who comes here? I am invisible,", "And I will overhear their conference."], "n": null}, {"d": "Enter Demetrius, Helena following him."}, {"s": "DEMETRIUS", "l": ["I love thee not; therefore pursue me not.", "Where is Lysander and fair Hermia?", "The one I’ll stay; the other stayeth me.", "Thou told’st me they were stol’n unto this wood,", "And here am I, and wood within this wood", "Because I cannot meet my Hermia.", "Hence, get thee gone, and follow me no more."], "n": "2.1.195"}, {"s": "HELENA", "l": ["You draw me, you hard-hearted adamant!", "But yet you draw not iron, for my heart", "Is true as steel. Leave you your power to draw,", "And I shall have no power to follow you."], "n": "2.1.202"}, {"s": "DEMETRIUS", "l": ["Do I entice you? Do I speak you fair?", "Or rather do I not in plainest truth", "Tell you I do not, nor I cannot love you?"], "n": "2.1.206"}, {"s": "HELENA", "l": ["And even for that do I love you the more.", "I am your spaniel, and, Demetrius,", "The more you beat me I will fawn on you.", "Use me but as your spaniel: spurn me, strike me,", "Neglect me, lose me; only give me leave", "( Unworthy as I am) to follow you.", "What worser place can I beg in your love", "( And yet a place of high respect with me)", "Than to be usèd as you use your dog?"], "n": "2.1.209"}, {"s": "DEMETRIUS", "l": ["Tempt not too much the hatred of my spirit,", "For I am sick when I do look on thee."], "n": "2.1.218"}, {"s": "HELENA", "l": ["And I am sick when I look not on you."], "n": "2.1.220"}, {"s": "DEMETRIUS", "l": ["You do impeach your modesty too much", "To leave the city and commit yourself", "Into the hands of one that loves you not,", "To trust the opportunity of night", "And the ill counsel of a desert place", "With the rich worth of your virginity."], "n": "2.1.221"}, {"s": "HELENA", "l": ["Your virtue is my privilege. For that", "It is not night when I do see your face,", "Therefore I think I am not in the night.", "Nor doth this wood lack worlds of company,", "For you, in my respect, are all the world.", "Then, how can it be said I am alone", "When all the world is here to look on me?"], "n": "2.1.227"}, {"s": "DEMETRIUS", "l": ["I’ll run from thee and hide me in the brakes", "And leave thee to the mercy of wild beasts."], "n": "2.1.234"}, {"s": "HELENA", "l": ["The wildest hath not such a heart as you.", "Run when you will. The story shall be changed:", "Apollo flies and Daphne holds the chase;", "The dove pursues the griffin; the mild hind", "Makes speed to catch the tiger. Bootless speed", "When cowardice pursues and valor flies!"], "n": "2.1.236"}, {"s": "DEMETRIUS", "l": ["I will not stay thy questions. Let me go,", "Or if thou follow me, do not believe", "But I shall do thee mischief in the wood."], "n": "2.1.242"}, {"s": "HELENA", "l": ["Ay, in the temple, in the town, the field,", "You do me mischief. Fie, Demetrius!", "Your wrongs do set a scandal on my sex.", "We cannot fight for love as men may do.", "We should be wooed and were not made to woo.", "[Demetrius exits.]", "I’ll follow thee and make a heaven of hell", "To die upon the hand I love so well."], "n": "2.1.245"}, {"d": "Helena exits."}, {"s": "OBERON", "l": ["Fare thee well, nymph. Ere he do leave this grove,", "Thou shalt fly him, and he shall seek thy love.", "[Enter Robin.]", "Hast thou the flower there? Welcome, wanderer."], "n": "2.1.252"}, {"s": "ROBIN", "l": ["Ay, there it is."], "n": "2.1.255"}, {"s": "OBERON", "l": ["I pray thee give it me.", "[Robin gives him the flower.]"], "n": "2.1.256"}, {"s": "OBERON", "l": ["I know a bank where the wild thyme blows,", "Where oxlips and the nodding violet grows,", "Quite overcanopied with luscious woodbine,", "With sweet muskroses, and with eglantine.", "There sleeps Titania sometime of the night,", "Lulled in these flowers with dances and delight.", "And there the snake throws her enameled skin,", "Weed wide enough to wrap a fairy in.", "And with the juice of this I’ll streak her eyes", "And make her full of hateful fantasies.", "Take thou some of it, and seek through this grove."], "n": null, "cut": true}, {"s": "OBERON", "l": ["[He gives Robin part of the flower.]", "A sweet Athenian lady is in love", "With a disdainful youth. Anoint his eyes,", "But do it when the next thing he espies", "May be the lady. Thou shalt know the man", "By the Athenian garments he hath on."], "n": null}, {"s": "OBERON", "l": ["Effect it with some care, that he may prove", "More fond on her than she upon her love.", "And look thou meet me ere the first cock crow."], "n": null, "cut": true}, {"s": "ROBIN", "l": ["Fear not, my lord. Your servant shall do so."], "n": "2.1.276"}, {"d": "They exit."}]}, "mnd32": {"play": "A Midsummer Night's Dream", "act": 3, "scene": 2, "title": "SCENE II.  Another part of the wood.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/a-midsummer-nights-dream/read/3/2/", "first": "3.2.1", "last": "3.2.492", "items": [{"d": "Enter Oberon, King of Fairies."}, {"s": "OBERON", "l": ["I wonder if Titania be awaked;", "Then what it was that next came in her eye,", "Which she must dote on in extremity.", "[Enter Robin Goodfellow.]", "Here comes my messenger. How now, mad spirit?", "What night-rule now about this haunted grove?"], "n": "3.2.1"}, {"s": "ROBIN", "l": ["My mistress with a monster is in love.", "Near to her close and consecrated bower,", "While she was in her dull and sleeping hour,", "A crew of patches, rude mechanicals,", "That work for bread upon Athenian stalls,", "Were met together to rehearse a play", "Intended for great Theseus’ nuptial day.", "The shallowest thick-skin of that barren sort,", "Who Pyramus presented in their sport,", "Forsook his scene and entered in a brake.", "When I did him at this advantage take,", "An ass’s noll I fixèd on his head.", "Anon his Thisbe must be answerèd,", "And forth my mimic comes. When they him spy,", "As wild geese that the creeping fowler eye,", "Or russet-pated choughs, many in sort,", "Rising and cawing at the gun’s report,", "Sever themselves and madly sweep the sky,", "So at his sight away his fellows fly,", "And, at our stamp, here o’er and o’er one falls.", "He “ Murder” cries and help from Athens calls.", "Their sense thus weak, lost with their fears thus strong,", "Made senseless things begin to do them wrong;", "For briers and thorns at their apparel snatch,", "Some sleeves, some hats, from yielders all things catch.", "I led them on in this distracted fear", "And left sweet Pyramus translated there.", "When in that moment, so it came to pass,", "Titania waked and straightway loved an ass."], "n": "3.2.6"}, {"s": "OBERON", "l": ["This falls out better than I could devise.", "But hast thou yet latched the Athenian’s eyes", "With the love juice, as I did bid thee do?"], "n": "3.2.37"}, {"s": "ROBIN", "l": ["I took him sleeping— that is finished, too—", "And the Athenian woman by his side,", "That, when he waked, of force she must be eyed."], "n": "3.2.40"}, {"d": "Enter Demetrius and Hermia."}, {"s": "OBERON", "l": ["Stand close. This is the same Athenian."], "n": "3.2.43"}, {"s": "ROBIN", "l": ["This is the woman, but not this the man."], "n": "3.2.44"}, {"d": "They step aside."}, {"s": "DEMETRIUS", "l": ["O, why rebuke you him that loves you so?", "Lay breath so bitter on your bitter foe!"], "n": "3.2.45"}, {"s": "HERMIA", "l": ["Now I but chide, but I should use thee worse,", "For thou, I fear, hast given me cause to curse.", "If thou hast slain Lysander in his sleep,", "Being o’er shoes in blood, plunge in the deep", "And kill me too.", "The sun was not so true unto the day", "As he to me. Would he have stolen away", "From sleeping Hermia? I’ll believe as soon", "This whole Earth may be bored, and that the moon", "May through the center creep and so displease", "Her brother’s noontide with th’ Antipodes.", "It cannot be but thou hast murdered him.", "So should a murderer look, so dead, so grim."], "n": "3.2.47"}, {"s": "DEMETRIUS", "l": ["So should the murdered look, and so should I,", "Pierced through the heart with your stern cruelty.", "Yet you, the murderer, look as bright, as clear,", "As yonder Venus in her glimmering sphere."], "n": "3.2.60"}, {"s": "HERMIA", "l": ["What’s this to my Lysander? Where is he?", "Ah, good Demetrius, wilt thou give him me?"], "n": "3.2.64"}, {"s": "DEMETRIUS", "l": ["I had rather give his carcass to my hounds."], "n": "3.2.66"}, {"s": "HERMIA", "l": ["Out, dog! Out, cur! Thou driv’st me past the bounds", "Of maiden’s patience. Hast thou slain him, then?", "Henceforth be never numbered among men.", "O, once tell true! Tell true, even for my sake!", "Durst thou have looked upon him, being awake?", "And hast thou killed him sleeping? O brave touch!", "Could not a worm, an adder, do so much?", "An adder did it, for with doubler tongue", "Than thine, thou serpent, never adder stung."], "n": "3.2.67"}, {"s": "DEMETRIUS", "l": ["You spend your passion on a misprised mood.", "I am not guilty of Lysander’s blood,", "Nor is he dead, for aught that I can tell."], "n": "3.2.76"}, {"s": "HERMIA", "l": ["I pray thee, tell me then that he is well."], "n": "3.2.79"}, {"s": "DEMETRIUS", "l": ["An if I could, what should I get therefor?"], "n": "3.2.80"}, {"s": "HERMIA", "l": ["A privilege never to see me more.", "And from thy hated presence part I so.", "See me no more, whether he be dead or no."], "n": "3.2.81"}, {"d": "She exits."}, {"s": "DEMETRIUS", "l": ["There is no following her in this fierce vein.", "Here, therefore, for a while I will remain.", "So sorrow’s heaviness doth heavier grow", "For debt that bankrout sleep doth sorrow owe,", "Which now in some slight measure it will pay,", "If for his tender here I make some stay."], "n": "3.2.84"}, {"d": "He lies down and falls asleep."}, {"s": "OBERON", "l": ["[, to Robin]", "What hast thou done? Thou hast mistaken quite", "And laid the love juice on some true-love’s sight.", "Of thy misprision must perforce ensue", "Some true-love turned, and not a false turned true."], "n": "3.2.90"}, {"s": "ROBIN", "l": ["Then fate o’errules, that, one man holding troth,", "A million fail, confounding oath on oath."], "n": "3.2.94"}, {"s": "OBERON", "l": ["About the wood go swifter than the wind,", "And Helena of Athens look thou find.", "All fancy-sick she is and pale of cheer", "With sighs of love that costs the fresh blood dear.", "By some illusion see thou bring her here.", "I’ll charm his eyes against she do appear."], "n": "3.2.96"}, {"s": "ROBIN", "l": ["I go, I go, look how I go,", "Swifter than arrow from the Tartar’s bow."], "n": "3.2.102"}, {"d": "He exits."}, {"s": "OBERON", "l": ["[, applying the nectar to Demetrius’ eyes]", "Flower of this purple dye,", "Hit with Cupid’s archery,", "Sink in apple of his eye.", "When his love he doth espy,", "Let her shine as gloriously", "As the Venus of the sky.—", "When thou wak’st, if she be by,", "Beg of her for remedy."], "n": "3.2.104"}, {"d": "Enter Robin."}, {"s": "ROBIN", "l": ["Captain of our fairy band,", "Helena is here at hand,", "And the youth, mistook by me,", "Pleading for a lover’s fee.", "Shall we their fond pageant see?", "Lord, what fools these mortals be!"], "n": "3.2.112"}, {"s": "OBERON", "l": ["Stand aside. The noise they make", "Will cause Demetrius to awake."], "n": "3.2.118"}, {"s": "ROBIN", "l": ["Then will two at once woo one.", "That must needs be sport alone.", "And those things do best please me", "That befall prepost’rously."], "n": "3.2.120"}, {"d": "They step aside."}, {"d": "Enter Lysander and Helena."}, {"s": "LYSANDER", "l": ["Why should you think that I should woo in scorn?", "Scorn and derision never come in tears.", "Look when I vow, I weep; and vows so born,", "In their nativity all truth appears.", "How can these things in me seem scorn to you,", "Bearing the badge of faith to prove them true?"], "n": "3.2.124"}, {"s": "HELENA", "l": ["You do advance your cunning more and more.", "When truth kills truth, O devilish holy fray!", "These vows are Hermia’s. Will you give her o’er?", "Weigh oath with oath and you will nothing weigh.", "Your vows to her and me, put in two scales,", "Will even weigh, and both as light as tales."], "n": "3.2.130"}, {"s": "LYSANDER", "l": ["I had no judgment when to her I swore."], "n": "3.2.137"}, {"s": "HELENA", "l": ["Nor none, in my mind, now you give her o’er."], "n": "3.2.138"}, {"s": "LYSANDER", "l": ["Demetrius loves her, and he loves not you."], "n": "3.2.139"}, {"s": "DEMETRIUS", "l": ["[, waking up]", "O Helen, goddess, nymph, perfect, divine!", "To what, my love, shall I compare thine eyne?", "Crystal is muddy. O, how ripe in show", "Thy lips, those kissing cherries, tempting grow!", "That pure congealèd white, high Taurus’ snow,", "Fanned with the eastern wind, turns to a crow", "When thou hold’st up thy hand. O, let me kiss", "This princess of pure white, this seal of bliss!"], "n": "3.2.140"}, {"s": "HELENA", "l": ["O spite! O hell! I see you all are bent", "To set against me for your merriment.", "If you were civil and knew courtesy,", "You would not do me thus much injury.", "Can you not hate me, as I know you do,", "But you must join in souls to mock me too?", "If you were men, as men you are in show,", "You would not use a gentle lady so,", "To vow and swear and superpraise my parts,", "When, I am sure, you hate me with your hearts.", "You both are rivals and love Hermia,", "And now both rivals to mock Helena.", "A trim exploit, a manly enterprise,", "To conjure tears up in a poor maid’s eyes", "With your derision! None of noble sort", "Would so offend a virgin and extort", "A poor soul’s patience, all to make you sport."], "n": "3.2.148"}, {"s": "LYSANDER", "l": ["You are unkind, Demetrius. Be not so,", "For you love Hermia; this you know I know.", "And here with all goodwill, with all my heart,", "In Hermia’s love I yield you up my part.", "And yours of Helena to me bequeath,", "Whom I do love and will do till my death."], "n": "3.2.165"}, {"s": "HELENA", "l": ["Never did mockers waste more idle breath."], "n": "3.2.171"}, {"s": "DEMETRIUS", "l": ["Lysander, keep thy Hermia. I will none.", "If e’er I loved her, all that love is gone.", "My heart to her but as guest-wise sojourned,", "And now to Helen is it home returned,", "There to remain."], "n": "3.2.172"}, {"s": "LYSANDER", "l": ["Helen, it is not so."], "n": "3.2.177"}, {"s": "DEMETRIUS", "l": ["Disparage not the faith thou dost not know,", "Lest to thy peril thou aby it dear.", "Look where thy love comes. Yonder is thy dear."], "n": "3.2.178"}, {"d": "Enter Hermia."}, {"s": "HERMIA", "l": ["[, to Lysander]", "Dark night, that from the eye his function takes,", "The ear more quick of apprehension makes;", "Wherein it doth impair the seeing sense,", "It pays the hearing double recompense.", "Thou art not by mine eye, Lysander, found;", "Mine ear, I thank it, brought me to thy sound.", "But why unkindly didst thou leave me so?"], "n": "3.2.181"}, {"s": "LYSANDER", "l": ["Why should he stay whom love doth press to go?"], "n": "3.2.188"}, {"s": "HERMIA", "l": ["What love could press Lysander from my side?"], "n": "3.2.189"}, {"s": "LYSANDER", "l": ["Lysander’s love, that would not let him bide,", "Fair Helena, who more engilds the night", "Than all yon fiery oes and eyes of light.", "Why seek’st thou me? Could not this make thee know", "The hate I bear thee made me leave thee so?"], "n": "3.2.190"}, {"s": "HERMIA", "l": ["You speak not as you think. It cannot be."], "n": "3.2.196"}, {"s": "HELENA", "l": ["Lo, she is one of this confederacy!", "Now I perceive they have conjoined all three", "To fashion this false sport in spite of me.—", "Injurious Hermia, most ungrateful maid,", "Have you conspired, have you with these contrived,", "To bait me with this foul derision?", "Is all the counsel that we two have shared,", "The sisters’ vows, the hours that we have spent", "When we have chid the hasty-footed time", "For parting us— O, is all forgot?", "All schooldays’ friendship, childhood innocence?", "We, Hermia, like two artificial gods,", "Have with our needles created both one flower,", "Both on one sampler, sitting on one cushion,", "Both warbling of one song, both in one key,", "As if our hands, our sides, voices, and minds", "Had been incorporate. So we grew together", "Like to a double cherry, seeming parted,", "But yet an union in partition,", "Two lovely berries molded on one stem;", "So with two seeming bodies but one heart,", "Two of the first, like coats in heraldry,", "Due but to one, and crownèd with one crest.", "And will you rent our ancient love asunder,", "To join with men in scorning your poor friend?", "It is not friendly; ’tis not maidenly.", "Our sex, as well as I, may chide you for it,", "Though I alone do feel the injury."], "n": "3.2.197"}, {"s": "HERMIA", "l": ["I am amazèd at your words.", "I scorn you not. It seems that you scorn me."], "n": "3.2.225"}, {"s": "HELENA", "l": ["Have you not set Lysander, as in scorn,", "To follow me and praise my eyes and face,", "And made your other love, Demetrius,", "Who even but now did spurn me with his foot,", "To call me goddess, nymph, divine and rare,", "Precious, celestial? Wherefore speaks he this", "To her he hates? And wherefore doth Lysander", "Deny your love ( so rich within his soul)", "And tender me, forsooth, affection,", "But by your setting on, by your consent?", "What though I be not so in grace as you,", "So hung upon with love, so fortunate,", "But miserable most, to love unloved?", "This you should pity rather than despise."], "n": "3.2.227"}, {"s": "HERMIA", "l": ["I understand not what you mean by this."], "n": "3.2.241"}, {"s": "HELENA", "l": ["Ay, do. Persever, counterfeit sad looks,", "Make mouths upon me when I turn my back,", "Wink each at other, hold the sweet jest up.", "This sport, well carried, shall be chronicled.", "If you have any pity, grace, or manners,", "You would not make me such an argument.", "But fare you well. ’Tis partly my own fault,", "Which death or absence soon shall remedy."], "n": "3.2.242"}, {"s": "LYSANDER", "l": ["Stay, gentle Helena. Hear my excuse,", "My love, my life, my soul, fair Helena."], "n": "3.2.250"}, {"s": "HELENA", "l": ["O excellent!"], "n": "3.2.252"}, {"s": "HERMIA", "l": ["[, to Lysander]", "Sweet, do not scorn her so."], "n": "3.2.253"}, {"s": "DEMETRIUS", "l": ["[, to Lysander]", "If she cannot entreat, I can compel."], "n": "3.2.254"}, {"s": "LYSANDER", "l": ["Thou canst compel no more than she entreat.", "Thy threats have no more strength than her weak prayers.—", "Helen, I love thee. By my life, I do.", "I swear by that which I will lose for thee,", "To prove him false that says I love thee not."], "n": "3.2.255"}, {"s": "DEMETRIUS", "l": ["I say I love thee more than he can do."], "n": "3.2.261"}, {"s": "LYSANDER", "l": ["If thou say so, withdraw and prove it too."], "n": "3.2.262"}, {"s": "DEMETRIUS", "l": ["Quick, come."], "n": "3.2.263"}, {"s": "HERMIA", "l": ["Lysander, whereto tends all this?"], "n": "3.2.264"}, {"d": "She takes hold of Lysander."}, {"s": "LYSANDER", "l": ["Away, you Ethiop!"], "n": "3.2.265"}, {"s": "DEMETRIUS", "l": ["[, to Hermia]", "No, no. He’ll", "Seem to break loose. To Lysander. Take on as you would follow,", "But yet come not. You are a tame man, go!"], "n": "3.2.266"}, {"s": "LYSANDER", "l": ["[, to Hermia]", "Hang off, thou cat, thou burr! Vile thing, let loose,", "Or I will shake thee from me like a serpent."], "n": "3.2.270"}, {"s": "HERMIA", "l": ["Why are you grown so rude? What change is this,", "Sweet love?"], "n": "3.2.272"}, {"s": "LYSANDER", "l": ["Thy love? Out, tawny Tartar, out!", "Out, loathèd med’cine! O, hated potion, hence!"], "n": "3.2.274"}, {"s": "HERMIA", "l": ["Do you not jest?"], "n": "3.2.276"}, {"s": "HELENA", "l": ["Yes, sooth, and so do you."], "n": "3.2.277"}, {"s": "LYSANDER", "l": ["Demetrius, I will keep my word with thee."], "n": "3.2.278"}, {"s": "DEMETRIUS", "l": ["I would I had your bond. For I perceive", "A weak bond holds you. I’ll not trust your word."], "n": "3.2.279"}, {"s": "LYSANDER", "l": ["What? Should I hurt her, strike her, kill her dead?", "Although I hate her, I’ll not harm her so."], "n": "3.2.281"}, {"s": "HERMIA", "l": ["What, can you do me greater harm than hate?", "Hate me? Wherefore? O me, what news, my love?", "Am not I Hermia? Are not you Lysander?", "I am as fair now as I was erewhile.", "Since night you loved me; yet since night you left me.", "Why, then, you left me— O, the gods forbid!—", "In earnest, shall I say?"], "n": "3.2.283"}, {"s": "LYSANDER", "l": ["Ay, by my life,", "And never did desire to see thee more.", "Therefore be out of hope, of question, of doubt.", "Be certain, nothing truer, ’tis no jest", "That I do hate thee and love Helena."], "n": "3.2.291"}, {"d": "Hermia turns him loose."}, {"s": "HERMIA", "l": ["O me! To Helena. You juggler, you cankerblossom,", "You thief of love! What, have you come by night", "And stol’n my love’s heart from him?"], "n": "3.2.296"}, {"s": "HELENA", "l": ["Fine, i’ faith.", "Have you no modesty, no maiden shame,", "No touch of bashfulness? What, will you tear", "Impatient answers from my gentle tongue?", "Fie, fie, you counterfeit, you puppet, you!"], "n": "3.2.299"}, {"s": "HERMIA", "l": ["“ Puppet”? Why so? Ay, that way goes the game.", "Now I perceive that she hath made compare", "Between our statures; she hath urged her height,", "And with her personage, her tall personage,", "Her height, forsooth, she hath prevailed with him.", "And are you grown so high in his esteem", "Because I am so dwarfish and so low?", "How low am I, thou painted maypole? Speak!", "How low am I? I am not yet so low", "But that my nails can reach unto thine eyes."], "n": "3.2.304"}, {"s": "HELENA", "l": ["I pray you, though you mock me, gentlemen,", "Let her not hurt me. I was never curst;", "I have no gift at all in shrewishness.", "I am a right maid for my cowardice.", "Let her not strike me. You perhaps may think,", "Because she is something lower than myself,", "That I can match her."], "n": "3.2.314"}, {"s": "HERMIA", "l": ["“ Lower”? Hark, again!"], "n": "3.2.321"}, {"s": "HELENA", "l": ["Good Hermia, do not be so bitter with me.", "I evermore did love you, Hermia,", "Did ever keep your counsels, never wronged you—", "Save that, in love unto Demetrius,", "I told him of your stealth unto this wood.", "He followed you; for love, I followed him.", "But he hath chid me hence and threatened me", "To strike me, spurn me, nay, to kill me too.", "And now, so you will let me quiet go,", "To Athens will I bear my folly back", "And follow you no further. Let me go.", "You see how simple and how fond I am."], "n": "3.2.322"}, {"s": "HERMIA", "l": ["Why, get you gone. Who is ’t that hinders you?"], "n": "3.2.334"}, {"s": "HELENA", "l": ["A foolish heart that I leave here behind."], "n": "3.2.335"}, {"s": "HERMIA", "l": ["What, with Lysander?"], "n": "3.2.336"}, {"s": "HELENA", "l": ["With Demetrius."], "n": "3.2.337"}, {"s": "LYSANDER", "l": ["Be not afraid. She shall not harm thee, Helena."], "n": "3.2.338"}, {"s": "DEMETRIUS", "l": ["No, sir, she shall not, though you take her part."], "n": "3.2.339"}, {"s": "HELENA", "l": ["O, when she is angry, she is keen and shrewd.", "She was a vixen when she went to school,", "And though she be but little, she is fierce."], "n": "3.2.340"}, {"s": "HERMIA", "l": ["“ Little” again? Nothing but “ low” and “ little”?", "Why will you suffer her to flout me thus?", "Let me come to her."], "n": "3.2.343"}, {"s": "LYSANDER", "l": ["Get you gone, you dwarf,", "You minimus of hind’ring knotgrass made,", "You bead, you acorn—"], "n": "3.2.346"}, {"s": "DEMETRIUS", "l": ["You are too officious", "In her behalf that scorns your services.", "Let her alone. Speak not of Helena.", "Take not her part. For if thou dost intend", "Never so little show of love to her,", "Thou shalt aby it."], "n": "3.2.349"}, {"s": "LYSANDER", "l": ["Now she holds me not.", "Now follow, if thou dar’st, to try whose right,", "Of thine or mine, is most in Helena."], "n": "3.2.355"}, {"s": "DEMETRIUS", "l": ["“ Follow”? Nay, I’ll go with thee, cheek by jowl."], "n": "3.2.358"}, {"d": "Demetrius and Lysander exit."}, {"s": "HERMIA", "l": ["You, mistress, all this coil is long of you.", "[Helena retreats.]", "Nay, go not back."], "n": "3.2.359"}, {"s": "HELENA", "l": ["I will not trust you, I,", "Nor longer stay in your curst company.", "Your hands than mine are quicker for a fray.", "My legs are longer though, to run away."], "n": "3.2.361"}, {"d": "She exits."}, {"s": "HERMIA", "l": ["I am amazed and know not what to say."], "n": "3.2.365"}, {"d": "She exits."}, {"s": "OBERON", "l": ["[, to Robin]", "This is thy negligence. Still thou mistak’st,", "Or else committ’st thy knaveries willfully."], "n": "3.2.366"}, {"s": "ROBIN", "l": ["Believe me, king of shadows, I mistook.", "Did not you tell me I should know the man", "By the Athenian garments he had on?", "And so far blameless proves my enterprise", "That I have ’nointed an Athenian’s eyes;", "And so far am I glad it so did sort,", "As this their jangling I esteem a sport."], "n": "3.2.368"}, {"s": "OBERON", "l": ["Thou seest these lovers seek a place to fight.", "Hie, therefore, Robin, overcast the night;", "The starry welkin cover thou anon", "With drooping fog as black as Acheron,", "And lead these testy rivals so astray", "As one come not within another’s way.", "Like to Lysander sometime frame thy tongue;", "Then stir Demetrius up with bitter wrong.", "And sometime rail thou like Demetrius.", "And from each other look thou lead them thus,", "Till o’er their brows death-counterfeiting sleep", "With leaden legs and batty wings doth creep.", "Then crush this herb into Lysander’s eye,", "[He gives a flower to Robin.]", "Whose liquor hath this virtuous property,", "To take from thence all error with his might", "And make his eyeballs roll with wonted sight.", "When they next wake, all this derision", "Shall seem a dream and fruitless vision.", "And back to Athens shall the lovers wend,", "With league whose date till death shall never end.", "Whiles I in this affair do thee employ,", "I’ll to my queen and beg her Indian boy;", "And then I will her charmèd eye release", "From monster’s view, and all things shall be peace."], "n": "3.2.375"}, {"s": "ROBIN", "l": ["My fairy lord, this must be done with haste,", "For night’s swift dragons cut the clouds full fast,", "And yonder shines Aurora’s harbinger,", "At whose approach, ghosts wand’ring here and there", "Troop home to churchyards. Damnèd spirits all,", "That in crossways and floods have burial,", "Already to their wormy beds are gone.", "For fear lest day should look their shames upon,", "They willfully themselves exile from light", "And must for aye consort with black-browed night."], "n": "3.2.399"}, {"s": "OBERON", "l": ["But we are spirits of another sort.", "I with the Morning’s love have oft made sport", "And, like a forester, the groves may tread", "Even till the eastern gate, all fiery red,", "Opening on Neptune with fair blessèd beams,", "Turns into yellow gold his salt-green streams.", "But notwithstanding, haste! Make no delay.", "We may effect this business yet ere day."], "n": "3.2.410"}, {"d": "He exits."}, {"s": "ROBIN", "l": ["Up and down, up and down,", "I will lead them up and down.", "I am feared in field and town.", "Goblin, lead them up and down.", "Here comes one."], "n": "3.2.418"}, {"d": "Enter Lysander."}, {"s": "LYSANDER", "l": ["Where art thou, proud Demetrius? Speak thou now."], "n": "3.2.423"}, {"s": "ROBIN", "l": ["[, in Demetrius’ voice]", "Here, villain, drawn and ready. Where art thou?"], "n": "3.2.424"}, {"s": "LYSANDER", "l": ["I will be with thee straight."], "n": "3.2.425"}, {"s": "ROBIN", "l": ["[, in Demetrius’ voice]", "Follow me, then, to", "plainer ground."], "n": "3.2.426"}, {"d": "Lysander exits."}, {"d": "Enter Demetrius."}, {"s": "DEMETRIUS", "l": ["Lysander, speak again.", "Thou runaway, thou coward, art thou fled?", "Speak! In some bush? Where dost thou hide thy head?"], "n": "3.2.428"}, {"s": "ROBIN", "l": ["[, in Lysander’s voice]", "Thou coward, art thou bragging to the stars,", "Telling the bushes that thou look’st for wars,", "And wilt not come? Come, recreant! Come, thou child!", "I’ll whip thee with a rod. He is defiled", "That draws a sword on thee."], "n": "3.2.432"}, {"s": "DEMETRIUS", "l": ["Yea, art thou there?"], "n": "3.2.438"}, {"s": "ROBIN", "l": ["[, in Lysander’s voice]", "Follow my voice. We’ll try no manhood here."], "n": "3.2.439"}, {"d": "They exit."}, {"d": "Enter Lysander."}, {"s": "LYSANDER", "l": ["He goes before me and still dares me on.", "When I come where he calls, then he is gone.", "The villain is much lighter-heeled than I.", "I followed fast, but faster he did fly,", "That fallen am I in dark uneven way,", "And here will rest me. Come, thou gentle day,", "For if but once thou show me thy gray light,", "I’ll find Demetrius and revenge this spite."], "n": "3.2.440"}, {"d": "He lies down and sleeps."}, {"d": "Enter Robin and Demetrius."}, {"s": "ROBIN", "l": ["[, in Lysander’s voice]", "Ho, ho, ho! Coward, why com’st thou not?"], "n": "3.2.448"}, {"s": "DEMETRIUS", "l": ["Abide me, if thou dar’st, for well I wot", "Thou runn’st before me, shifting every place,", "And dar’st not stand nor look me in the face.", "Where art thou now?"], "n": "3.2.449"}, {"s": "ROBIN", "l": ["[, in Lysander’s voice]", "Come hither. I am here."], "n": "3.2.453"}, {"s": "DEMETRIUS", "l": ["Nay, then, thou mock’st me. Thou shalt buy this dear", "If ever I thy face by daylight see.", "Now go thy way. Faintness constraineth me", "To measure out my length on this cold bed.", "By day’s approach look to be visited."], "n": "3.2.454"}, {"d": "He lies down and sleeps."}, {"d": "Enter Helena."}, {"s": "HELENA", "l": ["O weary night, O long and tedious night,", "Abate thy hours! Shine, comforts, from the east,", "That I may back to Athens by daylight", "From these that my poor company detest.", "And sleep, that sometimes shuts up sorrow’s eye,", "Steal me awhile from mine own company."], "n": "3.2.460"}, {"d": "She lies down and sleeps."}, {"s": "ROBIN", "l": ["Yet but three? Come one more.", "Two of both kinds makes up four.", "Here she comes, curst and sad.", "Cupid is a knavish lad", "Thus to make poor females mad."], "n": "3.2.466"}, {"d": "Enter Hermia."}, {"s": "HERMIA", "l": ["Never so weary, never so in woe,", "Bedabbled with the dew and torn with briers,", "I can no further crawl, no further go.", "My legs can keep no pace with my desires.", "Here will I rest me till the break of day.", "Heavens shield Lysander if they mean a fray!"], "n": "3.2.471"}, {"d": "She lies down and sleeps."}, {"s": "ROBIN", "l": ["On the ground", "Sleep sound.", "I’ll apply", "To your eye,", "Gentle lover, remedy.", "[Robin applies the nectar to Lysander’s eyes.]", "When thou wak’st,", "Thou tak’st", "True delight", "In the sight", "Of thy former lady’s eye.", "And the country proverb known,", "That every man should take his own,", "In your waking shall be shown.", "Jack shall have Jill;", "Naught shall go ill;", "The man shall have his mare again, and all shall be well."], "n": "3.2.477"}, {"d": "He exits."}]}, "mnd41": {"play": "A Midsummer Night's Dream", "act": 4, "scene": 1, "title": "SCENE I.  The same. Lysander, Demetrius, Helena and Hermia lying asleep.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/a-midsummer-nights-dream/read/4/1/", "first": "4.1.1", "last": "4.1.229", "items": [{"d": "With the four lovers still asleep onstage, enter Titania, Queen of Fairies, and Bottom and Fairies, and Oberon, the King, behind them unseen by those onstage."}, {"s": "TITANIA", "l": ["Come, sit thee down upon this flow’ry bed,", "While I thy amiable cheeks do coy,", "And stick muskroses in thy sleek smooth head,", "And kiss thy fair large ears, my gentle joy."], "n": "4.1.1"}, {"s": "BOTTOM", "l": ["Where’s Peaseblossom?"], "n": "4.1.5"}, {"s": "PEASEBLOSSOM", "l": ["Ready."], "n": "4.1.6"}, {"s": "BOTTOM", "l": ["Scratch my head, Peaseblossom. Where’s", "Monsieur Cobweb?"], "n": "4.1.7"}, {"s": "COBWEB", "l": ["Ready."], "n": "4.1.9"}, {"s": "BOTTOM", "l": ["Monsieur Cobweb, good monsieur, get you", "your weapons in your hand and kill me a red-hipped", "humble-bee on the top of a thistle, and, good", "monsieur, bring me the honey-bag. Do not fret", "yourself too much in the action, monsieur, and,", "good monsieur, have a care the honey-bag break", "not; I would be loath to have you overflown with a", "honey-bag, signior.", "[Cobweb exits.]", "Where’s Monsieur", "Mustardseed?"], "n": "4.1.10"}, {"s": "MUSTARDSEED", "l": ["Ready."], "n": "4.1.19"}, {"s": "BOTTOM", "l": ["Give me your neaf, Monsieur Mustardseed.", "Pray you, leave your courtesy, good monsieur."], "n": "4.1.20"}, {"s": "MUSTARDSEED", "l": ["What’s your will?"], "n": "4.1.22"}, {"s": "BOTTOM", "l": ["Nothing, good monsieur, but to help Cavalery", "Cobweb to scratch. I must to the barber’s,", "monsieur, for methinks I am marvels hairy about", "the face. And I am such a tender ass, if my hair do", "but tickle me, I must scratch."], "n": "4.1.23"}, {"s": "TITANIA", "l": ["What, wilt thou hear some music, my sweet love?"], "n": "4.1.28"}, {"s": "BOTTOM", "l": ["I have a reasonable good ear in music. Let’s", "have the tongs and the bones."], "n": "4.1.29"}, {"s": "TITANIA", "l": ["Or say, sweet love, what thou desirest to eat."], "n": "4.1.31"}, {"s": "BOTTOM", "l": ["Truly, a peck of provender. I could munch", "your good dry oats. Methinks I have a great desire", "to a bottle of hay. Good hay, sweet hay, hath no", "fellow."], "n": "4.1.32"}, {"s": "TITANIA", "l": ["I have a venturous fairy that shall seek", "The squirrel’s hoard and fetch thee new nuts."], "n": "4.1.36"}, {"s": "BOTTOM", "l": ["I had rather have a handful or two of dried", "peas. But, I pray you, let none of your people stir", "me; I have an exposition of sleep come upon me."], "n": "4.1.38"}, {"s": "TITANIA", "l": ["Sleep thou, and I will wind thee in my arms.—", "Fairies, begone, and be all ways away.", "[Fairies exit.]", "So doth the woodbine the sweet honeysuckle", "Gently entwist; the female ivy so", "Enrings the barky fingers of the elm.", "O, how I love thee! How I dote on thee!"], "n": "4.1.41"}, {"d": "Bottom and Titania sleep."}, {"d": "Enter Robin Goodfellow."}, {"s": "OBERON", "l": ["Welcome, good Robin. Seest thou this sweet sight?", "Her dotage now I do begin to pity.", "For, meeting her of late behind the wood,", "Seeking sweet favors for this hateful fool,", "I did upbraid her and fall out with her.", "For she his hairy temples then had rounded", "With coronet of fresh and fragrant flowers;", "And that same dew, which sometime on the buds", "Was wont to swell like round and orient pearls,", "Stood now within the pretty flouriets’ eyes,", "Like tears that did their own disgrace bewail.", "When I had at my pleasure taunted her,", "And she in mild terms begged my patience,", "I then did ask of her her changeling child,", "Which straight she gave me, and her fairy sent", "To bear him to my bower in Fairyland.", "And now I have the boy, I will undo", "This hateful imperfection of her eyes.", "And, gentle Puck, take this transformèd scalp", "From off the head of this Athenian swain,", "That he, awaking when the other do,", "May all to Athens back again repair", "And think no more of this night’s accidents", "But as the fierce vexation of a dream.", "But first I will release the Fairy Queen.", "[He applies the nectar to her eyes.]", "Be as thou wast wont to be.", "See as thou wast wont to see.", "Dian’s bud o’er Cupid’s flower", "Hath such force and blessèd power.", "Now, my Titania, wake you, my sweet queen."], "n": "4.1.47"}, {"s": "TITANIA", "l": ["[, waking]", "My Oberon, what visions have I seen!", "Methought I was enamored of an ass."], "n": "4.1.77"}, {"s": "OBERON", "l": ["There lies your love."], "n": "4.1.79"}, {"s": "TITANIA", "l": ["How came these things to pass?", "O, how mine eyes do loathe his visage now!"], "n": "4.1.80"}, {"s": "OBERON", "l": ["Silence awhile.— Robin, take off this head.—", "Titania, music call; and strike more dead", "Than common sleep of all these five the sense."], "n": "4.1.82"}, {"s": "TITANIA", "l": ["Music, ho, music such as charmeth sleep!"], "n": "4.1.85"}, {"s": "ROBIN", "l": ["[, removing the ass-head from Bottom]", "Now, when thou wak’st, with thine own fool’s eyes peep."], "n": "4.1.86"}, {"s": "OBERON", "l": ["Sound music.", "[Music.]", "Come, my queen, take hands with me,", "And rock the ground whereon these sleepers be.", "[Titania and Oberon dance.]", "Now thou and I are new in amity,", "And will tomorrow midnight solemnly", "Dance in Duke Theseus’ house triumphantly,", "And bless it to all fair prosperity.", "There shall the pairs of faithful lovers be", "Wedded, with Theseus, all in jollity."], "n": "4.1.88"}, {"s": "ROBIN", "l": ["Fairy king, attend and mark.", "I do hear the morning lark."], "n": "4.1.97"}, {"s": "OBERON", "l": ["Then, my queen, in silence sad", "Trip we after night’s shade.", "We the globe can compass soon,", "Swifter than the wand’ring moon."], "n": "4.1.99"}, {"s": "TITANIA", "l": ["Come, my lord, and in our flight", "Tell me how it came this night", "That I sleeping here was found", "With these mortals on the ground."], "n": "4.1.103"}, {"d": "Oberon, Robin, and Titania exit."}, {"d": "Wind horn. Enter Theseus and all his train, Hippolyta, Egeus."}, {"s": "THESEUS", "l": ["Go, one of you, find out the Forester.", "For now our observation is performed,", "And, since we have the vaward of the day,", "My love shall hear the music of my hounds.", "Uncouple in the western valley; let them go.", "Dispatch, I say, and find the Forester.", "[A Servant exits.]", "We will, fair queen, up to the mountain’s top", "And mark the musical confusion", "Of hounds and echo in conjunction."], "n": "4.1.107"}, {"s": "HIPPOLYTA", "l": ["I was with Hercules and Cadmus once,", "When in a wood of Crete they bayed the bear", "With hounds of Sparta. Never did I hear", "Such gallant chiding, for, besides the groves,", "The skies, the fountains, every region near", "Seemed all one mutual cry. I never heard", "So musical a discord, such sweet thunder."], "n": "4.1.116"}, {"s": "THESEUS", "l": ["My hounds are bred out of the Spartan kind,", "So flewed, so sanded; and their heads are hung", "With ears that sweep away the morning dew;", "Crook-kneed, and dewlapped like Thessalian bulls;", "Slow in pursuit, but matched in mouth like bells,", "Each under each. A cry more tunable", "Was never holloed to, nor cheered with horn,", "In Crete, in Sparta, nor in Thessaly.", "Judge when you hear.— But soft! What nymphs are these?"], "n": "4.1.123"}, {"s": "EGEUS", "l": ["My lord, this is my daughter here asleep,", "And this Lysander; this Demetrius is,", "This Helena, old Nedar’s Helena.", "I wonder of their being here together."], "n": "4.1.133"}, {"s": "THESEUS", "l": ["No doubt they rose up early to observe", "The rite of May, and hearing our intent,", "Came here in grace of our solemnity.", "But speak, Egeus. Is not this the day", "That Hermia should give answer of her choice?"], "n": "4.1.137"}, {"s": "EGEUS", "l": ["It is, my lord."], "n": "4.1.142"}, {"s": "THESEUS", "l": ["Go, bid the huntsmen wake them with their horns."], "n": "4.1.143"}, {"d": "A Servant exits."}, {"d": "Shout within. Wind horns. They all start up."}, {"s": "THESEUS", "l": ["Good morrow, friends. Saint Valentine is past.", "Begin these woodbirds but to couple now?"], "n": "4.1.144"}, {"d": "Demetrius, Helena, Hermia, and Lysander kneel."}, {"s": "LYSANDER", "l": ["Pardon, my lord."], "n": "4.1.146"}, {"s": "THESEUS", "l": ["I pray you all, stand up.", "[They rise.]", "I know you two are rival enemies.", "How comes this gentle concord in the world,", "That hatred is so far from jealousy", "To sleep by hate and fear no enmity?"], "n": "4.1.147"}, {"s": "LYSANDER", "l": ["My lord, I shall reply amazèdly,", "Half sleep, half waking. But as yet, I swear,", "I cannot truly say how I came here.", "But, as I think— for truly would I speak,", "And now I do bethink me, so it is:", "I came with Hermia hither. Our intent", "Was to be gone from Athens, where we might,", "Without the peril of the Athenian law—"], "n": "4.1.152"}, {"s": "EGEUS", "l": ["Enough, enough!— My lord, you have enough.", "I beg the law, the law upon his head.", "They would have stol’n away.— They would, Demetrius,", "Thereby to have defeated you and me:", "You of your wife and me of my consent,", "Of my consent that she should be your wife."], "n": "4.1.160"}, {"s": "DEMETRIUS", "l": ["My lord, fair Helen told me of their stealth,", "Of this their purpose hither to this wood,", "And I in fury hither followed them,", "Fair Helena in fancy following me.", "But, my good lord, I wot not by what power", "( But by some power it is) my love to Hermia,", "Melted as the snow, seems to me now", "As the remembrance of an idle gaud", "Which in my childhood I did dote upon,", "And all the faith, the virtue of my heart,", "The object and the pleasure of mine eye,", "Is only Helena. To her, my lord,", "Was I betrothed ere I saw Hermia.", "But like a sickness did I loathe this food.", "But, as in health, come to my natural taste,", "Now I do wish it, love it, long for it,", "And will forevermore be true to it."], "n": "4.1.167"}, {"s": "THESEUS", "l": ["Fair lovers, you are fortunately met.", "Of this discourse we more will hear anon.—", "Egeus, I will overbear your will,", "For in the temple by and by, with us,", "These couples shall eternally be knit.—", "And, for the morning now is something worn,", "Our purposed hunting shall be set aside.", "Away with us to Athens. Three and three,", "We’ll hold a feast in great solemnity.", "Come, Hippolyta."], "n": "4.1.184"}, {"d": "Theseus and his train, including Hippolyta and Egeus, exit."}, {"s": "DEMETRIUS", "l": ["These things seem small and undistinguishable,", "Like far-off mountains turnèd into clouds."], "n": "4.1.194"}, {"s": "HERMIA", "l": ["Methinks I see these things with parted eye,", "When everything seems double."], "n": "4.1.196"}, {"s": "HELENA", "l": ["So methinks.", "And I have found Demetrius like a jewel,", "Mine own and not mine own."], "n": "4.1.198"}, {"s": "DEMETRIUS", "l": ["Are you sure", "That we are awake? It seems to me", "That yet we sleep, we dream. Do not you think", "The Duke was here and bid us follow him?"], "n": "4.1.201"}, {"s": "HERMIA", "l": ["Yea, and my father."], "n": "4.1.205"}, {"s": "HELENA", "l": ["And Hippolyta."], "n": "4.1.206"}, {"s": "LYSANDER", "l": ["And he did bid us follow to the temple."], "n": "4.1.207"}, {"s": "DEMETRIUS", "l": ["Why, then, we are awake. Let’s follow him,", "And by the way let us recount our dreams."], "n": "4.1.208"}, {"d": "Lovers exit."}, {"s": "BOTTOM", "l": ["[, waking up]", "When my cue comes, call me,", "and I will answer. My next is “ Most fair Pyramus.”", "Hey-ho! Peter Quince! Flute the bellows-mender!", "Snout the tinker! Starveling! God’s my life! Stolen", "hence and left me asleep! I have had a most rare", "vision. I have had a dream past the wit of man to say", "what dream it was. Man is but an ass if he go about", "to expound this dream. Methought I was— there", "is no man can tell what. Methought I was and", "methought I had— but man is but a patched fool if", "he will offer to say what methought I had. The eye of", "man hath not heard, the ear of man hath not seen,", "man’s hand is not able to taste, his tongue to", "conceive, nor his heart to report what my dream", "was. I will get Peter Quince to write a ballad of this", "dream. It shall be called “ Bottom’s Dream” because", "it hath no bottom; and I will sing it in the", "latter end of a play, before the Duke. Peradventure,", "to make it the more gracious, I shall sing it at her", "death."], "n": "4.1.210"}, {"d": "He exits."}]}, "shr21": {"play": "The Taming of the Shrew", "act": 2, "scene": 1, "title": "SCENE I.  Padua. A room in Baptista's house.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/the-taming-of-the-shrew/read/2/1/", "first": "2.1.1", "last": "2.1.435", "items": [{"d": "Enter Katherine and Bianca with her hands tied."}, {"s": "BIANCA", "l": ["Good sister, wrong me not, nor wrong yourself,", "To make a bondmaid and a slave of me.", "That I disdain. But for these other goods—", "Unbind my hands, I’ll pull them off myself,", "Yea, all my raiment to my petticoat,", "Or what you will command me will I do,", "So well I know my duty to my elders."], "n": "2.1.1"}, {"s": "KATHERINE", "l": ["Of all thy suitors here I charge thee tell", "Whom thou lov’st best. See thou dissemble not."], "n": "2.1.8"}, {"s": "BIANCA", "l": ["Believe me, sister, of all the men alive", "I never yet beheld that special face", "Which I could fancy more than any other."], "n": "2.1.10"}, {"s": "KATHERINE", "l": ["Minion, thou liest. Is ’t not Hortensio?"], "n": "2.1.13"}, {"s": "BIANCA", "l": ["If you affect him, sister, here I swear", "I’ll plead for you myself, but you shall have him."], "n": "2.1.14"}, {"s": "KATHERINE", "l": ["O, then belike you fancy riches more.", "You will have Gremio to keep you fair."], "n": "2.1.16"}, {"s": "BIANCA", "l": ["Is it for him you do envy me so?", "Nay, then, you jest, and now I well perceive", "You have but jested with me all this while.", "I prithee, sister Kate, untie my hands."], "n": "2.1.18"}, {"d": "Katherine strikes her."}, {"s": "KATHERINE", "l": ["If that be jest, then all the rest was so."], "n": "2.1.22"}, {"d": "Enter Baptista."}, {"s": "BAPTISTA", "l": ["Why, how now, dame, whence grows this insolence?—", "Bianca, stand aside.— Poor girl, she weeps!", "[He unties her hands.]", "To Bianca. Go ply thy needle; meddle not with her.", "To Katherine. For shame, thou hilding of a devilish spirit!", "Why dost thou wrong her that did ne’er wrong thee?", "When did she cross thee with a bitter word?"], "n": "2.1.23"}, {"s": "KATHERINE", "l": ["Her silence flouts me, and I’ll be revenged!"], "n": "2.1.32"}, {"d": "She flies after Bianca."}, {"s": "BAPTISTA", "l": ["What, in my sight?— Bianca, get thee in."], "n": "2.1.33"}, {"d": "Bianca exits."}, {"s": "KATHERINE", "l": ["What, will you not suffer me? Nay, now I see", "She is your treasure, she must have a husband,", "I must dance barefoot on her wedding day", "And, for your love to her, lead apes in hell.", "Talk not to me. I will go sit and weep", "Till I can find occasion of revenge."], "n": "2.1.34"}, {"d": "She exits."}, {"s": "BAPTISTA", "l": ["Was ever gentleman thus grieved as I?", "But who comes here?"], "n": "2.1.40"}, {"d": "Enter Gremio; Lucentio disguised as Cambio in the habit of a mean man; Petruchio with Hortensio disguised as Litio; and Tranio disguised as Lucentio, with his boy, Biondello bearing a lute and books."}, {"s": "GREMIO", "l": ["Good morrow, neighbor Baptista."], "n": "2.1.42"}, {"s": "BAPTISTA", "l": ["Good morrow, neighbor Gremio.— God", "save you, gentlemen."], "n": "2.1.43"}, {"s": "PETRUCHIO", "l": ["And you, good sir. Pray, have you not a daughter", "Called Katherina, fair and virtuous?"], "n": "2.1.45"}, {"s": "BAPTISTA", "l": ["I have a daughter, sir, called Katherina."], "n": "2.1.47"}, {"s": "GREMIO", "l": ["[, to Petruchio]", "You are too blunt. Go to it orderly."], "n": "2.1.48"}, {"s": "PETRUCHIO", "l": ["You wrong me, Signior Gremio. Give me leave.—", "I am a gentleman of Verona, sir,", "That hearing of her beauty and her wit,", "Her affability and bashful modesty,", "Her wondrous qualities and mild behavior,", "Am bold to show myself a forward guest", "Within your house, to make mine eye the witness", "Of that report which I so oft have heard,", "And, for an entrance to my entertainment,", "I do present you with a man of mine,", "[Presenting Hortensio, disguised as Litio]", "Cunning in music and the mathematics,", "To instruct her fully in those sciences,", "Whereof I know she is not ignorant.", "Accept of him, or else you do me wrong.", "His name is Litio, born in Mantua."], "n": "2.1.49"}, {"s": "BAPTISTA", "l": ["You’re welcome, sir, and he for your good sake.", "But for my daughter Katherine, this I know,", "She is not for your turn, the more my grief."], "n": "2.1.64"}, {"s": "PETRUCHIO", "l": ["I see you do not mean to part with her,", "Or else you like not of my company."], "n": "2.1.67"}, {"s": "BAPTISTA", "l": ["Mistake me not. I speak but as I find.", "Whence are you, sir? What may I call your name?"], "n": "2.1.69"}, {"s": "PETRUCHIO", "l": ["Petruchio is my name, Antonio’s son,", "A man well known throughout all Italy."], "n": "2.1.71"}, {"s": "BAPTISTA", "l": ["I know him well. You are welcome for his sake."], "n": "2.1.73"}, {"s": "GREMIO", "l": ["Saving your tale, Petruchio, I pray", "Let us that are poor petitioners speak too!", "Bacare, you are marvelous forward."], "n": "2.1.74"}, {"s": "PETRUCHIO", "l": ["O, pardon me, Signior Gremio, I would fain be doing."], "n": "2.1.77"}, {"s": "GREMIO", "l": ["I doubt it not, sir. But you will curse your wooing.", "[To Baptista.]", "Neighbor, this is a gift very grateful,", "I am sure of it. To express the like kindness, myself,", "that have been more kindly beholding to you than", "any, freely give unto you this young scholar", "[presenting Lucentio, disguised as Cambio]", "that hath", "been long studying at Rheims, as cunning in Greek,", "Latin, and other languages as the other in music and", "mathematics. His name is Cambio. Pray accept his", "service."], "n": "2.1.79"}, {"s": "BAPTISTA", "l": ["A thousand thanks, Signior Gremio.— Welcome,", "good Cambio.", "[To Tranio]", "[as Lucentio.]", "But,", "gentle sir, methinks you walk like a stranger. May I", "be so bold to know the cause of your coming?"], "n": "2.1.89"}, {"s": "TRANIO", "l": ["[, as Lucentio]", "Pardon me, sir, the boldness is mine own,", "That being a stranger in this city here", "Do make myself a suitor to your daughter,", "Unto Bianca, fair and virtuous.", "Nor is your firm resolve unknown to me,", "In the preferment of the eldest sister.", "This liberty is all that I request,", "That, upon knowledge of my parentage,", "I may have welcome ’mongst the rest that woo", "And free access and favor as the rest.", "And toward the education of your daughters", "I here bestow a simple instrument", "And this small packet of Greek and Latin books.", "[Biondello comes forward with the gifts.]", "If you accept them, then their worth is great."], "n": "2.1.93"}, {"s": "BAPTISTA", "l": ["Lucentio is your name. Of whence, I pray?"], "n": "2.1.107"}, {"s": "TRANIO", "l": ["[, as Lucentio]", "Of Pisa, sir, son to Vincentio."], "n": "2.1.108"}, {"s": "BAPTISTA", "l": ["A mighty man of Pisa. By report", "I know him well. You are very welcome, sir.", "To Hortensio as Litio. Take you the lute, To Lucentio as Cambio. and you the set of books.", "You shall go see your pupils presently.", "Holla, within!", "[Enter a Servant.]", "Sirrah, lead these gentlemen", "To my daughters, and tell them both", "These are their tutors. Bid them use them well.", "[Servant exits with Hortensio and Lucentio.]", "We will go walk a little in the orchard,", "And then to dinner. You are passing welcome,", "And so I pray you all to think yourselves."], "n": "2.1.109"}, {"s": "PETRUCHIO", "l": ["Signior Baptista, my business asketh haste,", "And every day I cannot come to woo.", "You knew my father well, and in him me,", "Left solely heir to all his lands and goods,", "Which I have bettered rather than decreased.", "Then tell me, if I get your daughter’s love,", "What dowry shall I have with her to wife?"], "n": "2.1.121"}, {"s": "BAPTISTA", "l": ["After my death, the one half of my lands,", "And, in possession, twenty thousand crowns."], "n": "2.1.128"}, {"s": "PETRUCHIO", "l": ["And, for that dowry, I’ll assure her of", "Her widowhood, be it that she survive me,", "In all my lands and leases whatsoever.", "Let specialties be therefore drawn between us,", "That covenants may be kept on either hand."], "n": "2.1.130"}, {"s": "BAPTISTA", "l": ["Ay, when the special thing is well obtained,", "That is, her love, for that is all in all."], "n": "2.1.135"}, {"s": "PETRUCHIO", "l": ["Why, that is nothing. For I tell you, father,", "I am as peremptory as she proud-minded;", "And where two raging fires meet together,", "They do consume the thing that feeds their fury.", "Though little fire grows great with little wind,", "Yet extreme gusts will blow out fire and all.", "So I to her and so she yields to me,", "For I am rough and woo not like a babe."], "n": "2.1.137"}, {"s": "BAPTISTA", "l": ["Well mayst thou woo, and happy be thy speed.", "But be thou armed for some unhappy words."], "n": "2.1.145"}, {"s": "PETRUCHIO", "l": ["Ay, to the proof, as mountains are for winds,", "That shakes not, though they blow perpetually."], "n": "2.1.147"}, {"d": "Enter Hortensio as Litio with his head broke."}, {"s": "BAPTISTA", "l": ["How now, my friend, why dost thou look so pale?"], "n": "2.1.149"}, {"s": "HORTENSIO", "l": ["[, as Litio]", "For fear, I promise you, if I look pale."], "n": "2.1.150"}, {"s": "BAPTISTA", "l": ["What, will my daughter prove a good musician?"], "n": "2.1.151"}, {"s": "HORTENSIO", "l": ["[, as Litio]", "I think she’ll sooner prove a soldier!", "Iron may hold with her, but never lutes."], "n": "2.1.152"}, {"s": "BAPTISTA", "l": ["Why, then thou canst not break her to the lute?"], "n": "2.1.154"}, {"s": "HORTENSIO", "l": ["[, as Litio]", "Why, no, for she hath broke the lute to me.", "I did but tell her she mistook her frets,", "And bowed her hand to teach her fingering,", "When, with a most impatient devilish spirit,", "“‘ Frets’ call you these?” quoth she. “ I’ll fume with them!”", "And with that word she struck me on the head,", "And through the instrument my pate made way,", "And there I stood amazèd for a while,", "As on a pillory, looking through the lute,", "While she did call me “ rascal fiddler,”", "And “ twangling Jack,” with twenty such vile terms,", "As had she studied to misuse me so."], "n": "2.1.155"}, {"s": "PETRUCHIO", "l": ["Now, by the world, it is a lusty wench.", "I love her ten times more than ere I did.", "O, how I long to have some chat with her!"], "n": "2.1.168"}, {"s": "BAPTISTA", "l": ["[, to Hortensio as Litio]", "Well, go with me, and be not so discomfited.", "Proceed in practice with my younger daughter.", "She’s apt to learn, and thankful for good turns.—", "Signior Petruchio, will you go with us,", "Or shall I send my daughter Kate to you?"], "n": "2.1.171"}, {"s": "PETRUCHIO", "l": ["I pray you do. I’ll attend her here—", "[All but Petruchio exit.]", "And woo her with some spirit when she comes!", "Say that she rail, why then I’ll tell her plain", "She sings as sweetly as a nightingale.", "Say that she frown, I’ll say she looks as clear", "As morning roses newly washed with dew.", "Say she be mute and will not speak a word,", "Then I’ll commend her volubility", "And say she uttereth piercing eloquence.", "If she do bid me pack, I’ll give her thanks", "As though she bid me stay by her a week.", "If she deny to wed, I’ll crave the day", "When I shall ask the banns, and when be marrièd.", "But here she comes— and now, Petruchio, speak.", "[Enter Katherine.]", "Good morrow, Kate, for that’s your name, I hear."], "n": "2.1.176"}, {"s": "KATHERINE", "l": ["Well have you heard, but something hard of hearing.", "They call me Katherine that do talk of me."], "n": "2.1.191"}, {"s": "PETRUCHIO", "l": ["You lie, in faith, for you are called plain Kate,", "And bonny Kate, and sometimes Kate the curst.", "But Kate, the prettiest Kate in Christendom,", "Kate of Kate Hall, my super-dainty Kate", "( For dainties are all Kates)— and therefore, Kate,", "Take this of me, Kate of my consolation:", "Hearing thy mildness praised in every town,", "Thy virtues spoke of, and thy beauty sounded", "( Yet not so deeply as to thee belongs),", "Myself am moved to woo thee for my wife."], "n": "2.1.193"}, {"s": "KATHERINE", "l": ["“ Moved,” in good time! Let him that moved you hither", "Remove you hence. I knew you at the first", "You were a movable."], "n": "2.1.203"}, {"s": "PETRUCHIO", "l": ["Why, what’s a movable?"], "n": "2.1.207"}, {"s": "KATHERINE", "l": ["A joint stool."], "n": "2.1.208"}, {"s": "PETRUCHIO", "l": ["Thou hast hit it. Come, sit on me."], "n": "2.1.209"}, {"s": "KATHERINE", "l": ["Asses are made to bear, and so are you."], "n": "2.1.210"}, {"s": "PETRUCHIO", "l": ["Women are made to bear, and so are you."], "n": "2.1.211"}, {"s": "KATHERINE", "l": ["No such jade as you, if me you mean."], "n": "2.1.212"}, {"s": "PETRUCHIO", "l": ["Alas, good Kate, I will not burden thee,", "For knowing thee to be but young and light—"], "n": "2.1.213"}, {"s": "KATHERINE", "l": ["Too light for such a swain as you to catch,", "And yet as heavy as my weight should be."], "n": "2.1.215"}, {"s": "PETRUCHIO", "l": ["“ Should be”— should buzz!"], "n": "2.1.217"}, {"s": "KATHERINE", "l": ["Well ta’en, and like a buzzard."], "n": "2.1.218"}, {"s": "PETRUCHIO", "l": ["O slow-winged turtle, shall a buzzard take thee?"], "n": "2.1.220"}, {"s": "KATHERINE", "l": ["Ay, for a turtle, as he takes a buzzard."], "n": "2.1.221"}, {"s": "PETRUCHIO", "l": ["Come, come, you wasp! I’ faith, you are too angry."], "n": "2.1.222"}, {"s": "KATHERINE", "l": ["If I be waspish, best beware my sting."], "n": "2.1.223"}, {"s": "PETRUCHIO", "l": ["My remedy is then to pluck it out."], "n": "2.1.224"}, {"s": "KATHERINE", "l": ["Ay, if the fool could find it where it lies."], "n": "2.1.225"}, {"s": "PETRUCHIO", "l": ["Who knows not where a wasp does wear his sting?", "In his tail."], "n": "2.1.226"}, {"s": "KATHERINE", "l": ["In his tongue."], "n": "2.1.228"}, {"s": "PETRUCHIO", "l": ["Whose tongue?"], "n": "2.1.229"}, {"s": "KATHERINE", "l": ["Yours, if you talk of tales, and so farewell."], "n": "2.1.230"}, {"s": "PETRUCHIO", "l": ["What, with my tongue in your tail?", "Nay, come again, good Kate. I am a gentleman—"], "n": "2.1.231"}, {"s": "KATHERINE", "l": ["That I’ll try."], "n": "2.1.233"}, {"d": "She strikes him."}, {"s": "PETRUCHIO", "l": ["I swear I’ll cuff you if you strike again."], "n": "2.1.234"}, {"s": "KATHERINE", "l": ["So may you lose your arms.", "If you strike me, you are no gentleman,", "And if no gentleman, why then no arms."], "n": "2.1.235"}, {"s": "PETRUCHIO", "l": ["A herald, Kate? O, put me in thy books."], "n": "2.1.238"}, {"s": "KATHERINE", "l": ["What is your crest? A coxcomb?"], "n": "2.1.239"}, {"s": "PETRUCHIO", "l": ["A combless cock, so Kate will be my hen."], "n": "2.1.240"}, {"s": "KATHERINE", "l": ["No cock of mine. You crow too like a craven."], "n": "2.1.241"}, {"s": "PETRUCHIO", "l": ["Nay, come, Kate, come. You must not look so sour."], "n": "2.1.242"}, {"s": "KATHERINE", "l": ["It is my fashion when I see a crab."], "n": "2.1.243"}, {"s": "PETRUCHIO", "l": ["Why, here’s no crab, and therefore look not sour."], "n": "2.1.244"}, {"s": "KATHERINE", "l": ["There is, there is."], "n": "2.1.245"}, {"s": "PETRUCHIO", "l": ["Then show it me."], "n": "2.1.246"}, {"s": "KATHERINE", "l": ["Had I a glass, I would."], "n": "2.1.247"}, {"s": "PETRUCHIO", "l": ["What, you mean my face?"], "n": "2.1.248"}, {"s": "KATHERINE", "l": ["Well aimed of such a young one."], "n": "2.1.249"}, {"s": "PETRUCHIO", "l": ["Now, by Saint George, I am too young for you."], "n": "2.1.250"}, {"s": "KATHERINE", "l": ["Yet you are withered."], "n": "2.1.251"}, {"s": "PETRUCHIO", "l": ["’Tis with cares."], "n": "2.1.252"}, {"s": "KATHERINE", "l": ["I care not."], "n": "2.1.253"}, {"s": "PETRUCHIO", "l": ["Nay, hear you, Kate— in sooth, you ’scape not so."], "n": "2.1.254"}, {"s": "KATHERINE", "l": ["I chafe you if I tarry. Let me go."], "n": "2.1.255"}, {"s": "PETRUCHIO", "l": ["No, not a whit. I find you passing gentle.", "’Twas told me you were rough, and coy, and sullen,", "And now I find report a very liar.", "For thou art pleasant, gamesome, passing courteous,", "But slow in speech, yet sweet as springtime flowers.", "Thou canst not frown, thou canst not look askance,", "Nor bite the lip as angry wenches will,", "Nor hast thou pleasure to be cross in talk.", "But thou with mildness entertain’st thy wooers,", "With gentle conference, soft, and affable.", "Why does the world report that Kate doth limp?", "O sland’rous world! Kate like the hazel twig", "Is straight, and slender, and as brown in hue", "As hazelnuts, and sweeter than the kernels.", "O, let me see thee walk! Thou dost not halt."], "n": "2.1.256"}, {"s": "KATHERINE", "l": ["Go, fool, and whom thou keep’st command."], "n": "2.1.272"}, {"s": "PETRUCHIO", "l": ["Did ever Dian so become a grove", "As Kate this chamber with her princely gait?", "O, be thou Dian and let her be Kate,", "And then let Kate be chaste and Dian sportful."], "n": "2.1.273"}, {"s": "KATHERINE", "l": ["Where did you study all this goodly speech?"], "n": "2.1.277"}, {"s": "PETRUCHIO", "l": ["It is extempore, from my mother wit."], "n": "2.1.278"}, {"s": "KATHERINE", "l": ["A witty mother, witless else her son."], "n": "2.1.279"}, {"s": "PETRUCHIO", "l": ["Am I not wise?"], "n": "2.1.280"}, {"s": "KATHERINE", "l": ["Yes, keep you warm."], "n": "2.1.281"}, {"s": "PETRUCHIO", "l": ["Marry, so I mean, sweet Katherine, in thy bed.", "And therefore, setting all this chat aside,", "Thus in plain terms: your father hath consented", "That you shall be my wife, your dowry ’greed on,", "And, will you, nill you, I will marry you.", "Now, Kate, I am a husband for your turn,", "For by this light, whereby I see thy beauty,", "Thy beauty that doth make me like thee well,", "Thou must be married to no man but me.", "For I am he am born to tame you, Kate,", "And bring you from a wild Kate to a Kate", "Conformable as other household Kates.", "[Enter Baptista, Gremio, and Tranio as Lucentio.]", "Here comes your father. Never make denial.", "I must and will have Katherine to my wife."], "n": "2.1.282"}, {"s": "BAPTISTA", "l": ["Now, Signior Petruchio, how speed you with my daughter?"], "n": "2.1.296"}, {"s": "PETRUCHIO", "l": ["How but well, sir? How but well?", "It were impossible I should speed amiss."], "n": "2.1.298"}, {"s": "BAPTISTA", "l": ["Why, how now, daughter Katherine? In your dumps?"], "n": "2.1.300"}, {"s": "KATHERINE", "l": ["Call you me daughter? Now I promise you", "You have showed a tender fatherly regard,", "To wish me wed to one half lunatic,", "A madcap ruffian and a swearing Jack,", "That thinks with oaths to face the matter out."], "n": "2.1.302"}, {"s": "PETRUCHIO", "l": ["Father, ’tis thus: yourself and all the world", "That talked of her have talked amiss of her.", "If she be curst, it is for policy,", "For she’s not froward, but modest as the dove;", "She is not hot, but temperate as the morn.", "For patience she will prove a second Grissel,", "And Roman Lucrece for her chastity.", "And to conclude, we have ’greed so well together", "That upon Sunday is the wedding day."], "n": "2.1.307"}, {"s": "KATHERINE", "l": ["I’ll see thee hanged on Sunday first."], "n": "2.1.316"}, {"s": "GREMIO", "l": ["Hark, Petruchio, she says she’ll see thee", "hanged first."], "n": "2.1.317"}, {"s": "TRANIO", "l": ["[, as Lucentio]", "Is this your speeding? Nay,", "then, goodnight our part."], "n": "2.1.319"}, {"s": "PETRUCHIO", "l": ["Be patient, gentlemen. I choose her for myself.", "If she and I be pleased, what’s that to you?", "’Tis bargained ’twixt us twain, being alone,", "That she shall still be curst in company.", "I tell you, ’tis incredible to believe", "How much she loves me. O, the kindest Kate!", "She hung about my neck, and kiss on kiss", "She vied so fast, protesting oath on oath,", "That in a twink she won me to her love.", "O, you are novices! ’Tis a world to see", "How tame, when men and women are alone,", "A meacock wretch can make the curstest shrew.—", "Give me thy hand, Kate. I will unto Venice", "To buy apparel ’gainst the wedding day.—", "Provide the feast, father, and bid the guests.", "I will be sure my Katherine shall be fine."], "n": "2.1.321"}, {"s": "BAPTISTA", "l": ["I know not what to say, but give me your hands.", "God send you joy, Petruchio. ’Tis a match."], "n": "2.1.337"}, {"s": "GREMIO and TRANIO", "l": ["[, as Lucentio]", "Amen, say we. We will be witnesses."], "n": "2.1.339"}, {"s": "PETRUCHIO", "l": ["Father, and wife, and gentlemen, adieu.", "I will to Venice. Sunday comes apace.", "We will have rings, and things, and fine array,", "And kiss me, Kate. We will be married o’ Sunday."], "n": "2.1.340"}, {"d": "Petruchio and Katherine exit through different doors."}, {"s": "GREMIO", "l": ["Was ever match clapped up so suddenly?"], "n": "2.1.344"}, {"s": "BAPTISTA", "l": ["Faith, gentlemen, now I play a merchant’s part", "And venture madly on a desperate mart."], "n": "2.1.345"}, {"s": "TRANIO", "l": ["[, as Lucentio]", "’Twas a commodity lay fretting by you.", "’Twill bring you gain, or perish on the seas."], "n": "2.1.347"}, {"s": "BAPTISTA", "l": ["The gain I seek, is quiet in the match."], "n": "2.1.349"}, {"s": "GREMIO", "l": ["No doubt but he hath got a quiet catch.", "But now, Baptista, to your younger daughter.", "Now is the day we long have lookèd for.", "I am your neighbor and was suitor first."], "n": "2.1.350"}, {"s": "TRANIO", "l": ["[, as Lucentio]", "And I am one that love Bianca more", "Than words can witness or your thoughts can guess."], "n": "2.1.354"}, {"s": "GREMIO", "l": ["Youngling, thou canst not love so dear as I."], "n": "2.1.356"}, {"s": "TRANIO", "l": ["[, as Lucentio]", "Graybeard, thy love doth freeze."], "n": "2.1.357"}, {"s": "GREMIO", "l": ["But thine doth fry!", "Skipper, stand back. ’Tis age that nourisheth."], "n": "2.1.358"}, {"s": "TRANIO", "l": ["[, as Lucentio]", "But youth in ladies’ eyes that flourisheth."], "n": "2.1.360"}, {"s": "BAPTISTA", "l": ["Content you, gentlemen. I will compound this strife.", "’Tis deeds must win the prize, and he of both", "That can assure my daughter greatest dower", "Shall have my Bianca’s love.", "Say, Signior Gremio, what can you assure her?"], "n": "2.1.361"}, {"s": "GREMIO", "l": ["First, as you know, my house within the city", "Is richly furnishèd with plate and gold,", "Basins and ewers to lave her dainty hands;", "My hangings all of Tyrian tapestry;", "In ivory coffers I have stuffed my crowns,", "In cypress chests my arras counterpoints,", "Costly apparel, tents, and canopies,", "Fine linen, Turkey cushions bossed with pearl,", "Valance of Venice gold in needlework,", "Pewter and brass, and all things that belongs", "To house or housekeeping. Then, at my farm", "I have a hundred milch-kine to the pail,", "Six score fat oxen standing in my stalls,", "And all things answerable to this portion.", "Myself am struck in years, I must confess,", "And if I die tomorrow this is hers,", "If whilst I live she will be only mine."], "n": "2.1.366"}, {"s": "TRANIO", "l": ["[, as Lucentio]", "That “ only” came well in. To Baptista. Sir, list to me:", "I am my father’s heir and only son.", "If I may have your daughter to my wife,", "I’ll leave her houses three or four as good,", "Within rich Pisa walls, as any one", "Old Signior Gremio has in Padua,", "Besides two thousand ducats by the year", "Of fruitful land, all which shall be her jointure.—", "What, have I pinched you, Signior Gremio?"], "n": "2.1.383"}, {"s": "GREMIO", "l": ["Two thousand ducats by the year of land?", "Aside. My land amounts not to so much in all.—", "That she shall have, besides an argosy", "That now is lying in Marcellus’ road.", "To Tranio. What, have I choked you with an argosy?"], "n": "2.1.393"}, {"s": "TRANIO", "l": ["[, as Lucentio]", "Gremio, ’tis known my father hath no less", "Than three great argosies, besides two galliasses", "And twelve tight galleys. These I will assure her,", "And twice as much whate’er thou off’rest next."], "n": "2.1.398"}, {"s": "GREMIO", "l": ["Nay, I have offered all. I have no more,", "And she can have no more than all I have.", "To Baptista. If you like me, she shall have me and mine."], "n": "2.1.402"}, {"s": "TRANIO", "l": ["[, as Lucentio]", "Why, then, the maid is mine from all the world,", "By your firm promise. Gremio is outvied."], "n": "2.1.406"}, {"s": "BAPTISTA", "l": ["I must confess your offer is the best,", "And, let your father make her the assurance,", "She is your own; else, you must pardon me.", "If you should die before him, where’s her dower?"], "n": "2.1.408"}, {"s": "TRANIO", "l": ["[, as Lucentio]", "That’s but a cavil. He is old, I young."], "n": "2.1.412"}, {"s": "GREMIO", "l": ["And may not young men die as well as old?"], "n": "2.1.413"}, {"s": "BAPTISTA", "l": ["Well, gentlemen, I am thus resolved:", "On Sunday next, you know", "My daughter Katherine is to be married.", "To Tranio as Lucentio. Now, on the Sunday following, shall Bianca", "Be bride to you, if you make this assurance.", "If not, to Signior Gremio.", "And so I take my leave, and thank you both."], "n": "2.1.414"}, {"s": "GREMIO", "l": ["Adieu, good neighbor.", "[Baptista exits.]", "Now I fear thee not.", "Sirrah young gamester, your father were a fool", "To give thee all and in his waning age", "Set foot under thy table. Tut, a toy!", "An old Italian fox is not so kind, my boy."], "n": "2.1.422"}, {"d": "Gremio exits."}, {"s": "TRANIO", "l": ["A vengeance on your crafty withered hide!—", "Yet I have faced it with a card of ten.", "’Tis in my head to do my master good.", "I see no reason but supposed Lucentio", "Must get a father, called “ supposed Vincentio”—", "And that’s a wonder. Fathers commonly", "Do get their children. But in this case of wooing,", "A child shall get a sire, if I fail not of my cunning."], "n": "2.1.428"}, {"d": "He exits."}]}, "r312": {"play": "Richard III", "act": 1, "scene": 2, "title": "SCENE II.  London. Another street.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/richard-iii/read/1/2/", "first": "1.2.1", "last": "1.2.284", "items": [{"d": "Enter the corse of Henry the Sixth on a bier, with Halberds to guard it, Lady Anne being the mourner, accompanied by
