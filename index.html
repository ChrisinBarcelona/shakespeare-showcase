 to look on me?"]}, {"s": "DEMETRIUS", "l": ["I'll run from thee and hide me in the brakes,", "And leave thee to the mercy of wild beasts."]}, {"s": "HELENA", "l": ["The wildest hath not such a heart as you.", "Run when you will, the story shall be changed:", "Apollo flies, and Daphne holds the chase;", "The dove pursues the griffin; the mild hind", "Makes speed to catch the tiger; bootless speed,", "When cowardice pursues and valour flies."]}, {"s": "DEMETRIUS", "l": ["I will not stay thy questions; let me go:", "Or, if thou follow me, do not believe", "But I shall do thee mischief in the wood."]}, {"s": "HELENA", "l": ["Ay, in the temple, in the town, the field,", "You do me mischief. Fie, Demetrius!", "Your wrongs do set a scandal on my sex:", "We cannot fight for love, as men may do;", "We should be wood and were not made to woo.", "[Exit DEMETRIUS]", "I'll follow thee and make a heaven of hell,", "To die upon the hand I love so well."]}, {"d": "Exit"}, {"s": "OBERON", "l": ["Fare thee well, nymph: ere he do leave this grove,", "Thou shalt fly him and he shall seek thy love.", "[Re-enter PUCK]", "Hast thou the flower there? Welcome, wanderer."]}, {"s": "PUCK", "l": ["Ay, there it is."]}, {"s": "OBERON", "l": ["I pray thee, give it me.", "I know a bank where the wild thyme blows,", "Where oxlips and the nodding violet grows,", "Quite over-canopied with luscious woodbine,", "With sweet musk-roses and with eglantine:", "There sleeps Titania sometime of the night,", "Lull'd in these flowers with dances and delight;", "And there the snake throws her enamell'd skin,", "Weed wide enough to wrap a fairy in:", "And with the juice of this I'll streak her eyes,", "And make her full of hateful fantasies.", "Take thou some of it, and seek through this grove:", "A sweet Athenian lady is in love", "With a disdainful youth: anoint his eyes;", "But do it when the next thing he espies", "May be the lady: thou shalt know the man", "By the Athenian garments he hath on.", "Effect it with some care, that he may prove", "More fond on her than she upon her love:", "And look thou meet me ere the first cock crow."]}, {"s": "PUCK", "l": ["Fear not, my lord, your servant shall do so."]}, {"d": "Exeunt"}]}, "mnd32": {"play": "A Midsummer Night's Dream", "act": 3, "scene": 2, "title": "SCENE II.  Another part of the wood.", "items": [{"d": "Enter OBERON"}, {"s": "OBERON", "l": ["I wonder if Titania be awaked;", "Then, what it was that next came in her eye,", "Which she must dote on in extremity.", "[Enter PUCK]", "Here comes my messenger.", "How now, mad spirit!", "What night-rule now about this haunted grove?"]}, {"s": "PUCK", "l": ["My mistress with a monster is in love.", "Near to her close and consecrated bower,", "While she was in her dull and sleeping hour,", "A crew of patches, rude mechanicals,", "That work for bread upon Athenian stalls,", "Were met together to rehearse a play", "Intended for great Theseus' nuptial-day.", "The shallowest thick-skin of that barren sort,", "Who Pyramus presented, in their sport", "Forsook his scene and enter'd in a brake", "When I did him at this advantage take,", "An ass's nole I fixed on his head:", "Anon his Thisbe must be answered,", "And forth my mimic comes. When they him spy,", "As wild geese that the creeping fowler eye,", "Or russet-pated choughs, many in sort,", "Rising and cawing at the gun's report,", "Sever themselves and madly sweep the sky,", "So, at his sight, away his fellows fly;", "And, at our stamp, here o'er and o'er one falls;", "He murder cries and help from Athens calls.", "Their sense thus weak, lost with their fears", "thus strong,", "Made senseless things begin to do them wrong;", "For briers and thorns at their apparel snatch;", "Some sleeves, some hats, from yielders all", "things catch.", "I led them on in this distracted fear,", "And left sweet Pyramus translated there:", "When in that moment, so it came to pass,", "Titania waked and straightway loved an ass."]}, {"s": "OBERON", "l": ["This falls out better than I could devise.", "But hast thou yet latch'd the Athenian's eyes", "With the love-juice, as I did bid thee do?"]}, {"s": "PUCK", "l": ["I took him sleeping,--that is finish'd too,--", "And the Athenian woman by his side:", "That, when he waked, of force she must be eyed."]}, {"d": "Enter HERMIA and DEMETRIUS"}, {"s": "OBERON", "l": ["Stand close: this is the same Athenian."]}, {"s": "PUCK", "l": ["This is the woman, but not this the man."]}, {"s": "DEMETRIUS", "l": ["O, why rebuke you him that loves you so?", "Lay breath so bitter on your bitter foe."]}, {"s": "HERMIA", "l": ["Now I but chide; but I should use thee worse,", "For thou, I fear, hast given me cause to curse,", "If thou hast slain Lysander in his sleep,", "Being o'er shoes in blood, plunge in the deep,", "And kill me too.", "The sun was not so true unto the day", "As he to me: would he have stolen away", "From sleeping Hermia? I'll believe as soon", "This whole earth may be bored and that the moon", "May through the centre creep and so displease", "Her brother's noontide with Antipodes.", "It cannot be but thou hast murder'd him;", "So should a murderer look, so dead, so grim."]}, {"s": "DEMETRIUS", "l": ["So should the murder'd look, and so should I,", "Pierced through the heart with your stern cruelty:", "Yet you, the murderer, look as bright, as clear,", "As yonder Venus in her glimmering sphere."]}, {"s": "HERMIA", "l": ["What's this to my Lysander? where is he?", "Ah, good Demetrius, wilt thou give him me?"]}, {"s": "DEMETRIUS", "l": ["I had rather give his carcass to my hounds."]}, {"s": "HERMIA", "l": ["Out, dog! out, cur! thou drivest me past the bounds", "Of maiden's patience. Hast thou slain him, then?", "Henceforth be never number'd among men!", "O, once tell true, tell true, even for my sake!", "Durst thou have look'd upon him being awake,", "And hast thou kill'd him sleeping? O brave touch!", "Could not a worm, an adder, do so much?", "An adder did it; for with doubler tongue", "Than thine, thou serpent, never adder stung."]}, {"s": "DEMETRIUS", "l": ["You spend your passion on a misprised mood:", "I am not guilty of Lysander's blood;", "Nor is he dead, for aught that I can tell."]}, {"s": "HERMIA", "l": ["I pray thee, tell me then that he is well."]}, {"s": "DEMETRIUS", "l": ["An if I could, what should I get therefore?"]}, {"s": "HERMIA", "l": ["A privilege never to see me more.", "And from thy hated presence part I so:", "See me no more, whether he be dead or no."]}, {"d": "Exit"}, {"s": "DEMETRIUS", "l": ["There is no following her in this fierce vein:", "Here therefore for a while I will remain.", "So sorrow's heaviness doth heavier grow", "For debt that bankrupt sleep doth sorrow owe:", "Which now in some slight measure it will pay,", "If for his tender here I make some stay."]}, {"d": "Lies down and sleeps"}, {"s": "OBERON", "l": ["What hast thou done? thou hast mistaken quite", "And laid the love-juice on some true-love's sight:", "Of thy misprision must perforce ensue", "Some true love turn'd and not a false turn'd true."]}, {"s": "PUCK", "l": ["Then fate o'er-rules, that, one man holding troth,", "A million fail, confounding oath on oath."]}, {"s": "OBERON", "l": ["About the wood go swifter than the wind,", "And Helena of Athens look thou find:", "All fancy-sick she is and pale of cheer,", "With sighs of love, that costs the fresh blood dear:", "By some illusion see thou bring her here:", "I'll charm his eyes against she do appear."]}, {"s": "PUCK", "l": ["I go, I go; look how I go,", "Swifter than arrow from the Tartar's bow."]}, {"d": "Exit"}, {"s": "OBERON", "l": ["Flower of this purple dye,", "Hit with Cupid's archery,", "Sink in apple of his eye.", "When his love he doth espy,", "Let her shine as gloriously", "As the Venus of the sky.", "When thou wakest, if she be by,", "Beg of her for remedy."]}, {"d": "Re-enter PUCK"}, {"s": "PUCK", "l": ["Captain of our fairy band,", "Helena is here at hand;", "And the youth, mistook by me,", "Pleading for a lover's fee.", "Shall we their fond pageant see?", "Lord, what fools these mortals be!"]}, {"s": "OBERON", "l": ["Stand aside: the noise they make", "Will cause Demetrius to awake."]}, {"s": "PUCK", "l": ["Then will two at once woo one;", "That must needs be sport alone;", "And those things do best please me", "That befal preposterously."]}, {"d": "Enter LYSANDER and HELENA"}, {"s": "LYSANDER", "l": ["Why should you think that I should woo in scorn?", "Scorn and derision never come in tears:", "Look, when I vow, I weep; and vows so born,", "In their nativity all truth appears.", "How can these things in me seem scorn to you,", "Bearing the badge of faith, to prove them true?"]}, {"s": "HELENA", "l": ["You do advance your cunning more and more.", "When truth kills truth, O devilish-holy fray!", "These vows are Hermia's: will you give her o'er?", "Weigh oath with oath, and you will nothing weigh:", "Your vows to her and me, put in two scales,", "Will even weigh, and both as light as tales."]}, {"s": "LYSANDER", "l": ["I had no judgment when to her I swore."]}, {"s": "HELENA", "l": ["Nor none, in my mind, now you give her o'er."]}, {"s": "LYSANDER", "l": ["Demetrius loves her, and he loves not you."]}, {"s": "DEMETRIUS", "l": ["Awaking  O Helena, goddess, nymph, perfect, divine!", "To what, my love, shall I compare thine eyne?", "Crystal is muddy. O, how ripe in show", "Thy lips, those kissing cherries, tempting grow!", "That pure congealed white, high Taurus snow,", "Fann'd with the eastern wind, turns to a crow", "When thou hold'st up thy hand: O, let me kiss", "This princess of pure white, this seal of bliss!"]}, {"s": "HELENA", "l": ["O spite! O hell! I see you all are bent", "To set against me for your merriment:", "If you we re civil and knew courtesy,", "You would not do me thus much injury.", "Can you not hate me, as I know you do,", "But you must join in souls to mock me too?", "If you were men, as men you are in show,", "You would not use a gentle lady so;", "To vow, and swear, and superpraise my parts,", "When I am sure you hate me with your hearts.", "You both are rivals, and love Hermia;", "And now both rivals, to mock Helena:", "A trim exploit, a manly enterprise,", "To conjure tears up in a poor maid's eyes", "With your derision! none of noble sort", "Would so offend a virgin, and extort", "A poor soul's patience, all to make you sport."]}, {"s": "LYSANDER", "l": ["You are unkind, Demetrius; be not so;", "For you love Hermia; this you know I know:", "And here, with all good will, with all my heart,", "In Hermia's love I yield you up my part;", "And yours of Helena to me bequeath,", "Whom I do love and will do till my death."]}, {"s": "HELENA", "l": ["Never did mockers waste more idle breath."]}, {"s": "DEMETRIUS", "l": ["Lysander, keep thy Hermia; I will none:", "If e'er I loved her, all that love is gone.", "My heart to her but as guest-wise sojourn'd,", "And now to Helen is it home return'd,", "There to remain."]}, {"s": "LYSANDER", "l": ["Helen, it is not so."]}, {"s": "DEMETRIUS", "l": ["Disparage not the faith thou dost not know,", "Lest, to thy peril, thou aby it dear.", "Look, where thy love comes; yonder is thy dear."]}, {"d": "Re-enter HERMIA"}, {"s": "HERMIA", "l": ["Dark night, that from the eye his function takes,", "The ear more quick of apprehension makes;", "Wherein it doth impair the seeing sense,", "It pays the hearing double recompense.", "Thou art not by mine eye, Lysander, found;", "Mine ear, I thank it, brought me to thy sound", "But why unkindly didst thou leave me so?"]}, {"s": "LYSANDER", "l": ["Why should he stay, whom love doth press to go?"]}, {"s": "HERMIA", "l": ["What love could press Lysander from my side?"]}, {"s": "LYSANDER", "l": ["Lysander's love, that would not let him bide,", "Fair Helena, who more engilds the night", "Than all you fiery oes and eyes of light.", "Why seek'st thou me? could not this make thee know,", "The hate I bear thee made me leave thee so?"]}, {"s": "HERMIA", "l": ["You speak not as you think: it cannot be."]}, {"s": "HELENA", "l": ["Lo, she is one of this confederacy!", "Now I perceive they have conjoin'd all three", "To fashion this false sport, in spite of me.", "Injurious Hermia! most ungrateful maid!", "Have you conspired, have you with these contrived", "To bait me with this foul derision?", "Is all the counsel that we two have shared,", "The sisters' vows, the hours that we have spent,", "When we have chid the hasty-footed time", "For parting us,--O, is it all forgot?", "All school-days' friendship, childhood innocence?", "We, Hermia, like two artificial gods,", "Have with our needles created both one flower,", "Both on one sampler, sitting on one cushion,", "Both warbling of one song, both in one key,", "As if our hands, our sides, voices and minds,", "Had been incorporate. So we grow together,", "Like to a double cherry, seeming parted,", "But yet an union in partition;", "Two lovely berries moulded on one stem;", "So, with two seeming bodies, but one heart;", "Two of the first, like coats in heraldry,", "Due but to one and crowned with one crest.", "And will you rent our ancient love asunder,", "To join with men in scorning your poor friend?", "It is not friendly, 'tis not maidenly:", "Our sex, as well as I, may chide you for it,", "Though I alone do feel the injury."]}, {"s": "HERMIA", "l": ["I am amazed at your passionate words.", "I scorn you not: it seems that you scorn me."]}, {"s": "HELENA", "l": ["Have you not set Lysander, as in scorn,", "To follow me and praise my eyes and face?", "And made your other love, Demetrius,", "Who even but now did spurn me with his foot,", "To call me goddess, nymph, divine and rare,", "Precious, celestial? Wherefore speaks he this", "To her he hates? and wherefore doth Lysander", "Deny your love, so rich within his soul,", "And tender me, forsooth, affection,", "But by your setting on, by your consent?", "What thought I be not so in grace as you,", "So hung upon with love, so fortunate,", "But miserable most, to love unloved?", "This you should pity rather than despise."]}, {"s": "HERNIA", "l": ["I understand not what you mean by this."]}, {"s": "HELENA", "l": ["Ay, do, persever, counterfeit sad looks,", "Make mouths upon me when I turn my back;", "Wink each at other; hold the sweet jest up:", "This sport, well carried, shall be chronicled.", "If you have any pity, grace, or manners,", "You would not make me such an argument.", "But fare ye well: 'tis partly my own fault;", "Which death or absence soon shall remedy."]}, {"s": "LYSANDER", "l": ["Stay, gentle Helena; hear my excuse:", "My love, my life my soul, fair Helena!"]}, {"s": "HELENA", "l": ["O excellent!"]}, {"s": "HERMIA", "l": ["Sweet, do not scorn her so."]}, {"s": "DEMETRIUS", "l": ["If she cannot entreat, I can compel."]}, {"s": "LYSANDER", "l": ["Thou canst compel no more than she entreat:", "Thy threats have no more strength than her weak prayers.", "Helen, I love thee; by my life, I do:", "I swear by that which I will lose for thee,", "To prove him false that says I love thee not."]}, {"s": "DEMETRIUS", "l": ["I say I love thee more than he can do."]}, {"s": "LYSANDER", "l": ["If thou say so, withdraw, and prove it too."]}, {"s": "DEMETRIUS", "l": ["Quick, come!"]}, {"s": "HERMIA", "l": ["Lysander, whereto tends all this?"]}, {"s": "LYSANDER", "l": ["Away, you Ethiope!"]}, {"s": "DEMETRIUS", "l": ["No, no; he'll", "Seem to break loose; take on as you would follow,", "But yet come not: you are a tame man, go!"]}, {"s": "LYSANDER", "l": ["Hang off, thou cat, thou burr! vile thing, let loose,", "Or I will shake thee from me like a serpent!"]}, {"s": "HERMIA", "l": ["Why are you grown so rude? what change is this?", "Sweet love,--"]}, {"s": "LYSANDER", "l": ["Thy love! out, tawny Tartar, out!", "Out, loathed medicine! hated potion, hence!"]}, {"s": "HERMIA", "l": ["Do you not jest?"]}, {"s": "HELENA", "l": ["Yes, sooth; and so do you."]}, {"s": "LYSANDER", "l": ["Demetrius, I will keep my word with thee."]}, {"s": "DEMETRIUS", "l": ["I would I had your bond, for I perceive", "A weak bond holds you: I'll not trust your word."]}, {"s": "LYSANDER", "l": ["What, should I hurt her, strike her, kill her dead?", "Although I hate her, I'll not harm her so."]}, {"s": "HERMIA", "l": ["What, can you do me greater harm than hate?", "Hate me! wherefore? O me! what news, my love!", "Am not I Hermia? are not you Lysander?", "I am as fair now as I was erewhile.", "Since night you loved me; yet since night you left", "me:", "Why, then you left me--O, the gods forbid!--", "In earnest, shall I say?"]}, {"s": "LYSANDER", "l": ["Ay, by my life;", "And never did desire to see thee more.", "Therefore be out of hope, of question, of doubt;", "Be certain, nothing truer; 'tis no jest", "That I do hate thee and love Helena."]}, {"s": "HERMIA", "l": ["O me! you juggler! you canker-blossom!", "You thief of love! what, have you come by night", "And stolen my love's heart from him?"]}, {"s": "HELENA", "l": ["Fine, i'faith!", "Have you no modesty, no maiden shame,", "No touch of bashfulness? What, will you tear", "Impatient answers from my gentle tongue?", "Fie, fie! you counterfeit, you puppet, you!"]}, {"s": "HERMIA", "l": ["Puppet? why so? ay, that way goes the game.", "Now I perceive that she hath made compare", "Between our statures; she hath urged her height;", "And with her personage, her tall personage,", "Her height, forsooth, she hath prevail'd with him.", "And are you grown so high in his esteem;", "Because I am so dwarfish and so low?", "How low am I, thou painted maypole? speak;", "How low am I? I am not yet so low", "But that my nails can reach unto thine eyes."]}, {"s": "HELENA", "l": ["I pray you, though you mock me, gentlemen,", "Let her not hurt me: I was never curst;", "I have no gift at all in shrewishness;", "I am a right maid for my cowardice:", "Let her not strike me. You perhaps may think,", "Because she is something lower than myself,", "That I can match her."]}, {"s": "HERMIA", "l": ["Lower! hark, again."]}, {"s": "HELENA", "l": ["Good Hermia, do not be so bitter with me.", "I evermore did love you, Hermia,", "Did ever keep your counsels, never wrong'd you;", "Save that, in love unto Demetrius,", "I told him of your stealth unto this wood.", "He follow'd you; for love I follow'd him;", "But he hath chid me hence and threaten'd me", "To strike me, spurn me, nay, to kill me too:", "And now, so you will let me quiet go,", "To Athens will I bear my folly back", "And follow you no further: let me go:", "You see how simple and how fond I am."]}, {"s": "HERMIA", "l": ["Why, get you gone: who is't that hinders you?"]}, {"s": "HELENA", "l": ["A foolish heart, that I leave here behind."]}, {"s": "HERMIA", "l": ["What, with Lysander?"]}, {"s": "HELENA", "l": ["With Demetrius."]}, {"s": "LYSANDER", "l": ["Be not afraid; she shall not harm thee, Helena."]}, {"s": "DEMETRIUS", "l": ["No, sir, she shall not, though you take her part."]}, {"s": "HELENA", "l": ["O, when she's angry, she is keen and shrewd!", "She was a vixen when she went to school;", "And though she be but little, she is fierce."]}, {"s": "HERMIA", "l": ["'Little' again! nothing but 'low' and 'little'!", "Why will you suffer her to flout me thus?", "Let me come to her."]}, {"s": "LYSANDER", "l": ["Get you gone, you dwarf;", "You minimus, of hindering knot-grass made;", "You bead, you acorn."]}, {"s": "DEMETRIUS", "l": ["You are too officious", "In her behalf that scorns your services.", "Let her alone: speak not of Helena;", "Take not her part; for, if thou dost intend", "Never so little show of love to her,", "Thou shalt aby it."]}, {"s": "LYSANDER", "l": ["Now she holds me not;", "Now follow, if thou darest, to try whose right,", "Of thine or mine, is most in Helena."]}, {"s": "DEMETRIUS", "l": ["Follow! nay, I'll go with thee, cheek by jole."]}, {"d": "Exeunt LYSANDER and DEMETRIUS"}, {"s": "HERMIA", "l": ["You, mistress, all this coil is 'long of you:", "Nay, go not back."]}, {"s": "HELENA", "l": ["I will not trust you, I,", "Nor longer stay in your curst company.", "Your hands than mine are quicker for a fray,", "My legs are longer though, to run away."]}, {"d": "Exit"}, {"s": "HERMIA", "l": ["I am amazed, and know not what to say."]}, {"d": "Exit"}, {"s": "OBERON", "l": ["This is thy negligence: still thou mistakest,", "Or else committ'st thy knaveries wilfully."]}, {"s": "PUCK", "l": ["Believe me, king of shadows, I mistook.", "Did not you tell me I should know the man", "By the Athenian garment be had on?", "And so far blameless proves my enterprise,", "That I have 'nointed an Athenian's eyes;", "And so far am I glad it so did sort", "As this their jangling I esteem a sport."]}, {"s": "OBERON", "l": ["Thou see'st these lovers seek a place to fight:", "Hie therefore, Robin, overcast the night;", "The starry welkin cover thou anon", "With drooping fog as black as Acheron,", "And lead these testy rivals so astray", "As one come not within another's way.", "Like to Lysander sometime frame thy tongue,", "Then stir Demetrius up with bitter wrong;", "And sometime rail thou like Demetrius;", "And from each other look thou lead them thus,", "Till o'er their brows death-counterfeiting sleep", "With leaden legs and batty wings doth creep:", "Then crush this herb into Lysander's eye;", "Whose liquor hath this virtuous property,", "To take from thence all error with his might,", "And make his eyeballs roll with wonted sight.", "When they next wake, all this derision", "Shall seem a dream and fruitless vision,", "And back to Athens shall the lovers wend,", "With league whose date till death shall never end.", "Whiles I in this affair do thee employ,", "I'll to my queen and beg her Indian boy;", "And then I will her charmed eye release", "From monster's view, and all things shall be peace."]}, {"s": "PUCK", "l": ["My fairy lord, this must be done with haste,", "For night's swift dragons cut the clouds full fast,", "And yonder shines Aurora's harbinger;", "At whose approach, ghosts, wandering here and there,", "Troop home to churchyards: damned spirits all,", "That in crossways and floods have burial,", "Already to their wormy beds are gone;", "For fear lest day should look their shames upon,", "They willfully themselves exile from light", "And must for aye consort with black-brow'd night."]}, {"s": "OBERON", "l": ["But we are spirits of another sort:", "I with the morning's love have oft made sport,", "And, like a forester, the groves may tread,", "Even till the eastern gate, all fiery-red,", "Opening on Neptune with fair blessed beams,", "Turns into yellow gold his salt green streams.", "But, notwithstanding, haste; make no delay:", "We may effect this business yet ere day."]}, {"d": "Exit"}, {"s": "PUCK", "l": ["Up and down, up and down,", "I will lead them up and down:", "I am fear'd in field and town:", "Goblin, lead them up and down.", "Here comes one."]}, {"d": "Re-enter LYSANDER"}, {"s": "LYSANDER", "l": ["Where art thou, proud Demetrius? speak thou now."]}, {"s": "PUCK", "l": ["Here, villain; drawn and ready. Where art thou?"]}, {"s": "LYSANDER", "l": ["I will be with thee straight."]}, {"s": "PUCK", "l": ["Follow me, then,", "To plainer ground."]}, {"d": "Exit LYSANDER, as following the voice"}, {"d": "Re-enter DEMETRIUS"}, {"s": "DEMETRIUS", "l": ["Lysander! speak again:", "Thou runaway, thou coward, art thou fled?", "Speak! In some bush? Where dost thou hide thy head?"]}, {"s": "PUCK", "l": ["Thou coward, art thou bragging to the stars,", "Telling the bushes that thou look'st for wars,", "And wilt not come? Come, recreant; come, thou child;", "I'll whip thee with a rod: he is defiled", "That draws a sword on thee."]}, {"s": "DEMETRIUS", "l": ["Yea, art thou there?"]}, {"s": "PUCK", "l": ["Follow my voice: we'll try no manhood here."]}, {"d": "Exeunt"}, {"d": "Re-enter LYSANDER"}, {"s": "LYSANDER", "l": ["He goes before me and still dares me on:", "When I come where he calls, then he is gone.", "The villain is much lighter-heel'd than I:", "I follow'd fast, but faster he did fly;", "That fallen am I in dark uneven way,", "And here will rest me.", "[Lies down]", "Come, thou gentle day!", "For if but once thou show me thy grey light,", "I'll find Demetrius and revenge this spite."]}, {"d": "Sleeps"}, {"d": "Re-enter PUCK and DEMETRIUS"}, {"s": "PUCK", "l": ["Ho, ho, ho! Coward, why comest thou not?"]}, {"s": "DEMETRIUS", "l": ["Abide me, if thou darest; for well I wot", "Thou runn'st before me, shifting every place,", "And darest not stand, nor look me in the face.", "Where art thou now?"]}, {"s": "PUCK", "l": ["Come hither: I am here."]}, {"s": "DEMETRIUS", "l": ["Nay, then, thou mock'st me. Thou shalt buy this dear,", "If ever I thy face by daylight see:", "Now, go thy way. Faintness constraineth me", "To measure out my length on this cold bed.", "By day's approach look to be visited."]}, {"d": "Lies down and sleeps"}, {"d": "Re-enter HELENA"}, {"s": "HELENA", "l": ["O weary night, O long and tedious night,", "Abate thy hour! Shine comforts from the east,", "That I may back to Athens by daylight,", "From these that my poor company detest:", "And sleep, that sometimes shuts up sorrow's eye,", "Steal me awhile from mine own company."]}, {"d": "Lies down and sleeps"}, {"s": "PUCK", "l": ["Yet but three? Come one more;", "Two of both kinds make up four.", "Here she comes, curst and sad:", "Cupid is a knavish lad,", "Thus to make poor females mad."]}, {"d": "Re-enter HERMIA"}, {"s": "HERMIA", "l": ["Never so weary, never so in woe,", "Bedabbled with the dew and torn with briers,", "I can no further crawl, no further go;", "My legs can keep no pace with my desires.", "Here will I rest me till the break of day.", "Heavens shield Lysander, if they mean a fray!"]}, {"d": "Lies down and sleeps"}, {"s": "PUCK", "l": ["On the ground", "Sleep sound:", "I'll apply", "To your eye,", "Gentle lover, remedy.", "[Squeezing the juice on LYSANDER's eyes]", "When thou wakest,", "Thou takest", "True delight", "In the sight", "Of thy former lady's eye:", "And the country proverb known,", "That every man should take his own,", "In your waking shall be shown:", "Jack shall have Jill;", "Nought shall go ill;", "The man shall have his mare again, and all shall be well."]}, {"d": "Exit"}]}, "shr21": {"play": "The Taming of the Shrew", "act": 2, "scene": 1, "title": "SCENE I.  Padua. A room in BAPTISTA'S house.", "items": [{"d": "Enter KATHARINA and BIANCA"}, {"s": "BIANCA", "l": ["Good sister, wrong me not, nor wrong yourself,", "To make a bondmaid and a slave of me;", "That I disdain: but for these other gawds,", "Unbind my hands, I'll pull them off myself,", "Yea, all my raiment, to my petticoat;", "Or what you will command me will I do,", "So well I know my duty to my elders."]}, {"s": "KATHARINA", "l": ["Of all thy suitors, here I charge thee, tell", "Whom thou lovest best: see thou dissemble not."]}, {"s": "BIANCA", "l": ["Believe me, sister, of all the men alive", "I never yet beheld that special face", "Which I could fancy more than any other."]}, {"s": "KATHARINA", "l": ["Minion, thou liest. Is't not Hortensio?"]}, {"s": "BIANCA", "l": ["If you affect him, sister, here I swear", "I'll plead for you myself, but you shall have", "him."]}, {"s": "KATHARINA", "l": ["O then, belike, you fancy riches more:", "You will have Gremio to keep you fair."]}, {"s": "BIANCA", "l": ["Is it for him you do envy me so?", "Nay then you jest, and now I well perceive", "You have but jested with me all this while:", "I prithee, sister Kate, untie my hands."]}, {"s": "KATHARINA", "l": ["If that be jest, then all the rest was so."]}, {"d": "Strikes her"}, {"d": "Enter BAPTISTA"}, {"s": "BAPTISTA", "l": ["Why, how now, dame! whence grows this insolence?", "Bianca, stand aside. Poor girl! she weeps.", "Go ply thy needle; meddle not with her.", "For shame, thou helding of a devilish spirit,", "Why dost thou wrong her that did ne'er wrong thee?", "When did she cross thee with a bitter word?"]}, {"s": "KATHARINA", "l": ["Her silence flouts me, and I'll be revenged."]}, {"d": "Flies after BIANCA"}, {"s": "BAPTISTA", "l": ["What, in my sight? Bianca, get thee in."]}, {"d": "Exit BIANCA"}, {"s": "KATHARINA", "l": ["What, will you not suffer me? Nay, now I see", "She is your treasure, she must have a husband;", "I must dance bare-foot on her wedding day", "And for your love to her lead apes in hell.", "Talk not to me: I will go sit and weep", "Till I can find occasion of revenge."]}, {"d": "Exit"}, {"s": "BAPTISTA", "l": ["Was ever gentleman thus grieved as I?", "But who comes here?"]}, {"d": "Enter GREMIO, LUCENTIO in the habit of a mean man;\nPETRUCHIO, with HORTENSIO as a musician; and TRANIO,\nwith BIONDELLO bearing a lute and books"}, {"s": "GREMIO", "l": ["Good morrow, neighbour Baptista."]}, {"s": "BAPTISTA", "l": ["Good morrow, neighbour Gremio.", "God save you, gentlemen!"]}, {"s": "PETRUCHIO", "l": ["And you, good sir! Pray, have you not a daughter", "Call'd Katharina, fair and virtuous?"]}, {"s": "BAPTISTA", "l": ["I have a daughter, sir, called Katharina."]}, {"s": "GREMIO", "l": ["You are too blunt: go to it orderly."]}, {"s": "PETRUCHIO", "l": ["You wrong me, Signior Gremio: give me leave.", "I am a gentleman of Verona, sir,", "That, hearing of her beauty and her wit,", "Her affability and bashful modesty,", "Her wondrous qualities and mild behavior,", "Am bold to show myself a forward guest", "Within your house, to make mine eye the witness", "Of that report which I so oft have heard.", "And, for an entrance to my entertainment,", "I do present you with a man of mine,", "[Presenting HORTENSIO]", "Cunning in music and the mathematics,", "To instruct her fully in those sciences,", "Whereof I know she is not ignorant:", "Accept of him, or else you do me wrong:", "His name is Licio, born in Mantua."]}, {"s": "BAPTISTA", "l": ["You're welcome, sir; and he, for your good sake.", "But for my daughter Katharina, this I know,", "She is not for your turn, the more my grief."]}, {"s": "PETRUCHIO", "l": ["I see you do not mean to part with her,", "Or else you like not of my company."]}, {"s": "BAPTISTA", "l": ["Mistake me not; I speak but as I find.", "Whence are you, sir? what may I call your name?"]}, {"s": "PETRUCHIO", "l": ["Petruchio is my name; Antonio's son,", "A man well known throughout all Italy."]}, {"s": "BAPTISTA", "l": ["I know him well: you are welcome for his sake."]}, {"s": "GREMIO", "l": ["Saving your tale, Petruchio, I pray,", "Let us, that are poor petitioners, speak too:", "Baccare! you are marvellous forward."]}, {"s": "PETRUCHIO", "l": ["O, pardon me, Signior Gremio; I would fain be doing."]}, {"s": "GREMIO", "l": ["I doubt it not, sir; but you will curse your", "wooing. Neighbour, this is a gift very grateful, I am", "sure of it. To express the like kindness, myself,", "that have been more kindly beholding to you than", "any, freely give unto you this young scholar,", "[Presenting LUCENTIO]", "that hath been long studying at Rheims; as cunning", "in Greek, Latin, and other languages, as the other", "in music and mathematics: his name is Cambio; pray,", "accept his service."]}, {"s": "BAPTISTA", "l": ["A thousand thanks, Signior Gremio.", "Welcome, good Cambio.", "[To TRANIO]", "But, gentle sir, methinks you walk like a stranger:", "may I be so bold to know the cause of your coming?"]}, {"s": "TRANIO", "l": ["Pardon me, sir, the boldness is mine own,", "That, being a stranger in this city here,", "Do make myself a suitor to your daughter,", "Unto Bianca, fair and virtuous.", "Nor is your firm resolve unknown to me,", "In the preferment of the eldest sister.", "This liberty is all that I request,", "That, upon knowledge of my parentage,", "I may have welcome 'mongst the rest that woo", "And free access and favour as the rest:", "And, toward the education of your daughters,", "I here bestow a simple instrument,", "And this small packet of Greek and Latin books:", "If you accept them, then their worth is great."]}, {"s": "BAPTISTA", "l": ["Lucentio is your name; of whence, I pray?"]}, {"s": "TRANIO", "l": ["Of Pisa, sir; son to Vincentio."]}, {"s": "BAPTISTA", "l": ["A mighty man of Pisa; by report", "I know him well: you are very welcome, sir,", "Take you the lute, and you the set of books;", "You shall go see your pupils presently.", "Holla, within!", "[Enter a Servant]", "Sirrah, lead these gentlemen", "To my daughters; and tell them both,", "These are their tutors: bid them use them well.", "[Exit Servant, with LUCENTIO and HORTENSIO,\nBIONDELLO following]", "We will go walk a little in the orchard,", "And then to dinner. You are passing welcome,", "And so I pray you all to think yourselves."]}, {"s": "PETRUCHIO", "l": ["Signior Baptista, my business asketh haste,", "And every day I cannot come to woo.", "You knew my father well, and in him me,", "Left solely heir to all his lands and goods,", "Which I have better'd rather than decreased:", "Then tell me, if I get your daughter's love,", "What dowry shall I have with her to wife?"]}, {"s": "BAPTISTA", "l": ["After my death the one half of my lands,", "And in possession twenty thousand crowns."]}, {"s": "PETRUCHIO", "l": ["And, for that dowry, I'll assure her of", "Her widowhood, be it that she survive me,", "In all my lands and leases whatsoever:", "Let specialties be therefore drawn between us,", "That covenants may be kept on either hand."]}, {"s": "BAPTISTA", "l": ["Ay, when the special thing is well obtain'd,", "That is, her love; for that is all in all."]}, {"s": "PETRUCHIO", "l": ["Why, that is nothing: for I tell you, father,", "I am as peremptory as she proud-minded;", "And where two raging fires meet together", "They do consume the thing that feeds their fury:", "Though little fire grows great with little wind,", "Yet extreme gusts will blow out fire and all:", "So I to her and so she yields to me;", "For I am rough and woo not like a babe."]}, {"s": "BAPTISTA", "l": ["Well mayst thou woo, and happy be thy speed!", "But be thou arm'd for some unhappy words."]}, {"s": "PETRUCHIO", "l": ["Ay, to the proof; as mountains are for winds,", "That shake not, though they blow perpetually."]}, {"d": "Re-enter HORTENSIO, with his head broke"}, {"s": "BAPTISTA", "l": ["How now, my friend! why dost thou look so pale?"]}, {"s": "HORTENSIO", "l": ["For fear, I promise you, if I look pale."]}, {"s": "BAPTISTA", "l": ["What, will my daughter prove a good musician?"]}, {"s": "HORTENSIO", "l": ["I think she'll sooner prove a soldier", "Iron may hold with her, but never lutes."]}, {"s": "BAPTISTA", "l": ["Why, then thou canst not break her to the lute?"]}, {"s": "HORTENSIO", "l": ["Why, no; for she hath broke the lute to me.", "I did but tell her she mistook her frets,", "And bow'd her hand to teach her fingering;", "When, with a most impatient devilish spirit,", "'Frets, call you these?' quoth she; 'I'll fume", "with them:'", "And, with that word, she struck me on the head,", "And through the instrument my pate made way;", "And there I stood amazed for a while,", "As on a pillory, looking through the lute;", "While she did call me rascal fiddler", "And twangling Jack; with twenty such vile terms,", "As had she studied to misuse me so."]}, {"s": "PETRUCHIO", "l": ["Now, by the world, it is a lusty wench;", "I love her ten times more than e'er I did:", "O, how I long to have some chat with her!"]}, {"s": "BAPTISTA", "l": ["Well, go with me and be not so discomfited:", "Proceed in practise with my younger daughter;", "She's apt to learn and thankful for good turns.", "Signior Petruchio, will you go with us,", "Or shall I send my daughter Kate to you?"]}, {"s": "PETRUCHIO", "l": ["I pray you do.", "[Exeunt all but PETRUCHIO]", "I will attend her here,", "And woo her with some spirit when she comes.", "Say that she rail; why then I'll tell her plain", "She sings as sweetly as a nightingale:", "Say that she frown, I'll say she looks as clear", "As morning roses newly wash'd with dew:", "Say she be mute and will not speak a word;", "Then I'll commend her volubility,", "And say she uttereth piercing eloquence:", "If she do bid me pack, I'll give her thanks,", "As though she bid me stay by her a week:", "If she deny to wed, I'll crave the day", "When I shall ask the banns and when be married.", "But here she comes; and now, Petruchio, speak.", "[Enter KATHARINA]", "Good morrow, Kate; for that's your name, I hear."]}, {"s": "KATHARINA", "l": ["Well have you heard, but something hard of hearing:", "They call me Katharina that do talk of me."]}, {"s": "PETRUCHIO", "l": ["You lie, in faith; for you are call'd plain Kate,", "And bonny Kate and sometimes Kate the curst;", "But Kate, the prettiest Kate in Christendom", "Kate of Kate Hall, my super-dainty Kate,", "For dainties are all Kates, and therefore, Kate,", "Take this of me, Kate of my consolation;", "Hearing thy mildness praised in every town,", "Thy virtues spoke of, and thy beauty sounded,", "Yet not so deeply as to thee belongs,", "Myself am moved to woo thee for my wife."]}, {"s": "KATHARINA", "l": ["Moved! in good time: let him that moved you hither", "Remove you hence: I knew you at the first", "You were a moveable."]}, {"s": "PETRUCHIO", "l": ["Why, what's a moveable?"]}, {"s": "KATHARINA", "l": ["A join'd-stool."]}, {"s": "PETRUCHIO", "l": ["Thou hast hit it: come, sit on me."]}, {"s": "KATHARINA", "l": ["Asses are made to bear, and so are you."]}, {"s": "PETRUCHIO", "l": ["Women are made to bear, and so are you."]}, {"s": "KATHARINA", "l": ["No such jade as you, if me you mean."]}, {"s": "PETRUCHIO", "l": ["Alas! good Kate, I will not burden thee;", "For, knowing thee to be but young and light--"]}, {"s": "KATHARINA", "l": ["Too light for such a swain as you to catch;", "And yet as heavy as my weight should be."]}, {"s": "PETRUCHIO", "l": ["Should be! should--buzz!"]}, {"s": "KATHARINA", "l": ["Well ta'en, and like a buzzard."]}, {"s": "PETRUCHIO", "l": ["O slow-wing'd turtle! shall a buzzard take thee?"]}, {"s": "KATHARINA", "l": ["Ay, for a turtle, as he takes a buzzard."]}, {"s": "PETRUCHIO", "l": ["Come, come, you wasp; i' faith, you are too angry."]}, {"s": "KATHARINA", "l": ["If I be waspish, best beware my sting."]}, {"s": "PETRUCHIO", "l": ["My remedy is then, to pluck it out."]}, {"s": "KATHARINA", "l": ["Ay, if the fool could find it where it lies,"]}, {"s": "PETRUCHIO", "l": ["Who knows not where a wasp does", "wear his sting? In his tail."]}, {"s": "KATHARINA", "l": ["In his tongue."]}, {"s": "PETRUCHIO", "l": ["Whose tongue?"]}, {"s": "KATHARINA", "l": ["Yours, if you talk of tails: and so farewell."]}, {"s": "PETRUCHIO", "l": ["What, with my tongue in your tail? nay, come again,", "Good Kate; I am a gentleman."]}, {"s": "KATHARINA", "l": ["That I'll try."]}, {"d": "She strikes him"}, {"s": "PETRUCHIO", "l": ["I swear I'll cuff you, if you strike again."]}, {"s": "KATHARINA", "l": ["So may you lose your arms:", "If you strike me, you are no gentleman;", "And if no gentleman, why then no arms."]}, {"s": "PETRUCHIO", "l": ["A herald, Kate? O, put me in thy books!"]}, {"s": "KATHARINA", "l": ["What is your crest? a coxcomb?"]}, {"s": "PETRUCHIO", "l": ["A combless cock, so Kate will be my hen."]}, {"s": "KATHARINA", "l": ["No cock of mine; you crow too like a craven."]}, {"s": "PETRUCHIO", "l": ["Nay, come, Kate, come; you must not look so sour."]}, {"s": "KATHARINA", "l": ["It is my fashion, when I see a crab."]}, {"s": "PETRUCHIO", "l": ["Why, here's no crab; and therefore look not sour."]}, {"s": "KATHARINA", "l": ["There is, there is."]}, {"s": "PETRUCHIO", "l": ["Then show it me."]}, {"s": "KATHARINA", "l": ["Had I a glass, I would."]}, {"s": "PETRUCHIO", "l": ["What, you mean my face?"]}, {"s": "KATHARINA", "l": ["Well aim'd of such a young one."]}, {"s": "PETRUCHIO", "l": ["Now, by Saint George, I am too young for you."]}, {"s": "KATHARINA", "l": ["Yet you are wither'd."]}, {"s": "PETRUCHIO", "l": ["'Tis with cares."]}, {"s": "KATHARINA", "l": ["I care not."]}, {"s": "PETRUCHIO", "l": ["Nay, hear you, Kate: in sooth you scape not so."]}, {"s": "KATHARINA", "l": ["I chafe you, if I tarry: let me go."]}, {"s": "PETRUCHIO", "l": ["No, not a whit: I find you passing gentle.", "'Twas told me you were rough and coy and sullen,", "And now I find report a very liar;", "For thou are pleasant, gamesome, passing courteous,", "But slow in speech, yet sweet as spring-time flowers:", "Thou canst not frown, thou canst not look askance,", "Nor bite the lip, as angry wenches will,", "Nor hast thou pleasure to be cross in talk,", "But thou with mildness entertain'st thy wooers,", "With gentle conference, soft and affable.", "Why does the world report that Kate doth limp?", "O slanderous world! Kate like the hazel-twig", "Is straight and slender and as brown in hue", "As hazel nuts and sweeter than the kernels.", "O, let me see thee walk: thou dost not halt."]}, {"s": "KATHARINA", "l": ["Go, fool, and whom thou keep'st command."]}, {"s": "PETRUCHIO", "l": ["Did ever Dian so become a grove", "As Kate this chamber with her princely gait?", "O, be thou Dian, and let her be Kate;", "And then let Kate be chaste and Dian sportful!"]}, {"s": "KATHARINA", "l": ["Where did you study all this goodly speech?"]}, {"s": "PETRUCHIO", "l": ["It is extempore, from my mother-wit."]}, {"s": "KATHARINA", "l": ["A witty mother! witless else her son."]}, {"s": "PETRUCHIO", "l": ["Am I not wise?"]}, {"s": "KATHARINA", "l": ["Yes; keep you warm."]}, {"s": "PETRUCHIO", "l": ["Marry, so I mean, sweet Katharina, in thy bed:", "And therefore, setting all this chat aside,", "Thus in plain terms: your father hath consented", "That you shall be my wife; your dowry 'greed on;", "And, Will you, nill you, I will marry you.", "Now, Kate, I am a husband for your turn;", "For, by this light, whereby I see thy beauty,", "Thy beauty, that doth make me like thee well,", "Thou must be married to no man but me;", "For I am he am born to tame you Kate,", "And bring you from a wild Kate to a Kate", "Conformable as other household Kates.", "Here comes your father: never make denial;", "I must and will have Katharina to my wife."]}, {"d": "Re-enter BAPTISTA, GREMIO, and TRANIO"}, {"s": "BAPTISTA", "l": ["Now, Signior Petruchio, how speed you with my daughter?"]}, {"s": "PETRUCHIO", "l": ["How but well, sir? how but well?", "It were impossible I should speed amiss."]}, {"s": "BAPTISTA", "l": ["Why, how now, daughter Katharina! in your dumps?"]}, {"s": "KATHARINA", "l": ["Call you me daughter? now, I promise you", "You have show'd a tender fatherly regard,", "To wish me wed to one half lunatic;", "A mad-cup ruffian and a swearing Jack,", "That thinks with oaths to face the matter out."]}, {"s": "PETRUCHIO", "l": ["Father, 'tis thus: yourself and all the world,", "That talk'd of her, have talk'd amiss of her:", "If she be curst, it is for policy,", "For she's not froward, but modest as the dove;", "She is not hot, but temperate as the morn;", "For patience she will prove a second Grissel,", "And Roman Lucrece for her chastity:", "And to conclude, we have 'greed so well together,", "That upon Sunday is the wedding-day."]}, {"s": "KATHARINA", "l": ["I'll see thee hang'd on Sunday first."]}, {"s": "GREMIO", "l": ["Hark, Petruchio; she says she'll see thee", "hang'd first."]}, {"s": "TRANIO", "l": ["Is this your speeding? nay, then, good night our part!"]}, {"s": "PETRUCHIO", "l": ["Be patient, gentlemen; I choose her for myself:", "If she and I be pleased, what's that to you?", "'Tis bargain'd 'twixt us twain, being alone,", "That she shall still be curst in company.", "I tell you, 'tis incredible to believe", "How much she loves me: O, the kindest Kate!", "She hung about my neck; and kiss on kiss", "She vied so fast, protesting oath on oath,", "That in a twink she won me to her love.", "O, you are novices! 'tis a world to see,", "How tame, when men and women are alone,", "A meacock wretch can make the curstest shrew.", "Give me thy hand, Kate: I will unto Venice,", "To buy apparel 'gainst the wedding-day.", "Provide the feast, father, and bid the guests;", "I will be sure my Katharina shall be fine."]}, {"s": "BAPTISTA", "l": ["I know not what to say: but give me your hands;", "God send you joy, Petruchio! 'tis a match."]}, {"s": "GREMIO / TRANIO", "l": ["Amen, say we: we will be witnesses."]}, {"s": "PETRUCHIO", "l": ["Father, and wife, and gentlemen, adieu;", "I will to Venice; Sunday comes apace:", "We will have rings and things and fine array;", "And kiss me, Kate, we will be married o'Sunday."]}, {"d": "Exeunt PETRUCHIO and KATHARINA severally"}, {"s": "GREMIO", "l": ["Was ever match clapp'd up so suddenly?"]}, {"s": "BAPTISTA", "l": ["Faith, gentlemen, now I play a merchant's part,", "And venture madly on a desperate mart."]}, {"s": "TRANIO", "l": ["'Twas a commodity lay fretting by you:", "'Twill bring you gain, or perish on the seas."]}, {"s": "BAPTISTA", "l": ["The gain I seek is, quiet in the match."]}, {"s": "GREMIO", "l": ["No doubt but he hath got a quiet catch.", "But now, Baptists, to your younger daughter:", "Now is the day we long have looked for:", "I am your neighbour, and was suitor first."]}, {"s": "TRANIO", "l": ["And I am one that love Bianca more", "Than words can witness, or your thoughts can guess."]}, {"s": "GREMIO", "l": ["Youngling, thou canst not love so dear as I."]}, {"s": "TRANIO", "l": ["Graybeard, thy love doth freeze."]}, {"s": "GREMIO", "l": ["But thine doth fry.", "Skipper, stand back: 'tis age that nourisheth."]}, {"s": "TRANIO", "l": ["But youth in ladies' eyes that flourisheth."]}, {"s": "BAPTISTA", "l": ["Content you, gentlemen: I will compound this strife:", "'Tis deeds must win the prize; and he of both", "That can assure my daughter greatest dower", "Shall have my Bianca's love.", "Say, Signior Gremio, What can you assure her?"]}, {"s": "GREMIO", "l": ["First, as you know, my house within the city", "Is richly furnished with plate and gold;", "Basins and ewers to lave her dainty hands;", "My hangings all of Tyrian tapestry;", "In ivory coffers I have stuff'd my crowns;", "In cypress chests my arras counterpoints,", "Costly apparel, tents, and canopies,", "Fine linen, Turkey cushions boss'd with pearl,", "Valance of Venice gold in needlework,", "Pewter and brass and all things that belong", "To house or housekeeping: then, at my farm", "I have a hundred milch-kine to the pail,", "Sixscore fat oxen standing in my stalls,", "And all things answerable to this portion.", "Myself am struck in years, I must confess;", "And if I die to-morrow, this is hers,", "If whilst I live she will be only mine."]}, {"s": "TRANIO", "l": ["That 'only' came well in. Sir, list to me:", "I am my father's heir and only son:", "If I may have your daughter to my wife,", "I'll leave her houses three or four as good,", "Within rich Pisa walls, as any one", "Old Signior Gremio has in Padua;", "Besides two thousand ducats by the year", "Of fruitful land, all which shall be her jointure.", "What, have I pinch'd you, Signior Gremio?"]}, {"s": "GREMIO", "l": ["Two thousand ducats by the year of land!", "My land amounts not to so much in all:", "That she shall have; besides an argosy", "That now is lying in Marseilles' road.", "What, have I choked you with an argosy?"]}, {"s": "TRANIO", "l": ["Gremio, 'tis known my father hath no less", "Than three great argosies; besides two galliases,", "And twelve tight galleys: these I will assure her,", "And twice as much, whate'er thou offer'st next."]}, {"s": "GREMIO", "l": ["Nay, I have offer'd all, I have no more;", "And she can have no more than all I have:", "If you like me, she shall have me and mine."]}, {"s": "TRANIO", "l": ["Why, then the maid is mine from all the world,", "By your firm promise: Gremio is out-vied."]}, {"s": "BAPTISTA", "l": ["I must confess your offer is the best;", "And, let your father make her the assurance,", "She is your own; else, you must pardon me,", "if you should die before him, where's her dower?"]}, {"s": "TRANIO", "l": ["That's but a cavil: he is old, I young."]}, {"s": "GREMIO", "l": ["And may not young men die, as well as old?"]}, {"s": "BAPTISTA", "l": ["Well, gentlemen,", "I am thus resolved: on Sunday next you know", "My daughter Katharina is to be married:", "Now, on the Sunday following, shall Bianca", "Be bride to you, if you this assurance;", "If not, Signior Gremio:", "And so, I take my leave, and thank you both."]}, {"s": "GREMIO", "l": ["Adieu, good neighbour.", "[Exit BAPTISTA]", "Now I fear thee not:", "Sirrah young gamester, your father were a fool", "To give thee all, and in his waning age", "Set foot under thy table: tut, a toy!", "An old Italian fox is not so kind, my boy."]}, {"d": "Exit"}, {"s": "TRANIO", "l": ["A vengeance on your crafty wither'd hide!", "Yet I have faced it with a card of ten.", "'Tis in my head to do my master good:", "I see no reason but supposed Lucentio", "Must get a father, call'd 'supposed Vincentio;'", "And that's a wonder: fathers commonly", "Do get their children; but in this case of wooing,", "A child shall get a sire, if I fail not of my cunning."]}, {"d": "Exit"}]}, "r312": {"play": "The Tragedy of Richard the Third", "act": 1, "scene": 2, "title": "SCENE II.  The same. Another street.", "items": [{"d": "Enter the corpse of KING HENRY the Sixth, Gentlemen\nwith halberds to guard it; LADY ANNE being the mourner"}, {"s": "LADY ANNE", "l": ["Set down, set down your honourable load,", "If honour may be shrouded in a hearse,", "Whilst I awhile obsequiously lament", "The untimely fall of virtuous Lancaster.", "Poor key-cold figure of a holy king!", "Pale ashes of the house of Lancaster!", "Thou bloodless remnant of that royal blood!", "Be it lawful that I invocate thy ghost,", "To hear the lamentations of Poor Anne,", "Wife to thy Edward, to thy slaughter'd son,", "Stabb'd by the selfsame hand that made these wounds!", "Lo, in these windows that let forth thy life,", "I pour the helpless balm of my poor eyes.", "Cursed be the hand that made these fatal holes!", "Cursed be the heart that had the heart to do it!", "Cursed the blood that let this blood from hence!", "More direful hap betide that hated wretch,", "That makes us wretched by the death of thee,", "Than I can wish to adders, spiders, toads,", "Or any creeping venom'd thing that lives!", "If ever he have child, abortive be it,", "Prodigious, and untimely brought to light,", "Whose ugly and unnatural aspect", "May fright the hopeful mother at the view;", "And that be heir to his unhappiness!", "If ever he have wife, let her he made", "A miserable by the death of him", "As I am made by my poor lord and thee!", "Come, now towards Chertsey with your holy load,", "Taken from Paul's to be interred there;", "And still, as you are weary of the weight,", "Rest you, whiles I lament King Henry's corse."]}, {"d": "Enter GLOUCESTER"}, {"s": "GLOUCESTER", "l": ["Stay, you that bear the corse, and set it down."]}, {"s": "LADY ANNE", "l": ["What black magician conjures up this fiend,", "To stop devoted charitable deeds?"]}, {"s": "GLOUCESTER", "l": ["Villains, set down the corse; or, by Saint Paul,", "I'll make a corse of him that disobeys."]}, {"s": "Gentleman", "l": ["My lord, stand back, and let the coffin pass."]}, {"s": "GLOUCESTER", "l": ["Unmanner'd dog! stand thou, when I command:", "Advance thy halbert higher than my breast,", "Or, by Saint Paul, I'll strike thee to my foot,", "And spurn upon thee, beggar, for thy boldness."]}, {"s": "LADY ANNE", "l": ["What, do you tremble? are you all afraid?", "Alas, I blame you not; for you are mortal,", "And mortal eyes cannot endure the devil.", "Avaunt, thou dreadful minister of hell!", "Thou hadst but power over his mortal body,", "His soul thou canst not have; therefore be gone."]}, {"s": "GLOUCESTER", "l": ["Sweet saint, for charity, be not so curst."]}, {"s": "LADY ANNE", "l": ["Foul devil, for God's sake, hence, and trouble us not;", "For thou hast made the happy earth thy hell,", "Fill'd it with cursing cries and deep exclaims.", "If thou delight to view thy heinous deeds,", "Behold this pattern of thy butcheries.", "O, gentlemen, see, see! dead Henry's wounds", "Open their congeal'd mouths and bleed afresh!", "Blush, Blush, thou lump of foul deformity;", "For 'tis thy presence that exhales this blood", "From cold and empty veins, where no blood dwells;", "Thy deed, inhuman and unnatural,", "Provokes this deluge most unnatural.", "O God, which this blood madest, revenge his death!", "O earth, which this blood drink'st revenge his death!", "Either heaven with lightning strike the", "murderer dead,", "Or earth, gape open wide and eat him quick,", "As thou dost swallow up this good king's blood", "Which his hell-govern'd arm hath butchered!"]}, {"s": "GLOUCESTER", "l": ["Lady, you know no rules of charity,", "Which renders good for bad, blessings for curses."]}, {"s": "LADY ANNE", "l": ["Villain, thou know'st no law of God nor man:", "No beast so fierce but knows some touch of pity."]}, {"s": "GLOUCESTER", "l": ["But I know none, and therefore am no beast."]}, {"s": "LADY ANNE", "l": ["O wonderful, when devils tell the truth!"]}, {"s": "GLOUCESTER", "l": ["More wonderful, when angels are so angry.", "Vouchsafe, divine perfection of a woman,", "Of these supposed-evils, to give me leave,", "By circumstance, but to acquit myself."]}, {"s": "LADY ANNE", "l": ["Vouchsafe, defused infection of a man,", "For these known evils, but to give me leave,", "By circumstance, to curse thy cursed self."]}, {"s": "GLOUCESTER", "l": ["Fairer than tongue can name thee, let me have", "Some patient leisure to excuse myself."]}, {"s": "LADY ANNE", "l": ["Fouler than heart can think thee, thou canst make", "No excuse current, but to hang thyself."]}, {"s": "GLOUCESTER", "l": ["By such despair, I should accuse myself."]}, {"s": "LADY ANNE", "l": ["And, by despairing, shouldst thou stand excused;", "For doing worthy vengeance on thyself,", "Which didst unworthy slaughter upon others."]}, {"s": "GLOUCESTER", "l": ["Say that I slew them not?"]}, {"s": "LADY ANNE", "l": ["Why, then they are not dead:", "But dead they are, and devilish slave, by thee."]}, {"s": "GLOUCESTER", "l": ["I did not kill your husband."]}, {"s": "LADY ANNE", "l": ["Why, then he is alive."]}, {"s": "GLOUCESTER", "l": ["Nay, he is dead; and slain by Edward's hand."]}, {"s": "LADY ANNE", "l": ["In thy foul throat thou liest: Queen Margaret saw", "Thy murderous falchion smoking in his blood;", "The which thou once didst bend against her breast,", "But that thy brothers beat aside the point."]}, {"s": "GLOUCESTER", "l": ["I was provoked by her slanderous tongue,", "which laid their guilt upon my guiltless shoulders."]}, {"s": "LADY ANNE", "l": ["Thou wast provoked by thy bloody mind.", "Which never dreamt on aught but butcheries:", "Didst thou not kill this king?"]}, {"s": "GLOUCESTER", "l": ["I grant ye."]}, {"s": "LADY ANNE", "l": ["Dost grant me, hedgehog? then, God grant me too", "Thou mayst be damned for that wicked deed!", "O, he was gentle, mild, and virtuous!"]}, {"s": "GLOUCESTER", "l": ["The fitter for the King of heaven, that hath him."]}, {"s": "LADY ANNE", "l": ["He is in heaven, where thou shalt never come."]}, {"s": "GLOUCESTER", "l": ["Let him thank me, that holp to send him thither;", "For he was fitter for that place than earth."]}, {"s": "LADY ANNE", "l": ["And thou unfit for any place but hell."]}, {"s": "GLOUCESTER", "l": ["Yes, one place else, if you will hear me name it."]}, {"s": "LADY ANNE", "l": ["Some dungeon."]}, {"s": "GLOUCESTER", "l": ["Your bed-chamber."]}, {"s": "LADY ANNE", "l": ["I'll rest betide the chamber where thou liest!"]}, {"s": "GLOUCESTER", "l": ["So will it, madam till I lie with you."]}, {"s": "LADY ANNE", "l": ["I hope so."]}, {"s": "GLOUCESTER", "l": ["I know so. But, gentle Lady Anne,", "To leave this keen encounter of our wits,", "And fall somewhat into a slower method,", "Is not the causer of the timeless deaths", "Of these Plantagenets, Henry and Edward,", "As blameful as the executioner?"]}, {"s": "LADY ANNE", "l": ["Thou art the cause, and most accursed effect."]}, {"s": "GLOUCESTER", "l": ["Your beauty was the cause of that effect;", "Your beauty: which did haunt me in my sleep", "To undertake the death of all the world,", "So I might live one hour in your sweet bosom."]}, {"s": "LADY ANNE", "l": ["If I thought that, I tell thee, homicide,", "These nails should rend that beauty from my cheeks."]}, {"s": "GLOUCESTER", "l": ["These eyes could never endure sweet beauty's wreck;", "You should not blemish it, if I stood by:", "As all the world is cheered by the sun,", "So I by that; it is my day, my life."]}, {"s": "LADY ANNE", "l": ["Black night o'ershade thy day, and death thy life!"]}, {"s": "GLOUCESTER", "l": ["Curse not thyself, fair creature thou art both."]}, {"s": "LADY ANNE", "l": ["I would I were, to be revenged on thee."]}, {"s": "GLOUCESTER", "l": ["It is a quarrel most unnatural,", "To be revenged on him that loveth you."]}, {"s": "LADY ANNE", "l": ["It is a quarrel just and reasonable,", "To be revenged on him that slew my husband."]}, {"s": "GLOUCESTER", "l": ["He that bereft thee, lady, of thy husband,", "Did it to help thee to a better husband."]}, {"s": "LADY ANNE", "l": ["His better doth not breathe upon the earth."]}, {"s": "GLOUCESTER", "l": ["He lives that loves thee better than he could."]}, {"s": "LADY ANNE", "l": ["Name him."]}, {"s": "GLOUCESTER", "l": ["Plantagenet."]}, {"s": "LADY ANNE", "l": ["Why, that was he."]}, {"s": "GLOUCESTER", "l": ["The selfsame name, but one of better nature."]}, {"s": "LADY ANNE", "l": ["Where is he?"]}, {"s": "GLOUCESTER", "l": ["Here.", "[She spitteth at him]", "Why dost thou spit at me?"]}, {"s": "LADY ANNE", "l": ["Would it were mortal poison, for thy sake!"]}, {"s": "GLOUCESTER", "l": ["Never came poison from so sweet a place."]}, {"s": "LADY ANNE", "l": ["Never hung poison on a fouler toad.", "Out of my sight! thou dost infect my eyes."]}, {"s": "GLOUCESTER", "l": ["Thine eyes, sweet lady, have infected mine."]}, {"s": "LADY ANNE", "l": ["Would they were basilisks, to strike thee dead!"]}, {"s": "GLOUCESTER", "l": ["I would they were, that I might die at once;", "For now they kill me with a living death.", "Those eyes of thine from mine have drawn salt tears,", "Shamed their aspect with store of childish drops:", "These eyes that never shed remorseful tear,", "No, when my father York and Edward wept,", "To hear the piteous moan that Rutland made", "When black-faced Clifford shook his sword at him;", "Nor when thy warlike father, like a child,", "Told the sad story of my father's death,", "And twenty times made pause to sob and weep,", "That all the standers-by had wet their cheeks", "Like trees bedash'd with rain: in that sad time", "My manly eyes did scorn an humble tear;", "And what these sorrows could not thence exhale,", "Thy beauty hath, and made them blind with weeping.", "I never sued to friend nor enemy;", "My tongue could never learn sweet smoothing word;", "But now thy beauty is proposed my fee,", "My proud heart sues, and prompts my tongue to speak.", "[She looks scornfully at him]", "Teach not thy lips such scorn, for they were made", "For kissing, lady, not for such contempt.", "If thy revengeful heart cannot forgive,", "Lo, here I lend thee this sharp-pointed sword;", "Which if thou please to hide in this true bosom.", "And let the soul forth that adoreth thee,", "I lay it naked to the deadly stroke,", "And humbly beg the death upon my knee.", "[He lays his breast open: she offers at it with his sword]", "Nay, do not pause; for I did kill King Henry,", "But 'twas thy beauty that provoked me.", "Nay, now dispatch; 'twas I that stabb'd young Edward,", "But 'twas thy heavenly face that set me on.", "[Here she lets fall the sword]", "Take up the sword again, or take up me."]}, {"s": "LADY ANNE", "l": ["Arise, dissembler: though I wish thy death,", "I will not be the executioner."]}, {"s": "GLOUCESTER", "l": ["Then bid me kill myself, and I will do it."]}, {"s": "LADY ANNE", "l": ["I have already."]}, {"s": "GLOUCESTER", "l": ["Tush, that was in thy rage:", "Speak it again, and, even with the word,", "That hand, which, for thy love, did kill thy love,", "Shall, for thy love, kill a far truer love;", "To both their deaths thou shalt be accessary."]}, {"s": "LADY ANNE", "l": ["I would I knew thy heart."]}, {"s": "GLOUCESTER", "l": ["'Tis figured in my tongue."]}, {"s": "LADY ANNE", "l": ["I fear me both are false."]}, {"s": "GLOUCESTER", "l": ["Then never man was true."]}, {"s": "LADY ANNE", "l": ["Well, well, put up your sword."]}, {"s": "GLOUCESTER", "l": ["Say, then, my peace is made."]}, {"s": "LADY ANNE", "l": ["That shall you know hereafter."]}, {"s": "GLOUCESTER", "l": ["But shall I live in hope?"]}, {"s": "LADY ANNE", "l": ["All men, I hope, live so."]}, {"s": "GLOUCESTER", "l": ["Vouchsafe to wear this ring."]}, {"s": "LADY ANNE", "l": ["To take is not to give."]}, {"s": "GLOUCESTER", "l": ["Look, how this ring encompasseth finger.", "Even so thy breast encloseth my poor heart;", "Wear both of them, for both of them are thine.", "And if thy poor devoted suppliant may", "But beg one favour at thy gracious hand,", "Thou dost confirm his happiness for ever."]}, {"s": "LADY ANNE", "l": ["What is it?"]}, {"s": "GLOUCESTER", "l": ["That it would please thee leave these sad designs", "To him that hath more cause to be a mourner,", "And presently repair to Crosby Place;", "Where, after I have solemnly interr'd", "At Chertsey monastery this noble king,", "And wet his grave with my repentant tears,", "I will with all expedient duty see you:", "For divers unknown reasons. I beseech you,", "Grant me this boon."]}, {"s": "LADY ANNE", "l": ["With all my heart; and much it joys me too,", "To see you are become so penitent.", "Tressel and Berkeley, go along with me."]}, {"s": "GLOUCESTER", "l": ["Bid me farewell."]}, {"s": "LADY ANNE", "l": ["'Tis more than you deserve;", "But since you teach me how to flatter you,", "Imagine I have said farewell already."]}, {"d": "Exeunt LADY ANNE, TRESSEL, and BERKELEY"}, {"s": "GLOUCESTER", "l": ["Sirs, take up the corse."]}, {"s": "GENTLEMEN", "l": ["Towards Chertsey, noble lord?"]}, {"s": "GLOUCESTER", "l": ["No, to White-Friars; there attend my coining.", "[Exeunt all but GLOUCESTER]", "Was ever woman in this humour woo'd?", "Was ever woman in this humour won?", "I'll have her; but I will not keep her long.", "What! I, that kill'd her husband and his father,", "To take her in her heart's extremest hate,", "With curses in her mouth, tears in her eyes,", "The bleeding witness of her hatred by;", "Having God, her conscience, and these bars", "against me,", "And I nothing to back my suit at all,", "But the plain devil and dissembling looks,", "And yet to win her, all the world to nothing!", "Ha!", "Hath she forgot already that brave prince,", "Edward, her lord, whom I, some three months since,", "Stabb'd in my angry mood at Tewksbury?", "A sweeter and a lovelier gentleman,", "Framed in the prodigality of nature,", "Young, valiant, wise, and, no doubt, right royal,", "The spacious world cannot again afford", "And will she yet debase her eyes on me,", "That cropp'd the golden prime of this sweet prince,", "And made her widow to a woful bed?", "On me, whose all not equals Edward's moiety?", "On me, that halt and am unshapen thus?", "My dukedom to a beggarly denier,", "I do mistake my person all this while:", "Upon my life, she finds, although I cannot,", "Myself to be a marvellous proper man.", "I'll be at charges for a looking-glass,", "And entertain some score or two of tailors,", "To study fashions to adorn my body:", "Since I am crept in favour with myself,", "Will maintain it with some little cost.", "But first I'll turn yon fellow in his grave;", "And then return lamenting to my love.", "Shine out, fair sun, till I have bought a glass,", "That I may see my shadow as I pass."]}, {"d": "Exit"}]}, "cor45": {"play": "The Tragedy of Coriolanus", "act": 4, "scene": 5, "title": "SCENE V.  The same. A hall in Aufidius's house.", "items": [{"d": "Music within. Enter a Servingman"}, {"s": "First Servingman", "l": ["Wine, wine, wine! What service", "is here! I think our fellows are asleep."]}, {"d": "Exit"}, {"d": "Enter a second Servingman"}, {"s": "Second Servingman", "l": ["Where's Cotus? my master calls", "for him. Cotus!"]}, {"d": "Exit"}, {"d": "Enter CORIOLANUS"}, {"s": "CORIOLANUS", "l": ["A goodly house: the feast smells well; but I", "Appear not like a guest."]}, {"d": "Re-enter the first Servingman"}, {"s": "First Servingman", "l": ["What would you have, friend? whence are you?", "Here's no place for you: pray, go to the door."]}, {"d": "Exit"}, {"s": "CORIOLANUS", "l": ["I have deserved no better entertainment,", "In being Coriolanus."]}, {"d": "Re-enter second Servingman"}, {"s": "Second Servingman", "l": ["Whence are you, sir? Has the porter his eyes in his", "head; that he gives entrance to such companions?", "Pray, get you out."]}, {"s": "CORIOLANUS", "l": ["Away!"]}, {"s": "Second Servingman", "l": ["Away! get you away."]}, {"s": "CORIOLANUS", "l": ["Now thou'rt troublesome."]}, {"s": "Second Servingman", "l": ["Are you so brave? I'll have you talked with anon."]}, {"d": "Enter a third Servingman. The first meets him"}, {"s": "Third Servingman", "l": ["What fellow's this?"]}, {"s": "First Servingman", "l": ["A strange one as ever I looked on: I cannot get him", "out of the house: prithee, call my master to him."]}, {"d": "Retires"}, {"s": "Third Servingman", "l": ["What have you to do here, fellow? Pray you, avoid", "the house."]}, {"s": "CORIOLANUS", "l": ["Let me but stand; I will not hurt your hearth."]}, {"s": "Third Servingman", "l": ["What are you?"]}, {"s": "CORIOLANUS", "l": ["A gentleman."]}, {"s": "Third Servingman", "l": ["A marvellous poor one."]}, {"s": "CORIOLANUS", "l": ["True, so I am."]}, {"s": "Third Servingman", "l": ["Pray you, poor gentleman, take up some other", "station; here's no place for you; pray you, avoid: come."]}, {"s": "CORIOLANUS", "l": ["Follow your function, go, and batten on cold bits."]}, {"d": "Pushes him away"}, {"s": "Third Servingman", "l": ["What, you will not? Prithee, tell my master what a", "strange guest he has here."]}, {"s": "Second Servingman", "l": ["And I shall."]}, {"d": "Exit"}, {"s": "Third Servingman", "l": ["Where dwellest thou?"]}, {"s": "CORIOLANUS", "l": ["Under the canopy."]}, {"s": "Third Servingman", "l": ["Under the canopy!"]}, {"s": "CORIOLANUS", "l": ["Ay."]}, {"s": "Third Servingman", "l": ["Where's that?"]}, {"s": "CORIOLANUS", "l": ["I' the city of kites and crows."]}, {"s": "Third Servingman", "l": ["I' the city of kites and crows! What an ass it is!", "Then thou dwellest with daws too?"]}, {"s": "CORIOLANUS", "l": ["No, I serve not thy master."]}, {"s": "Third Servingman", "l": ["How, sir! do you meddle with my master?"]}, {"s": "CORIOLANUS", "l": ["Ay; 'tis an honester service than to meddle with thy", "mistress. Thou pratest, and pratest; serve with thy", "trencher, hence!"]}, {"d": "Beats him away. Exit third Servingman"}, {"d": "Enter AUFIDIUS with the second Servingman"}, {"s": "AUFIDIUS", "l": ["Where is this fellow?"]}, {"s": "Second Servingman", "l": ["Here, sir: I'ld have beaten him like a dog, but for", "disturbing the lords within."]}, {"d": "Retires"}, {"s": "AUFIDIUS", "l": ["Whence comest thou? what wouldst thou? thy name?", "Why speak'st not? speak, man: what's thy name?"]}, {"s": "CORIOLANUS", "l": ["If, Tullus,", "[Unmuffling]", "Not yet thou knowest me, and, seeing me, dost not", "Think me for the man I am, necessity", "Commands me name myself."]}, {"s": "AUFIDIUS", "l": ["What is thy name?"]}, {"s": "CORIOLANUS", "l": ["A name unmusical to the Volscians' ears,", "And harsh in sound to thine."]}, {"s": "AUFIDIUS", "l": ["Say, what's thy name?", "Thou hast a grim appearance, and thy face", "Bears a command in't; though thy tackle's torn.", "Thou show'st a noble vessel: what's thy name?"]}, {"s": "CORIOLANUS", "l": ["Prepare thy brow to frown: know'st", "thou me yet?"]}, {"s": "AUFIDIUS", "l": ["I know thee not: thy name?"]}, {"s": "CORIOLANUS", "l": ["My name is Caius Marcius, who hath done", "To thee particularly and to all the Volsces", "Great hurt and mischief; thereto witness may", "My surname, Coriolanus: the painful service,", "The extreme dangers and the drops of blood", "Shed for my thankless country are requited", "But with that surname; a good memory,", "And witness of the malice and displeasure", "Which thou shouldst bear me: only that name remains;", "The cruelty and envy of the people,", "Permitted by our dastard nobles, who", "Have all forsook me, hath devour'd the rest;", "And suffer'd me by the voice of slaves to be", "Whoop'd out of Rome. Now this extremity", "Hath brought me to thy hearth; not out of hope--", "Mistake me not--to save my life, for if", "I had fear'd death, of all the men i' the world", "I would have 'voided thee, but in mere spite,", "To be full quit of those my banishers,", "Stand I before thee here. Then if thou hast", "A heart of wreak in thee, that wilt revenge", "Thine own particular wrongs and stop those maims", "Of shame seen through thy country, speed", "thee straight,", "And make my misery serve thy turn: so use it", "That my revengeful services may prove", "As benefits to thee, for I will fight", "Against my canker'd country with the spleen", "Of all the under fiends. But if so be", "Thou darest not this and that to prove more fortunes", "Thou'rt tired, then, in a word, I also am", "Longer to live most weary, and present", "My throat to thee and to thy ancient malice;", "Which not to cut would show thee but a fool,", "Since I have ever follow'd thee with hate,", "Drawn tuns of blood out of thy country's breast,", "And cannot live but to thy shame, unless", "It be to do thee service."]}, {"s": "AUFIDIUS", "l": ["O Marcius, Marcius!", "Each word thou hast spoke hath weeded from my heart", "A root of ancient envy. If Jupiter", "Should from yond cloud speak divine things,", "And say 'Tis true,' I'ld not believe them more", "Than thee, all noble Marcius. Let me twine", "Mine arms about that body, where against", "My grained ash an hundred times hath broke", "And scarr'd the moon with splinters: here I clip", "The anvil of my sword, and do contest", "As hotly and as nobly with thy love", "As ever in ambitious strength I did", "Contend against thy valour. Know thou first,", "I loved the maid I married; never man", "Sigh'd truer breath; but that I see thee here,", "Thou noble thing! more dances my rapt heart", "Than when I first my wedded mistress saw", "Bestride my threshold. Why, thou Mars! I tell thee,", "We have a power on foot; and I had purpose", "Once more to hew thy target from thy brawn,", "Or lose mine arm fort: thou hast beat me out", "Twelve several times, and I have nightly since", "Dreamt of encounters 'twixt thyself and me;", "We have been down together in my sleep,", "Unbuckling helms, fisting each other's throat,", "And waked half dead with nothing. Worthy Marcius,", "Had we no quarrel else to Rome, but that", "Thou art thence banish'd, we would muster all", "From twelve to seventy, and pouring war", "Into the bowels of ungrateful Rome,", "Like a bold flood o'er-bear. O, come, go in,", "And take our friendly senators by the hands;", "Who now are here, taking their leaves of me,", "Who am prepared against your territories,", "Though not for Rome itself."]}, {"s": "CORIOLANUS", "l": ["You bless me, gods!"]}, {"s": "AUFIDIUS", "l": ["Therefore, most absolute sir, if thou wilt have", "The leading of thine own revenges, take", "The one half of my commission; and set down--", "As best thou art experienced, since thou know'st", "Thy country's strength and weakness,--thine own ways;", "Whether to knock against the gates of Rome,", "Or rudely visit them in parts remote,", "To fright them, ere destroy. But come in:", "Let me commend thee first to those that shall", "Say yea to thy desires. A thousand welcomes!", "And more a friend than e'er an enemy;", "Yet, Marcius, that was much. Your hand: most welcome!"]}, {"d": "Exeunt CORIOLANUS and AUFIDIUS. The two\nServingmen come forward"}, {"s": "First Servingman", "l": ["Here's a strange alteration!"]}, {"s": "Second Servingman", "l": ["By my hand, I had thought to have strucken him with", "a cudgel; and yet my mind gave me his clothes made a", "false report of him."]}, {"s": "First Servingman", "l": ["What an arm he has! he turned me about with his", "finger and his thumb, as one would set up a top."]}, {"s": "Second Servingman", "l": ["Nay, I knew by his face that there was something in", "him: he had, sir, a kind of face, methought,--I", "cannot tell how to term it."]}, {"s": "First Servingman", "l": ["He had so; looking as it were--would I were hanged,", "but I thought there was more in him than I could think."]}, {"s": "Second Servingman", "l": ["So did I, I'll be sworn: he is simply the rarest", "man i' the world."]}, {"s": "First Servingman", "l": ["I think he is: but a greater soldier than he you wot on."]}, {"s": "Second Servingman", "l": ["Who, my master?"]}, {"s": "First Servingman", "l": ["Nay, it's no matter for that."]}, {"s": "Second Servingman", "l": ["Worth six on him."]}, {"s": "First Servingman", "l": ["Nay, not so neither: but I take him to be the", "greater soldier."]}, {"s": "Second Servingman", "l": ["Faith, look you, one cannot tell how to say that:", "for the defence of a town, our general is excellent."]}, {"s": "First Servingman", "l": ["Ay, and for an assault too."]}, {"d": "Re-enter third Servingman"}, {"s": "Third Servingman", "l": ["O slaves, I can tell you news,-- news, you rascals!"]}, {"s": "First Servingman / Second Servingman", "l": ["What, what, what? let's partake."]}, {"s": "Third Servingman", "l": ["I would not be a Roman, of all nations; I had as", "lieve be a condemned man."]}, {"s": "First Servingman / Second Servingman", "l": ["Wherefore? wherefore?"]}, {"s": "Third Servingman", "l": ["Why, here's he that was wont to thwack our general,", "Caius Marcius."]}, {"s": "First Servingman", "l": ["Why do you say 'thwack our general '?"]}, {"s": "Third Servingman", "l": ["I do not say 'thwack our general;' but he was always", "good enough for him."]}, {"s": "Second Servingman", "l": ["Come, we are fellows and friends: he was ever too", "hard for him; I have heard him say so himself."]}, {"s": "First Servingman", "l": ["He was too hard for him directly, to say the troth", "on't: before Corioli he scotched him and notched", "him like a carbon ado."]}, {"s": "Second Servingman", "l": ["An he had been cannibally given, he might have", "broiled and eaten him too."]}, {"s": "First Servingman", "l": ["But, more of thy news?"]}, {"s": "Third Servingman", "l": ["Why, he is so made on here within, as if he were son", "and heir to Mars; set at upper end o' the table; no", "question asked him by any of the senators, but they", "stand bald before him: our general himself makes a", "mistress of him: sanctifies himself with's hand and", "turns up the white o' the eye to his discourse. But", "the bottom of the news is that our general is cut i'", "the middle and but one half of what he was", "yesterday; for the other has half, by the entreaty", "and grant of the whole table. He'll go, he says,", "and sowl the porter of Rome gates by the ears: he", "will mow all down before him, and leave his passage polled."]}, {"s": "Second Servingman", "l": ["And he's as like to do't as any man I can imagine."]}, {"s": "Third Servingman", "l": ["Do't! he will do't; for, look you, sir, he has as", "many friends as enemies; which friends, sir, as it", "were, durst not, look you, sir, show themselves, as", "we term it, his friends whilst he's in directitude."]}, {"s": "First Servingman", "l": ["Directitude! what's that?"]}, {"s": "Third Servingman", "l": ["But when they shall see, sir, his crest up again,", "and the man in blood, they will out of their", "burrows, like conies after rain, and revel all with", "him."]}, {"s": "First Servingman", "l": ["But when goes this forward?"]}, {"s": "Third Servingman", "l": ["To-morrow; to-day; presently; you shall have the", "drum struck up this afternoon: 'tis, as it were, a", "parcel of their feast, and to be executed ere they", "wipe their lips."]}, {"s": "Second Servingman", "l": ["Why, then we shall have a stirring world again.", "This peace is nothing, but to rust iron, increase", "tailors, and breed ballad-makers."]}, {"s": "First Servingman", "l": ["Let me have war, say I; it exceeds peace as far as", "day does night; it's spritely, waking, audible, and", "full of vent. Peace is a very apoplexy, lethargy;", "mulled, deaf, sleepy, insensible; a getter of more", "bastard children than war's a destroyer of men."]}, {"s": "Second Servingman", "l": ["'Tis so: and as war, in some sort, may be said to", "be a ravisher, so it cannot be denied but peace is a", "great maker of cuckolds."]}, {"s": "First Servingman", "l": ["Ay, and it makes men hate one another."]}, {"s": "Third Servingman", "l": ["Reason; because they then less need one another.", "The wars for my money. I hope to see Romans as cheap", "as Volscians. They are rising, they are rising."]}, {"s": "All", "l": ["In, in, in, in!"]}, {"d": "Exeunt"}]}, "ayl21": {"play": "As You Like It", "act": 2, "scene": 1, "title": "SCENE I.  The Forest of Arden.", "items": [{"d": "Enter DUKE SENIOR, AMIENS, and two or three Lords,\nlike foresters"}, {"s": "DUKE SENIOR", "l": ["Now, my co-mates and brothers in exile,", "Hath not old custom made this life more sweet", "Than that of painted pomp? Are not these woods", "More free from peril than the envious court?", "Here feel w function wireAttend(root){
