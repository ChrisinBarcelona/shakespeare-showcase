 the judgment: and what judgment", "Would step from this to this? Sense, sure, you have,", "Else could you not have motion; but sure, that sense", "Is apoplex'd; for madness would not err,", "Nor sense to ecstasy was ne'er so thrall'd", "But it reserved some quantity of choice,", "To serve in such a difference. What devil was't", "That thus hath cozen'd you at hoodman-blind?", "Eyes without feeling, feeling without sight,", "Ears without hands or eyes, smelling sans all,", "Or but a sickly part of one true sense", "Could not so mope.", "O shame! where is thy blush? Rebellious hell,", "If thou canst mutine in a matron's bones,", "To flaming youth let virtue be as wax,", "And melt in her own fire: proclaim no shame", "When the compulsive ardour gives the charge,", "Since frost itself as actively doth burn", "And reason panders will."]}, {"s": "QUEEN GERTRUDE", "l": ["O Hamlet, speak no more:", "Thou turn'st mine eyes into my very soul;", "And there I see such black and grained spots", "As will not leave their tinct."]}, {"s": "HAMLET", "l": ["Nay, but to live", "In the rank sweat of an enseamed bed,", "Stew'd in corruption, honeying and making love", "Over the nasty sty,--"]}, {"s": "QUEEN GERTRUDE", "l": ["O, speak to me no more;", "These words, like daggers, enter in mine ears;", "No more, sweet Hamlet!"]}, {"s": "HAMLET", "l": ["A murderer and a villain;", "A slave that is not twentieth part the tithe", "Of your precedent lord; a vice of kings;", "A cutpurse of the empire and the rule,", "That from a shelf the precious diadem stole,", "And put it in his pocket!"]}, {"s": "QUEEN GERTRUDE", "l": ["No more!"]}, {"s": "HAMLET", "l": ["A king of shreds and patches,--", "[Enter Ghost]", "Save me, and hover o'er me with your wings,", "You heavenly guards! What would your gracious figure?"]}, {"s": "QUEEN GERTRUDE", "l": ["Alas, he's mad!"]}, {"s": "HAMLET", "l": ["Do you not come your tardy son to chide,", "That, lapsed in time and passion, lets go by", "The important acting of your dread command? O, say!"]}, {"s": "Ghost", "l": ["Do not forget: this visitation", "Is but to whet thy almost blunted purpose.", "But, look, amazement on thy mother sits:", "O, step between her and her fighting soul:", "Conceit in weakest bodies strongest works:", "Speak to her, Hamlet."]}, {"s": "HAMLET", "l": ["How is it with you, lady?"]}, {"s": "QUEEN GERTRUDE", "l": ["Alas, how is't with you,", "That you do bend your eye on vacancy", "And with the incorporal air do hold discourse?", "Forth at your eyes your spirits wildly peep;", "And, as the sleeping soldiers in the alarm,", "Your bedded hair, like life in excrements,", "Starts up, and stands on end. O gentle son,", "Upon the heat and flame of thy distemper", "Sprinkle cool patience. Whereon do you look?"]}, {"s": "HAMLET", "l": ["On him, on him! Look you, how pale he glares!", "His form and cause conjoin'd, preaching to stones,", "Would make them capable. Do not look upon me;", "Lest with this piteous action you convert", "My stern effects: then what I have to do", "Will want true colour; tears perchance for blood."]}, {"s": "QUEEN GERTRUDE", "l": ["To whom do you speak this?"]}, {"s": "HAMLET", "l": ["Do you see nothing there?"]}, {"s": "QUEEN GERTRUDE", "l": ["Nothing at all; yet all that is I see."]}, {"s": "HAMLET", "l": ["Nor did you nothing hear?"]}, {"s": "QUEEN GERTRUDE", "l": ["No, nothing but ourselves."]}, {"s": "HAMLET", "l": ["Why, look you there! look, how it steals away!", "My father, in his habit as he lived!", "Look, where he goes, even now, out at the portal!"]}, {"d": "Exit Ghost"}, {"s": "QUEEN GERTRUDE", "l": ["This the very coinage of your brain:", "This bodiless creation ecstasy", "Is very cunning in."]}, {"s": "HAMLET", "l": ["Ecstasy!", "My pulse, as yours, doth temperately keep time,", "And makes as healthful music: it is not madness", "That I have utter'd: bring me to the test,", "And I the matter will re-word; which madness", "Would gambol from. Mother, for love of grace,", "Lay not that mattering unction to your soul,", "That not your trespass, but my madness speaks:", "It will but skin and film the ulcerous place,", "Whilst rank corruption, mining all within,", "Infects unseen. Confess yourself to heaven;", "Repent what's past; avoid what is to come;", "And do not spread the compost on the weeds,", "To make them ranker. Forgive me this my virtue;", "For in the fatness of these pursy times", "Virtue itself of vice must pardon beg,", "Yea, curb and woo for leave to do him good."]}, {"s": "QUEEN GERTRUDE", "l": ["O Hamlet, thou hast cleft my heart in twain."]}, {"s": "HAMLET", "l": ["O, throw away the worser part of it,", "And live the purer with the other half.", "Good night: but go not to mine uncle's bed;", "Assume a virtue, if you have it not.", "That monster, custom, who all sense doth eat,", "Of habits devil, is angel yet in this,", "That to the use of actions fair and good", "He likewise gives a frock or livery,", "That aptly is put on. Refrain to-night,", "And that shall lend a kind of easiness", "To the next abstinence: the next more easy;", "For use almost can change the stamp of nature,", "And either ... the devil, or throw him out", "With wondrous potency. Once more, good night:", "And when you are desirous to be bless'd,", "I'll blessing beg of you. For this same lord,", "[Pointing to POLONIUS]", "I do repent: but heaven hath pleased it so,", "To punish me with this and this with me,", "That I must be their scourge and minister.", "I will bestow him, and will answer well", "The death I gave him. So, again, good night.", "I must be cruel, only to be kind:", "Thus bad begins and worse remains behind.", "One word more, good lady."]}, {"s": "QUEEN GERTRUDE", "l": ["What shall I do?"]}, {"s": "HAMLET", "l": ["Not this, by no means, that I bid you do:", "Let the bloat king tempt you again to bed;", "Pinch wanton on your cheek; call you his mouse;", "And let him, for a pair of reechy kisses,", "Or paddling in your neck with his damn'd fingers,", "Make you to ravel all this matter out,", "That I essentially am not in madness,", "But mad in craft. 'Twere good you let him know;", "For who, that's but a queen, fair, sober, wise,", "Would from a paddock, from a bat, a gib,", "Such dear concernings hide? who would do so?", "No, in despite of sense and secrecy,", "Unpeg the basket on the house's top.", "Let the birds fly, and, like the famous ape,", "To try conclusions, in the basket creep,", "And break your own neck down."]}, {"s": "QUEEN GERTRUDE", "l": ["Be thou assured, if words be made of breath,", "And breath of life, I have no life to breathe", "What thou hast said to me."]}, {"s": "HAMLET", "l": ["I must to England; you know that?"]}, {"s": "QUEEN GERTRUDE", "l": ["Alack,", "I had forgot: 'tis so concluded on."]}, {"s": "HAMLET", "l": ["There's letters seal'd: and my two schoolfellows,", "Whom I will trust as I will adders fang'd,", "They bear the mandate; they must sweep my way,", "And marshal me to knavery. Let it work;", "For 'tis the sport to have the engineer", "Hoist with his own petard: and 't shall go hard", "But I will delve one yard below their mines,", "And blow them at the moon: O, 'tis most sweet,", "When in one line two crafts directly meet.", "This man shall set me packing:", "I'll lug the guts into the neighbour room.", "Mother, good night. Indeed this counsellor", "Is now most still, most secret and most grave,", "Who was in life a foolish prating knave.", "Come, sir, to draw toward an end with you.", "Good night, mother."]}, {"d": "Exeunt severally; HAMLET dragging in POLONIUS"}]}, "ham45": {"play": "The Tragedy of Hamlet, Prince of Denmark", "act": 4, "scene": 5, "title": "SCENE V.  Elsinore. A room in the castle.", "items": [{"d": "Enter QUEEN GERTRUDE, HORATIO, and a Gentleman"}, {"s": "QUEEN GERTRUDE", "l": ["I will not speak with her."]}, {"s": "Gentleman", "l": ["She is importunate, indeed distract:", "Her mood will needs be pitied."]}, {"s": "QUEEN GERTRUDE", "l": ["What would she have?"]}, {"s": "Gentleman", "l": ["She speaks much of her father; says she hears", "There's tricks i' the world; and hems, and beats her heart;", "Spurns enviously at straws; speaks things in doubt,", "That carry but half sense: her speech is nothing,", "Yet the unshaped use of it doth move", "The hearers to collection; they aim at it,", "And botch the words up fit to their own thoughts;", "Which, as her winks, and nods, and gestures", "yield them,", "Indeed would make one think there might be thought,", "Though nothing sure, yet much unhappily."]}, {"s": "HORATIO", "l": ["'Twere good she were spoken with; for she may strew", "Dangerous conjectures in ill-breeding minds."]}, {"s": "QUEEN GERTRUDE", "l": ["Let her come in.", "[Exit HORATIO]", "To my sick soul, as sin's true nature is,", "Each toy seems prologue to some great amiss:", "So full of artless jealousy is guilt,", "It spills itself in fearing to be spilt."]}, {"d": "Re-enter HORATIO, with OPHELIA"}, {"s": "OPHELIA", "l": ["Where is the beauteous majesty of Denmark?"]}, {"s": "QUEEN GERTRUDE", "l": ["How now, Ophelia!"]}, {"s": "OPHELIA", "l": ["Sings", "How should I your true love know", "From another one?", "By his cockle hat and staff,", "And his sandal shoon."]}, {"s": "QUEEN GERTRUDE", "l": ["Alas, sweet lady, what imports this song?"]}, {"s": "OPHELIA", "l": ["Say you? nay, pray you, mark.", "[Sings]", "He is dead and gone, lady,", "He is dead and gone;", "At his head a grass-green turf,", "At his heels a stone."]}, {"s": "QUEEN GERTRUDE", "l": ["Nay, but, Ophelia,--"]}, {"s": "OPHELIA", "l": ["Pray you, mark.", "[Sings]", "White his shroud as the mountain snow,--"]}, {"d": "Enter KING CLAUDIUS"}, {"s": "QUEEN GERTRUDE", "l": ["Alas, look here, my lord."]}, {"s": "OPHELIA", "l": ["Sings", "Larded with sweet flowers", "Which bewept to the grave did go", "With true-love showers."]}, {"s": "KING CLAUDIUS", "l": ["How do you, pretty lady?"]}, {"s": "OPHELIA", "l": ["Well, God 'ild you! They say the owl was a baker's", "daughter. Lord, we know what we are, but know not", "what we may be. God be at your table!"]}, {"s": "KING CLAUDIUS", "l": ["Conceit upon her father."]}, {"s": "OPHELIA", "l": ["Pray you, let's have no words of this; but when they", "ask you what it means, say you this:", "[Sings]", "To-morrow is Saint Valentine's day,", "All in the morning betime,", "And I a maid at your window,", "To be your Valentine.", "Then up he rose, and donn'd his clothes,", "And dupp'd the chamber-door;", "Let in the maid, that out a maid", "Never departed more."]}, {"s": "KING CLAUDIUS", "l": ["Pretty Ophelia!"]}, {"s": "OPHELIA", "l": ["Indeed, la, without an oath, I'll make an end on't:", "[Sings]", "By Gis and by Saint Charity,", "Alack, and fie for shame!", "Young men will do't, if they come to't;", "By cock, they are to blame.", "Quoth she, before you tumbled me,", "You promised me to wed.", "So would I ha' done, by yonder sun,", "An thou hadst not come to my bed."]}, {"s": "KING CLAUDIUS", "l": ["How long hath she been thus?"]}, {"s": "OPHELIA", "l": ["I hope all will be well. We must be patient: but I", "cannot choose but weep, to think they should lay him", "i' the cold ground. My brother shall know of it:", "and so I thank you for your good counsel. Come, my", "coach! Good night, ladies; good night, sweet ladies;", "good night, good night."]}, {"d": "Exit"}, {"s": "KING CLAUDIUS", "l": ["Follow her close; give her good watch,", "I pray you.", "[Exit HORATIO]", "O, this is the poison of deep grief; it springs", "All from her father's death. O Gertrude, Gertrude,", "When sorrows come, they come not single spies", "But in battalions. First, her father slain:", "Next, your son gone; and he most violent author", "Of his own just remove: the people muddied,", "Thick and unwholesome in their thoughts and whispers,", "For good Polonius' death; and we have done but greenly,", "In hugger-mugger to inter him: poor Ophelia", "Divided from herself and her fair judgment,", "Without the which we are pictures, or mere beasts:", "Last, and as much containing as all these,", "Her brother is in secret come from France;", "Feeds on his wonder, keeps himself in clouds,", "And wants not buzzers to infect his ear", "With pestilent speeches of his father's death;", "Wherein necessity, of matter beggar'd,", "Will nothing stick our person to arraign", "In ear and ear. O my dear Gertrude, this,", "Like to a murdering-piece, in many places", "Gives me superfluous death."]}, {"d": "A noise within"}, {"s": "QUEEN GERTRUDE", "l": ["Alack, what noise is this?"]}, {"s": "KING CLAUDIUS", "l": ["Where are my Switzers? Let them guard the door.", "[Enter another Gentleman]", "What is the matter?"]}, {"s": "Gentleman", "l": ["Save yourself, my lord:", "The ocean, overpeering of his list,", "Eats not the flats with more impetuous haste", "Than young Laertes, in a riotous head,", "O'erbears your officers. The rabble call him lord;", "And, as the world were now but to begin,", "Antiquity forgot, custom not known,", "The ratifiers and props of every word,", "They cry 'Choose we: Laertes shall be king:'", "Caps, hands, and tongues, applaud it to the clouds:", "'Laertes shall be king, Laertes king!'"]}, {"s": "QUEEN GERTRUDE", "l": ["How cheerfully on the false trail they cry!", "O, this is counter, you false Danish dogs!"]}, {"s": "KING CLAUDIUS", "l": ["The doors are broke."]}, {"d": "Noise within"}, {"d": "Enter LAERTES, armed; Danes following"}, {"s": "LAERTES", "l": ["Where is this king? Sirs, stand you all without."]}, {"s": "Danes", "l": ["No, let's come in."]}, {"s": "LAERTES", "l": ["I pray you, give me leave."]}, {"s": "Danes", "l": ["We will, we will."]}, {"d": "They retire without the door"}, {"s": "LAERTES", "l": ["I thank you: keep the door. O thou vile king,", "Give me my father!"]}, {"s": "QUEEN GERTRUDE", "l": ["Calmly, good Laertes."]}, {"s": "LAERTES", "l": ["That drop of blood that's calm proclaims me bastard,", "Cries cuckold to my father, brands the harlot", "Even here, between the chaste unsmirched brow", "Of my true mother."]}, {"s": "KING CLAUDIUS", "l": ["What is the cause, Laertes,", "That thy rebellion looks so giant-like?", "Let him go, Gertrude; do not fear our person:", "There's such divinity doth hedge a king,", "That treason can but peep to what it would,", "Acts little of his will. Tell me, Laertes,", "Why thou art thus incensed. Let him go, Gertrude.", "Speak, man."]}, {"s": "LAERTES", "l": ["Where is my father?"]}, {"s": "KING CLAUDIUS", "l": ["Dead."]}, {"s": "QUEEN GERTRUDE", "l": ["But not by him."]}, {"s": "KING CLAUDIUS", "l": ["Let him demand his fill."]}, {"s": "LAERTES", "l": ["How came he dead? I'll not be juggled with:", "To hell, allegiance! vows, to the blackest devil!", "Conscience and grace, to the profoundest pit!", "I dare damnation. To this point I stand,", "That both the worlds I give to negligence,", "Let come what comes; only I'll be revenged", "Most thoroughly for my father."]}, {"s": "KING CLAUDIUS", "l": ["Who shall stay you?"]}, {"s": "LAERTES", "l": ["My will, not all the world:", "And for my means, I'll husband them so well,", "They shall go far with little."]}, {"s": "KING CLAUDIUS", "l": ["Good Laertes,", "If you desire to know the certainty", "Of your dear father's death, is't writ in your revenge,", "That, swoopstake, you will draw both friend and foe,", "Winner and loser?"]}, {"s": "LAERTES", "l": ["None but his enemies."]}, {"s": "KING CLAUDIUS", "l": ["Will you know them then?"]}, {"s": "LAERTES", "l": ["To his good friends thus wide I'll ope my arms;", "And like the kind life-rendering pelican,", "Repast them with my blood."]}, {"s": "KING CLAUDIUS", "l": ["Why, now you speak", "Like a good child and a true gentleman.", "That I am guiltless of your father's death,", "And am most sensible in grief for it,", "It shall as level to your judgment pierce", "As day does to your eye."]}, {"s": "Danes", "l": ["Within                Let her come in."]}, {"s": "LAERTES", "l": ["How now! what noise is that?", "[Re-enter OPHELIA]", "O heat, dry up my brains! tears seven times salt,", "Burn out the sense and virtue of mine eye!", "By heaven, thy madness shall be paid by weight,", "Till our scale turn the beam. O rose of May!", "Dear maid, kind sister, sweet Ophelia!", "O heavens! is't possible, a young maid's wits", "Should be as moral as an old man's life?", "Nature is fine in love, and where 'tis fine,", "It sends some precious instance of itself", "After the thing it loves."]}, {"s": "OPHELIA", "l": ["Sings", "They bore him barefaced on the bier;", "Hey non nonny, nonny, hey nonny;", "And in his grave rain'd many a tear:--", "Fare you well, my dove!"]}, {"s": "LAERTES", "l": ["Hadst thou thy wits, and didst persuade revenge,", "It could not move thus."]}, {"s": "OPHELIA", "l": ["Sings", "You must sing a-down a-down,", "An you call him a-down-a.", "O, how the wheel becomes it! It is the false", "steward, that stole his master's daughter."]}, {"s": "LAERTES", "l": ["This nothing's more than matter."]}, {"s": "OPHELIA", "l": ["There's rosemary, that's for remembrance; pray,", "love, remember: and there is pansies. that's for thoughts."]}, {"s": "LAERTES", "l": ["A document in madness, thoughts and remembrance fitted."]}, {"s": "OPHELIA", "l": ["There's fennel for you, and columbines: there's rue", "for you; and here's some for me: we may call it", "herb-grace o' Sundays: O you must wear your rue with", "a difference. There's a daisy: I would give you", "some violets, but they withered all when my father", "died: they say he made a good end,--", "[Sings]", "For bonny sweet Robin is all my joy."]}, {"s": "LAERTES", "l": ["Thought and affliction, passion, hell itself,", "She turns to favour and to prettiness."]}, {"s": "OPHELIA", "l": ["Sings", "And will he not come again?", "And will he not come again?", "No, no, he is dead:", "Go to thy death-bed:", "He never will come again.", "His beard was as white as snow,", "All flaxen was his poll:", "He is gone, he is gone,", "And we cast away moan:", "God ha' mercy on his soul!", "And of all Christian souls, I pray God. God be wi' ye."]}, {"d": "Exit"}, {"s": "LAERTES", "l": ["Do you see this, O God?"]}, {"s": "KING CLAUDIUS", "l": ["Laertes, I must commune with your grief,", "Or you deny me right. Go but apart,", "Make choice of whom your wisest friends you will.", "And they shall hear and judge 'twixt you and me:", "If by direct or by collateral hand", "They find us touch'd, we will our kingdom give,", "Our crown, our life, and all that we can ours,", "To you in satisfaction; but if not,", "Be you content to lend your patience to us,", "And we shall jointly labour with your soul", "To give it due content."]}, {"s": "LAERTES", "l": ["Let this be so;", "His means of death, his obscure funeral--", "No trophy, sword, nor hatchment o'er his bones,", "No noble rite nor formal ostentation--", "Cry to be heard, as 'twere from heaven to earth,", "That I must call't in question."]}, {"s": "KING CLAUDIUS", "l": ["So you shall;", "And where the offence is let the great axe fall.", "I pray you, go with me."]}, {"d": "Exeunt"}]}, "ham47": {"play": "The Tragedy of Hamlet, Prince of Denmark", "act": 4, "scene": 7, "title": "SCENE VII.  Another room in the castle.", "items": [{"d": "Enter KING CLAUDIUS and LAERTES"}, {"s": "KING CLAUDIUS", "l": ["Now must your conscience my acquaintance seal,", "And you must put me in your heart for friend,", "Sith you have heard, and with a knowing ear,", "That he which hath your noble father slain", "Pursued my life."]}, {"s": "LAERTES", "l": ["It well appears: but tell me", "Why you proceeded not against these feats,", "So crimeful and so capital in nature,", "As by your safety, wisdom, all things else,", "You mainly were stirr'd up."]}, {"s": "KING CLAUDIUS", "l": ["O, for two special reasons;", "Which may to you, perhaps, seem much unsinew'd,", "But yet to me they are strong. The queen his mother", "Lives almost by his looks; and for myself--", "My virtue or my plague, be it either which--", "She's so conjunctive to my life and soul,", "That, as the star moves not but in his sphere,", "I could not but by her. The other motive,", "Why to a public count I might not go,", "Is the great love the general gender bear him;", "Who, dipping all his faults in their affection,", "Would, like the spring that turneth wood to stone,", "Convert his gyves to graces; so that my arrows,", "Too slightly timber'd for so loud a wind,", "Would have reverted to my bow again,", "And not where I had aim'd them."]}, {"s": "LAERTES", "l": ["And so have I a noble father lost;", "A sister driven into desperate terms,", "Whose worth, if praises may go back again,", "Stood challenger on mount of all the age", "For her perfections: but my revenge will come."]}, {"s": "KING CLAUDIUS", "l": ["Break not your sleeps for that: you must not think", "That we are made of stuff so flat and dull", "That we can let our beard be shook with danger", "And think it pastime. You shortly shall hear more:", "I loved your father, and we love ourself;", "And that, I hope, will teach you to imagine--", "[Enter a Messenger]", "How now! what news?"]}, {"s": "Messenger", "l": ["Letters, my lord, from Hamlet:", "This to your majesty; this to the queen."]}, {"s": "KING CLAUDIUS", "l": ["From Hamlet! who brought them?"]}, {"s": "Messenger", "l": ["Sailors, my lord, they say; I saw them not:", "They were given me by Claudio; he received them", "Of him that brought them."]}, {"s": "KING CLAUDIUS", "l": ["Laertes, you shall hear them. Leave us.", "[Exit Messenger]", "[Reads]", "'High and mighty, You shall know I am set naked on", "your kingdom. To-morrow shall I beg leave to see", "your kingly eyes: when I shall, first asking your", "pardon thereunto, recount the occasion of my sudden", "and more strange return.                  'HAMLET.'", "What should this mean? Are all the rest come back?", "Or is it some abuse, and no such thing?"]}, {"s": "LAERTES", "l": ["Know you the hand?"]}, {"s": "KING CLAUDIUS", "l": ["'Tis Hamlets character. 'Naked!", "And in a postscript here, he says 'alone.'", "Can you advise me?"]}, {"s": "LAERTES", "l": ["I'm lost in it, my lord. But let him come;", "It warms the very sickness in my heart,", "That I shall live and tell him to his teeth,", "'Thus didest thou.'"]}, {"s": "KING CLAUDIUS", "l": ["If it be so, Laertes--", "As how should it be so? how otherwise?--", "Will you be ruled by me?"]}, {"s": "LAERTES", "l": ["Ay, my lord;", "So you will not o'errule me to a peace."]}, {"s": "KING CLAUDIUS", "l": ["To thine own peace. If he be now return'd,", "As checking at his voyage, and that he means", "No more to undertake it, I will work him", "To an exploit, now ripe in my device,", "Under the which he shall not choose but fall:", "And for his death no wind of blame shall breathe,", "But even his mother shall uncharge the practise", "And call it accident."]}, {"s": "LAERTES", "l": ["My lord, I will be ruled;", "The rather, if you could devise it so", "That I might be the organ."]}, {"s": "KING CLAUDIUS", "l": ["It falls right.", "You have been talk'd of since your travel much,", "And that in Hamlet's hearing, for a quality", "Wherein, they say, you shine: your sum of parts", "Did not together pluck such envy from him", "As did that one, and that, in my regard,", "Of the unworthiest siege."]}, {"s": "LAERTES", "l": ["What part is that, my lord?"]}, {"s": "KING CLAUDIUS", "l": ["A very riband in the cap of youth,", "Yet needful too; for youth no less becomes", "The light and careless livery that it wears", "Than settled age his sables and his weeds,", "Importing health and graveness. Two months since,", "Here was a gentleman of Normandy:--", "I've seen myself, and served against, the French,", "And they can well on horseback: but this gallant", "Had witchcraft in't; he grew unto his seat;", "And to such wondrous doing brought his horse,", "As he had been incorpsed and demi-natured", "With the brave beast: so far he topp'd my thought,", "That I, in forgery of shapes and tricks,", "Come short of what he did."]}, {"s": "LAERTES", "l": ["A Norman was't?"]}, {"s": "KING CLAUDIUS", "l": ["A Norman."]}, {"s": "LAERTES", "l": ["Upon my life, Lamond."]}, {"s": "KING CLAUDIUS", "l": ["The very same."]}, {"s": "LAERTES", "l": ["I know him well: he is the brooch indeed", "And gem of all the nation."]}, {"s": "KING CLAUDIUS", "l": ["He made confession of you,", "And gave you such a masterly report", "For art and exercise in your defence", "And for your rapier most especially,", "That he cried out, 'twould be a sight indeed,", "If one could match you: the scrimers of their nation,", "He swore, had had neither motion, guard, nor eye,", "If you opposed them. Sir, this report of his", "Did Hamlet so envenom with his envy", "That he could nothing do but wish and beg", "Your sudden coming o'er, to play with him.", "Now, out of this,--"]}, {"s": "LAERTES", "l": ["What out of this, my lord?"]}, {"s": "KING CLAUDIUS", "l": ["Laertes, was your father dear to you?", "Or are you like the painting of a sorrow,", "A face without a heart?"]}, {"s": "LAERTES", "l": ["Why ask you this?"]}, {"s": "KING CLAUDIUS", "l": ["Not that I think you did not love your father;", "But that I know love is begun by time;", "And that I see, in passages of proof,", "Time qualifies the spark and fire of it.", "There lives within the very flame of love", "A kind of wick or snuff that will abate it;", "And nothing is at a like goodness still;", "For goodness, growing to a plurisy,", "Dies in his own too much: that we would do", "We should do when we would; for this 'would' changes", "And hath abatements and delays as many", "As there are tongues, are hands, are accidents;", "And then this 'should' is like a spendthrift sigh,", "That hurts by easing. But, to the quick o' the ulcer:--", "Hamlet comes back: what would you undertake,", "To show yourself your father's son in deed", "More than in words?"]}, {"s": "LAERTES", "l": ["To cut his throat i' the church."]}, {"s": "KING CLAUDIUS", "l": ["No place, indeed, should murder sanctuarize;", "Revenge should have no bounds. But, good Laertes,", "Will you do this, keep close within your chamber.", "Hamlet return'd shall know you are come home:", "We'll put on those shall praise your excellence", "And set a double varnish on the fame", "The Frenchman gave you, bring you in fine together", "And wager on your heads: he, being remiss,", "Most generous and free from all contriving,", "Will not peruse the foils; so that, with ease,", "Or with a little shuffling, you may choose", "A sword unbated, and in a pass of practise", "Requite him for your father."]}, {"s": "LAERTES", "l": ["I will do't:", "And, for that purpose, I'll anoint my sword.", "I bought an unction of a mountebank,", "So mortal that, but dip a knife in it,", "Where it draws blood no cataplasm so rare,", "Collected from all simples that have virtue", "Under the moon, can save the thing from death", "That is but scratch'd withal: I'll touch my point", "With this contagion, that, if I gall him slightly,", "It may be death."]}, {"s": "KING CLAUDIUS", "l": ["Let's further think of this;", "Weigh what convenience both of time and means", "May fit us to our shape: if this should fail,", "And that our drift look through our bad performance,", "'Twere better not assay'd: therefore this project", "Should have a back or second, that might hold,", "If this should blast in proof. Soft! let me see:", "We'll make a solemn wager on your cunnings: I ha't.", "When in your motion you are hot and dry--", "As make your bouts more violent to that end--", "And that he calls for drink, I'll have prepared him", "A chalice for the nonce, whereon but sipping,", "If he by chance escape your venom'd stuck,", "Our purpose may hold there.", "[Enter QUEEN GERTRUDE]", "How now, sweet queen!"]}, {"s": "QUEEN GERTRUDE", "l": ["One woe doth tread upon another's heel,", "So fast they follow; your sister's drown'd, Laertes."]}, {"s": "LAERTES", "l": ["Drown'd! O, where?"]}, {"s": "QUEEN GERTRUDE", "l": ["There is a willow grows aslant a brook,", "That shows his hoar leaves in the glassy stream;", "There with fantastic garlands did she come", "Of crow-flowers, nettles, daisies, and long purples", "That liberal shepherds give a grosser name,", "But our cold maids do dead men's fingers call them:", "There, on the pendent boughs her coronet weeds", "Clambering to hang, an envious sliver broke;", "When down her weedy trophies and herself", "Fell in the weeping brook. Her clothes spread wide;", "And, mermaid-like, awhile they bore her up:", "Which time she chanted snatches of old tunes;", "As one incapable of her own distress,", "Or like a creature native and indued", "Unto that element: but long it could not be", "Till that her garments, heavy with their drink,", "Pull'd the poor wretch from her melodious lay", "To muddy death."]}, {"s": "LAERTES", "l": ["Alas, then, she is drown'd?"]}, {"s": "QUEEN GERTRUDE", "l": ["Drown'd, drown'd."]}, {"s": "LAERTES", "l": ["Too much of water hast thou, poor Ophelia,", "And therefore I forbid my tears: but yet", "It is our trick; nature her custom holds,", "Let shame say what it will: when these are gone,", "The woman will be out. Adieu, my lord:", "I have a speech of fire, that fain would blaze,", "But that this folly douts it."]}, {"d": "Exit"}, {"s": "KING CLAUDIUS", "l": ["Let's follow, Gertrude:", "How much I had to do to calm his rage!", "Now fear I this will give it start again;", "Therefore let's follow."]}, {"d": "Exeunt"}]}, "ham51": {"play": "The Tragedy of Hamlet, Prince of Denmark", "act": 5, "scene": 1, "title": "SCENE I.  A churchyard.", "items": [{"d": "Enter two Clowns, with spades, &c"}, {"s": "First Clown", "l": ["Is she to be buried in Christian burial that", "wilfully seeks her own salvation?"]}, {"s": "Second Clown", "l": ["I tell thee she is: and therefore make her grave", "straight: the crowner hath sat on her, and finds it", "Christian burial."]}, {"s": "First Clown", "l": ["How can that be, unless she drowned herself in her", "own defence?"]}, {"s": "Second Clown", "l": ["Why, 'tis found so."]}, {"s": "First Clown", "l": ["It must be 'se offendendo;' it cannot be else. For", "here lies the point:  if I drown myself wittingly,", "it argues an act: and an act hath three branches: it", "is, to act, to do, to perform: argal, she drowned", "herself wittingly."]}, {"s": "Second Clown", "l": ["Nay, but hear you, goodman delver,--"]}, {"s": "First Clown", "l": ["Give me leave. Here lies the water; good: here", "stands the man; good; if the man go to this water,", "and drown himself, it is, will he, nill he, he", "goes,--mark you that; but if the water come to him", "and drown him, he drowns not himself: argal, he", "that is not guilty of his own death shortens not his own life."]}, {"s": "Second Clown", "l": ["But is this law?"]}, {"s": "First Clown", "l": ["Ay, marry, is't; crowner's quest law."]}, {"s": "Second Clown", "l": ["Will you ha' the truth on't? If this had not been", "a gentlewoman, she should have been buried out o'", "Christian burial."]}, {"s": "First Clown", "l": ["Why, there thou say'st: and the more pity that", "great folk should have countenance in this world to", "drown or hang themselves, more than their even", "Christian. Come, my spade. There is no ancient", "gentleman but gardeners, ditchers, and grave-makers:", "they hold up Adam's profession."]}, {"s": "Second Clown", "l": ["Was he a gentleman?"]}, {"s": "First Clown", "l": ["He was the first that ever bore arms."]}, {"s": "Second Clown", "l": ["Why, he had none."]}, {"s": "First Clown", "l": ["What, art a heathen? How dost thou understand the", "Scripture? The Scripture says 'Adam digged:'", "could he dig without arms? I'll put another", "question to thee: if thou answerest me not to the", "purpose, confess thyself--"]}, {"s": "Second Clown", "l": ["Go to."]}, {"s": "First Clown", "l": ["What is he that builds stronger than either the", "mason, the shipwright, or the carpenter?"]}, {"s": "Second Clown", "l": ["The gallows-maker; for that frame outlives a", "thousand tenants."]}, {"s": "First Clown", "l": ["I like thy wit well, in good faith: the gallows", "does well; but how does it well? it does well to", "those that do in: now thou dost ill to say the", "gallows is built stronger than the church: argal,", "the gallows may do well to thee. To't again, come."]}, {"s": "Second Clown", "l": ["'Who builds stronger than a mason, a shipwright, or", "a carpenter?'"]}, {"s": "First Clown", "l": ["Ay, tell me that, and unyoke."]}, {"s": "Second Clown", "l": ["Marry, now I can tell."]}, {"s": "First Clown", "l": ["To't."]}, {"s": "Second Clown", "l": ["Mass, I cannot tell."]}, {"d": "Enter HAMLET and HORATIO, at a distance"}, {"s": "First Clown", "l": ["Cudgel thy brains no more about it, for your dull", "ass will not mend his pace with beating; and, when", "you are asked this question next, say 'a", "grave-maker: 'the houses that he makes last till", "doomsday. Go, get thee to Yaughan: fetch me a", "stoup of liquor.", "[Exit Second Clown]", "[He digs and sings]", "In youth, when I did love, did love,", "Methought it was very sweet,", "To contract, O, the time, for, ah, my behove,", "O, methought, there was nothing meet."]}, {"s": "HAMLET", "l": ["Has this fellow no feeling of his business, that he", "sings at grave-making?"]}, {"s": "HORATIO", "l": ["Custom hath made it in him a property of easiness."]}, {"s": "HAMLET", "l": ["'Tis e'en so: the hand of little employment hath", "the daintier sense."]}, {"s": "First Clown", "l": ["Sings", "But age, with his stealing steps,", "Hath claw'd me in his clutch,", "And hath shipped me intil the land,", "As if I had never been such."]}, {"d": "Throws up a skull"}, {"s": "HAMLET", "l": ["That skull had a tongue in it, and could sing once:", "how the knave jowls it to the ground, as if it were", "Cain's jaw-bone, that did the first murder! It", "might be the pate of a politician, which this ass", "now o'er-reaches; one that would circumvent God,", "might it not?"]}, {"s": "HORATIO", "l": ["It might, my lord."]}, {"s": "HAMLET", "l": ["Or of a courtier; which could say 'Good morrow,", "sweet lord! How dost thou, good lord?' This might", "be my lord such-a-one, that praised my lord", "such-a-one's horse, when he meant to beg it; might it not?"]}, {"s": "HORATIO", "l": ["Ay, my lord."]}, {"s": "HAMLET", "l": ["Why, e'en so: and now my Lady Worm's; chapless, and", "knocked about the mazzard with a sexton's spade:", "here's fine revolution, an we had the trick to", "see't. Did these bones cost no more the breeding,", "but to play at loggats with 'em? mine ache to think on't."]}, {"s": "First Clown", "l": ["[Sings]", "A pick-axe, and a spade, a spade,", "For and a shrouding sheet:", "O, a pit of clay for to be made", "For such a guest is meet."]}, {"d": "Throws up another skull"}, {"s": "HAMLET", "l": ["There's another: why may not that be the skull of a", "lawyer? Where be his quiddities now, his quillets,", "his cases, his tenures, and his tricks? why does he", "suffer this rude knave now to knock him about the", "sconce with a dirty shovel, and will not tell him of", "his action of battery? Hum! This fellow might be", "in's time a great buyer of land, with his statutes,", "his recognizances, his fines, his double vouchers,", "his recoveries: is this the fine of his fines, and", "the recovery of his recoveries, to have his fine", "pate full of fine dirt? will his vouchers vouch him", "no more of his purchases, and double ones too, than", "the length and breadth of a pair of indentures? The", "very conveyances of his lands will hardly lie in", "this box; and must the inheritor himself have no more, ha?"]}, {"s": "HORATIO", "l": ["Not a jot more, my lord."]}, {"s": "HAMLET", "l": ["Is not parchment made of sheepskins?"]}, {"s": "HORATIO", "l": ["Ay, my lord, and of calf-skins too."]}, {"s": "HAMLET", "l": ["They are sheep and calves which seek out assurance", "in that. I will speak to this fellow. Whose", "grave's this, sirrah?"]}, {"s": "First Clown", "l": ["Mine, sir.", "[Sings]", "O, a pit of clay for to be made", "For such a guest is meet."]}, {"s": "HAMLET", "l": ["I think it be thine, indeed; for thou liest in't."]}, {"s": "First Clown", "l": ["You lie out on't, sir, and therefore it is not", "yours: for my part, I do not lie in't, and yet it is mine."]}, {"s": "HAMLET", "l": ["'Thou dost lie in't, to be in't and say it is thine:", "'tis for the dead, not for the quick; therefore thou liest."]}, {"s": "First Clown", "l": ["'Tis a quick lie, sir; 'twill away gain, from me to", "you."]}, {"s": "HAMLET", "l": ["What man dost thou dig it for?"]}, {"s": "First Clown", "l": ["For no man, sir."]}, {"s": "HAMLET", "l": ["What woman, then?"]}, {"s": "First Clown", "l": ["For none, neither."]}, {"s": "HAMLET", "l": ["Who is to be buried in't?"]}, {"s": "First Clown", "l": ["One that was a woman, sir; but, rest her soul, she's dead."]}, {"s": "HAMLET", "l": ["How absolute the knave is! we must speak by the", "card, or equivocation will undo us. By the Lord,", "Horatio, these three years I have taken a note of", "it; the age is grown so picked that the toe of the", "peasant comes so near the heel of the courtier, he", "gaffs his kibe. How long hast thou been a", "grave-maker?"]}, {"s": "First Clown", "l": ["Of all the days i' the year, I came to't that day", "that our last king Hamlet overcame Fortinbras."]}, {"s": "HAMLET", "l": ["How long is that since?"]}, {"s": "First Clown", "l": ["Cannot you tell that? every fool can tell that: it", "was the very day that young Hamlet was born; he that", "is mad, and sent into England."]}, {"s": "HAMLET", "l": ["Ay, marry, why was he sent into England?"]}, {"s": "First Clown", "l": ["Why, because he was mad: he shall recover his wits", "there; or, if he do not, it's no great matter there."]}, {"s": "HAMLET", "l": ["Why?"]}, {"s": "First Clown", "l": ["'Twill, a not be seen in him there; there the men", "are as mad as he."]}, {"s": "HAMLET", "l": ["How came he mad?"]}, {"s": "First Clown", "l": ["Very strangely, they say."]}, {"s": "HAMLET", "l": ["How strangely?"]}, {"s": "First Clown", "l": ["Faith, e'en with losing his wits."]}, {"s": "HAMLET", "l": ["Upon what ground?"]}, {"s": "First Clown", "l": ["Why, here in Denmark: I have been sexton here, man", "and boy, thirty years."]}, {"s": "HAMLET", "l": ["How long will a man lie i' the earth ere he rot?"]}, {"s": "First Clown", "l": ["I' faith, if he be not rotten before he die--as we", "have many pocky corses now-a-days, that will scarce", "hold the laying in--he will last you some eight year", "or nine year: a tanner will last you nine year."]}, {"s": "HAMLET", "l": ["Why he more than another?"]}, {"s": "First Clown", "l": ["Why, sir, his hide is so tanned with his trade, that", "he will keep out water a great while; and your water", "is a sore decayer of your whoreson dead body.", "Here's a skull now; this skull has lain in the earth", "three and twenty years."]}, {"s": "HAMLET", "l": ["Whose was it?"]}, {"s": "First Clown", "l": ["A whoreson mad fellow's it was: whose do you think it was?"]}, {"s": "HAMLET", "l": ["Nay, I know not."]}, {"s": "First Clown", "l": ["A pestilence on him for a mad rogue! a' poured a", "flagon of Rhenish on my head once. This same skull,", "sir, was Yorick's skull, the king's jester."]}, {"s": "HAMLET", "l": ["This?"]}, {"s": "First Clown", "l": ["E'en that."]}, {"s": "HAMLET", "l": ["Let me see.", "[Takes the skull]", "Alas, poor Yorick! I knew him, Horatio: a fellow", "of infinite jest, of most excellent fancy: he hath", "borne me on his back a thousand times; and now, how", "abhorred in my imagination it is! my gorge rims at", "it. Here hung those lips that I have kissed I know", "not how oft. Where be your gibes now? your", "gambols? your songs? your flashes of merriment,", "that were wont to set the table on a roar? Not one", "now, to mock your own grinning? quite chap-fallen?", "Now get you to my lady's chamber, and tell her, let", "her paint an inch thick, to this favour she must", "come; make her laugh at that. Prithee, Horatio, tell", "me one thing."]}, {"s": "HORATIO", "l": ["What's that, my lord?"]}, {"s": "HAMLET", "l": ["Dost thou think Alexander looked o' this fashion i'", "the earth?"]}, {"s": "HORATIO", "l": ["E'en so."]}, {"s": "HAMLET", "l": ["And smelt so? pah!"]}, {"d": "Puts down the skull"}, {"s": "HORATIO", "l": ["E'en so, my lord."]}, {"s": "HAMLET", "l": ["To what base uses we may return, Horatio! Why may", "not imagination trace the noble dust of Alexander,", "till he find it stopping a bung-hole?"]}, {"s": "HORATIO", "l": ["'Twere to consider too curiously, to consider so."]}, {"s": "HAMLET", "l": ["No, faith, not a jot; but to follow him thither with", "modesty enough, and likelihood to lead it: as", "thus: Alexander died, Alexander was buried,", "Alexander returneth into dust; the dust is earth; of", "earth we make loam; and why of that loam, whereto he", "was converted, might they not stop a beer-barrel?", "Imperious Caesar, dead and turn'd to clay,", "Might stop a hole to keep the wind away:", "O, that that earth, which kept the world in awe,", "Should patch a wall to expel the winter flaw!", "But soft! but soft! aside: here comes the king.", "[Enter Priest, &c. in procession; the Corpse of\nOPHELIA, LAERTES and Mourners following; KING\nCLAUDIUS, QUEEN GERTRUDE, their trains, &c]", "The queen, the courtiers: who is this they follow?", "And with such maimed rites? This doth betoken", "The corse they follow did with desperate hand", "Fordo its own life: 'twas of some estate.", "Couch we awhile, and mark."]}, {"d": "Retiring with HORATIO"}, {"s": "LAERTES", "l": ["What ceremony else?"]}, {"s": "HAMLET", "l": ["That is Laertes,", "A very noble youth: mark."]}, {"s": "LAERTES", "l": ["What ceremony else?"]}, {"s": "First Priest", "l": ["Her obsequies have been as far enlarged", "As we have warrantise: her death was doubtful;", "And, but that great command o'ersways the order,", "She should in ground unsanctified have lodged", "Till the last trumpet: for charitable prayers,", "Shards, flints and pebbles should be thrown on her;", "Yet here she is allow'd her virgin crants,", "Her maiden strewments and the bringing home", "Of bell and burial."]}, {"s": "LAERTES", "l": ["Must there no more be done?"]}, {"s": "First Priest", "l": ["No more be done:", "We should profane the service of the dead", "To sing a requiem and such rest to her", "As to peace-parted souls."]}, {"s": "LAERTES", "l": ["Lay her i' the earth:", "And from her fair and unpolluted flesh", "May violets spring! I tell thee, churlish priest,", "A ministering angel shall my sister be,", "When thou liest howling."]}, {"s": "HAMLET", "l": ["What, the fair Ophelia!"]}, {"s": "QUEEN GERTRUDE", "l": ["Sweets to the sweet: farewell!", "[Scattering flowers]", "I hoped thou shouldst have been my Hamlet's wife;", "I thought thy bride-bed to have deck'd, sweet maid,", "And not have strew'd thy grave."]}, {"s": "LAERTES", "l": ["O, treble woe", "Fall ten times treble on that cursed head,", "Whose wicked deed thy most ingenious sense", "Deprived thee of! Hold off the earth awhile,", "Till I have caught her once more in mine arms:", "[Leaps into the grave]", "Now pile your dust upon the quick and dead,", "Till of this flat a mountain you have made,", "To o'ertop old Pelion, or the skyish head", "Of blue Olympus."]}, {"s": "HAMLET", "l": ["Advancing     What is he whose grief", "Bears such an emphasis? whose phrase of sorrow", "Conjures the wandering stars, and makes them stand", "Like wonder-wounded hearers? This is I,", "Hamlet the Dane."]}, {"d": "Leaps into the grave"}, {"s": "LAERTES", "l": ["The devil take thy soul!"]}, {"d": "Grappling with him"}, {"s": "HAMLET", "l": ["Thou pray'st not well.", "I prithee, take thy fingers from my throat;", "For, though I am not splenitive and rash,", "Yet have I something in me dangerous,", "Which let thy wiseness fear: hold off thy hand."]}, {"s": "KING CLAUDIUS", "l": ["Pluck them asunder."]}, {"s": "QUEEN GERTRUDE", "l": ["Hamlet, Hamlet!"]}, {"s": "All", "l": ["Gentlemen,--"]}, {"s": "HORATIO", "l": ["Good my lord, be quiet."]}, {"d": "The Attendants part them, and they come out of the grave"}, {"s": "HAMLET", "l": ["Why I will fight with him upon this theme", "Until my eyelids will no longer wag."]}, {"s": "QUEEN GERTRUDE", "l": ["O my son, what theme?"]}, {"s": "HAMLET", "l": ["I loved Ophelia: forty thousand brothers", "Could not, with all their quantity of love,", "Make up my sum. What wilt thou do for her?"]}, {"s": "KING CLAUDIUS", "l": ["O, he is mad, Laertes."]}, {"s": "QUEEN GERTRUDE", "l": ["For love of God, forbear him."]}, {"s": "HAMLET", "l": ["'Swounds, show me what thou'lt do:", "Woo't weep? woo't fight? woo't fast? woo't tear thyself?", "Woo't drink up eisel? eat a crocodile?", "I'll do't. Dost thou come here to whine?", "To outface me with leaping in her grave?", "Be buried quick with her, and so will I:", "And, if thou prate of mountains, let them throw", "Millions of acres on us, till our ground,", "Singeing his pate against the burning zone,", "Make Ossa like a wart! Nay, an thou'lt mouth,", "I'll rant as well as thou."]}, {"s": "QUEEN GERTRUDE", "l": ["This is mere madness:", "And thus awhile the fit will work on him;", "Anon, as patient as the female dove,", "When that her golden couplets are disclosed,", "His silence will sit drooping."]}, {"s": "HAMLET", "l": ["Hear you, sir;", "What is the reason that you use me thus?", "I loved you ever: but it is no matter;", "Let Hercules himself do what he may,", "The cat will mew and dog will have his day."]}, {"d": "Exit"}, {"s": "KING CLAUDIUS", "l": ["I pray you, good Horatio, wait upon him.", "[Exit HORATIO]", "[To LAERTES]", "Strengthen your patience in our last night's speech;", "We'll put the matter to the present push.", "Good Gertrude, set some watch over your son.", "This grave shall have a living monument:", "An hour of quiet shortly shall we see;", "Till then, in patience our proceeding be."]}, {"d": "Exeunt"}]}, "ham52": {"play": "The Tragedy of Hamlet, Prince of Denmark", "act": 5, "scene": 2, "title": "SCENE II.  A hall in the castle.", "items": [{"d": "Enter HAMLET and HORATIO"}, {"s": "HAMLET", "l": ["So much for this, sir: now shall you see the other;", "You do remember all the circumstance?"]}, {"s": "HORATIO", "l": ["Remember it, my lord?"]}, {"s": "HAMLET", "l": ["Sir, in my heart there was a kind of fighting,", "That would not let me sleep: methought I lay", "Worse than the mutines in the bilboes. Rashly,", "And praised be rashness for it, let us know,", "Our indiscretion sometimes serves us well,", "When our deep plots do pall: and that should teach us", "There's a divinity that shapes our ends,", "Rough-hew them how we will,--"]}, {"s": "HORATIO", "l": ["That is most certain."]}, {"s": "HAMLET", "l": ["Up from my cabin,", "My sea-gown scarf'd about me, in the dark", "Groped I to find out them; had my desire.", "Finger'd their packet, and in fine withdrew", "To mine own room again; making so bold,", "My fears forgetting manners, to unseal", "Their grand commission; where I found, Horatio,--", "O royal knavery!--an exact command,", "Larded with many several sorts of reasons", "Importing Denmark's health and England's too,", "With, ho! such bugs and goblins in my life,", "That, on the supervise, no leisure bated,", "No, not to stay the grinding of the axe,", "My head should be struck off."]}, {"s": "HORATIO", "l": ["Is't possible?"]}, {"s": "HAMLET", "l": ["Here's the commission: read it at more leisure.", "But wilt thou hear me how I did proceed?"]}, {"s": "HORATIO", "l": ["I beseech you."]}, {"s": "HAMLET", "l": ["Being thus be-netted round with villanies,--", "Ere I could make a prologue to my brains,", "They had begun the play--I sat me down,", "Devised a new commission, wrote it fair:", "I once did hold it, as our statists do,", "A baseness to write fair and labour'd much", "How to forget that learning, but, sir, now", "It did me yeoman's service: wilt thou know", "The effect of what I wrote?"]}, {"s": "HORATIO", "l": ["Ay, good my lord."]}, {"s": "HAMLET", "l": ["An earnest conjuration from the king,", "As England was his faithful tributary,", "As love between them like the palm might flourish,", "As peace should stiff her wheaten garland wear", "And stand a comma 'tween their amities,", "And many such-like 'As'es of great charge,", "That, on the view and knowing of these contents,", "Without debatement further, more or less,", "He should the bearers put to sudden death,", "Not shriving-time allow'd."]}, {"s": "HORATIO", "l": ["How was this seal'd?"]}, {"s": "HAMLET", "l": ["Why, even in that was heaven ordinant.", "I had my father's signet in my purse,", "Which was the model of that Danish seal;", "Folded the writ up in form of the other,", "Subscribed it, gave't the impression, placed it safely,", "The changeling never known. Now, the next day", "Was our sea-fight; and what to this was sequent", "Thou know'st already."]}, {"s": "HORATIO", "l": ["So Guildenstern and Rosencrantz go to't."]}, {"s": "HAMLET", "l": ["Why, man, they did make love to this employment;", "They are not near my conscience; their defeat", "Does by their own insinuation grow:", "'Tis dangerous when the baser nature comes", "Between the pass and fell incensed points", "Of mighty opposites."]}, {"s": "HORATIO", "l": ["Why, what a king is this!"]}, {"s": "HAMLET", "l": ["Does it not, think'st thee, stand me now upon--", "He that hath kill'd my king and whored my mother,", "Popp'd in between the election and my hopes,", "Thrown out his angle for my proper life,", "And with such cozenage--is't not perfect conscience,", "To quit him with this arm? and is't not to be damn'd,", "To let this canker of our nature come", "In further evil?"]}, {"s": "HORATIO", "l": ["It must be shortly known to him from England", "What is the issue of the business there."]}, {"s": "HAMLET", "l": ["It will be short: the interim is mine;", "And a man's life's no more than to say 'One.'", "But I am very sorry, good Horatio,", "That to Laertes I forgot myself;", "For, by the image of my cause, I see", "The portraiture of his: I'll court his favours.", "But, sure, the bravery of his grief did put me", "Into a towering passion."]}, {"s": "HORATIO", "l": ["Peace! who comes here?"]}, {"d": "Enter OSRIC"}, {"s": "OSRIC", "l": ["Your lordship is right welcome back to Denmark."]}, {"s": "HAMLET", "l": ["I humbly thank you, sir. Dost know this water-fly?"]}, {"s": "HORATIO", "l": ["No, my good lord."]}, {"s": "HAMLET", "l": ["Thy state is the more gracious; for 'tis a vice to", "know him. He hath much land, and fertile: let a", "beast be lord of beasts, and his crib shall stand at", "the king's mess: 'tis a chough; but, as I say,", "spacious in the possession of dirt."]}, {"s": "OSRIC", "l": ["Sweet lord, if your lordship were at leisure, I", "should impart a thing to you from his majesty."]}, {"s": "HAMLET", "l": ["I will receive it, sir, with all diligence of", "spirit. Put your bonnet to his right use; 'tis for the head."]}, {"s": "OSRIC", "l": ["I thank your lordship, it is very hot."]}, {"s": "HAMLET", "l": ["No, believe me, 'tis very cold; the wind is", "northerly."]}, {"s": "OSRIC", "l": ["It is indifferent cold, my lord, indeed."]}, {"s": "HAMLET", "l": ["But yet methinks it is very sultry and hot for my", "complexion."]}, {"s": "OSRIC", "l": ["Exceedingly, my lord; it is very sultry,--as", "'twere,--I cannot tell how. But, my lord, his", "majesty bade me signify to you that he has laid a", "great wager on your head: sir, this is the matter,--"]}, {"s": "HAMLET", "l": ["I beseech you, remember--"]}, {"d": "HAMLET moves him to put on his hat"}, {"s": "OSRIC", "l": ["Nay, good my lord; for mine ease, in good faith.", "Sir, here is newly come to court Laertes; believe", "me, an absolute gentleman, full of most excellent", "differences, of very soft society and great showing:", "indeed, to speak feelingly of him, he is the card or", "calendar of gentry, for you shall find in him the", "continent of what part a gentleman would see."]}, {"s": "HAMLET", "l": ["Sir, his definement suffers no perdition in you;", "though, I know, to divide him inventorially would", "dizzy the arithmetic of memory, and yet but yaw", "neither, in respect of his quick sail. But, in the", "verity of extolment, I take him to be a soul of", "great article; and his infusion of such dearth and", "rareness, as, to make true diction of him, his", "semblable is his mirror; and who else would trace", "him, his umbrage, nothing more."]}, {"s": "OSRIC", "l": ["Your lordship speaks most infallibly of him."]}, {"s": "HAMLET", "l": ["The concernancy, sir? why do we wrap the gentleman", "in our more rawer breath?"]}, {"s": "OSRIC", "l": ["Sir?"]}, {"s": "HORATIO", "l": ["Is't not possible to understand in another tongue?", "You will do't, sir, really."]}, {"s": "HAMLET", "l": ["What imports the nomination of this gentleman?"]}, {"s": "OSRIC", "l": ["Of Laertes?"]}, {"s": "HORATIO", "l": ["His purse is empty already; all's golden words are spent."]}, {"s": "HAMLET", "l": ["Of him, sir."]}, {"s": "OSRIC", "l": ["I know you are not ignorant--"]}, {"s": "HAMLET", "l": ["I would you did, sir; yet, in faith, if you did,", "it would not much approve me. Well, sir?"]}, {"s": "OSRIC", "l": ["You are not ignorant of what excellence Laertes is--"]}, {"s": "HAMLET", "l": ["I dare not confess that, lest I should compare with", "him in excellence; but, to know a man well, were to", "know himself."]}, {"s": "OSRIC", "l": ["I mean, sir, for his weapon; but in the imputation", "laid on him by them, in his meed he's unfellowed."]}, {"s": "HAMLET", "l": ["What's his weapon?"]}, {"s": "OSRIC", "l": ["Rapier and dagger."]}, {"s": "HAMLET", "l": ["That's two of his weapons: but, well."]}, {"s": "OSRIC", "l": ["The king, sir, hath wagered with him six Barbary", "horses: against the which he has imponed, as I take", "it, six French rapiers and poniards, with their", "assigns, as girdle, hangers, and so: three of the", "carriages, in faith, are very dear to fancy, very", "responsive to the hilts, most delicate carriages,", "and of very liberal conceit."]}, {"s": "HAMLET", "l": ["What call you the carriages?"]}, {"s": "HORATIO", "l": ["I knew you must be edified by the margent ere you had done."]}, {"s": "OSRIC", "l": ["The carriages, sir, are the hangers."]}, {"s": "HAMLET", "l": ["The phrase would be more german to the matter, if we", "could carry cannon by our sides: I would it might", "be hangers till then. But, on: six Barbary horses", "against six French swords, their assigns, and three", "liberal-conceited carriages; that's the French bet", "against the Danish. Why is this 'imponed,' as you call it?"]}, {"s": "OSRIC", "l": ["The king, sir, hath laid, that in a dozen passes", "between yourself and him, he shall not exceed you", "three hits: he hath laid on twelve for nine; and it", "would come to immediate trial, if your lordship", "would vouchsafe the answer."]}, {"s": "HAMLET", "l": ["How if I answer 'no'?"]}, {"s": "OSRIC", "l": ["I mean, my lord, the opposition of your person in trial."]}, {"s": "HAMLET", "l": ["Sir, I will walk here in the hall: if it please his", "majesty, 'tis the breathing time of day with me; let", "the foils be brought, the gentleman willing, and the", "king hold his purpose, I will win for him an I can;", "if not, I will gain nothing but my shame and the odd hits."]}, {"s": "OSRIC", "l": ["Shall I re-deliver you e'en so?"]}, {"s": "HAMLET", "l": ["To this effect, sir; after what flourish your nature will."]}, {"s": "OSRIC", "l": ["I commend my duty to your lordship."]}, {"s": "HAMLET", "l": ["Yours, yours.", "[Exit OSRIC]", "He does well to commend it himself; there are no", "tongues else for's turn."]}, {"s": "HORATIO", "l": ["This lapwing runs away with the shell on his head."]}, {"s": "HAMLET", "l": ["He did comply with his dug, before he sucked it.", "Thus has he--and many more of the same bevy that I", "know the dressy age dotes on--only got the tune of", "the time and outward habit of encounter; a kind of", "yesty collection, which carries them through and", "through the most fond and winnowed opinions; and do", "but blow them to their trial, the bubbles are out."]}, {"d": "Enter a Lord"}, {"s": "Lord", "l": ["My lord, his majesty commended him to you by young", "Osric, who brings back to him that you attend him in", "the hall: he sends to know if your pleasure hold to", "play with Laertes, or that you will take longer time."]}, {"s": "HAMLET", "l": ["I am constant to my purpose; they follow the king's", "pleasure: if his fitness speaks, mine is ready; now", "or whensoever, provided I be so able as now."]}, {"s": "Lord", "l": ["The king and queen and all are coming down."]}, {"s": "HAMLET", "l": ["In happy time."]}, {"s": "Lord", "l": ["The queen desires you to use some gentle", "entertainment to Laertes before you fall to play."]}, {"s": "HAMLET", "l": ["She well instructs me."]}, {"d": "Exit Lord"}, {"s": "HORATIO", "l": ["You will lose this wager, my lord."]}, {"s": "HAMLET", "l": ["I do not think so: since he went into France, I", "have been in continual practise: I shall win at the", "odds. But thou wouldst not think how ill all's here", "about my heart: but it is no matter."]}, {"s": "HORATIO", "l": ["Nay, good my lord,--"]}, {"s": "HAMLET", "l": ["It is but foolery; but it is such a kind of", "gain-giving, as would perhaps trouble a woman."]}, {"s": "HORATIO", "l": ["If your mind dislike any thing, obey it: I will", "forestall their repair hither, and say you are not", "fit."]}, {"s": "HAMLET", "l": ["Not a whit, we defy augury: there's a special", "providence in the fall of a sparrow. If it be now,", "'tis not to come; if it be not to come, it will be", "now; if it be not now, yet it will come: the", "readiness is all: since no man has aught of what he", "leaves, what is't to leave betimes?"]}, {"d": "Enter KING CLAUDIUS, QUEEN GERTRUDE, LAERTES,\nLords, OSRIC, and Attendants with foils, &c"}, {"s": "KING CLAUDIUS", "l": ["Come, Hamlet, come, and take this hand from me."]}, {"d": "KING CLAUDIUS puts LAERTES' hand into HAMLET's"}, {"s": "HAMLET", "l": ["Give me your pardon, sir: I've done you wrong;", "But pardon't, as you are a gentleman.", "This presence knows,", "And you must needs have heard, how I am punish'd", "With sore distraction. What I have done,", "That might your nature, honour and exception", "Roughly awake, I here proclaim was madness.", "Was't Hamlet wrong'd Laertes? Never Hamlet:", "If Hamlet from himself be ta'en away,", "And when he's not himself does wrong Laertes,", "Then Hamlet does it not, Hamlet denies it.", "Who does it, then? His madness: if't be so,", "Hamlet is of the faction that is wrong'd;", "His madness is poor Hamlet's enemy.", "Sir, in this audience,", "Let my disclaiming from a purposed evil", "Free me so far in your most generous thoughts,", "That I have shot mine arrow o'er the house,", "And hurt my brother."]}, {"s": "LAERTES", "l": ["I am satisfied in nature,", "Whose motive, in this case, should stir me most", "To my revenge: but in my terms of honour", "I stand aloof; and will no reconcilement,", "Till by some elder masters, of known honour,", "I have a voice and precedent of peace,", "To keep my name ungored. But till that time,", "I do receive your offer'd love like love,", "And will not wrong it."]}, {"s": "HAMLET", "l": ["I embrace it freely;", "And will this brother's wager frankly play.", "Give us the foils. Come on."]}, {"s": "LAERTES", "l": ["Come, one for me."]}, {"s": "HAMLET", "l": ["I'll be your foil, Laertes: in mine ignorance", "Your skill shall, like a star i' the darkest night,", "Stick fiery off indeed."]}, {"s": "LAERTES", "l": ["You mock me, sir."]}, {"s": "HAMLET", "l": ["No, by this hand."]}, {"s": "KING CLAUDIUS", "l": ["Give them the foils, young Osric. Cousin Hamlet,", "You know the wager?"]}, {"s": "HAMLET", "l": ["Very well, my lord", "Your grace hath laid the odds o' the weaker side."]}, {"s": "KING CLAUDIUS", "l": ["I do not fear it; I have seen you both:", "But since he is better'd, we have therefore odds."]}, {"s": "LAERTES", "l": ["This is too heavy, let me see another."]}, {"s": "HAMLET", "l": ["This likes me well. These foils have all a length?"]}, {"d": "They prepare to play"}, {"s": "OSRIC", "l": ["Ay, my good lord."]}, {"s": "KING CLAUDIUS", "l": ["Set me the stoops of wine upon that table.", "If Hamlet give the first or second hit,", "Or quit in answer of the third exchange,", "Let all the battlements their ordnance fire:", "The king shall drink to Hamlet's better breath;", "And in the cup an union shall he throw,", "Richer than that which four successive kings", "In Denmark's crown have worn. Give me the cups;", "And let the kettle to the trumpet speak,", "The trumpet to the cannoneer without,", "The cannons to the heavens, the heavens to earth,", "'Now the king dunks to Hamlet.' Come, begin:", "And you, the judges, bear a wary eye."]}, {"s": "HAMLET", "l": ["Come on, sir."]}, {"s": "LAERTES", "l": ["Come, my lord."]}, {"d": "They play"}, {"s": "HAMLET", "l": ["One."]}, {"s": "LAERTES", "l": ["No."]}, {"s": "HAMLET", "l": ["Judgment."]}, {"s": "OSRIC", "l": ["A hit, a very palpable hit."]}, {"s": "LAERTES", "l": ["Well; again."]}, {"s": "KING CLAUDIUS", "l": ["Stay; give me drink. Hamlet, this pearl is thine;", "Here's to thy health.", "[Trumpets sound, and cannon shot off within]", "Give him the cup."]}, {"s": "HAMLET", "l": ["I'll play this bout first; set it by awhile. Come.", "[They play]", "Another hit; what say you?"]}, {"s": "LAERTES", "l": ["A touch, a touch, I do confess."]}, {"s": "KING CLAUDIUS", "l": ["Our son shall win."]}, {"s": "QUEEN GERTRUDE", "l": ["He's fat, and scant of breath.", "Here, Hamlet, take my napkin, rub thy brows;", "The queen carouses to thy fortune, Hamlet."]}, {"s": "HAMLET", "l": ["Good madam!"]}, {"s": "KING CLAUDIUS", "l": ["Gertrude, do not drink."]}, {"s": "QUEEN GERTRUDE", "l": ["I will, my lord; I pray you, pardon me."]}, {"s": "KING CLAUDIUS", "l": ["Aside  It is the poison'd cup: it is too late."]}, {"s": "HAMLET", "l": ["I dare not drink yet, madam; by and by."]}, {"s": "QUEEN GERTRUDE", "l": ["Come, let me wipe thy face."]}, {"s": "LAERTES", "l": ["My lord, I'll hit him now."]}, {"s": "KING CLAUDIUS", "l": ["I do not think't."]}, {"s": "LAERTES", "l": ["Aside  And yet 'tis almost 'gainst my conscience."]}, {"s": "HAMLET", "l": ["Come, for the third, Laertes: you but dally;", "I pray you, pass with your best violence;", "I am afeard you make a wanton of me."]}, {"s": "LAERTES", "l": ["Say you so? come on."]}, {"d": "They play"}, {"s": "OSRIC", "l": ["Nothing, neither way."]}, {"s": "LAERTES", "l": ["Have at you now!"]}, {"d": "LAERTES wounds HAMLET; then in scuffling, they\nchange rapiers, and HAMLET wounds LAERTES"}, {"s": "KING CLAUDIUS", "l": ["Part them; they are incensed."]}, {"s": "HAMLET", "l": ["Nay, come, again."]}, {"d": "QUEEN GERTRUDE falls"}, {"s": "OSRIC", "l": ["Look to the queen there, ho!"]}, {"s": "HORATIO", "l": ["They bleed on both sides. How is it, my lord?"]}, {"s": "OSRIC", "l": ["How is't, Laertes?"]}, {"s": "LAERTES", "l": ["Why, as a woodcock to mine own springe, Osric;", "I am justly kill'd with mine own treachery."]}, {"s": "HAMLET", "l": ["How does the queen?"]}, {"s": "KING CLAUDIUS", "l": ["She swounds to see them bleed."]}, {"s": "QUEEN GERTRUDE", "l": ["No, no, the drink, the drink,--O my dear Hamlet,--", "The drink, the drink! I am poison'd."]}, {"d": "Dies"}, {"s": "HAMLET", "l": ["O villany! Ho! let the door be lock'd:", "Treachery! Seek it out."]}, {"s": "LAERTES", "l": ["It is here, Hamlet: Hamlet, thou art slain;", "No medicine in the world can do thee good;", "In thee there is not half an hour of life;", "The treacherous instrument is in thy hand,", "Unbated and envenom'd: the foul practise", "Hath turn'd itself on me lo, here I lie,", "Never to rise again: thy mother's poison'd:", "I can no more: the king, the king's to blame."]}, {"s": "HAMLET", "l": ["The point!--envenom'd too!", "Then, venom, to thy work."]}, {"d": "Stabs KING CLAUDIUS"}, {"s": "All", "l": ["Treason! treason!"]}, {"s": "KING CLAUDIUS", "l": ["O, yet defend me, friends; I am but hurt."]}, {"s": "HAMLET", "l": ["Here, thou incestuous, murderous, damned Dane,", "Drink off this potion. Is thy union here?", "Follow my mother."]}, {"d": "KING CLAUDIUS dies"}, {"s": "LAERTES", "l": ["He is justly served;", "It is a poison temper'd by himself.", "Exchange forgiveness with me, noble Hamlet:", "Mine and my father's death come not upon thee,", "Nor thine on me."]}, {"d": "Dies"}, {"s": "HAMLET", "l": ["Heaven make thee free of it! I follow thee.", "I am dead, Horatio. Wretched queen, adieu!", "You that look pale and tremble at this chance,", "That are but mutes or audience to this act,", "Had I but time--as this fell sergeant, death,", "Is strict in his arrest--O, I could tell you--", "But let it be. Horatio, I am dead;", "Thou livest; report me and my cause aright", "To the unsatisfied."]}, {"s": "HORATIO", "l": ["Never believe it:", "I am more an antique Roman than a Dane:", "Here's yet some liquor left."]}, {"s": "HAMLET", "l": ["As thou'rt a man,", "Give me the cup: let go; by heaven, I'll have't.", "O good Horatio, what a wounded name,", "Things standing thus unknown, shall live behind me!", "If thou didst ever hold me in thy heart", "Absent thee from felicity awhile,", "And in this harsh world draw thy breath in pain,", "To tell my story.", "[March afar off, and shot within]", "What warlike noise is this?"]}, {"s": "OSRIC", "l": ["Young Fortinbras, with conquest come from Poland,", "To the ambassadors of England gives", "This warlike volley."]}, {"s": "HAMLET", "l": ["O, I die, Horatio;", "The potent poison quite o'er-crows my spirit:", "I cannot live to hear the news from England;", "But I do prophesy the election lights", "On Fortinbras: he has my dying voice;", "So tell him, with the occurrents, more and less,", "Which have solicited. The rest is silence."]}, {"d": "Dies"}, {"s": "HORATIO", "l": ["Now cracks a noble heart. Good night sweet prince:", "And flights of angels sing thee to thy rest!", "Why does the drum come hither?"]}, {"d": "March within"}, {"d": "Enter FORTINBRAS, the English Ambassadors,\nand others"}, {"s": "PRINCE FORTINBRAS", "l": ["Where is this sight?"]}, {"s": "HORATIO", "l": ["What is it ye would see?", "If aught of woe or wonder, cease your search."]}, {"s": "PRINCE FORTINBRAS", "l": ["This quarry cries on havoc. O proud death,", "What feast is toward in thine eternal cell,", "That thou so many princes at a shot", "So bloodily hast struck?"]}, {"s": "First Ambassador", "l": ["The sight is dismal;", "And our affairs from England come too late:", "The ears are senseless that should give us hearing,", "To tell him his commandment is fulfill'd,", "That Rosencrantz and Guildenstern are dead:", "Where should we have our thanks?"]}, {"s": "HORATIO", "l": ["Not from his mouth,", "Had it the ability of life to thank you:", "He never gave commandment for their death.", "But since, so jump upon this bloody question,", "You from the Polack wars, and you from England,", "Are here arrived give order that these bodies", "High on a stage be placed to the view;", "And let me speak to the yet unknowing world", "How these things came about: so shall you hear", "Of carnal, bloody, and unnatural acts,", "Of accidental judgments, casual slaughters,", "Of deaths put on by cunning and forced cause,", "And, in this upshot, purposes mistook", "Fall'n on the inventors' reads: all this can I", "Truly deliver."]}, {"s": "PRINCE FORTINBRAS", "l": ["Let us haste to hear it,", "And call the noblest to the audience.", "For me, with sorrow I embrace my fortune:", "I have some rights of memory in this kingdom,", "Which now to claim my vantage doth invite me."]}, {"s": "HORATIO", "l": ["Of that I shall have also cause to speak,", "And from his mouth whose voice will draw on more;", "But let this same be presently perform'd,", "Even while men's minds are wild; lest more mischance", "On plots and errors, happen."]}, {"s": "PRINCE FORTINBRAS", "l": ["Let four captains", "Bear Hamlet, like a soldier, to the stage;", "For he was likely, had he been put on,", "To have proved most royally: and, for his passage,", "The soldiers' music and the rites of war", "Speak loudly for him.", "Take up the bodies: such a sight as this", "Becomes the field, but here shows much amiss.", "Go, bid the soldiers shoot."]}, {"d": "A dead march. Exeunt, bearing off the dead\nbodies; after which a peal of ordnance is shot off"}]}, "mnd21": {"play": "A Midsummer Night's Dream", "act": 2, "scene": 1, "title": "SCENE I.  A wood near Athens.", "items": [{"d": "Enter, from opposite sides, a Fairy, and PUCK"}, {"s": "PUCK", "l": ["How now, spirit! whither wander you?"]}, {"s": "Fairy", "l": ["Over hill, over dale,", "Thorough bush, thorough brier,", "Over park, over pale,", "Thorough flood, thorough fire,", "I do wander everywhere,", "Swifter than the moon's sphere;", "And I serve the fairy queen,", "To dew her orbs upon the green.", "The cowslips tall her pensioners be:", "In their gold coats spots you see;", "Those be rubies, fairy favours,", "In those freckles live their savours:", "I must go seek some dewdrops here", "And hang a pearl in every cowslip's ear.", "Farewell, thou lob of spirits; I'll be gone:", "Our queen and all our elves come here anon."]}, {"s": "PUCK", "l": ["The king doth keep his revels here to-night:", "Take heed the queen come not within his sight;", "For Oberon is passing fell and wrath,", "Because that she as her attendant hath", "A lovely boy, stolen from an Indian king;", "She never had so sweet a changeling;", "And jealous Oberon would have the child", "Knight of his train, to trace the forests wild;", "But she perforce withholds the loved boy,", "Crowns him with flowers and makes him all her joy:", "And now they never meet in grove or green,", "By fountain clear, or spangled starlight sheen,", "But, they do square, that all their elves for fear", "Creep into acorn-cups and hide them there."]}, {"s": "Fairy", "l": ["Either I mistake your shape and making quite,", "Or else you are that shrewd and knavish sprite", "Call'd Robin Goodfellow: are not you he", "That frights the maidens of the villagery;", "Skim milk, and sometimes labour in the quern", "And bootless make the breathless housewife churn;", "And sometime make the drink to bear no barm;", "Mislead night-wanderers, laughing at their harm?", "Those that Hobgoblin call you and sweet Puck,", "You do their work, and they shall have good luck:", "Are not you he?"]}, {"s": "PUCK", "l": ["Thou speak'st aright;", "I am that merry wanderer of the night.", "I jest to Oberon and make him smile", "When I a fat and bean-fed horse beguile,", "Neighing in likeness of a filly foal:", "And sometime lurk I in a gossip's bowl,", "In very likeness of a roasted crab,", "And when she drinks, against her lips I bob", "And on her wither'd dewlap pour the ale.", "The wisest aunt, telling the saddest tale,", "Sometime for three-foot stool mistaketh me;", "Then slip I from her bum, down topples she,", "And 'tailor' cries, and falls into a cough;", "And then the whole quire hold their hips and laugh,", "And waxen in their mirth and neeze and swear", "A merrier hour was never wasted there.", "But, room, fairy! here comes Oberon."]}, {"s": "Fairy", "l": ["And here my mistress. Would that he were gone!"]}, {"d": "Enter, from one side, OBERON, with his train;\nfrom the other, TITANIA, with hers"}, {"s": "OBERON", "l": ["Ill met by moonlight, proud Titania."]}, {"s": "TITANIA", "l": ["What, jealous Oberon! Fairies, skip hence:", "I have forsworn his bed and company."]}, {"s": "OBERON", "l": ["Tarry, rash wanton: am not I thy lord?"]}, {"s": "TITANIA", "l": ["Then I must be thy lady: but I know", "When thou hast stolen away from fairy land,", "And in the shape of Corin sat all day,", "Playing on pipes of corn and versing love", "To amorous Phillida. Why art thou here,", "Come from the farthest Steppe of India?", "But that, forsooth, the bouncing Amazon,", "Your buskin'd mistress and your warrior love,", "To Theseus must be wedded, and you come", "To give their bed joy and prosperity."]}, {"s": "OBERON", "l": ["How canst thou thus for shame, Titania,", "Glance at my credit with Hippolyta,", "Knowing I know thy love to Theseus?", "Didst thou not lead him through the glimmering night", "From Perigenia, whom he ravished?", "And make him with fair AEgle break his faith,", "With Ariadne and Antiopa?"]}, {"s": "TITANIA", "l": ["These are the forgeries of jealousy:", "And never, since the middle summer's spring,", "Met we on hill, in dale, forest or mead,", "By paved fountain or by rushy brook,", "Or in the beached margent of the sea,", "To dance our ringlets to the whistling wind,", "But with thy brawls thou hast disturb'd our sport.", "Therefore the winds, piping to us in vain,", "As in revenge, have suck'd up from the sea", "Contagious fogs; which falling in the land", "Have every pelting river made so proud", "That they have overborne their continents:", "The ox hath therefore stretch'd his yoke in vain,", "The ploughman lost his sweat, and the green corn", "Hath rotted ere his youth attain'd a beard;", "The fold stands empty in the drowned field,", "And crows are fatted with the murrion flock;", "The nine men's morris is fill'd up with mud,", "And the quaint mazes in the wanton green", "For lack of tread are undistinguishable:", "The human mortals want their winter here;", "No night is now with hymn or carol blest:", "Therefore the moon, the governess of floods,", "Pale in her anger, washes all the air,", "That rheumatic diseases do abound:", "And thorough this distemperature we see", "The seasons alter: hoary-headed frosts", "Far in the fresh lap of the crimson rose,", "And on old Hiems' thin and icy crown", "An odorous chaplet of sweet summer buds", "Is, as in mockery, set: the spring, the summer,", "The childing autumn, angry winter, change", "Their wonted liveries, and the mazed world,", "By their increase, now knows not which is which:", "And this same progeny of evils comes", "From our debate, from our dissension;", "We are their parents and original."]}, {"s": "OBERON", "l": ["Do you amend it then; it lies in you:", "Why should Titania cross her Oberon?", "I do but beg a little changeling boy,", "To be my henchman."]}, {"s": "TITANIA", "l": ["Set your heart at rest:", "The fairy land buys not the child of me.", "His mother was a votaress of my order:", "And, in the spiced Indian air, by night,", "Full often hath she gossip'd by my side,", "And sat with me on Neptune's yellow sands,", "Marking the embarked traders on the flood,", "When we have laugh'd to see the sails conceive", "And grow big-bellied with the wanton wind;", "Which she, with pretty and with swimming gait", "Following,--her womb then rich with my young squire,--", "Would imitate, and sail upon the land,", "To fetch me trifles, and return again,", "As from a voyage, rich with merchandise.", "But she, being mortal, of that boy did die;", "And for her sake do I rear up her boy,", "And for her sake I will not part with him."]}, {"s": "OBERON", "l": ["How long within this wood intend you stay?"]}, {"s": "TITANIA", "l": ["Perchance till after Theseus' wedding-day.", "If you will patiently dance in our round", "And see our moonlight revels, go with us;", "If not, shun me, and I will spare your haunts."]}, {"s": "OBERON", "l": ["Give me that boy, and I will go with thee."]}, {"s": "TITANIA", "l": ["Not for thy fairy kingdom. Fairies, away!", "We shall chide downright, if I longer stay."]}, {"d": "Exit TITANIA with her train"}, {"s": "OBERON", "l": ["Well, go thy way: thou shalt not from this grove", "Till I torment thee for this injury.", "My gentle Puck, come hither. Thou rememberest", "Since once I sat upon a promontory,", "And heard a mermaid on a dolphin's back", "Uttering such dulcet and harmonious breath", "That the rude sea grew civil at her song", "And certain stars shot madly from their spheres,", "To hear the sea-maid's music."]}, {"s": "PUCK", "l": ["I remember."]}, {"s": "OBERON", "l": ["That very time I saw, but thou couldst not,", "Flying between the cold moon and the earth,", "Cupid all arm'd: a certain aim he took", "At a fair vestal throned by the west,", "And loosed his love-shaft smartly from his bow,", "As it should pierce a hundred thousand hearts;", "But I might see young Cupid's fiery shaft", "Quench'd in the chaste beams of the watery moon,", "And the imperial votaress passed on,", "In maiden meditation, fancy-free.", "Yet mark'd I where the bolt of Cupid fell:", "It fell upon a little western flower,", "Before milk-white, now purple with love's wound,", "And maidens call it love-in-idleness.", "Fetch me that flower; the herb I shew'd thee once:", "The juice of it on sleeping eye-lids laid", "Will make or man or woman madly dote", "Upon the next live creature that it sees.", "Fetch me this herb; and be thou here again", "Ere the leviathan can swim a league."]}, {"s": "PUCK", "l": ["I'll put a girdle round about the earth", "In forty minutes."]}, {"d": "Exit"}, {"s": "OBERON", "l": ["Having once this juice,", "I'll watch Titania when she is asleep,", "And drop the liquor of it in her eyes.", "The next thing then she waking looks upon,", "Be it on lion, bear, or wolf, or bull,", "On meddling monkey, or on busy ape,", "She shall pursue it with the soul of love:", "And ere I take this charm from off her sight,", "As I can take it with another herb,", "I'll make her render up her page to me.", "But who comes here? I am invisible;", "And I will overhear their conference."]}, {"d": "Enter DEMETRIUS, HELENA, following him"}, {"s": "DEMETRIUS", "l": ["I love thee not, therefore pursue me not.", "Where is Lysander and fair Hermia?", "The one I'll slay, the other slayeth me.", "Thou told'st me they were stolen unto this wood;", "And here am I, and wode within this wood,", "Because I cannot meet my Hermia.", "Hence, get thee gone, and follow me no more."]}, {"s": "HELENA", "l": ["You draw me, you hard-hearted adamant;", "But yet you draw not iron, for my heart", "Is true as steel: leave you your power to draw,", "And I shall have no power to follow you."]}, {"s": "DEMETRIUS", "l": ["Do I entice you? do I speak you fair?", "Or, rather, do I not in plainest truth", "Tell you, I do not, nor I cannot love you?"]}, {"s": "HELENA", "l": ["And even for that do I love you the more.", "I am your spaniel; and, Demetrius,", "The more you beat me, I will fawn on you:", "Use me but as your spaniel, spurn me, strike me,", "Neglect me, lose me; only give me leave,", "Unworthy as I am, to follow you.", "What worser place can I beg in your love,--", "And yet a place of high respect with me,--", "Than to be used as you use your dog?"]}, {"s": "DEMETRIUS", "l": ["Tempt not too much the hatred of my spirit;", "For I am sick when I do look on thee."]}, {"s": "HELENA", "l": ["And I am sick when I look not on you."]}, {"s": "DEMETRIUS", "l": ["You do impeach your modesty too much,", "To leave the city and commit yourself", "Into the hands of one that loves you not;", "To trust the opportunity of night", "And the ill counsel of a desert place", "With the rich worth of your virginity."]}, {"s": "HELENA", "l": ["Your virtue is my privilege: for that", "It is not night when I do see your face,", "Therefore I think I am not in the night;", "Nor doth this wood lack worlds of company,", "For you in my respect are all the world:", "Then how can it be said I am alone,", "When all the world is here
