 Gentlemen."}, {"s": "ANNE", "l": ["Set down, set down your honorable load,", "If honor may be shrouded in a hearse,", "Whilst I awhile obsequiously lament", "Th’ untimely fall of virtuous Lancaster.", "[They set down the bier.]", "Poor key-cold figure of a holy king,", "Pale ashes of the house of Lancaster,", "Thou bloodless remnant of that royal blood,", "Be it lawful that I invocate thy ghost", "To hear the lamentations of poor Anne,", "Wife to thy Edward, to thy slaughtered son,", "Stabbed by the selfsame hand that made these wounds.", "Lo, in these windows that let forth thy life", "I pour the helpless balm of my poor eyes.", "O, cursèd be the hand that made these holes;", "Cursèd the heart that had the heart to do it;", "Cursèd the blood that let this blood from hence.", "More direful hap betide that hated wretch", "That makes us wretched by the death of thee", "Than I can wish to wolves, to spiders, toads,", "Or any creeping venomed thing that lives.", "If ever he have child, abortive be it,", "Prodigious, and untimely brought to light,", "Whose ugly and unnatural aspect", "May fright the hopeful mother at the view,", "And that be heir to his unhappiness.", "If ever he have wife, let her be made", "More miserable by the death of him", "Than I am made by my young lord and thee.—", "Come now towards Chertsey with your holy load,", "Taken from Paul’s to be interrèd there.", "[They take up the bier.]", "And still, as you are weary of this weight,", "Rest you, whiles I lament King Henry’s corse."], "n": "1.2.1"}, {"d": "Enter Richard, Duke of Gloucester."}, {"s": "RICHARD", "l": ["Stay, you that bear the corse, and set it down."], "n": "1.2.34"}, {"s": "ANNE", "l": ["What black magician conjures up this fiend", "To stop devoted charitable deeds?"], "n": "1.2.35"}, {"s": "RICHARD", "l": ["Villains, set down the corse or, by Saint Paul,", "I’ll make a corse of him that disobeys."], "n": "1.2.37"}, {"s": "GENTLEMAN", "l": ["My lord, stand back and let the coffin pass."], "n": "1.2.39"}, {"s": "RICHARD", "l": ["Unmannered dog, stand thou when I command!—", "Advance thy halberd higher than my breast,", "Or by Saint Paul I’ll strike thee to my foot", "And spurn upon thee, beggar, for thy boldness."], "n": "1.2.40"}, {"d": "They set down the bier."}, {"s": "ANNE", "l": ["[, to the Gentlemen and Halberds]", "What, do you tremble? Are you all afraid?", "Alas, I blame you not, for you are mortal,", "And mortal eyes cannot endure the devil.—", "Avaunt, thou dreadful minister of hell.", "Thou hadst but power over his mortal body;", "His soul thou canst not have. Therefore begone."], "n": "1.2.44"}, {"s": "RICHARD", "l": ["Sweet saint, for charity, be not so curst."], "n": "1.2.50"}, {"s": "ANNE", "l": ["Foul devil, for God’s sake, hence, and trouble us not,", "For thou hast made the happy Earth thy hell,", "Filled it with cursing cries and deep exclaims.", "If thou delight to view thy heinous deeds,", "Behold this pattern of thy butcheries.", "[She points to the corpse.]", "O, gentlemen, see, see dead Henry’s wounds", "Open their congealed mouths and bleed afresh!—", "Blush, blush, thou lump of foul deformity,", "For ’tis thy presence that exhales this blood", "From cold and empty veins where no blood dwells.", "Thy deeds, inhuman and unnatural,", "Provokes this deluge most unnatural.—", "O God, which this blood mad’st, revenge his death!", "O Earth, which this blood drink’st, revenge his death!", "Either heaven with lightning strike the murderer dead,", "Or Earth gape open wide and eat him quick,", "As thou dost swallow up this good king’s blood,", "Which his hell-governed arm hath butcherèd."], "n": "1.2.51"}, {"s": "RICHARD", "l": ["Lady, you know no rules of charity,", "Which renders good for bad, blessings for curses."], "n": "1.2.72"}, {"s": "ANNE", "l": ["Villain, thou know’st nor law of God nor man.", "No beast so fierce but knows some touch of pity."], "n": "1.2.74"}, {"s": "RICHARD", "l": ["But I know none, and therefore am no beast."], "n": "1.2.76"}, {"s": "ANNE", "l": ["O, wonderful, when devils tell the truth!"], "n": "1.2.77"}, {"s": "RICHARD", "l": ["More wonderful, when angels are so angry.", "Vouchsafe, divine perfection of a woman,", "Of these supposèd crimes to give me leave", "By circumstance but to acquit myself."], "n": "1.2.78"}, {"s": "ANNE", "l": ["Vouchsafe, defused infection of a man,", "Of these known evils but to give me leave", "By circumstance to curse thy cursèd self."], "n": "1.2.82"}, {"s": "RICHARD", "l": ["Fairer than tongue can name thee, let me have", "Some patient leisure to excuse myself."], "n": "1.2.85"}, {"s": "ANNE", "l": ["Fouler than heart can think thee, thou canst make", "No excuse current but to hang thyself."], "n": "1.2.87"}, {"s": "RICHARD", "l": ["By such despair I should accuse myself."], "n": "1.2.89"}, {"s": "ANNE", "l": ["And by despairing shalt thou stand excused", "For doing worthy vengeance on thyself", "That didst unworthy slaughter upon others."], "n": "1.2.90"}, {"s": "RICHARD", "l": ["Say that I slew them not."], "n": "1.2.93"}, {"s": "ANNE", "l": ["Then say they were not slain.", "But dead they are, and, devilish slave, by thee."], "n": "1.2.94"}, {"s": "RICHARD", "l": ["I did not kill your husband."], "n": "1.2.96"}, {"s": "ANNE", "l": ["Why then, he is alive."], "n": "1.2.97"}, {"s": "RICHARD", "l": ["Nay, he is dead, and slain by Edward’s hands."], "n": "1.2.98"}, {"s": "ANNE", "l": ["In thy foul throat thou liest. Queen Margaret saw", "Thy murd’rous falchion smoking in his blood,", "The which thou once didst bend against her breast,", "But that thy brothers beat aside the point."], "n": "1.2.99"}, {"s": "RICHARD", "l": ["I was provokèd by her sland’rous tongue,", "That laid their guilt upon my guiltless shoulders."], "n": "1.2.103"}, {"s": "ANNE", "l": ["Thou wast provokèd by thy bloody mind,", "That never dream’st on aught but butcheries.", "Didst thou not kill this king?"], "n": "1.2.105"}, {"s": "RICHARD", "l": ["I grant you."], "n": "1.2.108"}, {"s": "ANNE", "l": ["Dost grant me, hedgehog? Then, God grant me too", "Thou mayst be damnèd for that wicked deed.", "O, he was gentle, mild, and virtuous."], "n": "1.2.109"}, {"s": "RICHARD", "l": ["The better for the King of heaven that hath him."], "n": "1.2.112"}, {"s": "ANNE", "l": ["He is in heaven, where thou shalt never come."], "n": "1.2.113"}, {"s": "RICHARD", "l": ["Let him thank me, that holp to send him thither,", "For he was fitter for that place than Earth."], "n": "1.2.114"}, {"s": "ANNE", "l": ["And thou unfit for any place but hell."], "n": "1.2.116"}, {"s": "RICHARD", "l": ["Yes, one place else, if you will hear me name it."], "n": "1.2.117"}, {"s": "ANNE", "l": ["Some dungeon."], "n": "1.2.118"}, {"s": "RICHARD", "l": ["Your bedchamber."], "n": "1.2.119"}, {"s": "ANNE", "l": ["Ill rest betide the chamber where thou liest!"], "n": "1.2.120"}, {"s": "RICHARD", "l": ["So will it, madam, till I lie with you."], "n": "1.2.121"}, {"s": "ANNE", "l": ["I hope so."], "n": "1.2.122"}, {"s": "RICHARD", "l": ["I know so. But, gentle Lady Anne,", "To leave this keen encounter of our wits", "And fall something into a slower method:", "Is not the causer of the timeless deaths", "Of these Plantagenets, Henry and Edward,", "As blameful as the executioner?"], "n": "1.2.123"}, {"s": "ANNE", "l": ["Thou wast the cause and most accursed effect."], "n": "1.2.129"}, {"s": "RICHARD", "l": ["Your beauty was the cause of that effect—", "Your beauty, that did haunt me in my sleep", "To undertake the death of all the world,", "So I might live one hour in your sweet bosom."], "n": "1.2.130"}, {"s": "ANNE", "l": ["If I thought that, I tell thee, homicide,", "These nails should rend that beauty from my cheeks."], "n": "1.2.134"}, {"s": "RICHARD", "l": ["These eyes could not endure that beauty’s wrack.", "You should not blemish it, if I stood by.", "As all the world is cheerèd by the sun,", "So I by that. It is my day, my life."], "n": "1.2.137"}, {"s": "ANNE", "l": ["Black night o’ershade thy day, and death thy life."], "n": "1.2.141"}, {"s": "RICHARD", "l": ["Curse not thyself, fair creature; thou art both."], "n": "1.2.142"}, {"s": "ANNE", "l": ["I would I were, to be revenged on thee."], "n": "1.2.143"}, {"s": "RICHARD", "l": ["It is a quarrel most unnatural", "To be revenged on him that loveth thee."], "n": "1.2.144"}, {"s": "ANNE", "l": ["It is a quarrel just and reasonable", "To be revenged on him that killed my husband."], "n": "1.2.146"}, {"s": "RICHARD", "l": ["He that bereft thee, lady, of thy husband", "Did it to help thee to a better husband."], "n": "1.2.148"}, {"s": "ANNE", "l": ["His better doth not breathe upon the earth."], "n": "1.2.150"}, {"s": "RICHARD", "l": ["He lives that loves thee better than he could."], "n": "1.2.151"}, {"s": "ANNE", "l": ["Name him."], "n": "1.2.152"}, {"s": "RICHARD", "l": ["Plantagenet."], "n": "1.2.153"}, {"s": "ANNE", "l": ["Why, that was he."], "n": "1.2.154"}, {"s": "RICHARD", "l": ["The selfsame name, but one of better nature."], "n": "1.2.155"}, {"s": "ANNE", "l": ["Where is he?"], "n": "1.2.156"}, {"s": "RICHARD", "l": ["Here. ( She spits at him.) Why dost thou spit at me?"], "n": "1.2.157"}, {"s": "ANNE", "l": ["Would it were mortal poison for thy sake."], "n": "1.2.159"}, {"s": "RICHARD", "l": ["Never came poison from so sweet a place."], "n": "1.2.160"}, {"s": "ANNE", "l": ["Never hung poison on a fouler toad.", "Out of my sight! Thou dost infect mine eyes."], "n": "1.2.161"}, {"s": "RICHARD", "l": ["Thine eyes, sweet lady, have infected mine."], "n": "1.2.163"}, {"s": "ANNE", "l": ["Would they were basilisks’ to strike thee dead."], "n": "1.2.164"}, {"s": "RICHARD", "l": ["I would they were, that I might die at once,", "For now they kill me with a living death.", "Those eyes of thine from mine have drawn salt tears,", "Shamed their aspects with store of childish drops.", "These eyes, which never shed remorseful tear—", "No, when my father York and Edward wept", "To hear the piteous moan that Rutland made", "When black-faced Clifford shook his sword at him;", "Nor when thy warlike father, like a child,", "Told the sad story of my father’s death", "And twenty times made pause to sob and weep,", "That all the standers-by had wet their cheeks", "Like trees bedashed with rain— in that sad time,", "My manly eyes did scorn an humble tear;", "And what these sorrows could not thence exhale", "Thy beauty hath, and made them blind with weeping.", "I never sued to friend nor enemy;", "My tongue could never learn sweet smoothing word.", "But now thy beauty is proposed my fee,", "My proud heart sues and prompts my tongue to speak.", "[She looks scornfully at him.]", "Teach not thy lip such scorn, for it was made", "For kissing, lady, not for such contempt.", "If thy revengeful heart cannot forgive,", "Lo, here I lend thee this sharp-pointed sword,", "Which if thou please to hide in this true breast", "And let the soul forth that adoreth thee,", "I lay it naked to the deadly stroke", "And humbly beg the death upon my knee.", "[He kneels and lays his breast open; she offers at it with his sword.]", "Nay, do not pause, for I did kill King Henry—", "But ’twas thy beauty that provokèd me.", "Nay, now dispatch; ’twas I that stabbed young Edward—", "But ’twas thy heavenly face that set me on.", "[She falls the sword.]", "Take up the sword again, or take up me."], "n": "1.2.165"}, {"s": "ANNE", "l": ["Arise, dissembler. Though I wish thy death,", "I will not be thy executioner."], "n": "1.2.202"}, {"s": "RICHARD", "l": ["[, rising]", "Then bid me kill myself, and I will do it."], "n": "1.2.204"}, {"s": "ANNE", "l": ["I have already."], "n": "1.2.205"}, {"s": "RICHARD", "l": ["That was in thy rage.", "Speak it again and, even with the word,", "This hand, which for thy love did kill thy love,", "Shall for thy love kill a far truer love.", "To both their deaths shalt thou be accessory."], "n": "1.2.206"}, {"s": "ANNE", "l": ["I would I knew thy heart."], "n": "1.2.211"}, {"s": "RICHARD", "l": ["’Tis figured in my tongue."], "n": "1.2.212"}, {"s": "ANNE", "l": ["I fear me both are false."], "n": "1.2.213"}, {"s": "RICHARD", "l": ["Then never was man true."], "n": "1.2.214"}, {"s": "ANNE", "l": ["Well, well, put up your sword."], "n": "1.2.215"}, {"s": "RICHARD", "l": ["Say then my peace is made."], "n": "1.2.216"}, {"s": "ANNE", "l": ["That shalt thou know hereafter."], "n": "1.2.217"}, {"s": "RICHARD", "l": ["But shall I live in hope?"], "n": "1.2.218"}, {"s": "ANNE", "l": ["All men I hope live so."], "n": "1.2.219"}, {"s": "RICHARD", "l": ["Vouchsafe to wear this ring."], "n": "1.2.220"}, {"s": "ANNE", "l": ["To take is not to give."], "n": "1.2.221"}, {"d": "He places the ring on her hand."}, {"s": "RICHARD", "l": ["Look how my ring encompasseth thy finger;", "Even so thy breast encloseth my poor heart.", "Wear both of them, for both of them are thine.", "And if thy poor devoted servant may", "But beg one favor at thy gracious hand,", "Thou dost confirm his happiness forever."], "n": "1.2.222"}, {"s": "ANNE", "l": ["What is it?"], "n": "1.2.228"}, {"s": "RICHARD", "l": ["That it may please you leave these sad designs", "To him that hath most cause to be a mourner,", "And presently repair to Crosby House,", "Where, after I have solemnly interred", "At Chertsey monast’ry this noble king", "And wet his grave with my repentant tears,", "I will with all expedient duty see you.", "For divers unknown reasons, I beseech you,", "Grant me this boon."], "n": "1.2.229"}, {"s": "ANNE", "l": ["With all my heart, and much it joys me too", "To see you are become so penitent.—", "Tressel and Berkeley, go along with me."], "n": "1.2.238"}, {"s": "RICHARD", "l": ["Bid me farewell."], "n": "1.2.241"}, {"s": "ANNE", "l": ["’Tis more than you deserve;", "But since you teach me how to flatter you,", "Imagine I have said “ farewell” already."], "n": "1.2.242"}, {"d": "Two exit with Anne. The bier is taken up."}, {"s": "GENTLEMAN", "l": ["Towards Chertsey, noble lord?"], "n": "1.2.245"}, {"s": "RICHARD", "l": ["No, to Whitefriars. There attend my coming.", "[Halberds and gentlemen exit with corse.]", "Was ever woman in this humor wooed?", "Was ever woman in this humor won?", "I’ll have her, but I will not keep her long.", "What, I that killed her husband and his father,", "To take her in her heart’s extremest hate,", "With curses in her mouth, tears in her eyes,", "The bleeding witness of my hatred by,", "Having God, her conscience, and these bars against me,", "And I no friends to back my suit at all", "But the plain devil and dissembling looks?", "And yet to win her, all the world to nothing!", "Ha!", "Hath she forgot already that brave prince,", "Edward, her lord, whom I some three months since", "Stabbed in my angry mood at Tewkesbury?", "A sweeter and a lovelier gentleman,", "Framed in the prodigality of nature,", "Young, valiant, wise, and, no doubt, right royal,", "The spacious world cannot again afford.", "And will she yet abase her eyes on me,", "That cropped the golden prime of this sweet prince", "And made her widow to a woeful bed?", "On me, whose all not equals Edward’s moiety?", "On me, that halts and am misshapen thus?", "My dukedom to a beggarly denier,", "I do mistake my person all this while!", "Upon my life, she finds, although I cannot,", "Myself to be a marv’lous proper man.", "I’ll be at charges for a looking glass", "And entertain a score or two of tailors", "To study fashions to adorn my body.", "Since I am crept in favor with myself,", "I will maintain it with some little cost.", "But first I’ll turn yon fellow in his grave", "And then return lamenting to my love.", "Shine out, fair sun, till I have bought a glass,", "That I may see my shadow as I pass."], "n": "1.2.246"}, {"d": "He exits."}]}, "cor45": {"play": "Coriolanus", "act": 4, "scene": 5, "title": "SCENE V.  Antium. A hall in Aufidius's house.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/coriolanus/read/4/5/", "first": "4.5.1", "last": "4.5.259", "items": [{"d": "Music plays. Enter a Servingman."}, {"s": "FIRST SERVINGMAN", "l": ["Wine, wine, wine! What service is", "here? I think our fellows are asleep."], "n": "4.5.1"}, {"d": "He exits."}, {"d": "Enter another Servingman."}, {"s": "SECOND SERVINGMAN", "l": ["Where’s Cotus? My master calls", "for him. Cotus!"], "n": "4.5.3"}, {"d": "He exits."}, {"d": "Enter Coriolanus."}, {"s": "CORIOLANUS", "l": ["A goodly house. The feast smells well, but I", "Appear not like a guest."], "n": "4.5.5"}, {"d": "Enter the First Servingman."}, {"s": "FIRST SERVINGMAN", "l": ["What would you have, friend?", "Whence are you? Here’s no place for you. Pray, go", "to the door."], "n": "4.5.7"}, {"d": "He exits."}, {"s": "CORIOLANUS", "l": ["I have deserved no better entertainment", "In being Coriolanus."], "n": "4.5.10"}, {"d": "Enter Second Servingman."}, {"s": "SECOND SERVINGMAN", "l": ["Whence are you, sir?— Has the", "porter his eyes in his head, that he gives entrance", "to such companions?— Pray, get you out."], "n": "4.5.12"}, {"s": "CORIOLANUS", "l": ["Away!"], "n": "4.5.15"}, {"s": "SECOND SERVINGMAN", "l": ["Away? Get you away."], "n": "4.5.16"}, {"s": "CORIOLANUS", "l": ["Now th’ art troublesome."], "n": "4.5.17"}, {"s": "SECOND SERVINGMAN", "l": ["Are you so brave? I’ll have you", "talked with anon."], "n": "4.5.18"}, {"d": "Enter Third Servingman; the First, entering, meets him."}, {"s": "THIRD SERVINGMAN", "l": ["What fellow’s this?"], "n": "4.5.20"}, {"s": "FIRST SERVINGMAN", "l": ["A strange one as ever I looked on. I", "cannot get him out o’ th’ house. Prithee, call my", "master to him."], "n": "4.5.21"}, {"d": "He steps aside."}, {"s": "THIRD SERVINGMAN", "l": ["What have you to do here, fellow?", "Pray you, avoid the house."], "n": "4.5.24"}, {"s": "CORIOLANUS", "l": ["Let me but stand. I will not hurt your", "hearth."], "n": "4.5.26"}, {"s": "THIRD SERVINGMAN", "l": ["What are you?"], "n": "4.5.28"}, {"s": "CORIOLANUS", "l": ["A gentleman."], "n": "4.5.29"}, {"s": "THIRD SERVINGMAN", "l": ["A marv’llous poor one."], "n": "4.5.30"}, {"s": "CORIOLANUS", "l": ["True, so I am."], "n": "4.5.31"}, {"s": "THIRD SERVINGMAN", "l": ["Pray you, poor gentleman, take up", "some other station. Here’s no place for you. Pray", "you, avoid. Come."], "n": "4.5.32"}, {"s": "CORIOLANUS", "l": ["Follow your function, go, and batten on", "cold bits."], "n": "4.5.35"}, {"d": "Pushes him away from him."}, {"s": "THIRD SERVINGMAN", "l": ["What, you will not?— Prithee, tell", "my master what a strange guest he has here."], "n": "4.5.37"}, {"s": "SECOND SERVINGMAN", "l": ["And I shall."], "n": "4.5.39"}, {"d": "Second Servingman exits."}, {"s": "THIRD SERVINGMAN", "l": ["Where dwell’st thou?"], "n": "4.5.40"}, {"s": "CORIOLANUS", "l": ["Under the canopy."], "n": "4.5.41"}, {"s": "THIRD SERVINGMAN", "l": ["Under the canopy?"], "n": "4.5.42"}, {"s": "CORIOLANUS", "l": ["Ay."], "n": "4.5.43"}, {"s": "THIRD SERVINGMAN", "l": ["Where’s that?"], "n": "4.5.44"}, {"s": "CORIOLANUS", "l": ["I’ th’ city of kites and crows."], "n": "4.5.45"}, {"s": "THIRD SERVINGMAN", "l": ["I’ th’ city of kites and crows? What", "an ass it is! Then thou dwell’st with daws too?"], "n": "4.5.46"}, {"s": "CORIOLANUS", "l": ["No, I serve not thy master."], "n": "4.5.48"}, {"s": "THIRD SERVINGMAN", "l": ["How, sir? Do you meddle with my", "master?"], "n": "4.5.49"}, {"s": "CORIOLANUS", "l": ["Ay, ’tis an honester service than to meddle", "with thy mistress. Thou prat’st and prat’st. Serve", "with thy trencher. Hence!"], "n": "4.5.51"}, {"d": "Beats him away."}, {"d": "Third Servingman exits."}, {"d": "Enter Aufidius with the Second Servingman."}, {"s": "AUFIDIUS", "l": ["Where is this fellow?"], "n": "4.5.54"}, {"s": "SECOND SERVINGMAN", "l": ["Here, sir. I’d have beaten him like", "a dog, but for disturbing the lords within."], "n": "4.5.55"}, {"d": "He steps aside."}, {"s": "AUFIDIUS", "l": ["Whence com’st thou? What wouldst thou?", "Thy name? Why speak’st not? Speak, man. What’s", "thy name?"], "n": "4.5.57"}, {"s": "CORIOLANUS", "l": ["[, removing his muffler]", "If, Tullus,", "Not yet thou know’st me, and seeing me, dost not", "Think me for the man I am, necessity", "Commands me name myself."], "n": "4.5.60"}, {"s": "AUFIDIUS", "l": ["What is thy name?"], "n": "4.5.64"}, {"s": "CORIOLANUS", "l": ["A name unmusical to the Volscians’ ears", "And harsh in sound to thine."], "n": "4.5.65"}, {"s": "AUFIDIUS", "l": ["Say, what’s thy name?", "Thou hast a grim appearance, and thy face", "Bears a command in ’t. Though thy tackle’s torn,", "Thou show’st a noble vessel. What’s thy name?"], "n": "4.5.67"}, {"s": "CORIOLANUS", "l": ["Prepare thy brow to frown. Know’st thou me yet?"], "n": "4.5.71"}, {"s": "AUFIDIUS", "l": ["I know thee not. Thy name?"], "n": "4.5.72"}, {"s": "CORIOLANUS", "l": ["My name is Caius Martius, who hath done", "To thee particularly and to all the Volsces", "Great hurt and mischief; thereto witness may", "My surname Coriolanus. The painful service,", "The extreme dangers, and the drops of blood", "Shed for my thankless country are requited", "But with that surname, a good memory", "And witness of the malice and displeasure", "Which thou shouldst bear me. Only that name remains.", "The cruelty and envy of the people,", "Permitted by our dastard nobles, who", "Have all forsook me, hath devoured the rest,", "And suffered me by th’ voice of slaves to be", "Whooped out of Rome. Now this extremity", "Hath brought me to thy hearth, not out of hope—", "Mistake me not— to save my life; for if", "I had feared death, of all the men i’ th’ world", "I would have ’voided thee, but in mere spite,", "To be full quit of those my banishers,", "Stand I before thee here. Then if thou hast", "A heart of wreak in thee, that wilt revenge", "Thine own particular wrongs and stop those maims", "Of shame seen through thy country, speed thee straight", "And make my misery serve thy turn. So use it", "That my revengeful services may prove", "As benefits to thee, for I will fight", "Against my cankered country with the spleen", "Of all the under fiends. But if so be", "Thou dar’st not this, and that to prove more fortunes", "Thou ’rt tired, then, in a word, I also am", "Longer to live most weary, and present", "My throat to thee and to thy ancient malice,", "Which not to cut would show thee but a fool,", "Since I have ever followed thee with hate,", "Drawn tuns of blood out of thy country’s breast,", "And cannot live but to thy shame, unless", "It be to do thee service."], "n": "4.5.73"}, {"s": "AUFIDIUS", "l": ["O Martius, Martius,", "Each word thou hast spoke hath weeded from my heart", "A root of ancient envy. If Jupiter", "Should from yond cloud speak divine things", "And say ’tis true, I’d not believe them more", "Than thee, all-noble Martius. Let me twine", "Mine arms about that body, whereagainst", "My grainèd ash an hundred times hath broke", "And scarred the moon with splinters.", "[They embrace.]", "Here I clip", "The anvil of my sword and do contest", "As hotly and as nobly with thy love", "As ever in ambitious strength I did", "Contend against thy valor. Know thou first,", "I loved the maid I married; never man", "Sighed truer breath. But that I see thee here,", "Thou noble thing, more dances my rapt heart", "Than when I first my wedded mistress saw", "Bestride my threshold. Why, thou Mars, I tell thee", "We have a power on foot, and I had purpose", "Once more to hew thy target from thy brawn", "Or lose mine arm for ’t. Thou hast beat me out", "Twelve several times, and I have nightly since", "Dreamt of encounters ’twixt thyself and me;", "We have been down together in my sleep,", "Unbuckling helms, fisting each other’s throat,", "And waked half dead with nothing. Worthy Martius,", "Had we no other quarrel else to Rome but that", "Thou art thence banished, we would muster all", "From twelve to seventy and, pouring war", "Into the bowels of ungrateful Rome,", "Like a bold flood o’erbear ’t. O, come, go in,", "And take our friendly senators by th’ hands,", "Who now are here, taking their leaves of me,", "Who am prepared against your territories,", "Though not for Rome itself."], "n": "4.5.112"}, {"s": "CORIOLANUS", "l": ["You bless me, gods!"], "n": "4.5.149"}, {"s": "AUFIDIUS", "l": ["Therefore, most absolute sir, if thou wilt have", "The leading of thine own revenges, take", "Th’ one half of my commission and set down—", "As best thou art experienced, since thou know’st", "Thy country’s strength and weakness— thine own ways,", "Whether to knock against the gates of Rome,", "Or rudely visit them in parts remote", "To fright them ere destroy. But come in.", "Let me commend thee first to those that shall", "Say yea to thy desires. A thousand welcomes!", "And more a friend than ere an enemy—", "Yet, Martius, that was much. Your hand. Most welcome!"], "n": "4.5.150"}, {"d": "Coriolanus and Aufidius exit."}, {"d": "Two of the Servingmen come forward."}, {"s": "FIRST SERVINGMAN", "l": ["Here’s a strange alteration!"], "n": "4.5.164"}, {"s": "SECOND SERVINGMAN", "l": ["By my hand, I had thought to", "have strucken him with a cudgel, and yet my mind", "gave me his clothes made a false report of him."], "n": "4.5.165"}, {"s": "FIRST SERVINGMAN", "l": ["What an arm he has! He turned me", "about with his finger and his thumb as one would", "set up a top."], "n": "4.5.168"}, {"s": "SECOND SERVINGMAN", "l": ["Nay, I knew by his face that there", "was something in him. He had, sir, a kind of face,", "methought— I cannot tell how to term it."], "n": "4.5.171"}, {"s": "FIRST SERVINGMAN", "l": ["He had so, looking as it were—", "Would I were hanged but I thought there was", "more in him than I could think."], "n": "4.5.174"}, {"s": "SECOND SERVINGMAN", "l": ["So did I, I’ll be sworn. He is simply", "the rarest man i’ th’ world."], "n": "4.5.177"}, {"s": "FIRST SERVINGMAN", "l": ["I think he is. But a greater soldier", "than he you wot one."], "n": "4.5.179"}, {"s": "SECOND SERVINGMAN", "l": ["Who, my master?"], "n": "4.5.181"}, {"s": "FIRST SERVINGMAN", "l": ["Nay, it’s no matter for that."], "n": "4.5.182"}, {"s": "SECOND SERVINGMAN", "l": ["Worth six on him."], "n": "4.5.183"}, {"s": "FIRST SERVINGMAN", "l": ["Nay, not so neither. But I take him", "to be the greater soldier."], "n": "4.5.184"}, {"s": "SECOND SERVINGMAN", "l": ["Faith, look you, one cannot tell", "how to say that. For the defense of a town our general", "is excellent."], "n": "4.5.186"}, {"s": "FIRST SERVINGMAN", "l": ["Ay, and for an assault too."], "n": "4.5.189"}, {"d": "Enter the Third Servingman."}, {"s": "THIRD SERVINGMAN", "l": ["O slaves, I can tell you news, news,", "you rascals!"], "n": "4.5.190"}, {"s": "BOTH", "l": ["What, what, what? Let’s partake!"], "n": "4.5.192"}, {"s": "THIRD SERVINGMAN", "l": ["I would not be a Roman, of all nations;", "I had as lief be a condemned man."], "n": "4.5.193"}, {"s": "BOTH", "l": ["Wherefore? Wherefore?"], "n": "4.5.195"}, {"s": "THIRD SERVINGMAN", "l": ["Why, here’s he that was wont to", "thwack our general, Caius Martius."], "n": "4.5.196"}, {"s": "FIRST SERVINGMAN", "l": ["Why do you say “ thwack our", "general”?"], "n": "4.5.198"}, {"s": "THIRD SERVINGMAN", "l": ["I do not say “ thwack our general,”", "but he was always good enough for him."], "n": "4.5.200"}, {"s": "SECOND SERVINGMAN", "l": ["Come, we are fellows and friends.", "He was ever too hard for him; I have heard him", "say so himself."], "n": "4.5.202"}, {"s": "FIRST SERVINGMAN", "l": ["He was too hard for him directly, to", "say the truth on ’t, before Corioles; he scotched", "him and notched him like a carbonado."], "n": "4.5.205"}, {"s": "SECOND SERVINGMAN", "l": ["An he had been cannibally given,", "he might have boiled and eaten him too."], "n": "4.5.208"}, {"s": "FIRST SERVINGMAN", "l": ["But, more of thy news."], "n": "4.5.210"}, {"s": "THIRD SERVINGMAN", "l": ["Why, he is so made on here within", "as if he were son and heir to Mars; set at upper end", "o’ th’ table; no question asked him by any of the", "senators but they stand bald before him. Our general", "himself makes a mistress of him, sanctifies", "himself with ’s hand, and turns up the white o’ th’", "eye to his discourse. But the bottom of the news is,", "our general is cut i’ th’ middle and but one half of", "what he was yesterday, for the other has half, by", "the entreaty and grant of the whole table. He’ll go,", "he says, and sowl the porter of Rome gates by th’", "ears. He will mow all down before him and leave", "his passage polled."], "n": "4.5.211"}, {"s": "SECOND SERVINGMAN", "l": ["And he’s as like to do ’t as any", "man I can imagine."], "n": "4.5.224"}, {"s": "THIRD SERVINGMAN", "l": ["Do ’t? He will do ’t! For, look you,", "sir, he has as many friends as enemies, which", "friends, sir, as it were, durst not, look you, sir, show", "themselves, as we term it, his friends whilest he’s", "in directitude."], "n": "4.5.226"}, {"s": "FIRST SERVINGMAN", "l": ["Directitude? What’s that?"], "n": "4.5.231"}, {"s": "THIRD SERVINGMAN", "l": ["But when they shall see, sir, his", "crest up again, and the man in blood, they will out", "of their burrows like coneys after rain, and revel", "all with him."], "n": "4.5.232"}, {"s": "FIRST SERVINGMAN", "l": ["But when goes this forward?"], "n": "4.5.236"}, {"s": "THIRD SERVINGMAN", "l": ["Tomorrow, today, presently. You", "shall have the drum struck up this afternoon. ’Tis,", "as it were, a parcel of their feast, and to be executed", "ere they wipe their lips."], "n": "4.5.237"}, {"s": "SECOND SERVINGMAN", "l": ["Why then, we shall have a stirring", "world again. This peace is nothing but to rust iron,", "increase tailors, and breed ballad-makers."], "n": "4.5.241"}, {"s": "FIRST SERVINGMAN", "l": ["Let me have war, say I. It exceeds", "peace as far as day does night. It’s sprightly walking,", "audible, and full of vent. Peace is a very apoplexy,", "lethargy; mulled, deaf, sleepy, insensible; a getter", "of more bastard children than war’s a destroyer of", "men."], "n": "4.5.244"}, {"s": "SECOND SERVINGMAN", "l": ["’Tis so, and as wars in some sort", "may be said to be a ravisher, so it cannot be denied", "but peace is a great maker of cuckolds."], "n": "4.5.250"}, {"s": "FIRST SERVINGMAN", "l": ["Ay, and it makes men hate one", "another."], "n": "4.5.253"}, {"s": "THIRD SERVINGMAN", "l": ["Reason: because they then less", "need one another. The wars for my money! I hope", "to see Romans as cheap as Volscians.", "[( Noise within.)]", "They are rising; they are rising."], "n": "4.5.255"}, {"s": "FIRST AND SECOND SERVINGMEN", "l": ["In, in, in, in!"], "n": "4.5.259"}, {"d": "They exit."}]}, "ayl21": {"play": "As You Like It", "act": 2, "scene": 1, "title": "SCENE I.  The Forest of Arden.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/as-you-like-it/read/2/1/", "first": "2.1.1", "last": "2.1.73", "items": [{"d": "Enter Duke Senior, Amiens, and two or three Lords, like foresters."}, {"s": "DUKE SENIOR", "l": ["Now, my co-mates and brothers in exile,", "Hath not old custom made this life more sweet", "Than that of painted pomp? Are not these woods", "More free from peril than the envious court?", "Here feel we not the penalty of Adam,", "The seasons’ difference, as the icy fang", "And churlish chiding of the winter’s wind,", "Which when it bites and blows upon my body", "Even till I shrink with cold, I smile and say", "“ This is no flattery. These are counselors", "That feelingly persuade me what I am.”", "Sweet are the uses of adversity,", "Which, like the toad, ugly and venomous,", "Wears yet a precious jewel in his head.", "And this our life, exempt from public haunt,", "Finds tongues in trees, books in the running brooks,", "Sermons in stones, and good in everything."], "n": "2.1.1"}, {"s": "AMIENS", "l": ["I would not change it. Happy is your Grace,", "That can translate the stubbornness of fortune", "Into so quiet and so sweet a style."], "n": "2.1.18"}, {"s": "DUKE SENIOR", "l": ["Come, shall we go and kill us venison?", "And yet it irks me the poor dappled fools,", "Being native burghers of this desert city,", "Should in their own confines with forkèd heads", "Have their round haunches gored."], "n": "2.1.21", "cut": true}, {"s": "FIRST LORD", "l": ["Indeed, my lord,", "The melancholy Jaques grieves at that,", "And in that kind swears you do more usurp", "Than doth your brother that hath banished you.", "Today my Lord of Amiens and myself", "Did steal behind him as he lay along", "Under an oak, whose antique root peeps out", "Upon the brook that brawls along this wood;", "To the which place a poor sequestered stag", "That from the hunter’s aim had ta’en a hurt", "Did come to languish. And indeed, my lord,", "The wretched animal heaved forth such groans", "That their discharge did stretch his leathern coat", "Almost to bursting, and the big round tears", "Coursed one another down his innocent nose", "In piteous chase. And thus the hairy fool,", "Much markèd of the melancholy Jaques,", "Stood on th’ extremest verge of the swift brook,", "Augmenting it with tears."], "n": "2.1.26", "cut": true}, {"s": "DUKE SENIOR", "l": ["But what said Jaques?", "Did he not moralize this spectacle?"], "n": "2.1.45", "cut": true}, {"s": "FIRST LORD", "l": ["O yes, into a thousand similes.", "First, for his weeping into the needless stream:", "“ Poor deer,” quoth he, “ thou mak’st a testament", "As worldlings do, giving thy sum of more", "To that which had too much.” Then, being there alone,", "Left and abandoned of his velvet friends:", "“ ’Tis right,” quoth he. “ Thus misery doth part", "The flux of company.” Anon a careless herd,", "Full of the pasture, jumps along by him", "And never stays to greet him. “ Ay,” quoth Jaques,", "“ Sweep on, you fat and greasy citizens.", "’Tis just the fashion. Wherefore do you look", "Upon that poor and broken bankrupt there?”", "Thus most invectively he pierceth through", "The body of country, city, court,", "Yea, and of this our life, swearing that we", "Are mere usurpers, tyrants, and what’s worse,", "To fright the animals and to kill them up", "In their assigned and native dwelling place."], "n": "2.1.47", "cut": true}, {"s": "DUKE SENIOR", "l": ["And did you leave him in this contemplation?"], "n": "2.1.67", "cut": true}, {"s": "SECOND LORD", "l": ["We did, my lord, weeping and commenting", "Upon the sobbing deer."], "n": "2.1.68", "cut": true}, {"s": "DUKE SENIOR", "l": ["Show me the place.", "I love to cope him in these sullen fits,", "For then he’s full of matter."], "n": "2.1.70", "cut": true}, {"s": "FIRST LORD", "l": ["I’ll bring you to him straight."], "n": "2.1.73", "cut": true}, {"d": "They exit."}]}, "rom11": {"play": "Romeo and Juliet", "act": 1, "scene": 1, "title": "SCENE I.  Verona. A public place.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/romeo-and-juliet/read/1/1/", "first": "1.1.163", "last": "1.1.247", "items": [{"s": "BENVOLIO", "l": ["Good morrow, cousin."], "n": "1.1.163"}, {"s": "ROMEO", "l": ["Is the day so young?"], "n": "1.1.164"}, {"s": "BENVOLIO", "l": ["But new struck nine."], "n": "1.1.165"}, {"s": "ROMEO", "l": ["Ay me, sad hours seem long.", "Was that my father that went hence so fast?"], "n": "1.1.166"}, {"s": "BENVOLIO", "l": ["It was. What sadness lengthens Romeo’s hours?"], "n": "1.1.168"}, {"s": "ROMEO", "l": ["Not having that which, having, makes them short."], "n": "1.1.169"}, {"s": "BENVOLIO", "l": ["In love?"], "n": "1.1.170"}, {"s": "ROMEO", "l": ["Out—"], "n": "1.1.171"}, {"s": "BENVOLIO", "l": ["Of love?"], "n": "1.1.172"}, {"s": "ROMEO", "l": ["Out of her favor where I am in love."], "n": "1.1.173"}, {"s": "BENVOLIO", "l": ["Alas that love, so gentle in his view,", "Should be so tyrannous and rough in proof!"], "n": "1.1.174"}, {"s": "ROMEO", "l": ["Alas that love, whose view is muffled still,", "Should without eyes see pathways to his will!", "Where shall we dine?— O me! What fray was here?", "Yet tell me not, for I have heard it all.", "Here’s much to do with hate, but more with love.", "Why then, O brawling love, O loving hate,", "O anything of nothing first create!", "O heavy lightness, serious vanity,", "Misshapen chaos of well-seeming forms,", "Feather of lead, bright smoke, cold fire, sick health,", "Still-waking sleep that is not what it is!", "This love feel I, that feel no love in this.", "Dost thou not laugh?"], "n": "1.1.176"}, {"s": "BENVOLIO", "l": ["No, coz, I rather weep."], "n": "1.1.189"}, {"s": "ROMEO", "l": ["Good heart, at what?"], "n": "1.1.190"}, {"s": "BENVOLIO", "l": ["At thy good heart’s oppression."], "n": "1.1.191"}, {"s": "ROMEO", "l": ["Why, such is love’s transgression.", "Griefs of mine own lie heavy in my breast,", "Which thou wilt propagate to have it pressed", "With more of thine. This love that thou hast shown", "Doth add more grief to too much of mine own.", "Love is a smoke made with the fume of sighs;", "Being purged, a fire sparkling in lovers’ eyes;", "Being vexed, a sea nourished with loving tears.", "What is it else? A madness most discreet,", "A choking gall, and a preserving sweet.", "Farewell, my coz."], "n": "1.1.192"}, {"s": "BENVOLIO", "l": ["Soft, I will go along.", "An if you leave me so, you do me wrong."], "n": "1.1.203"}, {"s": "ROMEO", "l": ["Tut, I have lost myself. I am not here.", "This is not Romeo. He’s some other where."], "n": "1.1.205"}, {"s": "BENVOLIO", "l": ["Tell me in sadness, who is that you love?"], "n": "1.1.207"}, {"s": "ROMEO", "l": ["What, shall I groan and tell thee?"], "n": "1.1.208"}, {"s": "BENVOLIO", "l": ["Groan? Why, no. But sadly tell me who."], "n": "1.1.209"}, {"s": "ROMEO", "l": ["A sick man in sadness makes his will—", "A word ill urged to one that is so ill.", "In sadness, cousin, I do love a woman."], "n": "1.1.210"}, {"s": "BENVOLIO", "l": ["I aimed so near when I supposed you loved."], "n": "1.1.213"}, {"s": "ROMEO", "l": ["A right good markman! And she’s fair I love."], "n": "1.1.214"}, {"s": "BENVOLIO", "l": ["A right fair mark, fair coz, is soonest hit."], "n": "1.1.215"}, {"s": "ROMEO", "l": ["Well in that hit you miss. She’ll not be hit", "With Cupid’s arrow. She hath Dian’s wit,", "And, in strong proof of chastity well armed,", "From love’s weak childish bow she lives uncharmed.", "She will not stay the siege of loving terms,", "Nor bide th’ encounter of assailing eyes,", "Nor ope her lap to saint-seducing gold.", "O, she is rich in beauty, only poor", "That, when she dies, with beauty dies her store."], "n": "1.1.216"}, {"s": "BENVOLIO", "l": ["Then she hath sworn that she will still live chaste?"], "n": "1.1.225"}, {"s": "ROMEO", "l": ["She hath, and in that sparing makes huge waste;", "For beauty, starved with her severity,", "Cuts beauty off from all posterity.", "She is too fair, too wise, wisely too fair,", "To merit bliss by making me despair.", "She hath forsworn to love, and in that vow", "Do I live dead, that live to tell it now."], "n": "1.1.226"}, {"s": "BENVOLIO", "l": ["Be ruled by me. Forget to think of her."], "n": "1.1.233"}, {"s": "ROMEO", "l": ["O, teach me how I should forget to think!"], "n": "1.1.234"}, {"s": "BENVOLIO", "l": ["By giving liberty unto thine eyes.", "Examine other beauties."], "n": "1.1.235"}, {"s": "ROMEO", "l": ["’Tis the way", "To call hers, exquisite, in question more.", "These happy masks that kiss fair ladies’ brows,", "Being black, puts us in mind they hide the fair.", "He that is strucken blind cannot forget", "The precious treasure of his eyesight lost.", "Show me a mistress that is passing fair;", "What doth her beauty serve but as a note", "Where I may read who passed that passing fair?", "Farewell. Thou canst not teach me to forget."], "n": "1.1.237"}, {"s": "BENVOLIO", "l": ["I’ll pay that doctrine or else die in debt."], "n": "1.1.247"}, {"d": "They exit."}]}, "rom13": {"play": "Romeo and Juliet", "act": 1, "scene": 3, "title": "SCENE III.  A room in Capulet's house.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/romeo-and-juliet/read/1/3/", "first": "1.3.1", "last": "1.3.113", "items": [{"d": "Enter Lady Capulet and Nurse."}, {"s": "LADY CAPULET", "l": ["Nurse, where’s my daughter? Call her forth to me."], "n": "1.3.1"}, {"s": "NURSE", "l": ["Now, by my maidenhead at twelve year old,", "I bade her come.— What, lamb! What, ladybird!", "God forbid. Where’s this girl? What, Juliet!"], "n": "1.3.2"}, {"d": "Enter Juliet."}, {"s": "JULIET", "l": ["How now, who calls?"], "n": "1.3.5"}, {"s": "NURSE", "l": ["Your mother."], "n": "1.3.6"}, {"s": "JULIET", "l": ["Madam, I am here. What is your will?"], "n": "1.3.7"}, {"s": "LADY CAPULET", "l": ["This is the matter.— Nurse, give leave awhile.", "We must talk in secret.— Nurse, come back again.", "I have remembered me, thou ’s hear our counsel.", "Thou knowest my daughter’s of a pretty age."], "n": "1.3.8"}, {"s": "NURSE", "l": ["Faith, I can tell her age unto an hour."], "n": "1.3.12"}, {"s": "LADY CAPULET", "l": ["She’s not fourteen."], "n": "1.3.13"}, {"s": "NURSE", "l": ["I’ll lay fourteen of my teeth ( and yet, to my teen", "be it spoken, I have but four) she’s not fourteen.", "How long is it now to Lammastide?"], "n": "1.3.14"}, {"s": "LADY CAPULET", "l": ["A fortnight and odd days."], "n": "1.3.17"}, {"s": "NURSE", "l": ["Even or odd, of all days in the year,", "Come Lammas Eve at night shall she be fourteen.", "Susan and she ( God rest all Christian souls!)", "Were of an age. Well, Susan is with God;", "She was too good for me. But, as I said,", "On Lammas Eve at night shall she be fourteen.", "That shall she. Marry, I remember it well.", "’Tis since the earthquake now eleven years,", "And she was weaned ( I never shall forget it)", "Of all the days of the year, upon that day.", "For I had then laid wormwood to my dug,", "Sitting in the sun under the dovehouse wall.", "My lord and you were then at Mantua.", "Nay, I do bear a brain. But, as I said,", "When it did taste the wormwood on the nipple", "Of my dug and felt it bitter, pretty fool,", "To see it tetchy and fall out with the dug.", "“ Shake,” quoth the dovehouse. ’Twas no need, I trow,", "To bid me trudge.", "And since that time it is eleven years.", "For then she could stand high-lone. Nay, by th’ rood,", "She could have run and waddled all about,", "For even the day before, she broke her brow,", "And then my husband ( God be with his soul,", "He was a merry man) took up the child.", "“ Yea,” quoth he, “ Dost thou fall upon thy face?", "Thou wilt fall backward when thou hast more wit,", "Wilt thou not, Jule?” And, by my holidam,", "The pretty wretch left crying and said “ Ay.”", "To see now how a jest shall come about!", "I warrant, an I should live a thousand years,", "I never should forget it. “ Wilt thou not, Jule?” quoth he.", "And, pretty fool, it stinted and said “ Ay.”"], "n": "1.3.18"}, {"s": "LADY CAPULET", "l": ["Enough of this. I pray thee, hold thy peace."], "n": "1.3.54"}, {"s": "NURSE", "l": ["Yes, madam, yet I cannot choose but laugh", "To think it should leave crying and say “ Ay.”", "And yet, I warrant, it had upon its brow", "A bump as big as a young cock’rel’s stone,", "A perilous knock, and it cried bitterly.", "“ Yea,” quoth my husband. “ Fall’st upon thy face?", "Thou wilt fall backward when thou comest to age,", "Wilt thou not, Jule?” It stinted and said “ Ay.”"], "n": "1.3.55"}, {"s": "JULIET", "l": ["And stint thou, too, I pray thee, nurse, say I."], "n": "1.3.63"}, {"s": "NURSE", "l": ["Peace. I have done. God mark thee to his grace,", "Thou wast the prettiest babe that e’er I nursed.", "An I might live to see thee married once,", "I have my wish."], "n": "1.3.64"}, {"s": "LADY CAPULET", "l": ["Marry, that “ marry” is the very theme", "I came to talk of.— Tell me, daughter Juliet,", "How stands your disposition to be married?"], "n": "1.3.68"}, {"s": "JULIET", "l": ["It is an honor that I dream not of."], "n": "1.3.71"}, {"s": "NURSE", "l": ["An honor? Were not I thine only nurse,", "I would say thou hadst sucked wisdom from thy teat."], "n": "1.3.72"}, {"s": "LADY CAPULET", "l": ["Well, think of marriage now. Younger than you", "Here in Verona, ladies of esteem,", "Are made already mothers. By my count", "I was your mother much upon these years", "That you are now a maid. Thus, then, in brief:", "The valiant Paris seeks you for his love."], "n": "1.3.75"}, {"s": "NURSE", "l": ["A man, young lady— lady, such a man", "As all the world— why, he’s a man of wax."], "n": "1.3.81"}, {"s": "LADY CAPULET", "l": ["Verona’s summer hath not such a flower."], "n": "1.3.83"}, {"s": "NURSE", "l": ["Nay, he’s a flower, in faith, a very flower."], "n": "1.3.84"}, {"s": "LADY CAPULET", "l": ["What say you? Can you love the gentleman?", "This night you shall behold him at our feast.", "Read o’er the volume of young Paris’ face,", "And find delight writ there with beauty’s pen.", "Examine every married lineament", "And see how one another lends content,", "And what obscured in this fair volume lies", "Find written in the margent of his eyes.", "This precious book of love, this unbound lover,", "To beautify him only lacks a cover.", "The fish lives in the sea, and ’tis much pride", "For fair without the fair within to hide.", "That book in many’s eyes doth share the glory", "That in gold clasps locks in the golden story.", "So shall you share all that he doth possess", "By having him, making yourself no less."], "n": "1.3.85"}, {"s": "NURSE", "l": ["No less? Nay, bigger. Women grow by men."], "n": "1.3.101"}, {"s": "LADY CAPULET", "l": ["Speak briefly. Can you like of Paris’ love?"], "n": "1.3.102"}, {"s": "JULIET", "l": ["I’ll look to like, if looking liking move.", "But no more deep will I endart mine eye", "Than your consent gives strength to make it fly."], "n": "1.3.103"}, {"d": "Enter Servingman."}, {"s": "SERVINGMAN", "l": ["Madam, the guests are come, supper", "served up, you called, my young lady asked for, the", "Nurse cursed in the pantry, and everything in", "extremity. I must hence to wait. I beseech you,", "follow straight."], "n": "1.3.106"}, {"s": "LADY CAPULET", "l": ["We follow thee.", "[Servingman exits.]", "Juliet, the County stays."], "n": "1.3.111"}, {"s": "NURSE", "l": ["Go, girl, seek happy nights to happy days."], "n": "1.3.113"}, {"d": "They exit."}]}, "rom14": {"play": "Romeo and Juliet", "act": 1, "scene": 4, "title": "SCENE IV.  A street.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/romeo-and-juliet/read/1/4/", "first": "1.4.13", "last": "1.4.121", "items": [{"s": "MERCUTIO", "l": ["Nay, gentle Romeo, we must have you dance."], "n": "1.4.13"}, {"s": "ROMEO", "l": ["Not I, believe me. You have dancing shoes", "With nimble soles. I have a soul of lead", "So stakes me to the ground I cannot move."], "n": "1.4.14"}, {"s": "MERCUTIO", "l": ["You are a lover. Borrow Cupid’s wings", "And soar with them above a common bound."], "n": "1.4.17"}, {"s": "ROMEO", "l": ["I am too sore enpiercèd with his shaft", "To soar with his light feathers, and so bound", "I cannot bound a pitch above dull woe.", "Under love’s heavy burden do I sink."], "n": "1.4.19"}, {"s": "MERCUTIO", "l": ["And to sink in it should you burden love—", "Too great oppression for a tender thing."], "n": "1.4.23", "cut": true}, {"s": "ROMEO", "l": ["Is love a tender thing? It is too rough,", "Too rude, too boist’rous, and it pricks like thorn."], "n": "1.4.25", "cut": true}, {"s": "MERCUTIO", "l": ["If love be rough with you, be rough with love.", "Prick love for pricking, and you beat love down.—", "Give me a case to put my visage in.—", "A visor for a visor. What care I", "What curious eye doth cote deformities?", "Here are the beetle brows shall blush for me."], "n": "1.4.27", "cut": true}, {"s": "BENVOLIO", "l": ["Come, knock and enter, and no sooner in", "But every man betake him to his legs."], "n": "1.4.33", "cut": true}, {"s": "ROMEO", "l": ["A torch for me. Let wantons light of heart", "Tickle the senseless rushes with their heels,", "For I am proverbed with a grandsire phrase:", "I’ll be a candle holder and look on;", "The game was ne’er so fair, and I am done."], "n": "1.4.35", "cut": true}, {"s": "MERCUTIO", "l": ["Tut, dun’s the mouse, the constable’s own word.", "If thou art dun, we’ll draw thee from the mire—", "Or, save your reverence, love— wherein thou stickest", "Up to the ears."], "n": "1.4.40", "cut": true}, {"s": "MERCUTIO", "l": ["Come, we burn daylight, ho!"], "n": null}, {"s": "ROMEO", "l": ["Nay, that’s not so."], "n": "1.4.45"}, {"s": "MERCUTIO", "l": ["I mean, sir, in delay", "We waste our lights; in vain, light lights by day.", "Take our good meaning, for our judgment sits", "Five times in that ere once in our five wits."], "n": "1.4.46"}, {"s": "ROMEO", "l": ["And we mean well in going to this masque,", "But ’tis no wit to go."], "n": "1.4.50"}, {"s": "MERCUTIO", "l": ["Why, may one ask?"], "n": "1.4.52"}, {"s": "ROMEO", "l": ["I dreamt a dream tonight."], "n": "1.4.53"}, {"s": "MERCUTIO", "l": ["And so did I."], "n": "1.4.54"}, {"s": "ROMEO", "l": ["Well, what was yours?"], "n": "1.4.55"}, {"s": "MERCUTIO", "l": ["That dreamers often lie."], "n": "1.4.56"}, {"s": "ROMEO", "l": ["In bed asleep while they do dream things true."], "n": "1.4.57"}, {"s": "MERCUTIO", "l": ["O, then I see Queen Mab hath been with you.", "She is the fairies’ midwife, and she comes", "In shape no bigger than an agate stone", "On the forefinger of an alderman,", "Drawn with a team of little atomi", "Over men’s noses as they lie asleep.", "Her wagon spokes made of long spinners’ legs,", "The cover of the wings of grasshoppers,", "Her traces of the smallest spider web,", "Her collars of the moonshine’s wat’ry beams,", "Her whip of cricket’s bone, the lash of film,", "Her wagoner a small gray-coated gnat,", "Not half so big as a round little worm", "Pricked from the lazy finger of a maid.", "Her chariot is an empty hazelnut,", "Made by the joiner squirrel or old grub,", "Time out o’ mind the fairies’ coachmakers.", "And in this state she gallops night by night", "Through lovers’ brains, and then they dream of love;", "On courtiers’ knees, that dream on cur’sies straight;", "O’er lawyers’ fingers, who straight dream on fees;", "O’er ladies’ lips, who straight on kisses dream,", "Which oft the angry Mab with blisters plagues", "Because their breaths with sweetmeats tainted are.", "Sometime she gallops o’er a courtier’s nose,", "And then dreams he of smelling out a suit.", "And sometime comes she with a tithe-pig’s tail,", "Tickling a parson’s nose as he lies asleep;", "Then he dreams of another benefice.", "Sometime she driveth o’er a soldier’s neck,", "And then dreams he of cutting foreign throats,", "Of breaches, ambuscadoes, Spanish blades,", "Of healths five fathom deep, and then anon", "Drums in his ear, at which he starts and wakes", "And, being thus frighted, swears a prayer or two", "And sleeps again. This is that very Mab", "That plats the manes of horses in the night", "And bakes the elflocks in foul sluttish hairs,", "Which once untangled much misfortune bodes.", "This is the hag, when maids lie on their backs,", "That presses them and learns them first to bear,", "Making them women of good carriage.", "This is she—"], "n": "1.4.58"}, {"s": "ROMEO", "l": ["Peace, peace, Mercutio, peace.", "Thou talk’st of nothing."], "n": "1.4.101"}, {"s": "MERCUTIO", "l": ["True, I talk of dreams,", "Which are the children of an idle brain,", "Begot of nothing but vain fantasy,", "Which is as thin of substance as the air", "And more inconstant than the wind, who woos", "Even now the frozen bosom of the north", "And, being angered, puffs away from thence,", "Turning his side to the dew-dropping south."], "n": "1.4.103"}, {"s": "BENVOLIO", "l": ["This wind you talk of blows us from ourselves.", "Supper is done, and we shall come too late."], "n": "1.4.111"}, {"s": "ROMEO", "l": ["I fear too early, for my mind misgives", "Some consequence yet hanging in the stars", "Shall bitterly begin his fearful date", "With this night’s revels, and expire the term", "Of a despisèd life closed in my breast", "By some vile forfeit of untimely death.", "But he that hath the steerage of my course", "Direct my sail. On, lusty gentlemen."], "n": "1.4.113"}, {"s": "BENVOLIO", "l": ["Strike, drum."], "n": "1.4.121"}, {"d": "They march about the stage and then withdraw to the side."}]}, "rom15": {"play": "Romeo and Juliet", "act": 1, "scene": 5, "title": "SCENE V.  A hall in Capulet's house.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/romeo-and-juliet/read/1/5/", "first": "1.5.104", "last": "1.5.122", "items": [{"s": "ROMEO", "l": ["[, taking Juliet’s hand]", "If I profane with my unworthiest hand", "This holy shrine, the gentle sin is this:", "My lips, two blushing pilgrims, ready stand", "To smooth that rough touch with a tender kiss."], "n": "1.5.104"}, {"s": "JULIET", "l": ["Good pilgrim, you do wrong your hand too much,", "Which mannerly devotion shows in this;", "For saints have hands that pilgrims’ hands do touch,", "And palm to palm is holy palmers’ kiss."], "n": "1.5.108"}, {"s": "ROMEO", "l": ["Have not saints lips, and holy palmers too?"], "n": "1.5.112"}, {"s": "JULIET", "l": ["Ay, pilgrim, lips that they must use in prayer."], "n": "1.5.113"}, {"s": "ROMEO", "l": ["O then, dear saint, let lips do what hands do.", "They pray: grant thou, lest faith turn to despair."], "n": "1.5.114"}, {"s": "JULIET", "l": ["Saints do not move, though grant for prayers’ sake."], "n": "1.5.116"}, {"s": "ROMEO", "l": ["Then move not while my prayer’s effect I take.", "[He kisses her.]", "Thus from my lips, by thine, my sin is purged."], "n": "1.5.117"}, {"s": "JULIET", "l": ["Then have my lips the sin that they have took."], "n": "1.5.119"}, {"s": "ROMEO", "l": ["Sin from my lips? O trespass sweetly urged!", "Give me my sin again."], "n": "1.5.120"}, {"d": "He kisses her."}, {"s": "JULIET", "l": ["You kiss by th’ book."], "n": "1.5.122"}]}, "rom22": {"play": "Romeo and Juliet", "act": 2, "scene": 2, "title": "SCENE II.  Capulet's orchard.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/romeo-and-juliet/read/2/2/", "first": "2.2.1", "last": "2.2.205", "items": [{"d": "Romeo comes forward."}, {"s": "ROMEO", "l": ["He jests at scars that never felt a wound.", "[Enter Juliet above.]", "But soft, what light through yonder window breaks?", "It is the East, and Juliet is the sun.", "Arise, fair sun, and kill the envious moon,", "Who is already sick and pale with grief", "That thou, her maid, art far more fair than she.", "Be not her maid since she is envious.", "Her vestal livery is but sick and green,", "And none but fools do wear it. Cast it off.", "It is my lady. O, it is my love!", "O, that she knew she were!", "She speaks, yet she says nothing. What of that?", "Her eye discourses; I will answer it.", "I am too bold. ’Tis not to me she speaks.", "Two of the fairest stars in all the heaven,", "Having some business, do entreat her eyes", "To twinkle in their spheres till they return.", "What if her eyes were there, they in her head?", "The brightness of her cheek would shame those stars", "As daylight doth a lamp; her eye in heaven", "Would through the airy region stream so bright", "That birds would sing and think it were not night.", "See how she leans her cheek upon her hand.", "O, that I were a glove upon that hand,", "That I might touch that cheek!"], "n": "2.2.1"}, {"s": "JULIET", "l": ["Ay me."], "n": "2.2.27"}, {"s": "ROMEO", "l": ["[, aside]", "She speaks.", "O, speak again, bright angel, for thou art", "As glorious to this night, being o’er my head,", "As is a wingèd messenger of heaven", "Unto the white-upturnèd wond’ring eyes", "Of mortals that fall back to gaze on him", "When he bestrides the lazy puffing clouds", "And sails upon the bosom of the air."], "n": "2.2.28"}, {"s": "JULIET", "l": ["O Romeo, Romeo, wherefore art thou Romeo?", "Deny thy father and refuse thy name,", "Or, if thou wilt not, be but sworn my love,", "And I’ll no longer be a Capulet."], "n": "2.2.36"}, {"s": "ROMEO", "l": ["[, aside]", "Shall I hear more, or shall I speak at this?"], "n": "2.2.40"}, {"s": "JULIET", "l": ["’Tis but thy name that is my enemy.", "Thou art thyself, though not a Montague.", "What’s Montague? It is nor hand, nor foot,", "Nor arm, nor face. O, be some other name", "Belonging to a man.", "What’s in a name? That which we call a rose", "By any other word would smell as sweet.", "So Romeo would, were he not Romeo called,", "Retain that dear perfection which he owes", "Without that title. Romeo, doff thy name,", "And, for thy name, which is no part of thee,", "Take all myself."], "n": "2.2.41"}, {"s": "ROMEO", "l": ["I take thee at thy word.", "Call me but love, and I’ll be new baptized.", "Henceforth I never will be Romeo."], "n": "2.2.53"}, {"s": "JULIET", "l": ["What man art thou that, thus bescreened in night,", "So stumblest on my counsel?"], "n": "2.2.56"}, {"s": "ROMEO", "l": ["By a name", "I know not how to tell thee who I am.", "My name, dear saint, is hateful to myself", "Because it is an enemy to thee.", "Had I it written, I would tear the word."], "n": "2.2.58"}, {"s": "JULIET", "l": ["My ears have yet not drunk a hundred words", "Of thy tongue’s uttering, yet I know the sound.", "Art thou not Romeo, and a Montague?"], "n": "2.2.63"}, {"s": "ROMEO", "l": ["Neither, fair maid, if either thee dislike."], "n": "2.2.66"}, {"s": "JULIET", "l": ["How camest thou hither, tell me, and wherefore?", "The orchard walls are high and hard to climb,", "And the place death, considering who thou art,", "If any of my kinsmen find thee here."], "n": "2.2.67"}, {"s": "ROMEO", "l": ["With love’s light wings did I o’erperch these walls,", "For stony limits cannot hold love out,", "And what love can do, that dares love attempt.", "Therefore thy kinsmen are no stop to me."], "n": "2.2.71"}, {"s": "JULIET", "l": ["If they do see thee, they will murder thee."], "n": "2.2.75"}, {"s": "ROMEO", "l": ["Alack, there lies more peril in thine eye", "Than twenty of their swords. Look thou but sweet,", "And I am proof against their enmity."], "n": "2.2.76"}, {"s": "JULIET", "l": ["I would not for the world they saw thee here."], "n": "2.2.79"}, {"s": "ROMEO", "l": ["I have night’s cloak to hide me from their eyes,", "And, but thou love me, let them find me here.", "My life were better ended by their hate", "Than death proroguèd, wanting of thy love."], "n": "2.2.80"}, {"s": "JULIET", "l": ["By whose direction found’st thou out this place?"], "n": "2.2.84"}, {"s": "ROMEO", "l": ["By love, that first did prompt me to inquire.", "He lent me counsel, and I lent him eyes.", "I am no pilot; yet, wert thou as far", "As that vast shore washed with the farthest sea,", "I should adventure for such merchandise."], "n": "2.2.85"}, {"s": "JULIET", "l": ["Thou knowest the mask of night is on my face,", "Else would a maiden blush bepaint my cheek", "For that which thou hast heard me speak tonight.", "Fain would I dwell on form; fain, fain deny", "What I have spoke. But farewell compliment.", "Dost thou love me? I know thou wilt say “ Ay,”", "And I will take thy word. Yet, if thou swear’st,", "Thou mayst prove false. At lovers’ perjuries,", "They say, Jove laughs. O gentle Romeo,", "If thou dost love, pronounce it faithfully.", "Or, if thou thinkest I am too quickly won,", "I’ll frown and be perverse and say thee nay,", "So thou wilt woo, but else not for the world.", "In truth, fair Montague, I am too fond,", "And therefore thou mayst think my havior light.", "But trust me, gentleman, I’ll prove more true", "Than those that have more coying to be strange.", "I should have been more strange, I must confess,", "But that thou overheard’st ere I was ware", "My true-love passion. Therefore pardon me,", "And not impute this yielding to light love,", "Which the dark night hath so discoverèd."], "n": "2.2.90"}, {"s": "ROMEO", "l": ["Lady, by yonder blessèd moon I vow,", "That tips with silver all these fruit-tree tops—"], "n": "2.2.112"}, {"s": "JULIET", "l": ["O, swear not by the moon, th’ inconstant moon,", "That monthly changes in her circled orb,", "Lest that thy love prove likewise variable."], "n": "2.2.114"}, {"s": "ROMEO", "l": ["What shall I swear by?"], "n": "2.2.117"}, {"s": "JULIET", "l": ["Do not swear at all.", "Or, if thou wilt, swear by thy gracious self,", "Which is the god of my idolatry,", "And I’ll believe thee."], "n": "2.2.118"}, {"s": "ROMEO", "l": ["If my heart’s dear love—"], "n": "2.2.122"}, {"s": "JULIET", "l": ["Well, do not swear. Although I joy in thee,", "I have no joy of this contract tonight.", "It is too rash, too unadvised, too sudden,", "Too like the lightning, which doth cease to be", "Ere one can say “ It lightens.” Sweet, good night.", "This bud of love, by summer’s ripening breath,", "May prove a beauteous flower when next we meet.", "Good night, good night. As sweet repose and rest", "Come to thy heart as that within my breast."], "n": "2.2.123"}, {"s": "ROMEO", "l": ["O, wilt thou leave me so unsatisfied?"], "n": "2.2.132"}, {"s": "JULIET", "l": ["What satisfaction canst thou have tonight?"], "n": "2.2.133"}, {"s": "ROMEO", "l": ["Th’ exchange of thy love’s faithful vow for mine."], "n": "2.2.134"}, {"s": "JULIET", "l": ["I gave thee mine before thou didst request it,", "And yet I would it were to give again."], "n": "2.2.135"}, {"s": "ROMEO", "l": ["Wouldst thou withdraw it? For what purpose, love?"], "n": "2.2.137"}, {"s": "JULIET", "l": ["But to be frank and give it thee again.", "And yet I wish but for the thing I have.", "My bounty is as boundless as the sea,", "My love as deep. The more I give to thee,", "The more I have, for both are infinite.", "[Nurse calls from within.]", "I hear some noise within. Dear love, adieu.—", "Anon, good nurse.— Sweet Montague, be true.", "Stay but a little; I will come again."], "n": "2.2.138"}, {"d": "She exits."}, {"s": "ROMEO", "l": ["O blessèd, blessèd night! I am afeard,", "Being in night, all this is but a dream,", "Too flattering sweet to be substantial."], "n": "2.2.146"}, {"d": "Reenter Juliet above."}, {"s": "JULIET", "l": ["Three words, dear Romeo, and good night indeed.", "If that thy bent of love be honorable,", "Thy purpose marriage, send me word tomorrow,", "By one that I’ll procure to come to thee,", "Where and what time thou wilt perform the rite,", "And all my fortunes at thy foot I’ll lay", "And follow thee my lord throughout the world."], "n": "2.2.149"}, {"s": "NURSE", "l": ["[, within]", "Madam."], "n": "2.2.156"}, {"s": "JULIET", "l": ["I come anon.— But if thou meanest not well,", "I do beseech thee—"], "n": "2.2.157"}, {"s": "NURSE", "l": ["[, within]", "Madam."], "n": "2.2.159"}, {"s": "JULIET", "l": ["By and by, I come.—", "To cease thy strife and leave me to my grief.", "Tomorrow will I send."], "n": "2.2.160"}, {"s": "ROMEO", "l": ["So thrive my soul—"], "n": "2.2.163"}, {"s": "JULIET", "l": ["A thousand times good night."], "n": "2.2.164"}, {"d": "She exits."}, {"s": "ROMEO", "l": ["A thousand times the worse to want thy light.", "Love goes toward love as schoolboys from their books,", "But love from love, toward school with heavy looks."], "n": "2.2.165"}, {"d": "Going."}, {"d": "Enter Juliet above again."}, {"s": "JULIET", "l": ["Hist, Romeo, hist! O, for a falc’ner’s voice", "To lure this tassel-gentle back again!", "Bondage is hoarse and may not speak aloud,", "Else would I tear the cave where Echo lies", "And make her airy tongue more hoarse than mine", "With repetition of “ My Romeo!”"], "n": "2.2.169"}, {"s": "ROMEO", "l": ["It is my soul that calls upon my name.", "How silver-sweet sound lovers’ tongues by night,", "Like softest music to attending ears."], "n": "2.2.175"}, {"s": "JULIET", "l": ["Romeo."], "n": "2.2.178"}, {"s": "ROMEO", "l": ["My dear."], "n": "2.2.179"}, {"s": "JULIET", "l": ["What o’clock tomorrow", "Shall I send to thee?"], "n": "2.2.180"}, {"s": "ROMEO", "l": ["By the hour of nine."], "n": "2.2.182"}, {"s": "JULIET", "l": ["I will not fail. ’Tis twenty year till then.", "I have forgot why I did call thee back."], "n": "2.2.183"}, {"s": "ROMEO", "l": ["Let me stand here till thou remember it."], "n": "2.2.185"}, {"s": "JULIET", "l": ["I shall forget, to have thee still stand there,", "Rememb’ring how I love thy company."], "n": "2.2.186"}, {"s": "ROMEO", "l": ["And I’ll still stay, to have thee still forget,", "Forgetting any other home but this."], "n": "2.2.188"}, {"s": "JULIET", "l": ["’Tis almost morning. I would have thee gone,", "And yet no farther than a wanton’s bird,", "That lets it hop a little from his hand,", "Like a poor prisoner in his twisted gyves,", "And with a silken thread plucks it back again,", "So loving-jealous of his liberty."], "n": "2.2.190"}, {"s": "ROMEO", "l": ["I would I were thy bird."], "n": "2.2.196"}, {"s": "JULIET", "l": ["Sweet, so would I.", "Yet I should kill thee with much cherishing.", "Good night, good night. Parting is such sweet sorrow", "That I shall say “ Good night” till it be morrow."], "n": "2.2.197"}, {"d": "She exits."}, {"s": "ROMEO", "l": ["Sleep dwell upon thine eyes, peace in thy breast.", "Would I were sleep and peace so sweet to rest.", "Hence will I to my ghostly friar’s close cell,", "His help to crave, and my dear hap to tell."], "n": "2.2.202"}, {"d": "He exits."}]}, "rom53": {"play": "Romeo and Juliet", "act": 5, "scene": 3, "title": "SCENE III.  A churchyard; in it a monument belonging to the Capulets.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/romeo-and-juliet/read/5/3/", "first": "5.3.74", "last": "5.3.175", "items": [{"s": "ROMEO", "l": ["In faith, I will.— Let me peruse this face.", "Mercutio’s kinsman, noble County Paris!", "What said my man when my betossèd soul", "Did not attend him as we rode? I think", "He told me Paris should have married Juliet.", "Said he not so? Or did I dream it so?", "Or am I mad, hearing him talk of Juliet,", "To think it was so?— O, give me thy hand,", "One writ with me in sour misfortune’s book!", "I’ll bury thee in a triumphant grave.—", "[He opens the tomb.]", "A grave? O, no. A lantern, slaughtered youth,", "For here lies Juliet, and her beauty makes", "This vault a feasting presence full of light.—", "Death, lie thou there, by a dead man interred.", "[Laying Paris in the tomb.]"], "n": "5.3.74", "cut": true}, {"s": "ROMEO", "l": ["How oft when men are at the point of death", "Have they been merry, which their keepers call", "A light’ning before death! O, how may I", "Call this a light’ning?— O my love, my wife,", "Death, that hath sucked the honey of thy breath,", "Hath had no power yet upon thy beauty.", "Thou art not conquered. Beauty’s ensign yet", "Is crimson in thy lips and in thy cheeks,", "And death’s pale flag is not advancèd there.—", "Tybalt, liest thou there in thy bloody sheet?", "O, what more favor can I do to thee", "Than with that hand that cut thy youth in twain", "To sunder his that was thine enemy?", "Forgive me, cousin.— Ah, dear Juliet,", "Why art thou yet so fair? Shall I believe", "That unsubstantial death is amorous,", "And that the lean abhorrèd monster keeps", "Thee here in dark to be his paramour?", "For fear of that I still will stay with thee", "And never from this palace of dim night", "Depart again. Here, here will I remain", "With worms that are thy chambermaids. O, here", "Will I set up my everlasting rest", "And shake the yoke of inauspicious stars", "From this world-wearied flesh! Eyes, look your last.", "Arms, take your last embrace. And, lips, O, you", "The doors of breath, seal with a righteous kiss", "A dateless bargain to engrossing death.", "[Kissing Juliet.]", "Come, bitter conduct, come, unsavory guide!", "Thou desperate pilot, now at once run on", "The dashing rocks thy seasick weary bark!", "Here’s to my love. Drinking. O true apothecary,", "Thy drugs are quick. Thus with a kiss I die."], "n": null}, {"d": "He dies."}, {"d": "Enter Friar Lawrence with lantern, crow, and spade."}, {"s": "FRIAR LAWRENCE", "l": ["Saint Francis be my speed! How oft tonight", "Have my old feet stumbled at graves!— Who’s there?"], "n": "5.3.121", "cut": true}, {"s": "BALTHASAR", "l": ["Here’s one, a friend, and one that knows you well."], "n": "5.3.123", "cut": true}, {"s": "FRIAR LAWRENCE", "l": ["Bliss be upon you. Tell me, good my friend,", "What torch is yond that vainly lends his light", "To grubs and eyeless skulls? As I discern,", "It burneth in the Capels’ monument."], "n": "5.3.124", "cut": true}, {"s": "BALTHASAR", "l": ["It doth so, holy sir, and there’s my master,", "One that you love."], "n": "5.3.128", "cut": true}, {"s": "FRIAR LAWRENCE", "l": ["Who is it?"], "n": "5.3.130", "cut": true}, {"s": "BALTHASAR", "l": ["Romeo."], "n": "5.3.131", "cut": true}, {"s": "FRIAR LAWRENCE", "l": ["How long hath he been there?"], "n": "5.3.132", "cut": true}, {"s": "BALTHASAR", "l": ["Full half an hour."], "n": "5.3.133", "cut": true}, {"s": "FRIAR LAWRENCE", "l": ["Go with me to the vault."], "n": "5.3.134", "cut": true}, {"s": "BALTHASAR", "l": ["I dare not, sir.", "My master knows not but I am gone hence,", "And fearfully did menace me with death", "If I did stay to look on his intents."], "n": "5.3.135", "cut": true}, {"s": "FRIAR LAWRENCE", "l": ["Stay, then. I’ll go alone. Fear comes upon me.", "O, much I fear some ill unthrifty thing."], "n": "5.3.139", "cut": true}, {"s": "BALTHASAR", "l": ["As I did sleep under this yew tree here,", "I dreamt my master and another fought,", "And that my master slew him."], "n": "5.3.141", "cut": true}, {"s": "FRIAR LAWRENCE", "l": ["[, moving toward the tomb]", "Romeo!—", "Alack, alack, what blood is this which stains", "The stony entrance of this sepulcher?", "What mean these masterless and gory swords", "To lie discolored by this place of peace?", "Romeo! O, pale! Who else? What, Paris too?", "And steeped in blood? Ah, what an unkind hour", "Is guilty of this lamentable chance!", "The lady stirs."], "n": "5.3.144"}, {"s": "JULIET", "l": ["O comfortable friar, where is my lord?", "I do remember well where I should be,", "And there I am. Where is my Romeo?"], "n": "5.3.153"}, {"s": "FRIAR LAWRENCE", "l": ["I hear some noise.— Lady, come from that nest", "Of death, contagion, and unnatural sleep.", "A greater power than we can contradict", "Hath thwarted our intents. Come, come away.", "Thy husband in thy bosom there lies dead,", "And Paris, too. Come, I’ll dispose of thee", "Among a sisterhood of holy nuns.", "Stay not to question, for the watch is coming.", "Come, go, good Juliet. I dare no longer stay."], "n": "5.3.156"}, {"s": "JULIET", "l": ["Go, get thee hence, for I will not away.", "[He exits.]", "What’s here? A cup closed in my true love’s hand?", "Poison, I see, hath been his timeless end.—", "O churl, drunk all, and left no friendly drop", "To help me after! I will kiss thy lips.", "Haply some poison yet doth hang on them,", "To make me die with a restorative.", "[She kisses him.]", "Thy lips are warm!"], "n": "5.3.165"}, {"d": "Enter Paris’s Page and Watch."}, {"s": "FIRST WATCH", "l": ["Lead, boy. Which way?"], "n": "5.3.173", "cut": true}, {"s": "JULIET", "l": ["Yea, noise? Then I’ll be brief. O, happy dagger,", "This is thy sheath. There rust, and let me die."], "n": "5.3.174"}, {"d": "She takes Romeo’s dagger, stabs herself, and dies."}]}};

const SCRIPT_NOTE={rom15:"Source for the party mosaic: Romeo and Juliet's shared sonnet and the kiss.",mac11:"Source for the witches' ritual: the opening scene of the play, performed as a ritual.",ham47:"Source for Ophelia's water: Gertrude's 'There is a willow' speech.",ham52:"Source for the Hamlet vs Laertes duel.",mnd21:"Covers two pieces: Oberon & Titania, and Helena & Demetrius.",mnd41:"Our cut runs from the hunting horns to the lovers' exit. Theseus, Hippolyta and Egeus are not cast yet: double them or trim their lines.",ham31:"Our cut: from 'To be or not to be' (marked cut) to the end of Ophelia's 'O, what a noble mind'.",rom14:"Our cut: from Mercutio's 'Nay, gentle Romeo' to Benvolio's 'Strike, drum' (the end of the scene). Speeches marked Cut are Chris's internal cuts.",rom53:"Our cut: from Romeo's 'How oft when men are at the point of death' to Juliet's death. Paris is cut, so the scene opens on Romeo alone in the tomb; the Friar's exchange with Balthasar is marked Cut.",rom22:"The whole balcony scene for now, from 'He jests at scars' to Romeo's exit. The Nurse only calls from offstage ('Madam!').",rom11:"Our cut: from Benvolio's 'Good morrow, cousin' to the end of the scene."};
