l": ["I’ll warrant you. Fear me not. Withdraw,", "I hear him coming."], "n": "3.4.9"}, {"d": "Polonius hides behind the arras."}, {"d": "Enter Hamlet."}, {"s": "HAMLET", "l": ["Now, mother, what’s the matter?"], "n": "3.4.11"}, {"s": "QUEEN", "l": ["Hamlet, thou hast thy father much offended."], "n": "3.4.12"}, {"s": "HAMLET", "l": ["Mother, you have my father much offended."], "n": "3.4.13"}, {"s": "QUEEN", "l": ["Come, come, you answer with an idle tongue."], "n": "3.4.14"}, {"s": "HAMLET", "l": ["Go, go, you question with a wicked tongue."], "n": "3.4.15"}, {"s": "QUEEN", "l": ["Why, how now, Hamlet?"], "n": "3.4.16"}, {"s": "HAMLET", "l": ["What’s the matter now?"], "n": "3.4.17"}, {"s": "QUEEN", "l": ["Have you forgot me?"], "n": "3.4.18"}, {"s": "HAMLET", "l": ["No, by the rood, not so.", "You are the Queen, your husband’s brother’s wife,", "And ( would it were not so) you are my mother."], "n": "3.4.19"}, {"s": "QUEEN", "l": ["Nay, then I’ll set those to you that can speak."], "n": "3.4.22"}, {"s": "HAMLET", "l": ["Come, come, and sit you down; you shall not budge.", "You go not till I set you up a glass", "Where you may see the inmost part of you."], "n": "3.4.23"}, {"s": "QUEEN", "l": ["What wilt thou do? Thou wilt not murder me?", "Help, ho!"], "n": "3.4.26"}, {"s": "POLONIUS", "l": ["[, behind the arras]", "What ho! Help!"], "n": "3.4.28"}, {"s": "HAMLET", "l": ["How now, a rat? Dead for a ducat, dead."], "n": "3.4.29"}, {"d": "He kills Polonius by thrusting a rapier through the arras."}, {"s": "POLONIUS", "l": ["[, behind the arras]", "O, I am slain!"], "n": "3.4.30"}, {"s": "QUEEN", "l": ["O me, what hast thou done?"], "n": "3.4.31"}, {"s": "HAMLET", "l": ["Nay, I know not. Is it the King?"], "n": "3.4.32"}, {"s": "QUEEN", "l": ["O, what a rash and bloody deed is this!"], "n": "3.4.33"}, {"s": "HAMLET", "l": ["A bloody deed— almost as bad, good mother,", "As kill a king and marry with his brother."], "n": "3.4.34"}, {"s": "QUEEN", "l": ["As kill a king?"], "n": "3.4.36"}, {"s": "HAMLET", "l": ["Ay, lady, it was my word.", "[He pulls Polonius’ body from behind the arras.]", "Thou wretched, rash, intruding fool, farewell.", "I took thee for thy better. Take thy fortune.", "Thou find’st to be too busy is some danger.", "To Queen. Leave wringing of your hands. Peace, sit you down,", "And let me wring your heart; for so I shall", "If it be made of penetrable stuff,", "If damnèd custom have not brazed it so", "That it be proof and bulwark against sense."], "n": "3.4.37"}, {"s": "QUEEN", "l": ["What have I done, that thou dar’st wag thy tongue", "In noise so rude against me?"], "n": "3.4.47"}, {"s": "HAMLET", "l": ["Such an act", "That blurs the grace and blush of modesty,", "Calls virtue hypocrite, takes off the rose", "From the fair forehead of an innocent love", "And sets a blister there, makes marriage vows", "As false as dicers’ oaths— O, such a deed", "As from the body of contraction plucks", "The very soul, and sweet religion makes", "A rhapsody of words! Heaven’s face does glow", "O’er this solidity and compound mass", "With heated visage, as against the doom,", "Is thought-sick at the act."], "n": "3.4.49"}, {"s": "QUEEN", "l": ["Ay me, what act", "That roars so loud and thunders in the index?"], "n": "3.4.61"}, {"s": "HAMLET", "l": ["Look here upon this picture and on this,", "The counterfeit presentment of two brothers.", "See what a grace was seated on this brow,", "Hyperion’s curls, the front of Jove himself,", "An eye like Mars’ to threaten and command,", "A station like the herald Mercury", "New-lighted on a heaven-kissing hill,", "A combination and a form indeed", "Where every god did seem to set his seal", "To give the world assurance of a man.", "This was your husband. Look you now what follows.", "Here is your husband, like a mildewed ear", "Blasting his wholesome brother. Have you eyes?", "Could you on this fair mountain leave to feed", "And batten on this moor? Ha! Have you eyes?", "You cannot call it love, for at your age", "The heyday in the blood is tame, it’s humble", "And waits upon the judgment; and what judgment", "Would step from this to this? Sense sure you have,", "Else could you not have motion; but sure that sense", "Is apoplexed; for madness would not err,", "Nor sense to ecstasy was ne’er so thralled,", "But it reserved some quantity of choice", "To serve in such a difference. What devil was ’t", "That thus hath cozened you at hoodman-blind?", "Eyes without feeling, feeling without sight,", "Ears without hands or eyes, smelling sans all,", "Or but a sickly part of one true sense", "Could not so mope. O shame, where is thy blush?", "Rebellious hell,", "If thou canst mutine in a matron’s bones,", "To flaming youth let virtue be as wax", "And melt in her own fire. Proclaim no shame", "When the compulsive ardor gives the charge,", "Since frost itself as actively doth burn,", "And reason panders will."], "n": "3.4.63"}, {"s": "QUEEN", "l": ["O Hamlet, speak no more!", "Thou turn’st my eyes into my very soul,", "And there I see such black and grainèd spots", "As will not leave their tinct."], "n": "3.4.99"}, {"s": "HAMLET", "l": ["Nay, but to live", "In the rank sweat of an enseamèd bed,", "Stewed in corruption, honeying and making love", "Over the nasty sty!"], "n": "3.4.103"}, {"s": "QUEEN", "l": ["O, speak to me no more!", "These words like daggers enter in my ears.", "No more, sweet Hamlet!"], "n": "3.4.107"}, {"s": "HAMLET", "l": ["A murderer and a villain,", "A slave that is not twentieth part the tithe", "Of your precedent lord; a vice of kings,", "A cutpurse of the empire and the rule,", "That from a shelf the precious diadem stole", "And put it in his pocket—"], "n": "3.4.110"}, {"s": "QUEEN", "l": ["No more!"], "n": "3.4.116"}, {"s": "HAMLET", "l": ["A king of shreds and patches—", "[Enter Ghost.]", "Save me and hover o’er me with your wings,", "You heavenly guards!— What would your gracious figure?"], "n": "3.4.117"}, {"s": "QUEEN", "l": ["Alas, he’s mad."], "n": "3.4.121"}, {"s": "HAMLET", "l": ["Do you not come your tardy son to chide,", "That, lapsed in time and passion, lets go by", "Th’ important acting of your dread command?", "O, say!"], "n": "3.4.122"}, {"s": "GHOST", "l": ["Do not forget. This visitation", "Is but to whet thy almost blunted purpose.", "But look, amazement on thy mother sits.", "O, step between her and her fighting soul.", "Conceit in weakest bodies strongest works.", "Speak to her, Hamlet."], "n": "3.4.126"}, {"s": "HAMLET", "l": ["How is it with you, lady?"], "n": "3.4.132"}, {"s": "QUEEN", "l": ["Alas, how is ’t with you,", "That you do bend your eye on vacancy", "And with th’ incorporal air do hold discourse?", "Forth at your eyes your spirits wildly peep,", "And, as the sleeping soldiers in th’ alarm,", "Your bedded hair, like life in excrements,", "Start up and stand an end. O gentle son,", "Upon the heat and flame of thy distemper", "Sprinkle cool patience! Whereon do you look?"], "n": "3.4.133"}, {"s": "HAMLET", "l": ["On him, on him! Look you how pale he glares.", "His form and cause conjoined, preaching to stones,", "Would make them capable. To the Ghost. Do not look upon me,", "Lest with this piteous action you convert", "My stern effects. Then what I have to do", "Will want true color— tears perchance for blood."], "n": "3.4.142"}, {"s": "QUEEN", "l": ["To whom do you speak this?"], "n": "3.4.149"}, {"s": "HAMLET", "l": ["Do you see nothing there?"], "n": "3.4.150"}, {"s": "QUEEN", "l": ["Nothing at all; yet all that is I see."], "n": "3.4.151"}, {"s": "HAMLET", "l": ["Nor did you nothing hear?"], "n": "3.4.152"}, {"s": "QUEEN", "l": ["No, nothing but ourselves."], "n": "3.4.153"}, {"s": "HAMLET", "l": ["Why, look you there, look how it steals away!", "My father, in his habit as he lived!", "Look where he goes even now out at the portal!"], "n": "3.4.154"}, {"d": "Ghost exits."}, {"s": "QUEEN", "l": ["This is the very coinage of your brain.", "This bodiless creation ecstasy", "Is very cunning in."], "n": "3.4.157"}, {"s": "HAMLET", "l": ["Ecstasy?", "My pulse as yours doth temperately keep time", "And makes as healthful music. It is not madness", "That I have uttered. Bring me to the test,", "And I the matter will reword, which madness", "Would gambol from. Mother, for love of grace,", "Lay not that flattering unction to your soul", "That not your trespass but my madness speaks.", "It will but skin and film the ulcerous place,", "Whiles rank corruption, mining all within,", "Infects unseen. Confess yourself to heaven,", "Repent what’s past, avoid what is to come,", "And do not spread the compost on the weeds", "To make them ranker. Forgive me this my virtue,", "For, in the fatness of these pursy times,", "Virtue itself of vice must pardon beg,", "Yea, curb and woo for leave to do him good."], "n": "3.4.160"}, {"s": "QUEEN", "l": ["O Hamlet, thou hast cleft my heart in twain!"], "n": "3.4.177"}, {"s": "HAMLET", "l": ["O, throw away the worser part of it,", "And live the purer with the other half!", "Good night. But go not to my uncle’s bed.", "Assume a virtue if you have it not.", "That monster, custom, who all sense doth eat,", "Of habits devil, is angel yet in this,", "That to the use of actions fair and good", "He likewise gives a frock or livery", "That aptly is put on. Refrain tonight,", "And that shall lend a kind of easiness", "To the next abstinence, the next more easy;", "For use almost can change the stamp of nature", "And either the devil or throw him out", "With wondrous potency. Once more, good night,", "And, when you are desirous to be blest,", "I’ll blessing beg of you. For this same lord", "[Pointing to Polonius.]", "I do repent; but heaven hath pleased it so", "To punish me with this and this with me,", "That I must be their scourge and minister.", "I will bestow him and will answer well", "The death I gave him. So, again, good night.", "I must be cruel only to be kind.", "This bad begins, and worse remains behind.", "One word more, good lady."], "n": "3.4.178"}, {"s": "QUEEN", "l": ["What shall I do?"], "n": "3.4.202"}, {"s": "HAMLET", "l": ["Not this by no means that I bid you do:", "Let the bloat king tempt you again to bed,", "Pinch wanton on your cheek, call you his mouse,", "And let him, for a pair of reechy kisses", "Or paddling in your neck with his damned fingers,", "Make you to ravel all this matter out", "That I essentially am not in madness,", "But mad in craft. ’Twere good you let him know,", "For who that’s but a queen, fair, sober, wise,", "Would from a paddock, from a bat, a gib,", "Such dear concernings hide? Who would do so?", "No, in despite of sense and secrecy,", "Unpeg the basket on the house’s top,", "Let the birds fly, and like the famous ape,", "To try conclusions, in the basket creep", "And break your own neck down."], "n": "3.4.203"}, {"s": "QUEEN", "l": ["Be thou assured, if words be made of breath", "And breath of life, I have no life to breathe", "What thou hast said to me."], "n": "3.4.219"}, {"s": "HAMLET", "l": ["I must to England, you know that."], "n": "3.4.222"}, {"s": "QUEEN", "l": ["Alack,", "I had forgot! ’Tis so concluded on."], "n": "3.4.223"}, {"s": "HAMLET", "l": ["There’s letters sealed; and my two schoolfellows,", "Whom I will trust as I will adders fanged,", "They bear the mandate; they must sweep my way", "And marshal me to knavery. Let it work,", "For ’tis the sport to have the enginer", "Hoist with his own petard; and ’t shall go hard", "But I will delve one yard below their mines", "And blow them at the moon. O, ’tis most sweet", "When in one line two crafts directly meet.", "This man shall set me packing.", "I’ll lug the guts into the neighbor room.", "Mother, good night indeed. This counselor", "Is now most still, most secret, and most grave,", "Who was in life a foolish prating knave.—", "Come, sir, to draw toward an end with you.—", "Good night, mother."], "n": "3.4.225"}, {"d": "They exit, Hamlet tugging in Polonius."}]}, "ham45": {"play": "Hamlet", "act": 4, "scene": 5, "title": "SCENE V.  Elsinore. A room in the castle.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/hamlet/read/4/5/", "first": "4.5.1", "last": "4.5.245", "items": [{"d": "Enter Horatio, Queen, and a Gentleman."}, {"s": "QUEEN", "l": ["I will not speak with her."], "n": "4.5.1"}, {"s": "GENTLEMAN", "l": ["She is importunate,", "Indeed distract; her mood will needs be pitied."], "n": "4.5.2"}, {"s": "QUEEN", "l": ["What would she have?"], "n": "4.5.4"}, {"s": "GENTLEMAN", "l": ["She speaks much of her father, says she hears", "There’s tricks i’ th’ world, and hems, and beats her heart,", "Spurns enviously at straws, speaks things in doubt", "That carry but half sense. Her speech is nothing,", "Yet the unshapèd use of it doth move", "The hearers to collection. They aim at it", "And botch the words up fit to their own thoughts;", "Which, as her winks and nods and gestures yield them,", "Indeed would make one think there might be thought,", "Though nothing sure, yet much unhappily."], "n": "4.5.5"}, {"s": "HORATIO", "l": ["’Twere good she were spoken with, for she may strew", "Dangerous conjectures in ill-breeding minds."], "n": "4.5.18"}, {"s": "QUEEN", "l": ["Let her come in.", "[Gentleman exits.]", "Aside. To my sick soul ( as sin’s true nature is),", "Each toy seems prologue to some great amiss.", "So full of artless jealousy is guilt,", "It spills itself in fearing to be spilt."], "n": "4.5.21"}, {"d": "Enter Ophelia distracted."}, {"s": "OPHELIA", "l": ["Where is the beauteous Majesty of Denmark?"], "n": "4.5.26"}, {"s": "QUEEN", "l": ["How now, Ophelia?"], "n": "4.5.27"}, {"s": "OPHELIA", "l": ["[sings]", "How should I your true love know", "From another one?", "By his cockle hat and staff", "And his sandal shoon."], "n": "4.5.28"}, {"s": "QUEEN", "l": ["Alas, sweet lady, what imports this song?"], "n": "4.5.32"}, {"s": "OPHELIA", "l": ["Say you? Nay, pray you, mark.", "[Sings.]", "He is dead and gone, lady,", "He is dead and gone;", "At his head a grass-green turf,", "At his heels a stone.", "Oh, ho!"], "n": "4.5.33"}, {"s": "QUEEN", "l": ["Nay, but Ophelia—"], "n": "4.5.39"}, {"s": "OPHELIA", "l": ["Pray you, mark.", "[Sings.]", "White his shroud as the mountain snow—"], "n": "4.5.40"}, {"d": "Enter King."}, {"s": "QUEEN", "l": ["Alas, look here, my lord."], "n": "4.5.42"}, {"s": "OPHELIA", "l": ["[sings]", "Larded all with sweet flowers;", "Which bewept to the ground did not go", "With true-love showers."], "n": "4.5.43"}, {"s": "KING", "l": ["How do you, pretty lady?"], "n": "4.5.46"}, {"s": "OPHELIA", "l": ["Well, God dild you. They say the owl was a", "baker’s daughter. Lord, we know what we are but", "know not what we may be. God be at your table."], "n": "4.5.47"}, {"s": "KING", "l": ["Conceit upon her father."], "n": "4.5.50"}, {"s": "OPHELIA", "l": ["Pray let’s have no words of this, but when", "they ask you what it means, say you this:", "[Sings.]", "Tomorrow is Saint Valentine’s day,", "All in the morning betime,", "And I a maid at your window,", "To be your Valentine.", "Then up he rose and donned his clothes", "And dupped the chamber door,", "Let in the maid, that out a maid", "Never departed more."], "n": "4.5.51"}, {"s": "KING", "l": ["Pretty Ophelia—"], "n": "4.5.61"}, {"s": "OPHELIA", "l": ["Indeed, without an oath, I’ll make an end on ’t:", "[Sings.]", "By Gis and by Saint Charity,", "Alack and fie for shame,", "Young men will do ’t, if they come to ’t;", "By Cock, they are to blame.", "Quoth she “ Before you tumbled me,", "You promised me to wed.”", "He answers:", "“ So would I ’a done, by yonder sun,", "An thou hadst not come to my bed.”"], "n": "4.5.62"}, {"s": "KING", "l": ["How long hath she been thus?"], "n": "4.5.72"}, {"s": "OPHELIA", "l": ["I hope all will be well. We must be patient,", "but I cannot choose but weep to think they would", "lay him i’ th’ cold ground. My brother shall know of", "it. And so I thank you for your good counsel. Come,", "my coach! Good night, ladies, good night, sweet", "ladies, good night, good night."], "n": "4.5.73"}, {"d": "She exits."}, {"s": "KING", "l": ["Follow her close; give her good watch, I pray you.", "[Horatio exits.]", "O, this is the poison of deep grief. It springs", "All from her father’s death, and now behold!", "O Gertrude, Gertrude,", "When sorrows come, they come not single spies,", "But in battalions: first, her father slain;", "Next, your son gone, and he most violent author", "Of his own just remove; the people muddied,", "Thick, and unwholesome in their thoughts and whispers", "For good Polonius’ death, and we have done but greenly", "In hugger-mugger to inter him; poor Ophelia", "Divided from herself and her fair judgment,", "Without the which we are pictures or mere beasts;", "Last, and as much containing as all these,", "Her brother is in secret come from France,", "Feeds on his wonder, keeps himself in clouds,", "And wants not buzzers to infect his ear", "With pestilent speeches of his father’s death,", "Wherein necessity, of matter beggared,", "Will nothing stick our person to arraign", "In ear and ear. O, my dear Gertrude, this,", "Like to a murd’ring piece, in many places", "Gives me superfluous death."], "n": "4.5.79"}, {"d": "A noise within."}, {"s": "QUEEN", "l": ["Alack, what noise is this?"], "n": "4.5.104"}, {"s": "KING", "l": ["Attend!", "Where is my Switzers? Let them guard the door.", "[Enter a Messenger.]", "What is the matter?"], "n": "4.5.105"}, {"s": "MESSENGER", "l": ["Save yourself, my lord.", "The ocean, overpeering of his list,", "Eats not the flats with more impiteous haste", "Than young Laertes, in a riotous head,", "O’erbears your officers. The rabble call him “ lord,”", "And, as the world were now but to begin,", "Antiquity forgot, custom not known,", "The ratifiers and props of every word,", "They cry “ Choose we, Laertes shall be king!”", "Caps, hands, and tongues applaud it to the clouds,", "“ Laertes shall be king! Laertes king!”"], "n": "4.5.108"}, {"d": "A noise within."}, {"s": "QUEEN", "l": ["How cheerfully on the false trail they cry.", "O, this is counter, you false Danish dogs!"], "n": "4.5.119"}, {"s": "KING", "l": ["The doors are broke."], "n": "4.5.121"}, {"d": "Enter Laertes with others."}, {"s": "LAERTES", "l": ["Where is this king?— Sirs, stand you all without."], "n": "4.5.122"}, {"s": "ALL", "l": ["No, let’s come in!"], "n": "4.5.123"}, {"s": "LAERTES", "l": ["I pray you, give me leave."], "n": "4.5.124"}, {"s": "ALL", "l": ["We will, we will."], "n": "4.5.125"}, {"s": "LAERTES", "l": ["I thank you. Keep the door. Followers exit. O, thou vile king,", "Give me my father!"], "n": "4.5.126"}, {"s": "QUEEN", "l": ["Calmly, good Laertes."], "n": "4.5.129"}, {"s": "LAERTES", "l": ["That drop of blood that’s calm proclaims me bastard,", "Cries “ cuckold” to my father, brands the harlot", "Even here between the chaste unsmirchèd brow", "Of my true mother."], "n": "4.5.130"}, {"s": "KING", "l": ["What is the cause, Laertes,", "That thy rebellion looks so giant-like?—", "Let him go, Gertrude. Do not fear our person.", "There’s such divinity doth hedge a king", "That treason can but peep to what it would,", "Acts little of his will.— Tell me, Laertes,", "Why thou art thus incensed.— Let him go, Gertrude.—", "Speak, man."], "n": "4.5.135"}, {"s": "LAERTES", "l": ["Where is my father?"], "n": "4.5.144"}, {"s": "KING", "l": ["Dead."], "n": "4.5.145"}, {"s": "QUEEN", "l": ["But not by him."], "n": "4.5.146"}, {"s": "KING", "l": ["Let him demand his fill."], "n": "4.5.147"}, {"s": "LAERTES", "l": ["How came he dead? I’ll not be juggled with.", "To hell, allegiance! Vows, to the blackest devil!", "Conscience and grace, to the profoundest pit!", "I dare damnation. To this point I stand,", "That both the worlds I give to negligence,", "Let come what comes, only I’ll be revenged", "Most throughly for my father."], "n": "4.5.148"}, {"s": "KING", "l": ["Who shall stay you?"], "n": "4.5.155"}, {"s": "LAERTES", "l": ["My will, not all the world.", "And for my means, I’ll husband them so well", "They shall go far with little."], "n": "4.5.156"}, {"s": "KING", "l": ["Good Laertes,", "If you desire to know the certainty", "Of your dear father, is ’t writ in your revenge", "That, swoopstake, you will draw both friend and foe,", "Winner and loser?"], "n": "4.5.159"}, {"s": "LAERTES", "l": ["None but his enemies."], "n": "4.5.165"}, {"s": "KING", "l": ["Will you know them, then?"], "n": "4.5.166"}, {"s": "LAERTES", "l": ["To his good friends thus wide I’ll ope my arms", "And, like the kind life-rend’ring pelican,", "Repast them with my blood."], "n": "4.5.167"}, {"s": "KING", "l": ["Why, now you speak", "Like a good child and a true gentleman.", "That I am guiltless of your father’s death", "And am most sensibly in grief for it,", "It shall as level to your judgment ’pear", "As day does to your eye."], "n": "4.5.170"}, {"d": "A noise within: “ Let her come in!”"}, {"s": "LAERTES", "l": ["How now, what noise is that?", "[Enter Ophelia.]", "O heat, dry up my brains! Tears seven times salt", "Burn out the sense and virtue of mine eye!", "By heaven, thy madness shall be paid with weight", "Till our scale turn the beam! O rose of May,", "Dear maid, kind sister, sweet Ophelia!", "O heavens, is ’t possible a young maid’s wits", "Should be as mortal as an old man’s life?", "Nature is fine in love, and, where ’tis fine,", "It sends some precious instance of itself", "After the thing it loves."], "n": "4.5.177"}, {"s": "OPHELIA", "l": ["[sings]", "They bore him barefaced on the bier,", "Hey non nonny, nonny, hey nonny,", "And in his grave rained many a tear.", "Fare you well, my dove."], "n": "4.5.188"}, {"s": "LAERTES", "l": ["Hadst thou thy wits and didst persuade revenge,", "It could not move thus."], "n": "4.5.192"}, {"s": "OPHELIA", "l": ["You must sing “ A-down a-down”— and you", "“ Call him a-down-a.”— O, how the wheel becomes", "it! It is the false steward that stole his master’s", "daughter."], "n": "4.5.194"}, {"s": "LAERTES", "l": ["This nothing’s more than matter."], "n": "4.5.198"}, {"s": "OPHELIA", "l": ["There’s rosemary, that’s for remembrance.", "Pray you, love, remember. And there is pansies,", "that’s for thoughts."], "n": "4.5.199"}, {"s": "LAERTES", "l": ["A document in madness: thoughts and remembrance", "fitted."], "n": "4.5.202"}, {"s": "OPHELIA", "l": ["There’s fennel for you, and columbines.", "There’s rue for you, and here’s some for me; we", "may call it herb of grace o’ Sundays. You must wear", "your rue with a difference. There’s a daisy. I would", "give you some violets, but they withered all when", "my father died. They say he made a good end.", "Sings. For bonny sweet Robin is all my joy."], "n": "4.5.204"}, {"s": "LAERTES", "l": ["Thought and afflictions, passion, hell itself", "She turns to favor and to prettiness."], "n": "4.5.211"}, {"s": "OPHELIA", "l": ["[sings]", "And will he not come again?", "And will he not come again?", "No, no, he is dead.", "Go to thy deathbed.", "He never will come again.", "His beard was as white as snow,", "All flaxen was his poll.", "He is gone, he is gone,", "And we cast away moan.", "God ’a mercy on his soul.", "And of all Christians’ souls, I pray God. God be wi’", "you."], "n": "4.5.213"}, {"d": "She exits."}, {"s": "LAERTES", "l": ["Do you see this, O God?"], "n": "4.5.225"}, {"s": "KING", "l": ["Laertes, I must commune with your grief,", "Or you deny me right. Go but apart,", "Make choice of whom your wisest friends you will,", "And they shall hear and judge ’twixt you and me.", "If by direct or by collateral hand", "They find us touched, we will our kingdom give,", "Our crown, our life, and all that we call ours,", "To you in satisfaction; but if not,", "Be you content to lend your patience to us,", "And we shall jointly labor with your soul", "To give it due content."], "n": "4.5.226"}, {"s": "LAERTES", "l": ["Let this be so.", "His means of death, his obscure funeral", "( No trophy, sword, nor hatchment o’er his bones,", "No noble rite nor formal ostentation)", "Cry to be heard, as ’twere from heaven to earth,", "That I must call ’t in question."], "n": "4.5.237"}, {"s": "KING", "l": ["So you shall,", "And where th’ offense is, let the great ax fall.", "I pray you, go with me."], "n": "4.5.243"}, {"d": "They exit."}]}, "ham47": {"play": "Hamlet", "act": 4, "scene": 7, "title": "SCENE VII.  Another room in the castle.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/hamlet/read/4/7/", "first": "4.7.1", "last": "4.7.221", "items": [{"d": "Enter King and Laertes."}, {"s": "KING", "l": ["Now must your conscience my acquittance seal,", "And you must put me in your heart for friend,", "Sith you have heard, and with a knowing ear,", "That he which hath your noble father slain", "Pursued my life."], "n": "4.7.1"}, {"s": "LAERTES", "l": ["It well appears. But tell me", "Why you proceeded not against these feats,", "So criminal and so capital in nature,", "As by your safety, greatness, wisdom, all things else,", "You mainly were stirred up."], "n": "4.7.6"}, {"s": "KING", "l": ["O, for two special reasons,", "Which may to you perhaps seem much unsinewed,", "But yet to me they’re strong. The Queen his mother", "Lives almost by his looks, and for myself", "( My virtue or my plague, be it either which),", "She is so conjunctive to my life and soul", "That, as the star moves not but in his sphere,", "I could not but by her. The other motive", "Why to a public count I might not go", "Is the great love the general gender bear him,", "Who, dipping all his faults in their affection,", "Work like the spring that turneth wood to stone,", "Convert his gyves to graces, so that my arrows,", "Too slightly timbered for so loud a wind,", "Would have reverted to my bow again,", "But not where I have aimed them."], "n": "4.7.11"}, {"s": "LAERTES", "l": ["And so have I a noble father lost,", "A sister driven into desp’rate terms,", "Whose worth, if praises may go back again,", "Stood challenger on mount of all the age", "For her perfections. But my revenge will come."], "n": "4.7.27"}, {"s": "KING", "l": ["Break not your sleeps for that. You must not think", "That we are made of stuff so flat and dull", "That we can let our beard be shook with danger", "And think it pastime. You shortly shall hear more.", "I loved your father, and we love ourself,", "And that, I hope, will teach you to imagine—", "[Enter a Messenger with letters.]", "How now? What news?"], "n": "4.7.32"}, {"s": "MESSENGER", "l": ["Letters, my lord, from Hamlet.", "These to your Majesty, this to the Queen."], "n": "4.7.39"}, {"s": "KING", "l": ["From Hamlet? Who brought them?"], "n": "4.7.42"}, {"s": "MESSENGER", "l": ["Sailors, my lord, they say. I saw them not.", "They were given me by Claudio. He received them", "Of him that brought them."], "n": "4.7.43"}, {"s": "KING", "l": ["Laertes, you shall hear them.—", "Leave us.", "[Messenger exits.]", "[Reads.]", "What should this mean? Are all the rest come back?", "Or is it some abuse and no such thing?"], "n": "4.7.46"}, {"s": "LAERTES", "l": ["Know you the hand?"], "n": "4.7.56"}, {"s": "KING", "l": ["’Tis Hamlet’s character. “ Naked”—", "And in a postscript here, he says “ alone.”", "Can you advise me?"], "n": "4.7.57"}, {"s": "LAERTES", "l": ["I am lost in it, my lord. But let him come.", "It warms the very sickness in my heart", "That I shall live and tell him to his teeth", "“ Thus didst thou.”"], "n": "4.7.60"}, {"s": "KING", "l": ["If it be so, Laertes", "( As how should it be so? how otherwise?),", "Will you be ruled by me?"], "n": "4.7.64"}, {"s": "LAERTES", "l": ["Ay, my lord,", "So you will not o’errule me to a peace."], "n": "4.7.67"}, {"s": "KING", "l": ["To thine own peace. If he be now returned,", "As checking at his voyage, and that he means", "No more to undertake it, I will work him", "To an exploit, now ripe in my device,", "Under the which he shall not choose but fall;", "And for his death no wind of blame shall breathe,", "But even his mother shall uncharge the practice", "And call it accident."], "n": "4.7.69"}, {"s": "LAERTES", "l": ["My lord, I will be ruled,", "The rather if you could devise it so", "That I might be the organ."], "n": "4.7.77"}, {"s": "KING", "l": ["It falls right.", "You have been talked of since your travel much,", "And that in Hamlet’s hearing, for a quality", "Wherein they say you shine. Your sum of parts", "Did not together pluck such envy from him", "As did that one, and that, in my regard,", "Of the unworthiest siege."], "n": "4.7.80"}, {"s": "LAERTES", "l": ["What part is that, my lord?"], "n": "4.7.87"}, {"s": "KING", "l": ["A very ribbon in the cap of youth—", "Yet needful too, for youth no less becomes", "The light and careless livery that it wears", "Than settled age his sables and his weeds,", "Importing health and graveness. Two months since", "Here was a gentleman of Normandy.", "I have seen myself, and served against, the French,", "And they can well on horseback, but this gallant", "Had witchcraft in ’t. He grew unto his seat,", "And to such wondrous doing brought his horse", "As had he been encorpsed and demi-natured", "With the brave beast. So far he topped my thought", "That I in forgery of shapes and tricks", "Come short of what he did."], "n": "4.7.88"}, {"s": "LAERTES", "l": ["A Norman was ’t?"], "n": "4.7.102"}, {"s": "KING", "l": ["A Norman."], "n": "4.7.103"}, {"s": "LAERTES", "l": ["Upon my life, Lamord."], "n": "4.7.104"}, {"s": "KING", "l": ["The very same."], "n": "4.7.105"}, {"s": "LAERTES", "l": ["I know him well. He is the brooch indeed", "And gem of all the nation."], "n": "4.7.106"}, {"s": "KING", "l": ["He made confession of you", "And gave you such a masterly report", "For art and exercise in your defense,", "And for your rapier most especial,", "That he cried out ’twould be a sight indeed", "If one could match you. The ’scrimers of their nation", "He swore had neither motion, guard, nor eye,", "If you opposed them. Sir, this report of his", "Did Hamlet so envenom with his envy", "That he could nothing do but wish and beg", "Your sudden coming-o’er, to play with you.", "Now out of this—"], "n": "4.7.108"}, {"s": "LAERTES", "l": ["What out of this, my lord?"], "n": "4.7.121"}, {"s": "KING", "l": ["Laertes, was your father dear to you?", "Or are you like the painting of a sorrow,", "A face without a heart?"], "n": "4.7.122"}, {"s": "LAERTES", "l": ["Why ask you this?"], "n": "4.7.125"}, {"s": "KING", "l": ["Not that I think you did not love your father,", "But that I know love is begun by time", "And that I see, in passages of proof,", "Time qualifies the spark and fire of it.", "There lives within the very flame of love", "A kind of wick or snuff that will abate it,", "And nothing is at a like goodness still;", "For goodness, growing to a pleurisy,", "Dies in his own too-much. That we would do", "We should do when we would; for this “ would” changes", "And hath abatements and delays as many", "As there are tongues, are hands, are accidents;", "And then this “ should” is like a spendthrift sigh,", "That hurts by easing. But to the quick of th’ ulcer:", "Hamlet comes back; what would you undertake", "To show yourself indeed your father’s son", "More than in words?"], "n": "4.7.126"}, {"s": "LAERTES", "l": ["To cut his throat i’ th’ church."], "n": "4.7.144"}, {"s": "KING", "l": ["No place indeed should murder sanctuarize;", "Revenge should have no bounds. But, good Laertes,", "Will you do this? Keep close within your chamber.", "Hamlet, returned, shall know you are come home.", "We’ll put on those shall praise your excellence", "And set a double varnish on the fame", "The Frenchman gave you; bring you, in fine, together", "And wager on your heads. He, being remiss,", "Most generous, and free from all contriving,", "Will not peruse the foils, so that with ease,", "Or with a little shuffling, you may choose", "A sword unbated, and in a pass of practice", "Requite him for your father."], "n": "4.7.145"}, {"s": "LAERTES", "l": ["I will do ’t,", "And for that purpose I’ll anoint my sword.", "I bought an unction of a mountebank", "So mortal that, but dip a knife in it,", "Where it draws blood no cataplasm so rare,", "Collected from all simples that have virtue", "Under the moon, can save the thing from death", "That is but scratched withal. I’ll touch my point", "With this contagion, that, if I gall him slightly,", "It may be death."], "n": "4.7.159"}, {"s": "KING", "l": ["Let’s further think of this,", "Weigh what convenience both of time and means", "May fit us to our shape. If this should fail,", "And that our drift look through our bad performance,", "’Twere better not assayed. Therefore this project", "Should have a back or second that might hold", "If this did blast in proof. Soft, let me see.", "We’ll make a solemn wager on your cunnings—", "I ha ’t!", "When in your motion you are hot and dry", "( As make your bouts more violent to that end)", "And that he calls for drink, I’ll have prepared him", "A chalice for the nonce, whereon but sipping,", "If he by chance escape your venomed stuck,", "Our purpose may hold there.— But stay, what noise?"], "n": "4.7.169"}, {"d": "Enter Queen."}, {"s": "QUEEN", "l": ["One woe doth tread upon another’s heel,", "So fast they follow. Your sister’s drowned, Laertes."], "n": "4.7.187"}, {"s": "LAERTES", "l": ["Drowned? O, where?"], "n": "4.7.189"}, {"s": "QUEEN", "l": ["There is a willow grows askant the brook", "That shows his hoar leaves in the glassy stream.", "Therewith fantastic garlands did she make", "Of crowflowers, nettles, daisies, and long purples,", "That liberal shepherds give a grosser name,", "But our cold maids do “ dead men’s fingers” call them.", "There on the pendant boughs her coronet weeds", "Clamb’ring to hang, an envious sliver broke,", "When down her weedy trophies and herself", "Fell in the weeping brook. Her clothes spread wide,", "And mermaid-like awhile they bore her up,", "Which time she chanted snatches of old lauds,", "As one incapable of her own distress", "Or like a creature native and endued", "Unto that element. But long it could not be", "Till that her garments, heavy with their drink,", "Pulled the poor wretch from her melodious lay", "To muddy death."], "n": "4.7.190"}, {"s": "LAERTES", "l": ["Alas, then she is drowned."], "n": "4.7.209"}, {"s": "QUEEN", "l": ["Drowned, drowned."], "n": "4.7.210"}, {"s": "LAERTES", "l": ["Too much of water hast thou, poor Ophelia,", "And therefore I forbid my tears. But yet", "It is our trick; nature her custom holds,", "Let shame say what it will. When these are gone,", "The woman will be out.— Adieu, my lord.", "I have a speech o’ fire that fain would blaze,", "But that this folly drowns it."], "n": "4.7.211"}, {"d": "He exits."}, {"s": "KING", "l": ["Let’s follow, Gertrude.", "How much I had to do to calm his rage!", "Now fear I this will give it start again.", "Therefore, let’s follow."], "n": "4.7.218"}, {"d": "They exit."}]}, "ham51": {"play": "Hamlet", "act": 5, "scene": 1, "title": "SCENE I.  A churchyard.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/hamlet/read/5/1/", "first": "5.1.1", "last": "5.1.319", "items": [{"d": "Enter Gravedigger and Another."}, {"s": "GRAVEDIGGER", "l": ["Is she to be buried in Christian burial,", "when she willfully seeks her own salvation?"], "n": "5.1.1"}, {"s": "OTHER", "l": ["I tell thee she is. Therefore make her grave", "straight. The crowner hath sat on her and finds it", "Christian burial."], "n": "5.1.3"}, {"s": "GRAVEDIGGER", "l": ["How can that be, unless she drowned", "herself in her own defense?"], "n": "5.1.6"}, {"s": "OTHER", "l": ["Why, ’tis found so."], "n": "5.1.8"}, {"s": "GRAVEDIGGER", "l": ["It must be se offendendo; it cannot be", "else. For here lies the point: if I drown myself", "wittingly, it argues an act, and an act hath three", "branches— it is to act, to do, to perform. Argal, she", "drowned herself wittingly."], "n": "5.1.9"}, {"s": "OTHER", "l": ["Nay, but hear you, goodman delver—"], "n": "5.1.14"}, {"s": "GRAVEDIGGER", "l": ["Give me leave. Here lies the water;", "good. Here stands the man; good. If the man go to", "this water and drown himself, it is ( will he, nill he)", "he goes; mark you that. But if the water come to him", "and drown him, he drowns not himself. Argal, he", "that is not guilty of his own death shortens not his", "own life."], "n": "5.1.15"}, {"s": "OTHER", "l": ["But is this law?"], "n": "5.1.22"}, {"s": "GRAVEDIGGER", "l": ["Ay, marry, is ’t— crowner’s ’quest law."], "n": "5.1.23"}, {"s": "OTHER", "l": ["Will you ha’ the truth on ’t? If this had not been", "a gentlewoman, she should have been buried out o’", "Christian burial."], "n": "5.1.24"}, {"s": "GRAVEDIGGER", "l": ["Why, there thou sayst. And the more", "pity that great folk should have count’nance in this", "world to drown or hang themselves more than", "their even-Christian. Come, my spade. There is no", "ancient gentlemen but gard’ners, ditchers, and", "grave-makers. They hold up Adam’s profession."], "n": "5.1.27"}, {"s": "OTHER", "l": ["Was he a gentleman?"], "n": "5.1.33"}, {"s": "GRAVEDIGGER", "l": ["He was the first that ever bore arms."], "n": "5.1.34"}, {"s": "OTHER", "l": ["Why, he had none."], "n": "5.1.35"}, {"s": "GRAVEDIGGER", "l": ["What, art a heathen? How dost thou", "understand the scripture? The scripture says Adam", "digged. Could he dig without arms? I’ll put another", "question to thee. If thou answerest me not to the", "purpose, confess thyself—"], "n": "5.1.36"}, {"s": "OTHER", "l": ["Go to!"], "n": "5.1.41"}, {"s": "GRAVEDIGGER", "l": ["What is he that builds stronger than", "either the mason, the shipwright, or the carpenter?"], "n": "5.1.42"}, {"s": "OTHER", "l": ["The gallows-maker; for that frame outlives a", "thousand tenants."], "n": "5.1.44"}, {"s": "GRAVEDIGGER", "l": ["I like thy wit well, in good faith. The", "gallows does well. But how does it well? It does", "well to those that do ill. Now, thou dost ill to say the", "gallows is built stronger than the church. Argal, the", "gallows may do well to thee. To ’t again, come."], "n": "5.1.46"}, {"s": "OTHER", "l": ["“ Who builds stronger than a mason, a shipwright,", "or a carpenter?”"], "n": "5.1.51"}, {"s": "GRAVEDIGGER", "l": ["Ay, tell me that, and unyoke."], "n": "5.1.53"}, {"s": "OTHER", "l": ["Marry, now I can tell."], "n": "5.1.54"}, {"s": "GRAVEDIGGER", "l": ["To ’t."], "n": "5.1.55"}, {"s": "OTHER", "l": ["Mass, I cannot tell."], "n": "5.1.56"}, {"d": "Enter Hamlet and Horatio afar off."}, {"s": "GRAVEDIGGER", "l": ["Cudgel thy brains no more about it,", "for your dull ass will not mend his pace with", "beating. And, when you are asked this question", "next, say “ a grave-maker.” The houses he makes", "lasts till doomsday. Go, get thee in, and fetch me a", "stoup of liquor.", "[The Other Man exits and the Gravedigger digs and sings.]", "In youth when I did love, did love,", "Methought it was very sweet", "To contract— O— the time for— a— my behove,", "O, methought there— a— was nothing— a— meet."], "n": "5.1.57"}, {"s": "HAMLET", "l": ["Has this fellow no feeling of his business? He", "sings in grave-making."], "n": "5.1.67"}, {"s": "HORATIO", "l": ["Custom hath made it in him a property of", "easiness."], "n": "5.1.69"}, {"s": "HAMLET", "l": ["’Tis e’en so. The hand of little employment", "hath the daintier sense."], "n": "5.1.71"}, {"s": "GRAVEDIGGER", "l": ["[sings]", "But age with his stealing steps", "Hath clawed me in his clutch,", "And hath shipped me into the land,", "As if I had never been such."], "n": "5.1.73"}, {"d": "He digs up a skull."}, {"s": "HAMLET", "l": ["That skull had a tongue in it and could sing", "once. How the knave jowls it to the ground as if", "’twere Cain’s jawbone, that did the first murder!", "This might be the pate of a politician which this ass", "now o’erreaches, one that would circumvent God,", "might it not?"], "n": "5.1.77"}, {"s": "HORATIO", "l": ["It might, my lord."], "n": "5.1.83"}, {"s": "HAMLET", "l": ["Or of a courtier, which could say “ Good", "morrow, sweet lord! How dost thou, sweet lord?”", "This might be my Lord Such-a-one that praised my", "Lord Such-a-one’s horse when he went to beg it,", "might it not?"], "n": "5.1.84"}, {"s": "HORATIO", "l": ["Ay, my lord."], "n": "5.1.89"}, {"s": "HAMLET", "l": ["Why, e’en so. And now my Lady Worm’s,", "chapless and knocked about the mazard with a", "sexton’s spade. Here’s fine revolution, an we had", "the trick to see ’t. Did these bones cost no more the", "breeding but to play at loggets with them? Mine", "ache to think on ’t."], "n": "5.1.90"}, {"s": "GRAVEDIGGER", "l": ["[sings]", "A pickax and a spade, a spade,", "For and a shrouding sheet,", "O, a pit of clay for to be made", "For such a guest is meet."], "n": "5.1.96"}, {"d": "He digs up more skulls."}, {"s": "HAMLET", "l": ["There’s another. Why may not that be the", "skull of a lawyer? Where be his quiddities now, his", "quillities, his cases, his tenures, and his tricks? Why", "does he suffer this mad knave now to knock him", "about the sconce with a dirty shovel and will not tell", "him of his action of battery? Hum, this fellow might", "be in ’s time a great buyer of land, with his statutes,", "his recognizances, his fines, his double vouchers,", "his recoveries. Is this the fine of his fines and the", "recovery of his recoveries, to have his fine pate full", "of fine dirt? Will his vouchers vouch him no more", "of his purchases, and double ones too, than the", "length and breadth of a pair of indentures? The very", "conveyances of his lands will scarcely lie in this box,", "and must th’ inheritor himself have no more, ha?"], "n": "5.1.100"}, {"s": "HORATIO", "l": ["Not a jot more, my lord."], "n": "5.1.115"}, {"s": "HAMLET", "l": ["Is not parchment made of sheepskins?"], "n": "5.1.116"}, {"s": "HORATIO", "l": ["Ay, my lord, and of calves’ skins too."], "n": "5.1.117"}, {"s": "HAMLET", "l": ["They are sheep and calves which seek out", "assurance in that. I will speak to this fellow.—", "Whose grave’s this, sirrah?"], "n": "5.1.118"}, {"s": "GRAVEDIGGER", "l": ["Mine, sir.", "[Sings.]", "O, a pit of clay for to be made", "For such a guest is meet."], "n": "5.1.121"}, {"s": "HAMLET", "l": ["I think it be thine indeed, for thou liest in ’t."], "n": "5.1.124"}, {"s": "GRAVEDIGGER", "l": ["You lie out on ’t, sir, and therefore ’tis", "not yours. For my part, I do not lie in ’t, yet it is", "mine."], "n": "5.1.125"}, {"s": "HAMLET", "l": ["Thou dost lie in ’t, to be in ’t and say it is thine.", "’Tis for the dead, not for the quick; therefore thou", "liest."], "n": "5.1.128"}, {"s": "GRAVEDIGGER", "l": ["’Tis a quick lie, sir; ’twill away again", "from me to you."], "n": "5.1.131"}, {"s": "HAMLET", "l": ["What man dost thou dig it for?"], "n": "5.1.133"}, {"s": "GRAVEDIGGER", "l": ["For no man, sir."], "n": "5.1.134"}, {"s": "HAMLET", "l": ["What woman then?"], "n": "5.1.135"}, {"s": "GRAVEDIGGER", "l": ["For none, neither."], "n": "5.1.136"}, {"s": "HAMLET", "l": ["Who is to be buried in ’t?"], "n": "5.1.137"}, {"s": "GRAVEDIGGER", "l": ["One that was a woman, sir, but, rest", "her soul, she’s dead."], "n": "5.1.138"}, {"s": "HAMLET", "l": ["How absolute the knave is! We must speak by", "the card, or equivocation will undo us. By the", "Lord, Horatio, this three years I have took note of", "it: the age is grown so picked that the toe of the", "peasant comes so near the heel of the courtier, he", "galls his kibe.— How long hast thou been", "grave-maker?"], "n": "5.1.140"}, {"s": "GRAVEDIGGER", "l": ["Of all the days i’ th’ year, I came to ’t", "that day that our last King Hamlet overcame", "Fortinbras."], "n": "5.1.147"}, {"s": "HAMLET", "l": ["How long is that since?"], "n": "5.1.150"}, {"s": "GRAVEDIGGER", "l": ["Cannot you tell that? Every fool can", "tell that. It was that very day that young Hamlet", "was born— he that is mad, and sent into England."], "n": "5.1.151"}, {"s": "HAMLET", "l": ["Ay, marry, why was he sent into England?"], "n": "5.1.154"}, {"s": "GRAVEDIGGER", "l": ["Why, because he was mad. He shall", "recover his wits there. Or if he do not, ’tis no great", "matter there."], "n": "5.1.155"}, {"s": "HAMLET", "l": ["Why?"], "n": "5.1.158"}, {"s": "GRAVEDIGGER", "l": ["’Twill not be seen in him there. There", "the men are as mad as he."], "n": "5.1.159"}, {"s": "HAMLET", "l": ["How came he mad?"], "n": "5.1.161"}, {"s": "GRAVEDIGGER", "l": ["Very strangely, they say."], "n": "5.1.162"}, {"s": "HAMLET", "l": ["How “ strangely”?"], "n": "5.1.163"}, {"s": "GRAVEDIGGER", "l": ["Faith, e’en with losing his wits."], "n": "5.1.164"}, {"s": "HAMLET", "l": ["Upon what ground?"], "n": "5.1.165"}, {"s": "GRAVEDIGGER", "l": ["Why, here in Denmark. I have been", "sexton here, man and boy, thirty years."], "n": "5.1.166"}, {"s": "HAMLET", "l": ["How long will a man lie i’ th’ earth ere he rot?"], "n": "5.1.168"}, {"s": "GRAVEDIGGER", "l": ["Faith, if he be not rotten before he die", "( as we have many pocky corses nowadays that will", "scarce hold the laying in), he will last you some", "eight year or nine year. A tanner will last you nine", "year."], "n": "5.1.169"}, {"s": "HAMLET", "l": ["Why he more than another?"], "n": "5.1.174"}, {"s": "GRAVEDIGGER", "l": ["Why, sir, his hide is so tanned with his", "trade that he will keep out water a great while; and", "your water is a sore decayer of your whoreson dead", "body. Here’s a skull now hath lien you i’ th’ earth", "three-and-twenty years."], "n": "5.1.175"}, {"s": "HAMLET", "l": ["Whose was it?"], "n": "5.1.180"}, {"s": "GRAVEDIGGER", "l": ["A whoreson mad fellow’s it was.", "Whose do you think it was?"], "n": "5.1.181"}, {"s": "HAMLET", "l": ["Nay, I know not."], "n": "5.1.183"}, {"s": "GRAVEDIGGER", "l": ["A pestilence on him for a mad rogue!", "He poured a flagon of Rhenish on my head once.", "This same skull, sir, was, sir, Yorick’s skull, the", "King’s jester."], "n": "5.1.184"}, {"s": "HAMLET", "l": ["This?"], "n": "5.1.188"}, {"s": "GRAVEDIGGER", "l": ["E’en that."], "n": "5.1.189"}, {"s": "HAMLET", "l": ["[, taking the skull]", "Let me see. Alas, poor", "Yorick! I knew him, Horatio— a fellow of infinite", "jest, of most excellent fancy. He hath bore me on his", "back a thousand times, and now how abhorred in", "my imagination it is! My gorge rises at it. Here hung", "those lips that I have kissed I know not how oft.", "Where be your gibes now? your gambols? your", "songs? your flashes of merriment that were wont to", "set the table on a roar? Not one now to mock your", "own grinning? Quite chapfallen? Now get you to my", "lady’s chamber, and tell her, let her paint an inch", "thick, to this favor she must come. Make her laugh", "at that.— Prithee, Horatio, tell me one thing."], "n": "5.1.190"}, {"s": "HORATIO", "l": ["What’s that, my lord?"], "n": "5.1.203"}, {"s": "HAMLET", "l": ["Dost thou think Alexander looked o’ this", "fashion i’ th’ earth?"], "n": "5.1.204"}, {"s": "HORATIO", "l": ["E’en so."], "n": "5.1.206"}, {"s": "HAMLET", "l": ["And smelt so? Pah!"], "n": "5.1.207"}, {"d": "He puts the skull down."}, {"s": "HORATIO", "l": ["E’en so, my lord."], "n": "5.1.208"}, {"s": "HAMLET", "l": ["To what base uses we may return, Horatio!", "Why may not imagination trace the noble dust of", "Alexander till he find it stopping a bunghole?"], "n": "5.1.209"}, {"s": "HORATIO", "l": ["’Twere to consider too curiously to consider", "so."], "n": "5.1.212"}, {"s": "HAMLET", "l": ["No, faith, not a jot; but to follow him thither,", "with modesty enough and likelihood to lead it, as", "thus: Alexander died, Alexander was buried, Alexander", "returneth to dust; the dust is earth; of earth", "we make loam; and why of that loam whereto he", "was converted might they not stop a beer barrel?", "Imperious Caesar, dead and turned to clay,", "Might stop a hole to keep the wind away.", "O, that that earth which kept the world in awe", "Should patch a wall t’ expel the winter’s flaw!", "[Enter King, Queen, Laertes, Lords attendant, and the corpse of Ophelia, with a Doctor of Divinity.]", "But soft, but soft awhile! Here comes the King,", "The Queen, the courtiers. Who is this they follow?", "And with such maimèd rites? This doth betoken", "The corse they follow did with desp’rate hand", "Fordo its own life. ’Twas of some estate.", "Couch we awhile and mark."], "n": "5.1.214"}, {"d": "They step aside."}, {"s": "LAERTES", "l": ["What ceremony else?"], "n": "5.1.230"}, {"s": "HAMLET", "l": ["That is Laertes, a very noble youth. Mark."], "n": "5.1.231"}, {"s": "LAERTES", "l": ["What ceremony else?"], "n": "5.1.232"}, {"s": "DOCTOR", "l": ["Her obsequies have been as far enlarged", "As we have warranty. Her death was doubtful,", "And, but that great command o’ersways the order,", "She should in ground unsanctified been lodged", "Till the last trumpet. For charitable prayers", "Shards, flints, and pebbles should be thrown on her.", "Yet here she is allowed her virgin crants,", "Her maiden strewments, and the bringing home", "Of bell and burial."], "n": "5.1.233"}, {"s": "LAERTES", "l": ["Must there no more be done?"], "n": "5.1.243"}, {"s": "DOCTOR", "l": ["No more be done.", "We should profane the service of the dead", "To sing a requiem and such rest to her", "As to peace-parted souls."], "n": "5.1.244"}, {"s": "LAERTES", "l": ["Lay her i’ th’ earth,", "And from her fair and unpolluted flesh", "May violets spring! I tell thee, churlish priest,", "A minist’ring angel shall my sister be", "When thou liest howling."], "n": "5.1.248"}, {"s": "HAMLET", "l": ["[, to Horatio]", "What, the fair Ophelia?"], "n": "5.1.253"}, {"s": "QUEEN", "l": ["Sweets to the sweet, farewell!", "[She scatters flowers.]", "I hoped thou shouldst have been my Hamlet’s wife;", "I thought thy bride-bed to have decked, sweet maid,", "And not have strewed thy grave."], "n": "5.1.254"}, {"s": "LAERTES", "l": ["O, treble woe", "Fall ten times treble on that cursèd head", "Whose wicked deed thy most ingenious sense", "Deprived thee of!— Hold off the earth awhile,", "Till I have caught her once more in mine arms.", "[Leaps in the grave.]", "Now pile your dust upon the quick and dead,", "Till of this flat a mountain you have made", "T’ o’ertop old Pelion or the skyish head", "Of blue Olympus."], "n": "5.1.258"}, {"s": "HAMLET", "l": ["[, advancing]", "What is he whose grief", "Bears such an emphasis, whose phrase of sorrow", "Conjures the wand’ring stars and makes them stand", "Like wonder-wounded hearers? This is I,", "Hamlet the Dane."], "n": "5.1.267"}, {"s": "LAERTES", "l": ["[, coming out of the grave]", "The devil take thy soul!"], "n": "5.1.272"}, {"s": "HAMLET", "l": ["Thou pray’st not well.", "[They grapple.]", "I prithee take thy fingers from my throat,", "For though I am not splenitive and rash,", "Yet have I in me something dangerous,", "Which let thy wisdom fear. Hold off thy hand."], "n": "5.1.273"}, {"s": "KING", "l": ["Pluck them asunder."], "n": "5.1.278"}, {"s": "QUEEN", "l": ["Hamlet! Hamlet!"], "n": "5.1.279"}, {"s": "ALL", "l": ["Gentlemen!"], "n": "5.1.280"}, {"s": "HORATIO", "l": ["Good my lord, be quiet."], "n": "5.1.281"}, {"d": "Hamlet and Laertes are separated."}, {"s": "HAMLET", "l": ["Why, I will fight with him upon this theme", "Until my eyelids will no longer wag!"], "n": "5.1.282"}, {"s": "QUEEN", "l": ["O my son, what theme?"], "n": "5.1.284"}, {"s": "HAMLET", "l": ["I loved Ophelia. Forty thousand brothers", "Could not with all their quantity of love", "Make up my sum. What wilt thou do for her?"], "n": "5.1.285"}, {"s": "KING", "l": ["O, he is mad, Laertes!"], "n": "5.1.288"}, {"s": "QUEEN", "l": ["For love of God, forbear him."], "n": "5.1.289"}, {"s": "HAMLET", "l": ["’Swounds, show me what thou ’t do.", "Woo’t weep, woo’t fight, woo’t fast, woo’t tear thyself,", "Woo’t drink up eisel, eat a crocodile?", "I’ll do ’t. Dost thou come here to whine?", "To outface me with leaping in her grave?", "Be buried quick with her, and so will I.", "And if thou prate of mountains, let them throw", "Millions of acres on us, till our ground,", "Singeing his pate against the burning zone,", "Make Ossa like a wart. Nay, an thou ’lt mouth,", "I’ll rant as well as thou."], "n": "5.1.290"}, {"s": "QUEEN", "l": ["This is mere madness;", "And thus awhile the fit will work on him.", "Anon, as patient as the female dove", "When that her golden couplets are disclosed,", "His silence will sit drooping."], "n": "5.1.302"}, {"s": "HAMLET", "l": ["Hear you, sir,", "What is the reason that you use me thus?", "I loved you ever. But it is no matter.", "Let Hercules himself do what he may,", "The cat will mew, and dog will have his day."], "n": "5.1.307"}, {"d": "Hamlet exits."}, {"s": "KING", "l": ["I pray thee, good Horatio, wait upon him.", "[Horatio exits.]", "To Laertes. Strengthen your patience in our last night’s speech.", "We’ll put the matter to the present push.—", "Good Gertrude, set some watch over your son.—", "This grave shall have a living monument.", "An hour of quiet thereby shall we see.", "Till then in patience our proceeding be."], "n": "5.1.312"}, {"d": "They exit."}]}, "ham52": {"play": "Hamlet", "act": 5, "scene": 2, "title": "SCENE II.  A hall in the castle.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/hamlet/read/5/2/", "first": "5.2.1", "last": "5.2.449", "items": [{"d": "Enter Hamlet and Horatio."}, {"s": "HAMLET", "l": ["So much for this, sir. Now shall you see the other.", "You do remember all the circumstance?"], "n": "5.2.1"}, {"s": "HORATIO", "l": ["Remember it, my lord!"], "n": "5.2.3"}, {"s": "HAMLET", "l": ["Sir, in my heart there was a kind of fighting", "That would not let me sleep. Methought I lay", "Worse than the mutines in the bilboes. Rashly—", "And praised be rashness for it: let us know,", "Our indiscretion sometime serves us well", "When our deep plots do pall; and that should learn us", "There’s a divinity that shapes our ends,", "Rough-hew them how we will—"], "n": "5.2.4"}, {"s": "HORATIO", "l": ["That is most certain."], "n": "5.2.13"}, {"s": "HAMLET", "l": ["Up from my cabin,", "My sea-gown scarfed about me, in the dark", "Groped I to find out them; had my desire,", "Fingered their packet, and in fine withdrew", "To mine own room again, making so bold", "( My fears forgetting manners) to unfold", "Their grand commission; where I found, Horatio,", "A royal knavery— an exact command,", "Larded with many several sorts of reasons", "Importing Denmark’s health and England’s too,", "With— ho!— such bugs and goblins in my life,", "That on the supervise, no leisure bated,", "No, not to stay the grinding of the ax,", "My head should be struck off."], "n": "5.2.15"}, {"s": "HORATIO", "l": ["Is ’t possible?"], "n": "5.2.29"}, {"s": "HAMLET", "l": ["Here’s the commission. Read it at more leisure.", "[Handing him a paper.]", "But wilt thou hear now how I did proceed?"], "n": "5.2.30"}, {"s": "HORATIO", "l": ["I beseech you."], "n": "5.2.32"}, {"s": "HAMLET", "l": ["Being thus benetted round with villainies,", "Or I could make a prologue to my brains,", "They had begun the play. I sat me down,", "Devised a new commission, wrote it fair—", "I once did hold it, as our statists do,", "A baseness to write fair, and labored much", "How to forget that learning; but, sir, now", "It did me yeoman’s service. Wilt thou know", "Th’ effect of what I wrote?"], "n": "5.2.33"}, {"s": "HORATIO", "l": ["Ay, good my lord."], "n": "5.2.42"}, {"s": "HAMLET", "l": ["An earnest conjuration from the King,", "As England was his faithful tributary,", "As love between them like the palm might flourish,", "As peace should still her wheaten garland wear", "And stand a comma ’tween their amities,", "And many suchlike ases of great charge,", "That, on the view and knowing of these contents,", "Without debatement further, more or less,", "He should those bearers put to sudden death,", "Not shriving time allowed."], "n": "5.2.43"}, {"s": "HORATIO", "l": ["How was this sealed?"], "n": "5.2.53"}, {"s": "HAMLET", "l": ["Why, even in that was heaven ordinant.", "I had my father’s signet in my purse,", "Which was the model of that Danish seal;", "Folded the writ up in the form of th’ other,", "Subscribed it, gave ’t th’ impression, placed it safely,", "The changeling never known. Now, the next day", "Was our sea-fight; and what to this was sequent", "Thou knowest already."], "n": "5.2.54"}, {"s": "HORATIO", "l": ["So Guildenstern and Rosencrantz go to ’t."], "n": "5.2.63"}, {"s": "HAMLET", "l": ["Why, man, they did make love to this employment.", "They are not near my conscience. Their defeat", "Does by their own insinuation grow.", "’Tis dangerous when the baser nature comes", "Between the pass and fell incensèd points", "Of mighty opposites."], "n": "5.2.64"}, {"s": "HORATIO", "l": ["Why, what a king is this!"], "n": "5.2.70"}, {"s": "HAMLET", "l": ["Does it not, think thee, stand me now upon—", "He that hath killed my king and whored my mother,", "Popped in between th’ election and my hopes,", "Thrown out his angle for my proper life,", "And with such cozenage— is ’t not perfect conscience", "To quit him with this arm? And is ’t not to be damned", "To let this canker of our nature come", "In further evil?"], "n": "5.2.71"}, {"s": "HORATIO", "l": ["It must be shortly known to him from England", "What is the issue of the business there."], "n": "5.2.81"}, {"s": "HAMLET", "l": ["It will be short. The interim’s mine,", "And a man’s life’s no more than to say “ one.”", "But I am very sorry, good Horatio,", "That to Laertes I forgot myself,", "For by the image of my cause I see", "The portraiture of his. I’ll court his favors.", "But, sure, the bravery of his grief did put me", "Into a tow’ring passion."], "n": "5.2.83"}, {"s": "HORATIO", "l": ["Peace, who comes here?"], "n": "5.2.91"}, {"d": "Enter Osric, a courtier."}, {"s": "OSRIC", "l": ["Your Lordship is right welcome back to", "Denmark."], "n": "5.2.92"}, {"s": "HAMLET", "l": ["I humbly thank you, sir.", "[Aside to Horatio.]", "Dost know this waterfly?"], "n": "5.2.94"}, {"s": "HORATIO", "l": ["[, aside to Hamlet]", "No, my good lord."], "n": "5.2.96"}, {"s": "HAMLET", "l": ["[, aside to Horatio]", "Thy state is the more gracious,", "for ’tis a vice to know him. He hath much", "land, and fertile. Let a beast be lord of beasts and his", "crib shall stand at the king’s mess. ’Tis a chough,", "but, as I say, spacious in the possession of dirt."], "n": "5.2.97"}, {"s": "OSRIC", "l": ["Sweet lord, if your Lordship were at leisure, I", "should impart a thing to you from his Majesty."], "n": "5.2.102"}, {"s": "HAMLET", "l": ["I will receive it, sir, with all diligence of", "spirit. Put your bonnet to his right use: ’tis for the", "head."], "n": "5.2.104"}, {"s": "OSRIC", "l": ["I thank your Lordship; it is very hot."], "n": "5.2.107"}, {"s": "HAMLET", "l": ["No, believe me, ’tis very cold; the wind is", "northerly."], "n": "5.2.108"}, {"s": "OSRIC", "l": ["It is indifferent cold, my lord, indeed."], "n": "5.2.110"}, {"s": "HAMLET", "l": ["But yet methinks it is very sultry and hot for", "my complexion."], "n": "5.2.111"}, {"s": "OSRIC", "l": ["Exceedingly, my lord; it is very sultry, as", "’twere— I cannot tell how. My lord, his Majesty", "bade me signify to you that he has laid a great wager", "on your head. Sir, this is the matter—"], "n": "5.2.113"}, {"s": "HAMLET", "l": ["I beseech you, remember."], "n": "5.2.117"}, {"d": "He motions to Osric to put on his hat."}, {"s": "OSRIC", "l": ["Nay, good my lord, for my ease, in good faith.", "Sir, here is newly come to court Laertes— believe", "me, an absolute gentleman, full of most excellent", "differences, of very soft society and great showing.", "Indeed, to speak feelingly of him, he is the card or", "calendar of gentry, for you shall find in him the", "continent of what part a gentleman would see."], "n": "5.2.118"}, {"s": "HAMLET", "l": ["Sir, his definement suffers no perdition in", "you, though I know to divide him inventorially", "would dozy th’ arithmetic of memory, and yet but", "yaw neither, in respect of his quick sail. But, in the", "verity of extolment, I take him to be a soul of great", "article, and his infusion of such dearth and rareness", "as, to make true diction of him, his semblable is his", "mirror, and who else would trace him, his umbrage,", "nothing more."], "n": "5.2.125"}, {"s": "OSRIC", "l": ["Your Lordship speaks most infallibly of him."], "n": "5.2.134"}, {"s": "HAMLET", "l": ["The concernancy, sir? Why do we wrap the", "gentleman in our more rawer breath?"], "n": "5.2.135"}, {"s": "OSRIC", "l": ["Sir?"], "n": "5.2.137"}, {"s": "HORATIO", "l": ["Is ’t not possible to understand in another", "tongue? You will to ’t, sir, really."], "n": "5.2.138"}, {"s": "HAMLET", "l": ["[, to Osric]", "What imports the nomination of", "this gentleman?"], "n": "5.2.140"}, {"s": "OSRIC", "l": ["Of Laertes?"], "n": "5.2.142"}, {"s": "HORATIO", "l": ["His purse is empty already; all ’s golden words", "are spent."], "n": "5.2.143"}, {"s": "HAMLET", "l": ["Of him, sir."], "n": "5.2.145"}, {"s": "OSRIC", "l": ["I know you are not ignorant—"], "n": "5.2.146"}, {"s": "HAMLET", "l": ["I would you did, sir. Yet, in faith, if you did, it", "would not much approve me. Well, sir?"], "n": "5.2.147"}, {"s": "OSRIC", "l": ["You are not ignorant of what excellence Laertes", "is—"], "n": "5.2.149"}, {"s": "HAMLET", "l": ["I dare not confess that, lest I should compare", "with him in excellence. But to know a man well", "were to know himself."], "n": "5.2.151"}, {"s": "OSRIC", "l": ["I mean, sir, for his weapon. But in the imputation", "laid on him by them, in his meed he’s", "unfellowed."], "n": "5.2.154"}, {"s": "HAMLET", "l": ["What’s his weapon?"], "n": "5.2.157"}, {"s": "OSRIC", "l": ["Rapier and dagger."], "n": "5.2.158"}, {"s": "HAMLET", "l": ["That’s two of his weapons. But, well—"], "n": "5.2.159"}, {"s": "OSRIC", "l": ["The King, sir, hath wagered with him six Barbary", "horses, against the which he has impawned, as I", "take it, six French rapiers and poniards, with their", "assigns, as girdle, hangers, and so. Three of the", "carriages, in faith, are very dear to fancy, very", "responsive to the hilts, most delicate carriages, and", "of very liberal conceit."], "n": "5.2.160"}, {"s": "HAMLET", "l": ["What call you the “ carriages”?"], "n": "5.2.167"}, {"s": "HORATIO", "l": ["I knew you must be edified by the margent", "ere you had done."], "n": "5.2.168"}, {"s": "OSRIC", "l": ["The carriages, sir, are the hangers."], "n": "5.2.170"}, {"s": "HAMLET", "l": ["The phrase would be more germane to the", "matter if we could carry a cannon by our sides. I", "would it might be “ hangers” till then. But on. Six", "Barbary horses against six French swords, their", "assigns, and three liberal-conceited carriages—", "that’s the French bet against the Danish. Why is this", "all “ impawned,” as you call it?"], "n": "5.2.171"}, {"s": "OSRIC", "l": ["The King, sir, hath laid, sir, that in a dozen", "passes between yourself and him, he shall not", "exceed you three hits. He hath laid on twelve for", "nine, and it would come to immediate trial if your", "Lordship would vouchsafe the answer."], "n": "5.2.178"}, {"s": "HAMLET", "l": ["How if I answer no?"], "n": "5.2.183"}, {"s": "OSRIC", "l": ["I mean, my lord, the opposition of your person", "in trial."], "n": "5.2.184"}, {"s": "HAMLET", "l": ["Sir, I will walk here in the hall. If it please his", "Majesty, it is the breathing time of day with me. Let", "the foils be brought, the gentleman willing, and the", "King hold his purpose, I will win for him, an I can.", "If not, I will gain nothing but my shame and the odd", "hits."], "n": "5.2.186"}, {"s": "OSRIC", "l": ["Shall I deliver you e’en so?"], "n": "5.2.192"}, {"s": "HAMLET", "l": ["To this effect, sir, after what flourish your", "nature will."], "n": "5.2.193"}, {"s": "OSRIC", "l": ["I commend my duty to your Lordship."], "n": "5.2.195"}, {"s": "HAMLET", "l": ["Yours.", "[Osric exits.]", "He does well to commend", "it himself. There are no tongues else for ’s", "turn."], "n": "5.2.196"}, {"s": "HORATIO", "l": ["This lapwing runs away with the shell on his", "head."], "n": "5.2.199"}, {"s": "HAMLET", "l": ["He did comply, sir, with his dug before he", "sucked it. Thus has he ( and many more of the same", "breed that I know the drossy age dotes on) only got", "the tune of the time, and, out of an habit of", "encounter, a kind of yeasty collection, which carries", "them through and through the most fanned", "and winnowed opinions; and do but blow them to", "their trial, the bubbles are out."], "n": "5.2.201"}, {"d": "Enter a Lord."}, {"s": "LORD", "l": ["My lord, his Majesty commended him to you by", "young Osric, who brings back to him that you", "attend him in the hall. He sends to know if your", "pleasure hold to play with Laertes, or that you will", "take longer time."], "n": "5.2.209"}, {"s": "HAMLET", "l": ["I am constant to my purposes. They follow", "the King’s pleasure. If his fitness speaks, mine is", "ready now or whensoever, provided I be so able as", "now."], "n": "5.2.214"}, {"s": "LORD", "l": ["The King and Queen and all are coming down."], "n": "5.2.218"}, {"s": "HAMLET", "l": ["In happy time."], "n": "5.2.219"}, {"s": "LORD", "l": ["The Queen desires you to use some gentle", "entertainment to Laertes before you fall to play."], "n": "5.2.220"}, {"s": "HAMLET", "l": ["She well instructs me."], "n": "5.2.222"}, {"d": "Lord exits."}, {"s": "HORATIO", "l": ["You will lose, my lord."], "n": "5.2.223"}, {"s": "HAMLET", "l": ["I do not think so. Since he went into France, I", "have been in continual practice. I shall win at the", "odds; but thou wouldst not think how ill all’s here", "about my heart. But it is no matter."], "n": "5.2.224"}, {"s": "HORATIO", "l": ["Nay, good my lord—"], "n": "5.2.228"}, {"s": "HAMLET", "l": ["It is but foolery, but it is such a kind of", "gaingiving as would perhaps trouble a woman."], "n": "5.2.229"}, {"s": "HORATIO", "l": ["If your mind dislike anything, obey it. I will", "forestall their repair hither and say you are not fit."], "n": "5.2.231"}, {"s": "HAMLET", "l": ["Not a whit. We defy augury. There is a", "special providence in the fall of a sparrow. If it be", "now, ’tis not to come; if it be not to come, it will be", "now; if it be not now, yet it will come. The", "readiness is all. Since no man of aught he leaves", "knows, what is ’t to leave betimes? Let be."], "n": "5.2.233"}, {"d": "A table prepared. Enter Trumpets, Drums, and Officers with cushions, King, Queen, Osric, and all the state, foils, daggers, flagons of wine, and Laertes."}, {"s": "KING", "l": ["Come, Hamlet, come and take this hand from me."], "n": "5.2.239"}, {"d": "He puts Laertes’ hand into Hamlet’s."}, {"s": "HAMLET", "l": ["[, to Laertes]", "Give me your pardon, sir. I have done you wrong;", "But pardon ’t as you are a gentleman. This presence knows,", "And you must needs have heard, how I am punished", "With a sore distraction. What I have done", "That might your nature, honor, and exception", "Roughly awake, I here proclaim was madness.", "Was ’t Hamlet wronged Laertes? Never Hamlet.", "If Hamlet from himself be ta’en away,", "And when he’s not himself does wrong Laertes,", "Then Hamlet does it not; Hamlet denies it.", "Who does it, then? His madness. If ’t be so,", "Hamlet is of the faction that is wronged;", "His madness is poor Hamlet’s enemy.", "Sir, in this audience", "Let my disclaiming from a purposed evil", "Free me so far in your most generous thoughts", "That I have shot my arrow o’er the house", "And hurt my brother."], "n": "5.2.240"}, {"s": "LAERTES", "l": ["I am satisfied in nature,", "Whose motive in this case should stir me most", "To my revenge; but in my terms of honor", "I stand aloof and will no reconcilement", "Till by some elder masters of known honor", "I have a voice and precedent of peace", "To keep my name ungored. But till that time", "I do receive your offered love like love", "And will not wrong it."], "n": "5.2.259"}, {"s": "HAMLET", "l": ["I embrace it freely", "And will this brothers’ wager frankly play.—", "Give us the foils. Come on."], "n": "5.2.268"}, {"s": "LAERTES", "l": ["Come, one for me."], "n": "5.2.271"}, {"s": "HAMLET", "l": ["I’ll be your foil, Laertes; in mine ignorance", "Your skill shall, like a star i’ th’ darkest night,", "Stick fiery off indeed."], "n": "5.2.272"}, {"s": "LAERTES", "l": ["You mock me, sir."], "n": "5.2.275"}, {"s": "HAMLET", "l": ["No, by this hand."], "n": "5.2.276"}, {"s": "KING", "l": ["Give them the foils, young Osric. Cousin Hamlet,", "You know the wager?"], "n": "5.2.277"}, {"s": "HAMLET", "l": ["Very well, my lord.", "Your Grace has laid the odds o’ th’ weaker side."], "n": "5.2.279"}, {"s": "KING", "l": ["I do not fear it; I have seen you both.", "But, since he is better, we have therefore odds."], "n": "5.2.281"}, {"s": "LAERTES", "l": ["This is too heavy. Let me see another."], "n": "5.2.283"}, {"s": "HAMLET", "l": ["This likes me well. These foils have all a length?"], "n": "5.2.284"}, {"s": "OSRIC", "l": ["Ay, my good lord."], "n": "5.2.285"}, {"d": "Prepare to play."}, {"s": "KING", "l": ["Set me the stoups of wine upon that table.—", "If Hamlet give the first or second hit", "Or quit in answer of the third exchange,", "Let all the battlements their ordnance fire.", "The King shall drink to Hamlet’s better breath,", "And in the cup an union shall he throw,", "Richer than that which four successive kings", "In Denmark’s crown have worn. Give me the cups,", "And let the kettle to the trumpet speak,", "The trumpet to the cannoneer without,", "The cannons to the heavens, the heaven to earth,", "“ Now the King drinks to Hamlet.” Come, begin.", "And you, the judges, bear a wary eye."], "n": "5.2.286"}, {"d": "Trumpets the while."}, {"s": "HAMLET", "l": ["Come on, sir."], "n": "5.2.299"}, {"s": "LAERTES", "l": ["Come, my lord."], "n": "5.2.300"}, {"d": "They play."}, {"s": "HAMLET", "l": ["One."], "n": "5.2.301"}, {"s": "LAERTES", "l": ["No."], "n": "5.2.302"}, {"s": "HAMLET", "l": ["Judgment!"], "n": "5.2.303"}, {"s": "OSRIC", "l": ["A hit, a very palpable hit."], "n": "5.2.304"}, {"s": "LAERTES", "l": ["Well, again."], "n": "5.2.305"}, {"s": "KING", "l": ["Stay, give me drink.— Hamlet, this pearl is thine.", "Here’s to thy health.", "[He drinks and then drops the pearl in the cup.]", "[Drum, trumpets, and shot.]", "Give him the cup."], "n": "5.2.306"}, {"s": "HAMLET", "l": ["I’ll play this bout first. Set it by awhile.", "Come. They play. Another hit. What say you?"], "n": "5.2.309"}, {"s": "LAERTES", "l": ["A touch, a touch. I do confess ’t."], "n": "5.2.311"}, {"s": "KING", "l": ["Our son shall win."], "n": "5.2.312"}, {"s": "QUEEN", "l": ["He’s fat and scant of breath.—", "Here, Hamlet, take my napkin; rub thy brows.", "The Queen carouses to thy fortune, Hamlet."], "n": "5.2.313"}, {"d": "She lifts the cup."}, {"s": "HAMLET", "l": ["Good madam."], "n": "5.2.316"}, {"s": "KING", "l": ["Gertrude, do not drink."], "n": "5.2.317"}, {"s": "QUEEN", "l": ["I will, my lord; I pray you pardon me."], "n": "5.2.318"}, {"d": "She drinks."}, {"s": "KING", "l": ["[, aside]", "It is the poisoned cup. It is too late."], "n": "5.2.319"}, {"s": "HAMLET", "l": ["I dare not drink yet, madam— by and by."], "n": "5.2.320"}, {"s": "QUEEN", "l": ["Come, let me wipe thy face."], "n": "5.2.321"}, {"s": "LAERTES", "l": ["[, to Claudius]", "My lord, I’ll hit him now."], "n": "5.2.322"}, {"s": "KING", "l": ["I do not think ’t."], "n": "5.2.323"}, {"s": "LAERTES", "l": ["[, aside]", "And yet it is almost against my conscience."], "n": "5.2.324"}, {"s": "HAMLET", "l": ["Come, for the third, Laertes. You do but dally.", "I pray you pass with your best violence.", "I am afeard you make a wanton of me."], "n": "5.2.325"}, {"s": "LAERTES", "l": ["Say you so? Come on."], "n": "5.2.328"}, {"d": "Play."}, {"s": "OSRIC", "l": ["Nothing neither way."], "n": "5.2.329"}, {"s": "LAERTES", "l": ["Have at you now!"], "n": "5.2.330"}, {"d": "Laertes wounds Hamlet. Then in scuffling they change rapiers, and Hamlet wounds Laertes."}, {"s": "KING", "l": ["Part them. They are incensed."], "n": "5.2.331"}, {"s": "HAMLET", "l": ["Nay, come again."], "n": "5.2.332"}, {"d": "The Queen falls."}, {"s": "OSRIC", "l": ["Look to the Queen there, ho!"], "n": "5.2.333"}, {"s": "HORATIO", "l": ["They bleed on both sides.— How is it, my lord?"], "n": "5.2.334"}, {"s": "OSRIC", "l": ["How is ’t, Laertes?"], "n": "5.2.335"}, {"s": "LAERTES", "l": ["Why as a woodcock to mine own springe, Osric.", "[He falls.]", "I am justly killed with mine own treachery."], "n": "5.2.336"}, {"s": "HAMLET", "l": ["How does the Queen?"], "n": "5.2.338"}, {"s": "KING", "l": ["She swoons to see them bleed."], "n": "5.2.339"}, {"s": "QUEEN", "l": ["No, no, the drink, the drink! O, my dear Hamlet!", "The drink, the drink! I am poisoned."], "n": "5.2.340"}, {"d": "She dies."}, {"s": "HAMLET", "l": ["O villainy! Ho! Let the door be locked.", "[Osric exits.]", "Treachery! Seek it out."], "n": "5.2.342"}, {"s": "LAERTES", "l": ["It is here, Hamlet. Hamlet, thou art slain.", "No med’cine in the world can do thee good.", "In thee there is not half an hour’s life.", "The treacherous instrument is in thy hand,", "Unbated and envenomed. The foul practice", "Hath turned itself on me. Lo, here I lie,", "Never to rise again. Thy mother’s poisoned.", "I can no more. The King, the King’s to blame."], "n": "5.2.344"}, {"s": "HAMLET", "l": ["The point envenomed too! Then, venom, to thy work."], "n": "5.2.352"}, {"d": "Hurts the King."}, {"s": "ALL", "l": ["Treason, treason!"], "n": "5.2.354"}, {"s": "KING", "l": ["O, yet defend me, friends! I am but hurt."], "n": "5.2.355"}, {"s": "HAMLET", "l": ["Here, thou incestuous, murd’rous, damnèd Dane,", "Drink off this potion. Is thy union here?", "[Forcing him to drink the poison.]", "Follow my mother."], "n": "5.2.356"}, {"d": "King dies."}, {"s": "LAERTES", "l": ["He is justly served.", "It is a poison tempered by himself.", "Exchange forgiveness with me, noble Hamlet.", "Mine and my father’s death come not upon thee,", "Nor thine on me."], "n": "5.2.359"}, {"d": "Dies."}, {"s": "HAMLET", "l": ["Heaven make thee free of it. I follow thee.—", "I am dead, Horatio.— Wretched queen, adieu.—", "You that look pale and tremble at this chance,", "That are but mutes or audience to this act,", "Had I but time ( as this fell sergeant, Death,", "Is strict in his arrest), O, I could tell you—", "But let it be.— Horatio, I am dead.", "Thou livest; report me and my cause aright", "To the unsatisfied."], "n": "5.2.364"}, {"s": "HORATIO", "l": ["Never believe it.", "I am more an antique Roman than a Dane.", "Here’s yet some liquor left."], "n": "5.2.373"}, {"d": "He picks up the cup."}, {"s": "HAMLET", "l": ["As thou ’rt a man,", "Give me the cup. Let go! By heaven, I’ll ha ’t.", "O God, Horatio, what a wounded name,", "Things standing thus unknown, shall I leave behind me!", "If thou didst ever hold me in thy heart,", "Absent thee from felicity awhile", "And in this harsh world draw thy breath in pain", "To tell my story.", "[A march afar off and shot within.]", "What warlike noise is this?"], "n": "5.2.376"}, {"d": "Enter Osric."}, {"s": "OSRIC", "l": ["Young Fortinbras, with conquest come from Poland,", "To th’ ambassadors of England gives", "This warlike volley."], "n": "5.2.386"}, {"s": "HAMLET", "l": ["O, I die, Horatio!", "The potent poison quite o’ercrows my spirit.", "I cannot live to hear the news from England.", "But I do prophesy th’ election lights", "On Fortinbras; he has my dying voice.", "So tell him, with th’ occurrents, more and less,", "Which have solicited— the rest is silence.", "O, O, O, O!"], "n": "5.2.389"}, {"d": "Dies."}, {"s": "HORATIO", "l": ["Now cracks a noble heart. Good night, sweet prince,", "And flights of angels sing thee to thy rest.", "[March within.]", "Why does the drum come hither?"], "n": "5.2.397"}, {"d": "Enter Fortinbras with the English Ambassadors with Drum, Colors, and Attendants."}, {"s": "FORTINBRAS", "l": ["Where is this sight?"], "n": "5.2.400"}, {"s": "HORATIO", "l": ["What is it you would see?", "If aught of woe or wonder, cease your search."], "n": "5.2.401"}, {"s": "FORTINBRAS", "l": ["This quarry cries on havoc. O proud Death,", "What feast is toward in thine eternal cell", "That thou so many princes at a shot", "So bloodily hast struck?"], "n": "5.2.403"}, {"s": "AMBASSADOR", "l": ["The sight is dismal,", "And our affairs from England come too late.", "The ears are senseless that should give us hearing", "To tell him his commandment is fulfilled,", "That Rosencrantz and Guildenstern are dead.", "Where should we have our thanks?"], "n": "5.2.407"}, {"s": "HORATIO", "l": ["Not from his mouth,", "Had it th’ ability of life to thank you.", "He never gave commandment for their death.", "But since, so jump upon this bloody question,", "You from the Polack wars, and you from England,", "Are here arrived, give order that these bodies", "High on a stage be placed to the view,", "And let me speak to th’ yet unknowing world", "How these things came about. So shall you hear", "Of carnal, bloody, and unnatural acts,", "Of accidental judgments, casual slaughters,", "Of deaths put on by cunning and forced cause,", "And, in this upshot, purposes mistook", "Fall’n on th’ inventors’ heads. All this can I", "Truly deliver."], "n": "5.2.413"}, {"s": "FORTINBRAS", "l": ["Let us haste to hear it", "And call the noblest to the audience.", "For me, with sorrow I embrace my fortune.", "I have some rights of memory in this kingdom,", "Which now to claim my vantage doth invite me."], "n": "5.2.429"}, {"s": "HORATIO", "l": ["Of that I shall have also cause to speak,", "And from his mouth whose voice will draw on more.", "But let this same be presently performed", "Even while men’s minds are wild, lest more mischance", "On plots and errors happen."], "n": "5.2.434"}, {"s": "FORTINBRAS", "l": ["Let four captains", "Bear Hamlet like a soldier to the stage,", "For he was likely, had he been put on,", "To have proved most royal; and for his passage,", "The soldier’s music and the rite of war", "Speak loudly for him.", "Take up the bodies. Such a sight as this", "Becomes the field but here shows much amiss.", "Go, bid the soldiers shoot."], "n": "5.2.441"}, {"d": "They exit, marching, after the which, a peal of ordnance are shot off."}]}, "mnd21": {"play": "A Midsummer Night's Dream", "act": 61, "scene": 1, "title": "SCENE I.  A wood near Athens.", "source": "Folger Shakespeare", "url": "https://www.folger.edu/explore/shakespeares-works/a-midsummer-nights-dream/read/61/1/", "first": "2.1.1", "last": "2.1.276", "items": [{"d": "Enter a Fairy at one door and Robin Goodfellow at another."}, {"s": "ROBIN", "l": ["How now, spirit? Whither wander you?"], "n": "2.1.1"}, {"s": "FAIRY", "l": ["Over hill, over dale,", "Thorough bush, thorough brier,", "Over park, over pale,", "Thorough flood, thorough fire;", "I do wander everywhere,"], "n": "2.1.2"}, {"s": "FAIRY", "l": ["Swifter than the moon’s sphere.", "And I serve the Fairy Queen,", "To dew her orbs upon the green.", "The cowslips tall her pensioners be;", "In their gold coats spots you see;", "Those be rubies, fairy favors;", "In those freckles live their savors.", "I must go seek some dewdrops here", "And hang a pearl in every cowslip’s ear.", "Farewell, thou lob of spirits. I’ll be gone.", "Our queen and all her elves come here anon."], "n": null, "cut": true}, {"s": "ROBIN", "l": ["The King doth keep his revels here tonight.", "Take heed the Q
