const SPEAKER_ACTOR={"MACBETH":"Rob McLoughlin","ROSS":"Vacant","ANGUS":"Vacant","BANQUO":"Julien Paschal","FIRST WITCH":"Hannah Di Bella","SECOND WITCH":"Vacant","THIRD WITCH":"Sarah Dillamore","LADY MACBETH":"Vacant","SEYTON":"Chrystele Alix",
 "HAMLET":"Julien Paschal","OPHELIA":"Chrystele Alix","LAERTES":"Carlos Toca","QUEEN":"Vacant","KING":"Alex Lui","POLONIUS":"Adrian P. Smith","HORATIO":"Michael Strelow","GRAVEDIGGER":"Dario Roberto","OTHER":"Teo Jansen",
 "OBERON":"Jean-Baptiste Courtois","TITANIA":"Ella Arkeus","ROBIN":"Teo Jansen","HELENA":"Sarah Dillamore","HERMIA":"Hannah Di Bella","DEMETRIUS":"Jan Zammit","LYSANDER":"Kyle Scudder",
 "KATHERINE":"Sarah Dillamore","PETRUCHIO":"Jan Zammit","RICHARD":"Dario Roberto","ANNE":"Sarah Burns","CORIOLANUS":"Alex Lui","AUFIDIUS":"Rob McLoughlin","DUKE SENIOR":"Aldo D'Ibaños","AMIENS":"Teo Jansen","FAIRY":"Sophie Heideker","MUSTARDSEED":"Sophie Heideker",
 "ROMEO":"Vacant","BENVOLIO":"Vacant","JULIET":"Vacant","LADY CAPULET":"Vacant","NURSE":"Vacant","MERCUTIO":"Vacant","FRIAR LAWRENCE":"Vacant"};
const SCENE_ABOUT={"rom53":{"before": "Since the balcony: the Friar married them in secret (2.6); Romeo killed Juliet's cousin Tybalt after Tybalt killed Mercutio, and was banished to Mantua (3.1); the lovers had one night together (3.5). Forced to marry Paris, Juliet took the Friar's potion to sleep like death and was laid in the family tomb (4.3–5). The Friar's letter explaining the plan never reached Romeo (5.2). He only heard she was dead, bought poison, and rode back to Verona (5.1). At the tomb door he has already killed Paris.", "about": "The night that began on the balcony ends here. Romeo's last speech is not panic: he sees how beautiful she still looks ('Death, that hath sucked the honey of thy breath, / Hath had no power yet upon thy beauty'), which the audience knows means she is alive, and drinks anyway. Then Juliet wakes, asking for him. The Friar's lines are short and frightened; hers are shorter still. Find the stillness, and how fast it ends: she kisses him, hoping some poison is left, and when the watch comes she does not hesitate."},"rom22":{"before": "Romeo and Mercutio went masked to the Capulets' feast (1.4). There Romeo forgot Rosaline the moment he saw Juliet; they met, spoke a sonnet together and kissed, and only afterwards each learned that the other belonged to the enemy house (1.5). Romeo has given his friends the slip and climbed the orchard wall.", "about": "The most famous love scene ever written, and it is mostly Juliet's. She thinks she is alone and says what she would never say to his face; he overhears, and she is mortified, then refuses to play games: 'Dost thou love me? I know thou wilt say \"Ay.\"' She is the practical one: the wall is high, her kinsmen will kill him, and if his love is honourable, he can send word tomorrow about the wedding. Romeo swears by the moon; she stops him. Find the speed of it, the interruptions (the Nurse calling), and how neither can bear to say goodnight."},"rom14":{"before": "Romeo has been moping over Rosaline (1.1). Capulet's servant, who can't read, asked Romeo to read out the guest list for tonight's feast; Rosaline is on it, so Benvolio talks Romeo into going in masks, to compare her with other beauties (1.2). Meanwhile Juliet has been told to look at Paris at the same feast (1.3).", "about": "Two ways of handling dreams. Romeo is heavy, love-sick and full of foreboding; Mercutio is all speed and wit and cannot bear him being sad. The Queen Mab speech starts as a party piece, a miniature world of gnats and hazelnut-shell chariots, then darkens as Mab visits lawyers, parsons and soldiers and becomes the hag who presses on sleeping girls, until Romeo has to stop him: 'Thou talk'st of nothing.' Find what Mercutio is running from. The scene ends with Romeo's premonition of 'untimely death', and he goes in anyway: 'He that hath the steerage of my course / Direct my sail.'"},"rom13":{"before": "The play has opened with a street brawl between the Montagues and Capulets. In 1.2 the County Paris, a young nobleman related to the Prince, asked old Capulet for Juliet's hand; Capulet told him to wait two years and woo her, and invited him to the feast tonight. Juliet is not yet fourteen, and she has not met Romeo.", "about": "A girl being prepared for the marriage market by two very different mothers. Lady Capulet is formal and uneasy alone with her daughter: she sends the Nurse out, then calls her straight back. The Nurse is the one who actually raised Juliet, and her rambling story of the weaning and the fall ('Wilt thou not, Jule?') is full of love and of grief for her own dead daughter, Susan. Juliet barely speaks, and her answers are careful: 'I'll look to like, if looking liking move.' Play the comedy of the Nurse, and the pressure underneath it."},"mac13": {"before": "Macbeth and Banquo have just won a savage battle for King Duncan. Off stage, the king has already ordered that the traitor Thane of Cawdor be executed and his title given to Macbeth, but Macbeth doesn't know it yet. The witches planned this meeting in 1.1.", "about": "Temptation. The witches never tell Macbeth to do anything: they name a future and let him fill in the rest. Within minutes of hearing 'king hereafter' he is picturing murder ('why do I yield to that suggestion / Whose horrid image doth unfix my hair'). Play the gap between the two men: Banquo is curious and wary, Macbeth goes 'rapt' and silent."}, "rom11": {"before": "The play opens with a brawl between Montague and Capulet servants that drags in both old men; the Prince threatens death for the next disturbance of the peace. Romeo's parents then tell Benvolio that their son has been seen wandering before dawn in tears and shutting himself away from the daylight.", "about": "Love, but not yet Juliet. Romeo is lovesick for Rosaline, who has sworn to stay chaste, and he talks in paradoxes ('O brawling love, O loving hate'): he is in love with being in love. Benvolio is the patient friend who listens, teases and tries to cure him. Keep it light and young. Benvolio's advice, 'examine other beauties', is exactly what will send Romeo to the Capulet feast, where he meets Juliet."}, "ayl21": {"before": "Duke Senior's younger brother Frederick has seized his dukedom. The Duke and a few loyal lords now live in the Forest of Arden 'like the old Robin Hood of England' (1.1).", "about": "Making peace with loss. 'Sweet are the uses of adversity' is the thesis of the whole play's pastoral world. The Duke is not naive: he feels 'the icy fang / And churlish chiding of the winter's wind' and chooses to find 'good in everything'. Play the cold as real, and the contentment as earned."}, "mnd21a": {"before": "In Athens, Hermia has refused to marry Demetrius and is eloping through the wood with Lysander; Helena has told Demetrius. Meanwhile the fairy king and queen have been at war for some time.", "about": "A marriage row on a cosmic scale. Their jealousy has broken the weather: floods, rotting crops, the seasons swapping their 'wonted liveries'. The changeling boy is the excuse; underneath are pride and suspicion (each accuses the other of loving Theseus or Hippolyta). Titania's reason for keeping the boy is love for his mother, who died giving birth to him. Play it as a real couple's fight, with real hurt."}, "ham13": {"before": "Old King Hamlet is dead, and Claudius has married his widow Gertrude within two months. In 1.2 Claudius gave Laertes leave to go back to France. Hamlet has been courting Ophelia with letters and gifts.", "about": "A young woman being told by the men who love her what she is allowed to feel. Laertes warns her off Hamlet; Polonius gives Laertes his famous precepts ('to thine own self be true') and then orders Ophelia to stop seeing Hamlet altogether. She has wit and spirit with her brother; with her father, her last line is 'I shall obey, my lord.' This is where her silencing starts."}, "mnd21b": {"before": "Demetrius has followed Hermia into the wood, because Helena told him about the elopement in the hope of winning his thanks. Oberon has just sent Puck for the magic flower.", "about": "Unrequited love at its most humiliating, and funny because she means every word. Helena offers to be treated like a dog ('I am your spaniel'); Demetrius threatens her with the dangers of the wood and with violence. She turns it back on him: 'We cannot fight for love as men may do. / We should be wooed and were not made to woo.' Oberon, unseen, decides to help her."}, "cor45": {"before": "Caius Martius won the name Coriolanus by taking the Volscian city of Corioles almost single-handed. He stood for consul but could not bring himself to beg the common people for their votes; the tribunes turned the people against him and Rome banished him ('You common cry of curs… I banish you!', 3.3). He has walked alone to Antium, his enemy's city.", "about": "Two men who have only ever touched each other in combat. The servants' comedy at the top sets up the stranger in rags; then he names himself and offers Aufidius his throat or his sword against Rome. Aufidius's joy is startling, almost erotic: seeing him 'more dances my rapt heart / Than when I first my wedded mistress saw'. Find the danger and the love in the same embrace."}, "ham31": {"before": "The Ghost has told Hamlet that Claudius murdered his father (1.5), and Hamlet has put on an 'antic disposition'. Polonius believes Hamlet is mad for love of Ophelia, so he and Claudius set her in Hamlet's path and hide to watch (the start of 3.1, before our cut).", "about": "Hamlet weighs whether life is worth living, then meets the woman he loved, who has been sent to hand back his gifts. The big choice is whether Hamlet realises they are being watched ('Where's your father?'). His cruelty may be aimed at the spies as much as at her. Her speech alone at the end is grief for the man she has lost. In our version 'To be or not to be' is marked as cut."}, "mac32": {"before": "Macbeth murdered Duncan (2.2) with his wife's planning; Duncan's sons fled and Macbeth was crowned. He now fears Banquo, whose descendants the witches said would be kings, and has just hired murderers to kill Banquo and his son Fleance (3.1).", "about": "The crown has brought no peace: 'Naught's had, all's spent', she says, alone. The partnership has turned upside down: she tries to comfort him, and he keeps his plan from her ('Be innocent of the knowledge, dearest chuck, / Till thou applaud the deed'). Play intimacy and distance at once: they are closer physically than ever, and further apart."}, "r312": {"before": "Richard (Duke of Gloucester) and his brothers of York have defeated the Lancastrians. Richard helped kill King Henry VI and his son Edward, Prince of Wales, who was Anne's husband. In 1.1 he told the audience his plan: 'I'll marry Warwick's youngest daughter. / What though I killed her husband and her father?' In the text Anne is following the coffin of King Henry VI, her father-in-law; in our staging it is her husband Edward's.", "about": "The most audacious seduction in Shakespeare: absolute hatred turned in about 250 lines. Richard flatters, blames her beauty for his crimes, and finally offers her his sword and his bare breast. Anne's hatred must be real, and Richard's charm must actually work. Afterwards he shares his amazement with the audience: 'Was ever woman in this humor wooed?'"}, "shr21": {"before": "Baptista will not let his younger daughter Bianca marry until the elder, Katherine, is married. Bianca's suitors have backed Petruchio, who has come to Padua 'to wive it wealthily'. At the top of the scene Kate has tied up Bianca and struck her.", "about": "A duel of wits that is also a recognition: two performers, both outsiders, meeting their match. Petruchio's tactic is to contradict everything, praising her mildness while she rages. The bargaining with Baptista around it shows marriage as business. Keep it fast, and let Kate win plenty of rounds."}, "ham34": {"before": "The play-within-the-play (3.2) has exposed Claudius's guilt. Hamlet had the chance to kill him at prayer and did not (3.3). Gertrude has summoned her son, and Polonius has hidden behind the arras to listen.", "about": "A son forcing his mother to look at herself. Hamlet kills Polonius almost without looking, mistaking him for the king, then turns all his fury on Gertrude, until the Ghost appears; only Hamlet sees it, which convinces her he is mad. Big choices: how much does Gertrude know about the murder, and does she change sides by the end, when she promises to keep his secret?"}, "mnd32": {"before": "Oberon has charmed Titania, who now dotes on Bottom with an ass's head. Puck was sent to anoint 'the Athenian' but chose the wrong one: Lysander woke and fell for Helena, deserting Hermia (2.2).", "about": "Chaos among the lovers, played with total sincerity: none of them thinks it is funny. A lifelong friendship breaks ('We, Hermia, like two artificial gods…'), and the insults get personal, about height above all. Oberon orders a fog; Puck leads the men apart until all four fall asleep, and the cure goes on Lysander's eyes."}, "ham45": {"before": "Hamlet has killed Polonius and been shipped to England. Polonius was buried in haste and in secret. Laertes has come back from France and raised a mob.", "about": "Grief with nowhere to go. Ophelia's songs mix mourning with bawdy, and her flowers have meanings: rosemary for remembrance, pansies for thoughts, fennel and columbines for flattery and faithlessness, rue for sorrow and repentance, and no violets, because they 'withered all when my father died'. Avoid 'pretty' madness. Watch, too, how smoothly Claudius turns Laertes's rage towards Hamlet."}, "ham51": {"before": "Ophelia has drowned (4.7). The coroner has allowed her a Christian burial despite the suspicion of suicide, which the gravediggers argue about. Hamlet has come back secretly from the voyage to England.", "about": "Death as the great leveller: lawyers, courtiers, jesters and Alexander the Great all end as dust. Yorick's skull makes it personal. Then the funeral arrives, Hamlet learns whose grave it is, and he and Laertes grapple in it ('forty thousand brothers'). Let the comedy breathe: it makes what follows land."}, "mac55": {"before": "Malcolm and the English army are marching on Dunsinane. Lady Macbeth has been sleepwalking and washing imaginary blood from her hands (5.1). Macbeth trusts the witches' promises: no harm until Birnam Wood comes to Dunsinane.", "about": "Numbness, not wailing. Macbeth has 'almost forgot the taste of fears'; the news of his wife's death brings not grief but the void: life is 'a tale / Told by an idiot, full of sound and fury, / Signifying nothing.' Then the messenger reports that the wood is moving, and he arms anyway."}, "mnd41": {"before": "Oberon has released Titania and Puck has fixed Lysander's eyes; Demetrius stays enchanted, now loving Helena. It is dawn on Theseus and Hippolyta's wedding day, and they are out hunting.", "about": "Waking up. The night is already turning into a dream: Theseus overrules Egeus, the couples are paired off right, and the lovers cannot trust their own memories ('Are you sure / That we are awake?'). Play the hush and the wonder. Our cut starts at the hunting horns; the Titania and Bottom section before it is not ours."}, "mos-witches": {"before": "Nothing: this is the first scene of the play. Before we meet Macbeth, Shakespeare shows us the three sisters agreeing where they will meet him, on the heath, when the battle is done.", "about": "Twelve lines, and the whole play is in them: thunder, a rendezvous, Macbeth's name, and the riddle 'Fair is foul, and foul is fair.' We stage it as a ritual: the spell is being cast here, so that the prophecy in 1.3 is the result."}, "mos-water": {"before": "The source is Act 4, Scene 7: Claudius and Laertes are plotting the rigged duel when Gertrude enters with the news that Ophelia has drowned, and tells how: 'There is a willow grows askant the brook.'", "about": ""}, "f3": {"before": "The source is Act 5, Scene 2. Claudius and Laertes have set it up: an unblunted, poisoned foil for Laertes and a poisoned cup for Hamlet. Gertrude drinks from the cup; Laertes wounds Hamlet, the foils are swapped, and Laertes, dying, confesses: 'The King, the King's to blame.'", "about": ""}};

const PART_SPEAKERS={macbeth:["MACBETH"],aufidius:["AUFIDIUS"],banquo:["BANQUO"],hamlet:["HAMLET"],"lady-macbeth":["LADY MACBETH"],"witch-1":["FIRST WITCH"],kate:["KATHERINE"],hermia:["HERMIA"],ophelia:["OPHELIA"],"witch-2":["SECOND WITCH"],laertes:["LAERTES"],gertrude:["QUEEN"],claudius:["KING"],coriolanus:["CORIOLANUS"],"witch-3":["THIRD WITCH"],seyton:["SEYTON"],helena:["HELENA"],anne:["ANNE"],polonius:["POLONIUS"],horatio:["HORATIO"],demetrius:["DEMETRIUS"],lysander:["LYSANDER"],petruchio:["PETRUCHIO"],richard:["RICHARD"],gravedigger:["GRAVEDIGGER"],"other-gravemaker":["OTHER"],puck:["ROBIN"],oberon:["OBERON"],titania:["TITANIA"],amiens:["AMIENS"],fairy:["FAIRY","MUSTARDSEED"],"duke-senior":["DUKE SENIOR"],romeo:["ROMEO"],benvolio:["BENVOLIO"],juliet:["JULIET"],"lady-capulet":["LADY CAPULET"],nurse:["NURSE"],mercutio:["MERCUTIO"],"friar-lawrence":["FRIAR LAWRENCE"]};
const ORIG_CAST={parts:PARTS.map(p=>p.actor),chars:CHARS.map(c=>c.actor),items:ORDER.map(o=>o.actors?[...o.actors]:null),speak:{...SPEAKER_ACTOR}};
let releases={};
function applyReleases(){
  PARTS.forEach((p,i)=>p.actor=ORIG_CAST.parts[i]);CHARS.forEach((c,i)=>c.actor=ORIG_CAST.chars[i]);
  ORDER.forEach((o,i)=>{if(ORIG_CAST.items[i])o.actors=[...ORIG_CAST.items[i]]});Object.assign(SPEAKER_ACTOR,ORIG_CAST.speak);
  const gone=PARTS.filter((p,i)=>{const r=releases[p.id];return r&&r.actor===ORIG_CAST.parts[i]&&p.actor!=="Vacant"});
  if(!gone.length)return;
  const was=new Map(gone.map(p=>[p,p.actor]));
  gone.forEach(p=>{p.actor="Vacant";(PART_SPEAKERS[p.id]||[]).forEach(k=>{if(k in SPEAKER_ACTOR)SPEAKER_ACTOR[k]="Vacant"})});
  CHARS.forEach(c=>{const ps=PARTS.filter(p=>p.ch===c.id);if(ps.length)c.actor=ps.map(p=>p.actor).join(", ")});
  ORDER.forEach(o=>{if(!o.actors)return;const chars=o.chars||[];
    gone.forEach(g=>{const x=was.get(g);if(!chars.includes(g.ch))return;
      if(PARTS.some(p=>p.actor===x&&chars.includes(p.ch)))return;/* still plays someone else in this piece */
      const j=o.actors.indexOf(x);if(j>=0)o.actors[j]="Vacant"})});
}
function uncast(k){const set=new Set();SCRIPTS[k].items.forEach(it=>{if(it.s)it.s.split(" / ").forEach(n=>{if(!SPEAKER_ACTOR[n]&&!/^(ALL|BOTH)$|\band\b/i.test(n))set.add(n)})});return [...set]}
function scriptWords(k){let n=0;SCRIPTS[k].items.forEach(it=>{if(it.l&&!it.cut)it.l.forEach(l=>{n+=l.replace(/\[.*?\]/g,"").split(/\s+/).filter(Boolean).length})});return n}

async function shrinkImage(file,max=800){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej({code:"bad_image"});i.src=url});
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.85)}finally{URL.revokeObjectURL(url)}}

function myReleasedNote(n){const rs=Object.values(releases).filter(r=>r&&r.actor===n);
  return rs.length?`<p class="cfoot relnote">You gave up ${esc(rs.map(r=>r.name).join(", "))}. If that was a mistake, talk to Chris.</p>`:""}
function releasesBlock(){const rs=Object.entries(releases).filter(([,r])=>r&&r.actor);
  return `<section class="mecard"><h2>Declined parts</h2>${rs.length?`<p class="clede" style="margin:0 0 12px">These parts were given up by the actor and now show as vacant. Restore puts the actor back in the part everywhere on the site.</p><ul class="mybk">${rs.map(([id,r])=>`<li><div><b>${esc(r.name||id)}</b><div class="meta">Declined by ${esc(r.actor)}${r.at?" · "+new Date(r.at).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):""}</div></div><button type="button" class="btn sm" data-restore="${esc(id)}">Restore to ${esc(r.actor.split(" ")[0])}</button></li>`).join("")}</ul>`:`<p class="clede" style="margin:0">No one has declined a part.</p>`}</section>`}
function askRelease(id){const p=PARTS.find(x=>x.id===id);if(!p||p.actor!==me)return;
  const others=PARTS.filter(x=>x.actor===me&&x.id!==id),pieces=ITEMS.filter(i=>(i.chars||[]).includes(p.ch)&&(i.actors||[]).includes(me));

  $("sheetbg").classList.add("on");$("cx").onclick=closeSheet;$("relok").onchange=e=>{$("relgo").disabled=!e.target.checked};

      await db.collection("releases").doc(id).create(rec);

    catch(e){toast(e&&e.code==="exists"?"That part has already been declined":e&&e.code==="not_allowed"?"That isn't allowed":"Couldn't save. Try again");$("relgo").disabled=false}}}
async function tidyBookingsAfterRelease(x){const now=new Date();
  for(const [id,b] of Object.entries(bookings)){const s=b&&IT[b.scene];if(!s||b.type!=="scene"||slotEnd(id)<now||s.actors.includes(x))continue;
    try{if(b.actor===x){await db.collection("bookings").doc(id).delete();notifyCancel(id,b)}
      else if(Array.isArray(b.with)&&b.with.includes(x))await db.collection("bookings").doc(id).update({with:b.with.filter(a=>a!==x)})}catch(_){}}}
function notifyRelease(p,actor){try{const still=PARTS.filter(x=>x.actor===actor).map(x=>x.name);
  fetch("https://formsubmit.co/ajax/chris@chriskelly.it",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({_subject:"Part declined: "+actor+" gives up "+p.name,_template:"table",_captcha:"false","Actor":actor,"Part given up":p.name,"Play":playOf(p),"Still plays":still.join(", ")||"No parts left","When":new Date().toLocaleString("en-GB"),"To undo":"Log in as Chris on the site, unlock editing, then use Restore under Declined parts","Site":"https://shakespeareshow.actor/#me"})}).catch(()=>{})}catch(e){}}
function wireMe(){
  document.querySelectorAll("[data-me]").forEach(b=>b.onclick=()=>{setMe(b.dataset.me);route();window.scrollTo(0,0)});
  const nm=$("notme");if(nm)nm.onclick=()=>{setMe("");route();window.scrollTo(0,0)};
  const ud=$("unlockdir");if(ud)ud.onclick=async()=>{const p=$("dirpin").value.trim();if(!p)return;ud.disabled=true;
    try{if(db.isDirector&&await db.isDirector(p)){localStorage.setItem("ss_dir_pin",p);isOwner=true;toast("Editing unlocked");route()}else{toast("That code isn't right");ud.disabled=false}}catch(e){toast("Couldn't check the code");ud.disabled=false}};
  const ld=$("lockdir");if(ld)ld.onclick=()=>{try{localStorage.removeItem("ss_dir_pin")}catch(_){}isOwner=false;toast("Editing locked");route()};
  const jb=$("jumpbk");if(jb)jb.onclick=()=>{if(location.hash==="#mybookings")jumpBookings();else location.hash="#mybookings"};
  document.querySelectorAll("[data-cbk]").forEach(b=>b.onclick=()=>askCancelBk(b.dataset.cbk));
  document.querySelectorAll("[data-ebk]").forEach(b=>b.onclick=()=>openSlot(b.dataset.ebk));
  document.querySelectorAll("[data-obk]").forEach(x=>x.onclick=()=>{const id=x.dataset.obk,b=bookings[id];if(b)setComing(id,comingOf(b).filter(a=>a!==me&&a!==b.actor),"You're off this session")});
  const hf=$("hsfile");if(hf)hf.onchange=async()=>{const f=hf.files[0];if(!f)return;toast("Uploading your headshot…");try{await saveMyHeadshot(me,f);toast("Headshot updated ✓");route()}catch(e){toast(e&&e.code==="not_allowed"?"Photo uploads aren't switched on yet. Ask Chris.":e&&e.code==="bad_image"?"Couldn't read that image. Try a JPG or PNG.":"Upload failed")}hf.value=""};
  document.querySelectorAll("[data-rel]").forEach(b=>b.onclick=()=>askRelease(b.dataset.rel));
  document.querySelectorAll("[data-restore]").forEach(b=>b.onclick=async()=>{const id=b.dataset.restore,r=releases[id];b.disabled=true;
    try{await db.collection("releases").doc(id).delete();const n={...releases};delete n[id];releases=n;applyReleases();toast((r&&r.name||"Part")+" restored to "+(r&&r.actor||"the actor"));route()}catch(e){toast(e&&e.code==="not_allowed"?"Unlock editing first":"Couldn't restore");b.disabled=false}});
  if(!me||!db)return;const ref=db.collection("cast").doc(ck(me));
  const save=async(patch,msg)=>{try{await ref.update({...patch,at:new Date().toISOString()});toast(msg)}catch(e){toast(e&&e.code==="not_allowed"?"That isn't allowed":"Couldn't save")}};
  document.querySelectorAll("[data-crew]").forEach(b=>b.onclick=()=>{const c=CREW.find(x=>x.name===me);save({[c.field||"status"]:b.dataset.crew},b.dataset.crew==="accepted"?"Accepted, welcome aboard!":"Set back to pending")});
  const ac=$("acc");if(ac)ac.onclick=()=>save({status:"accepted"},"Accepted, welcome aboard!");
  const dc=$("dec");if(dc)dc.onclick=()=>save({status:"pending"},"Set back to pending");
}

  const sh=(x1,y1,x2,y2,d)=>{const L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L;return [x1+ux*d,y1+uy*d,x2-ux*d,y2-uy*d]};
  const arrows=pts.map(([a,b],i)=>{const [x1,y1,x2,y2]=sh(a[1],a[2],b[1],b[2],46);const nx=-(y2-y1),ny=x2-x1,L=Math.hypot(nx,ny),o=7;const ox=nx/L*o,oy=ny/L*o;
    return `<line x1="${x1+ox}" y1="${y1+oy}" x2="${x2+ox}" y2="${y2+oy}" class="mar" marker-end="url(#mh)"/><line x1="${x2-ox}" y1="${y2-oy}" x2="${x1-ox}" y2="${y1-oy}" class="mar" marker-end="url(#mh)"/>`}).join("");
  const inward=N.map(([t,x,y])=>{const [x1,y1,x2,y2]=sh(x,y,210,238,52);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="mar in" marker-end="url(#mh2)"/>`}).join("");
  return `<figure class="venn vmoment" aria-labelledby="venn2cap"><svg viewBox="0 20 420 360" role="img" aria-label="Diagram: Actor 1, Actor 2 and Actor 3, with arrows running both ways between each pair and in towards the centre. In the centre, active listening: the moment.">
    <defs><marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mhp"/></marker><marker id="mh2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" class="mhp2"/></marker></defs>
    ${arrows}${inward}
    ${N.map(([t,x,y,c])=>`<text x="${x}" y="${y+6}" text-anchor="middle" class="vl" fill="${c}">${t}</text>`).join("")}

const SPEECH=[
 ["HAMLET","Speak the speech, I pray you, as I pronounced it to you, trippingly on the tongue: but if you mouth it, as many of your players do, I had as lief the town-crier spoke my lines.","Say the speech the way I showed you, light and quick off the tongue. If you chew it and over-pronounce it, the way so many actors do, I'd rather have the town crier read it."],
 ["","Nor do not saw the air too much with your hand, thus, but use all gently; for in the very torrent, tempest, and, as I may say, the whirlwind of passion, you must acquire and beget a temperance that may give it smoothness.","Don't wave your arms about like this. Do everything with control. Even in the middle of a storm of feeling, find a calm inside it that keeps it smooth."],
 ["","O, it offends me to the soul to hear a robustious periwig-pated fellow tear a passion to tatters, to very rags, to split the ears of the groundlings, who for the most part are capable of nothing but inexplicable dumb-shows and noise: I would have such a fellow whipped for o'erdoing Termagant; it out-herods Herod: pray you, avoid it.","It kills me to hear some big, bewigged actor rip an emotion to shreds, yelling to deafen the cheap seats, who mostly only like mime and noise anyway. I'd have him whipped for overacting the villain. It's more over the top than the over-the-top roles themselves. Please, don't do it."],
 ["HAMLET","Be not too tame neither, but let your own discretion be your tutor: suit the action to the word, the word to the action; with this special observance, that you o'erstep not the modesty of nature:","But don't be too timid either. Let your own judgement guide you. Match what you do to what you say, and what you say to what you do, and above all don't go beyond what's natural."],
 ["","for any thing so overdone is from the purpose of playing, whose end, both at the first and now, was and is, to hold, as 'twere, the mirror up to nature; to show virtue her own feature, scorn her own image, and the very age and body of the time his form and pressure.","Overdoing it defeats the whole point of acting, which has always been, and still is, to hold a mirror up to life: to show goodness and foolishness as they really are, and to show our own times exactly as they are."],
 ["","Now this overdone, or come tardy off, though it make the unskilful laugh, [[cannot but make the judicious grieve;]] the censure of the which one must in your allowance o'erweigh a whole theatre of others.","Overdo it, or underplay it, and you might get a laugh from people who don't know better, [[but the people who do know will wince.]] And the opinion of one of them should matter more to you than a whole theatre full of the others."],
 ["","O, there be players that I have seen play, and heard others praise, and that highly, not to speak it profanely, that, neither having the accent of Christians nor the gait of Christian, pagan, nor man, have so strutted and bellowed that I have thought some of nature's journeymen had made men and not made them well, they imitated humanity so abominably.","I've seen actors, highly praised ones too, who didn't speak or walk like any human being. They strutted and bellowed so much that I thought nature's apprentices must have made them, and botched the job, they imitated people so badly."],
 ["HAMLET","O, reform it altogether. And let those that play your clowns speak no more than is set down for them; for there be of them that will themselves laugh, to set on some quantity of barren spectators to laugh too; though, in the mean time, some necessary question of the play be then to be considered: that's villanous, and shows a most pitiful ambition in the fool that uses it. Go, make you ready.","Fix it completely. And make your comedians say only what's written for them. Some of them laugh at their own jokes to get the dimmer part of the audience laughing too, just when something important in the play needs attention. That's unforgivable, and it shows how cheap the ambition of a clown who does it is. Go and get ready."]

  if(!db){toast("Sign in to book");return}
  const ref=db.collection("bookings").doc(id);
  try{const l=await ref.acquire({holder:myId||("anon-"+Math.random().toString(36).slice(2)),ttlMs:5000});
    if(!l.acquired){toast("Someone is booking this slot right now");return}
    const s=await ref.get();if(s.exists&&s.data()&&s.data().type){toast("That slot was just taken");closeSheet();return}
    if(ref.create)await ref.create(body);else await ref.set(body);toast("Booked ✓");closeSheet();if(body.type==="scene")notifyBooking(id,body);
  }catch(e){if(e&&e.code==="exists"){toast("That slot was just taken");closeSheet()}else if(e&&(e.code==="invalid_argument"||e.code==="not_allowed")){toast("Only Chris can do that")}else toast("Couldn't book: "+(e&&e.code||"error"))}
}



function matchActor(fname){
  const f=fname.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\.[a-z0-9]+$/,"").replace(/[^a-z0-9]+/g," ").trim();
  const full=CAST.find(n=>f.includes(ck(n).replace(/-/g," ")));if(full)return full;
  const hits=CAST.filter(n=>{const parts=ck(n).split("-").filter(p=>p.length>2);return parts.some(p=>new RegExp("\\b"+p+"\\b").test(f))});
  return hits.length===1?hits[0]:null;
}
async function saveHeadshot(name,file){
  if(!assets)throw {code:"no_assets"};
  const a=await assets.upload(file);const ref=db.collection("cast").doc(ck(name));const snap=await ref.get();
  if(snap.exists)await ref.update({headshot:a.id});else await ref.set({headshot:a.id,status:"offered"});
}

/* ---- poster viewer ---- */
(function(){
  const box=document.createElement("div");box.id="lbox";box.hidden=true;box.setAttribute("role","dialog");box.setAttribute("aria-modal","true");box.setAttribute("aria-label","Poster viewer");
  box.innerHTML=`<div class="lb-top"><span class="lb-cap" id="lbcap"></span><a class="lb-btn" id="lbdl" download>Download</a><button type="button" class="lb-btn" id="lbx" aria-label="Close">Close ✕</button></div>
    <button type="button" class="lb-nav prev" id="lbp" aria-label="Previous poster">‹</button><img id="lbimg" alt=""><button type="button" class="lb-nav next" id="lbn" aria-label="Next poster">›</button>`;
  document.body.appendChild(box);
  let list=[],i=0,back=null;
  const show=()=>{const im=list[i];$("lbimg").src=im.dataset.full;$("lbimg").alt=im.alt;$("lbcap").textContent=im.alt.replace(/ poster$/,"")+(list.length>1?`  ·  ${i+1} of ${list.length}`:"");
    $("lbdl").href=im.dataset.full;$("lbdl").setAttribute("download",im.dataset.dl||"poster.jpg");$("lbp").hidden=$("lbn").hidden=list.length<2};
  const open=im=>{const grid=im.closest(".postergrid,.costgrid:not(.one)")||im.closest(".props");list=grid?[...grid.querySelectorAll("img[data-full]")]:[im];i=Math.max(0,list.indexOf(im));back=im;show();box.hidden=false;document.documentElement.style.overflow="hidden";$("lbx").focus()};
  const close=()=>{box.hidden=true;$("lbimg").removeAttribute("src");document.documentElement.style.overflow="";if(back)back.focus()};
  const step=d=>{i=(i+d+list.length)%list.length;show()};
  document.addEventListener("click",e=>{const im=e.target.closest&&e.target.closest("img[data-full]");if(im&&!box.contains(im)){e.preventDefault();open(im)}});
  document.addEventListener("keydown",e=>{if(box.hidden){const im=e.target.closest&&e.target.closest("img[data-full]");if(im&&(e.key==="Enter"||e.key===" ")){e.preventDefault();open(im)}return}
    if(e.key==="Escape")close();else if(e.key==="ArrowRight")step(1);else if(e.key==="ArrowLeft")step(-1);
    else if(e.key==="Tab"){const f=[...box.querySelectorAll("a,button:not([hidden])")];const a=f.indexOf(document.activeElement);if(e.shiftKey&&a<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&a===f.length-1){e.preventDefault();f[0].focus()}}});
  $("lbx").onclick=close;$("lbp").onclick=()=>step(-1);$("lbn").onclick=()=>step(1);
  box.addEventListener("click",e=>{if(e.target===box)close()});
  let sx=null;box.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});box.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)step(dx<0?1:-1);sx=null});
})();
</script>
